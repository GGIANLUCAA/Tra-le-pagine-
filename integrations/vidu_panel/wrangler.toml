name = "tra-le-pagine-vidu"
main = "worker.mjs"
compatibility_date = "2026-10-28"
workers_dev = true

[[services]]
binding = "STUDIO"
service = "video-library-studio"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "video-library-studio"

[triggers]
# Only retrieves jobs explicitly submitted by the owner. Never creates videos.
crons = ["*/10 * * * *"]

# CONFIG_SECRET: random 32+ character Worker secret, never committed.
