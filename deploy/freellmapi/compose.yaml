# Optional self-hosted router; this file is not deployed by GitHub Actions.
# Official upstream image: https://github.com/tashfeenahmed/freellmapi
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3001'
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - freellmapi-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/api/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  freellmapi-data:
