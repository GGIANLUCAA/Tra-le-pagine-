name: "ArtVision Critico V1 — Dalí, analisi con zoom e voce"
run-name: "DALÍ - studio critico privato V1"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-critico-dali-v1.yml"
permissions:
  contents: read
concurrency:
  group: dali-critico-v1
  cancel-in-progress: false
jobs:
  critica:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: "Carica il progetto originale - niente vecchi file modificati"
        uses: actions/checkout@v4
      - name: "Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Monta strumenti video e voci già in uso nel progetto"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libsndfile1
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "Pillow>=10,<13" "opencv-python-headless>=4.8,<5" \
            "edge-tts>=6.1,<9" "soundfile>=0.12,<1" "google-genai>=2.25,<4" \
            "scipy>=1.11,<2"
          python -m py_compile \
            modules/artvision_critico/render_dali.py \
            modules/artvision/identita_visiva_v6.py \
            src/gemini_voice.py
      - name: "Regia critica: voce, macro inquadrature, montaggio, musica"
        run: |
          python modules/artvision_critico/render_dali.py
      - name: "Verifica master - mai consegnare file vuoti"
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          folder=Path("output/dali-critico-v1")
          mp4=folder/"ARTVISION_DALI_SOGNO_DELL_APE_CRITICO_V1.mp4"
          assert mp4.is_file() and mp4.stat().st_size>1_000_000
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries",
                  "format=duration,size:stream=codec_type,width,height",
                  "-of","json",str(mp4)]))
          tracks={x["codec_type"] for x in info["streams"]}
          assert tracks=={"audio","video"},tracks
          video=next(x for x in info["streams"] if x["codec_type"]=="video")
          assert (video["width"],video["height"])==(1080,1920)
          assert float(info["format"]["duration"])>250
          regia=json.loads((folder/"REGIA_DETTAGLI_E_SYNC.json").read_text())
          assert len(regia["beats"])==16
          print("MASTER OK",info["format"]["duration"],"secondi",round(mp4.stat().st_size/1e6,1),"MB")
          PY
      - name: "Pacchetto privato da valutare, NON pubblicato sui social"
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_DALI_CRITICO_V1
          path: |
            output/dali-critico-v1/ARTVISION_DALI_SOGNO_DELL_APE_CRITICO_V1.mp4
            output/dali-critico-v1/COPERTINA_DALI_CRITICO.jpg
            output/dali-critico-v1/REGIA_DETTAGLI_E_SYNC.json
            output/dali-critico-v1/SCRIPT_CRITICO.txt
            output/dali-critico-v1/DIRITTI_E_CREDITI.txt
          if-no-files-found: error
          retention-days: 14
