name: ArtVision John Martin N05613 — V81 four original films
run-name: MARTIN V81 4×1 — real Tate frame in Museum, one Gacrux WAV, no Vidu
on:
  push:
    branches: [pilot/artvision-john-martin-wrath-v81]
    paths:
      - src/artvision_martin_visual_v81.py
      - src/artvision_martin_render_v81.py
      - tests/test_artvision_martin_frame_v81.py
      - docs/productions/2026-10-30-martin-wrath-v81/**
      - .github/workflows/artvision-martin-four-v81.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artvision-martin-4x1-v81-one-off
  cancel-in-progress: false
jobs:
  render-martin-four:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free rendering, WAV and source QA dependencies
        run: |
          python -m pip install --disable-pip-version-check -q "numpy>=1.26,<3" "Pillow>=10.2" "opencv-python-headless>=4.8" "requests>=2.31" "soundfile>=0.12" "google-genai>=2.25.0" "scipy>=1.11"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m py_compile src/artvision_martin_visual_v81.py src/artvision_martin_render_v81.py
          ffmpeg -version | head -n 1
      - name: V80 frame-only-opening-ending QA and actual-size output tests
        run: python -m unittest discover -s tests -p "test_artvision_martin_frame_v81.py" -v
      - name: Generate one free voice and render four distinct source-verified real MP4s
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_FREE_QUOTA_CONFIRMED: "true"
          GEMINI_TTS_PROJECT_BILLING_DISABLED_CONFIRMED: "true"
        run: python -u src/artvision_martin_render_v81.py
      - name: Deliver source manifest, technical QA, actual MP4s, covers and ZIPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_MARTIN_N05613_V81_TRUE_FILES
          path: |
            output/artvision-martin-wrath-v81/*/*.mp4
            output/artvision-martin-wrath-v81/*/COPERTINA.jpg
            output/artvision-martin-wrath-v81/*_COMPLETE.zip
            output/artvision-martin-wrath-v81/MARTIN_V81_4X1_STATE.json
            output/artvision-martin-wrath-v81/SOURCE_MANIFEST.json
            output/artvision-martin-wrath-v81/GACRUX_GATE_V81.json
          if-no-files-found: warn
          retention-days: 14
