name: "Libri — Il fantasma di Canterville, voce Gacrux"
on:
  push:
    branches: ["feature/libri-canterville-20261026"]
    paths: ["voice_jobs/canterville_20261026.txt"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verifica credenziali
        run: test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY assente" && exit 2)
      - name: Installa dipendenze audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install -q 'numpy>=1.25,<3' 'soundfile>=0.12' 'scipy>=1.11' 'google-genai>=2.25,<3' 'faster-whisper>=1.1,<2'
      - name: Narrazione italiana completa con Gacrux
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from gemini_voice import synthesize
          text=Path('voice_jobs/canterville_20261026.txt').read_text(encoding='utf-8')
          sound,times=synthesize(text,Path('output/canterville_voice'))
          print('Voice length:', len(sound)/24000,'Sentences:',len(times))
          PY
      - name: Conserva voice e metadati
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CANTERVILLE_GACRUX
          path: output/canterville_voice/
          if-no-files-found: error
          retention-days: 14
