name: "Ricerca fonti ufficiali V2 - Musei e archivi"
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Progetto da ricercare"
        type: choice
        options: [artvision, storia]
        default: artvision
        required: true
      provider:
        description: "Una fonte: ArtVision: musei; Storia: archivi"
        type: choice
        options: [met, artic, cleveland, loc, archive, commons, vam, smk, wellcome, nasa, gallica]
        default: met
        required: true
      query:
        description: "Artista, titolo del quadro, citta e anno"
        type: string
        required: true
      limit:
        description: "Massimo candidati"
        type: choice
        options: ["1", "2", "3", "4", "5"]
        default: "3"
        required: true
  push:
    branches: [main]
    paths:
      - "src/public_archive_sources_v1.py"
      - "src/public_archive_sources_v2.py"
      - "src/source_selector_v34.py"
      - "tests/test_public_archive_sources_v1.py"
      - "tests/test_public_archive_sources_v2.py"
      - ".github/workflows/public-archive-sources-v1.yml"
  pull_request:
    paths:
      - "src/public_archive_sources_v1.py"
      - "src/public_archive_sources_v2.py"
      - "src/source_selector_v34.py"
      - "tests/test_public_archive_sources_v1.py"
      - "tests/test_public_archive_sources_v2.py"
      - ".github/workflows/public-archive-sources-v1.yml"
permissions:
  contents: read
jobs:
  contract_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Safety tests (offline, no cost)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/public_archive_sources_v1.py src/public_archive_sources_v2.py src/source_selector_v34.py
          python -m unittest discover -s tests -p 'test_public_archive_sources_v1.py' -v
          python -m unittest discover -s tests -p 'test_public_archive_sources_v2.py' -v
          python -m unittest discover -s tests -p 'test_source_selector_v34.py' -v
          python -m json.tool config/public_api_artvision_v1.json >/dev/null
          python -m json.tool config/public_api_storia_v1.json >/dev/null
  live_provider_probe:
    needs: contract_tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bounded one-candidate live probe, zero media downloads
        shell: bash
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,"src")
          from public_archive_sources_v2 import search
          examples={"met":"Socrates","artic":"Seurat","cleveland":"landscape",
                    "loc":"Market Street 1906","archive":"historic film","commons":"Venice 1896",
                    "vam":"Turner","smk":"Eckersberg","wellcome":"Victorian portrait",
                    "nasa":"Apollo 11","gallica":"Paris 1900"}
          report={}
          for provider,query in examples.items():
              try:
                  result=search(provider,query,1)
                  report[provider]={"status":"api_responded",
                      "results":len(result["items"]),"requests":result["api_requests"]}
              except Exception as exc:
                  report[provider]={"status":"failed","reason":str(exc)[:120]}
          print(json.dumps(report,indent=2))
          with open("PROBE_REPORT.json","w") as f:json.dump(report,f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PUBLIC_ARCHIVE_PROVIDER_PROBE_V2
          path: PROBE_REPORT.json
          retention-days: 14
          if-no-files-found: warn
  research_one_query:
    needs: contract_tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RESEARCH_PROJECT: ${{ inputs.project }}
      RESEARCH_PROVIDER: ${{ inputs.provider }}
      RESEARCH_QUERY: ${{ inputs.query }}
      RESEARCH_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: One source search only, fail closed on rights
        shell: bash
        run: |
          set -euo pipefail
          case "$RESEARCH_PROJECT:$RESEARCH_PROVIDER" in
            artvision:met|artvision:artic|artvision:cleveland|artvision:commons|artvision:vam|artvision:smk|artvision:wellcome)
              brief="config/public_api_artvision_v1.json"; scene="opera" ;;
            storia:loc|storia:archive|storia:commons|storia:nasa|storia:gallica|storia:wellcome)
              brief="config/public_api_storia_v1.json"; scene="archivio" ;;
            *) echo "Provider incompatible with project" >&2; exit 1 ;;
          esac
          python src/source_selector_v34.py --mode discover \
            --brief "$brief" --scene "$scene" --provider "$RESEARCH_PROVIDER" \
            --query "$RESEARCH_QUERY" --limit "$RESEARCH_LIMIT" \
            --out output/public_archive_v1
          python - <<'PY'
          import json
          x=json.load(open("output/public_archive_v1/CANDIDATI_DA_APPROVARE_V34.json"))
          assert x["automatic_selection"] is False
          assert all(i["rights_review"]=="pending" and i["visual_review"]=="pending"
                     and i["authenticity_review"]=="pending" for i in x["results"])
          print("Research completed; candidate review required:",len(x["results"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CANDIDATI_FONTI_UFFICIALI_V2
          path: output/public_archive_v1/
          retention-days: 14
          if-no-files-found: error

  live-once-21-archives-8-credentials:
    needs: contract_tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    env:
      PROBE_NVIDIA: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA || secrets.NVIDIA_NIM_API_KEY || secrets.NVIDIA_KEY || secrets.NVIDIA_NIM || secrets.NGC_API_KEY || secrets.INVIDIA || secrets.INVIDIA_API_KEY }}
      PROBE_GROQ: ${{ secrets.GROQ_API_KEY || secrets.GROQ }}
      PROBE_GEMINI: ${{ secrets.GEMINI_API_KEY }}
      PROBE_HF: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN }}
      PROBE_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER2 }}
      PROBE_PIXABAY: ${{ secrets.PIXABAY || secrets.PIXABAY_API_KEY }}
      PROBE_AIHORDE: ${{ secrets.AIHORDE_API_KEY }}
      PROBE_VIDU: ${{ secrets.VIDUOK || secrets.VIDU_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Actual 21 public catalog requests plus 8 read-only credential probes
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_api_live_readonly_diagnostic_v1.py' -v
          python src/api_live_readonly_diagnostic_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: API_LIVE_REAL_RESPONSES_${{ github.run_id }}
          path: output/api_live_check_v1/RESULTS.json
          retention-days: 14
          if-no-files-found: error
