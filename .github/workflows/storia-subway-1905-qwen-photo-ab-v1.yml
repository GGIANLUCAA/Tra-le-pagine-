name: "1905 Subway | one photographic image A/B | Qwen vs Finegrain"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storia-subway-1905-qwen-photo-ab-v1.yml"
permissions:
  contents: read
  actions: read
jobs:
  photo_comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Verify one new zero-paid trial script"
        run: python -m py_compile tools/storia_subway_1905_qwen_photo_compare_v1.py
      - name: "Install free Qwen Gradio interface"
        run: python -m pip install -q 'numpy>=1.26,<2.3' 'opencv-python-headless>=4.9,<5' 'pillow>=10,<13' 'gradio_client>=1.0,<3'
      - name: "Recover previous authentic photo comparison, no original film download needed"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output/storia_subway_1905_prev_photo
          gh run download 43360370888 --repo "$GITHUB_REPOSITORY" \
             --name SUBWAY_1905_PHOTOREAL_I2I_SOURCE_VS_CANDIDATES_ZERO_VIDU \
             --dir output/storia_subway_1905_prev_photo
          test -s output/storia_subway_1905_prev_photo/FINEGRAIN_NEW_REAL_I2I_PHOTO.jpg
      - name: "Single Qwen free photo edit comparison"
        run: python -u tools/storia_subway_1905_qwen_photo_compare_v1.py
      - name: "Preserve provider output and actual visual comparison"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SUBWAY_1905_ONE_PHOTO_REALISM_FINEGRAIN_QWEN_AB
          retention-days: 14
          if-no-files-found: warn
          path: output/storia_subway_1905_qwen_compare/
