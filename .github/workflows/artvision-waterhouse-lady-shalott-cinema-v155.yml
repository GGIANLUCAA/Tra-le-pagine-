name: ArtVision V155 · Waterhouse The Lady of Shalott Cinema original PD review
on:
  push:
    branches: [main]
    paths:
      - requests/artvision/waterhouse-lady-shalott-cinema-v155.json
permissions:
  contents: read
concurrency:
  group: artvision-owner-waterhouse-lady-shalott-cinema-v155-once
  cancel-in-progress: false
jobs:
  cinema_review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact-sourced renderer before starting
        run: python -m py_compile src/artvision_waterhouse_lady_shalott_cinema_v155.py
      - name: Verify exact authorized selected work
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("requests/artvision/waterhouse-lady-shalott-cinema-v155.json").read_text())
          q=json.loads(Path("queue/artvision_owner_selected_ten_20261102.json").read_text())
          assert r["work_id"]=="waterhouse_lady_shalott_1888_tate_n01543"
          assert r["owner_automation_id"]=="6adca191603c8191a90d5190901cd034"
          assert r["run_once_only"] is True
          assert r["variant"]=="cinema_standard" and r["public_title"]=="The Lady of Shalott"
          assert not r["allow_paid_calls"] and not r["social_publish"] and not r["gold_v25"]
          assert any(w["id"]==r["work_id"] and w["slots_delivered_this_selection"]==0 for w in q["works"])
          PY
      - name: Validate Tate N01543 provenance and Commons private-review license source before render
        run: |
          python - <<'PY'
          import json
          r=json.load(open('requests/artvision/waterhouse-lady-shalott-cinema-v155.json'))
          assert r['license_status']=='Commons_PD_Art_PDM_Tate_UK_claim_noted'
          assert r['source_url']=='https://upload.wikimedia.org/wikipedia/commons/1/1e/John_William_Waterhouse_-_The_Lady_of_Shalott_-_Google_Art_Project.jpg'
          assert r['source_expected_pixels']==[4180,3208]
          assert r['source_fail_closed_on_429'] and r['no_commercial_publication_or_Gold']
          PY
      - name: Install no-paid runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless imageio-ffmpeg
          mkdir -p /tmp/artvision-bin
          python - <<'PY'
          from imageio_ffmpeg import get_ffmpeg_exe
          from pathlib import Path
          src=Path(get_ffmpeg_exe())
          assert src.is_file()
          Path("/tmp/artvision-bin/ffmpeg").symlink_to(src)
          PY
          echo "/tmp/artvision-bin" >> "$GITHUB_PATH"
          /tmp/artvision-bin/ffmpeg -version | head -1
      - name: Render only one MP4 candidate
        run: python src/artvision_waterhouse_lady_shalott_cinema_v155.py --output /tmp/waterhouse_lady_v155
      - name: Validate physical MP4 and SHA
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("/tmp/waterhouse_lady_v155")
          q=json.loads((p/"QA_V155.json").read_text())
          f=p/q["mp4"]["filename"]
          assert f.is_file() and f.stat().st_size>100000
          assert hashlib.sha256(f.read_bytes()).hexdigest()==q["mp4"]["sha256"]
          assert q["mp4"]["full_ffmpeg_decode"]=="PASS"
          assert q["mp4"]["frames"]==960 and q["mp4"]["duration_seconds"]==48
          assert q["gold_v25"] is False and q["social_published"] is False
          assert (p/"WATERHOUSE_LADY_SHALOTT_CINEMA_V155_REVIEW_PACKAGE.zip").is_file()
          print("VERIFIED",q["mp4"]["sha256"],f.stat().st_size)
          PY
      - name: Save real MP4 and package for readback
        uses: actions/upload-artifact@v4
        with:
          name: WATERHOUSE_LADY_SHALOTT_V155_CINEMA_REVIEW_MP4
          path: |
            /tmp/waterhouse_lady_v155/WATERHOUSE_THE_LADY_OF_SHALOTT_CINEMA_V155_REVIEW.mp4
            /tmp/waterhouse_lady_v155/WATERHOUSE_LADY_SHALOTT_CINEMA_V155_REVIEW_PACKAGE.zip
            /tmp/waterhouse_lady_v155/QA_V155.json
            /tmp/waterhouse_lady_v155/COVER.jpg
            /tmp/waterhouse_lady_v155/CONTACT_SHEET_V155.jpg
          if-no-files-found: error
          retention-days: 30
