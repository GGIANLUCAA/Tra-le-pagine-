name: "WOW LAB · Hiroshige bluebird CC0 source isolated"
on:
  push:
    branches: [experiment/wow-lab-hiroshige-bluebird-20261030]
    paths:
      - "wow_lab/experiments/hiroshige_bird/source.py"
      - ".github/workflows/wow-lab-hiroshige-source-20261030.yml"
permissions:
  contents: read
concurrency:
  group: "wow-lab-hiroshige-source-20261030"
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - run: python wow_lab/experiments/hiroshige_bird/source.py
      - uses: actions/upload-artifact@v4
        with:
          name: WOW_LAB_HIROSHIGE_36725_CC0_SOURCE
          path: wow_lab/experiments/hiroshige_bird/sources/*
          if-no-files-found: error
          retention-days: 14
