name: "WOW LAB · Sharaku CC0 original acquisition"
on:
  push:
    branches:
      - experiment/wow-lab-sharaku-shadow-puppet-20261030
    paths:
      - "wow_lab/experiments/sharaku_shadow/source.py"
      - ".github/workflows/wow-lab-sharaku-source-20261030.yml"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "Pillow>=10,<12"
      - run: python wow_lab/experiments/sharaku_shadow/source.py
      - uses: actions/upload-artifact@v4
        with:
          name: WOW_LAB_SHARAKU_37358_SOURCE
          path: wow_lab/experiments/sharaku_shadow/source/*
          retention-days: 15
          if-no-files-found: error
