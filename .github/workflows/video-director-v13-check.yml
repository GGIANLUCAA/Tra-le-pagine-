name: "Direzione GPT V13 - ricette e riuso voce senza API"
on:
  push:
    branches: [main, "feature/gpt-video-director-v13", "feature/creator-growth-v14", "feature/production-v15", "feature/production-runner-v16"]
    paths:
      - "docs/creator-business*"
      - "tests/test_creator_business_metrics.mjs"
      - "AGENTS.md"
      - "config/editorial_rules.json"
      - "src/editorial_rules.py"
      - "tests/test_editorial_rules.py"
      - "docs/REGOLE_ATTIVE.md"
      - "START_HERE_GPT.md"
      - "config/video_formats_v13.json"
      - "src/video_director_v13.py"
      - "src/creator_metrics_v13.py"
      - "src/creator_growth_v14.py"
      - "src/production_batch_v15.py"
      - "src/production_runner_v16.py"
      - "src/production_adapter_v16.py"
      - "tools/production_store_v16.py"
      - "tests/test_production_*v16.py"
      - ".github/workflows/production-runner-v16.yml"
      - "config/production_v15.json"
      - "queue/production_v15.json"
      - "tests/test_production_batch_v15.py"
      - "config/creator_growth_v14.json"
      - "tests/test_creator_growth_v14.py"
      - "templates/CREATOR_*V14.json"
      - "tests/test_creator_metrics_v13.py"
      - "src/gemini_voice.py"
      - "src/episode_v3.py"
      - "src/regia_narrativa_v12.py"
      - "src/studio_autopilot_v11.py"
      - "tests/test_video_director_v13.py"
      - "tests/test_voice_cache_v13.py"
      - "integrations/video_library_laboratorio/**"
      - ".github/workflows/video-director-v13-check.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dipendenze dei controlli offline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "numpy>=1.25,<3" "pillow>=10,<13" "soundfile>=0.12,<1"
      - name: Regole attive, identita del format e mix espliciti
        run: python -m unittest discover -s tests -p "test_editorial_rules.py" -v
      - name: Routing, schede, hash e MP4 reale
        run: python -m unittest discover -s tests -p "test_video_director_v13.py" -v
      - name: Regia V38 senza stampini o quote immagini
        run: python -m unittest discover -s tests -p "test_narrative_variation_v38.py" -v
      - name: Nuovo libro Oz — piano immagini e testi social offline
        run: python -m unittest discover -s tests -p "test_oz_episode_20261026.py" -v
      - name: Metriche confrontabili senza ricavi inventati
        run: |
          python -m unittest discover -s tests -p "test_creator_metrics_v13.py" -v
          python -m unittest discover -s tests -p "test_creator_growth_v14.py" -v
          python -m unittest discover -s tests -p "test_production_batch_v15.py" -v
          python -m unittest discover -s tests -p "test_production_*v16.py" -v
      - name: Riuso WAV e trasparenza dei tempi stimati
        run: python -m unittest discover -s tests -p "test_voice_cache_v13.py" -v
      - name: Scene, provenienza e nessun sottotitolo
        run: |
          python -m unittest discover -s tests -p "test_regia_narrativa_v12.py" -v
          python -m unittest discover -s tests -p "test_no_subtitles_v12.py" -v
          python -m unittest discover -s tests -p "test_studio_autopilot_v11.py" -v
      - name: Laboratorio conservato e sintassi
        run: |
          node integrations/video_library_laboratorio/workspace-api.test.mjs
          node tests/test_creator_business_metrics.mjs
          python -m py_compile src/production_batch_v15.py src/creator_growth_v14.py src/creator_metrics_v13.py src/video_director_v13.py src/gemini_voice.py src/episode_v3.py src/regia_narrativa_v12.py src/studio_autopilot_v11.py
