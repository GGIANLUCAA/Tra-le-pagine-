name: "ArtVision Critico — Bosch Giardino delle delizie V21"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "queue/render_requests/bosch_giardino_delizie_20261022.json"
permissions:
  contents: read
jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "FFmpeg e strumenti Critico esistenti"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "numpy==1.26.4" "opencv-python-headless==4.10.0.84" "Pillow>=10,<13" "soundfile>=0.12" "google-genai>=1,<3" "edge-tts>=7,<8"
      - name: "Ottieni fotografia originale e crea voce Google con tempi reali"
        run: |
          python modules/artvision_critico/production_series/bosch_v21_assets.py
      - name: "Verifica file originali (nessuna finta immagine, nessuna finta voce)"
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          out=Path("output/bosch-critico-v21")
          m=json.loads((out/"ASSETS_TIMING.json").read_text())
          assert m["art"]["dims"][0]>=6000 and m["art"]["dims"][1]>=3500
          assert len(m["voice"]["beat_ends"])==11
          assert m["voice"]["duration"]>75
          assert (out/"PAINTING.jpg").stat().st_size>2000000
          assert (out/"VOCE.wav").stat().st_size>1000000
          assert (out/"MUSIC.mp3").stat().st_size>150000
          print("SOURCE / VOICE / MUSIC verified:",m["voice"]["engine"],m["voice"]["duration"])
          PY
      - name: "Consegna materiale verificato per regia artistica di dettaglio"
        uses: actions/upload-artifact@v4
        with:
          name: BOSCH_CRITICO_V21_ASSETS_${{ github.run_id }}
          path: |
            output/bosch-critico-v21/PAINTING.jpg
            output/bosch-critico-v21/VOCE.wav
            output/bosch-critico-v21/MUSIC.mp3
            output/bosch-critico-v21/ASSETS_TIMING.json
            output/bosch-critico-v21/COPIONE.txt
          retention-days: 14
          if-no-files-found: error
