name: "VIDU Cane · stage source (no credits)"
on:
  push:
    branches: [main]
    paths:
      - "requests/vidu_image_stage/*.json"
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet "Pillow>=10,<13"
      - name: "Stage image as unreferenced git blob; no video calls"
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,json,subprocess,hashlib,base64,io,pathlib,urllib.request,urllib.parse
          from PIL import Image,ImageOps
          changed=subprocess.run(['git','diff','--name-only','--diff-filter=A',os.environ['BEFORE'],os.environ['AFTER'],'--','requests/vidu_image_stage'],check=True,capture_output=True,text=True).stdout.splitlines()
          if len(changed)!=1 or not re.fullmatch(r'requests/vidu_image_stage/[a-z0-9][a-z0-9-]{7,63}[.]json',changed[0]):
              raise SystemExit('One new valid request only')
          d=json.loads(pathlib.Path(changed[0]).read_text())
          if d.get('schema')!='vidu_dog_image_stage_v1' or d.get('id')!=pathlib.Path(changed[0]).stem:
              raise SystemExit('Invalid request')
          u=d.get('source_url','')
          p=urllib.parse.urlparse(u)
          if p.scheme!='https' or p.hostname!='media.canva.com' or not p.path.startswith('/v2/image-resize/'):
              raise SystemExit('Invalid source host')
          possible=[u]
          original_path=re.sub('height:200','height:1280',re.sub('width:112','width:720',p.path))
          if original_path!=p.path:possible.insert(0,urllib.parse.urlunparse(p._replace(path=original_path)))
          image=None
          for url in possible:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'image/*'})
                  with urllib.request.urlopen(req,timeout=25) as f:
                      if not f.headers.get('Content-Type','').startswith('image/'):continue
                      raw=f.read(9_000_001)
                  if len(raw)>9_000_000:continue
                  x=Image.open(io.BytesIO(raw));x.load()
                  if x.width>=100 and x.height>=170 and (image is None or x.width*x.height>image.width*image.height):
                      image=x.convert('RGB')
              except Exception as e:
                  print('Photo variant unavailable',type(e).__name__)
          if image is None:raise SystemExit('No usable image, no Vidu request')
          out=ImageOps.fit(image,(720,1280),method=Image.Resampling.LANCZOS)
          bio=io.BytesIO();out.save(bio,format='JPEG',quality=94,optimize=True)
          body=bio.getvalue()
          sha=hashlib.sha256(body).hexdigest()
          repo=os.environ['GITHUB_REPOSITORY']
          created=subprocess.run(['gh','api','-X','POST',f'repos/{repo}/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(body).decode(),'encoding':'base64'}),capture_output=True,text=True,check=True)
          blob=json.loads(created.stdout)['sha']
          data={'schema':'vidu_dog_image_stage_v1','id':d['id'],'git_blob_sha':blob,'sha256':sha,'filename':'photo.jpg','source_dimensions':list(image.size),'output_dimensions':[720,1280],'stage':'ready','vidu_credits_spent':0,'source_kind':'AI-created image'}
          path=f'queue/vidu_image_stage/{d["id"]}.json'
          payload=base64.b64encode((json.dumps(data,indent=2)+'\n').encode()).decode()
          subprocess.run(['gh','api','-X','PUT',f'repos/{repo}/contents/{path}','-f','branch=main','-f',f'message=Stage dog photo {d["id"]}','-f','content='+payload],check=True,capture_output=True,text=True)
          print('DOG_IMAGE_READY',d['id'],'BLOB',blob,'SHA',sha,'SOURCE_SIZE',image.size)
          PY
