name: ArtVision V169 Delacroix Sardanapalus one genuine narrated Critico review
on:
  push:
    branches: [main]
    paths:
      - requests/artvision/delacroix-sardanapalus-critico-v169.json
permissions:
  contents: read
  actions: read
concurrency:
  group: artvision-owner-delacroix-sardanapalus-critico-v169-single
  cancel-in-progress: false
jobs:
  single_narrated_critico:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Compile renderer and run regression BEFORE voice
        run: |
          python -m py_compile src/artvision_delacroix_sardanapalus_critico_v169.py
          python -m unittest discover -s tests -p test_artvision_delacroix_critico_recipe_v169.py -v
      - name: Gate only one owner-requested missing slot without publication or duplicate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('requests/artvision/delacroix-sardanapalus-critico-v169.json'))
          q=json.load(open('queue/artvision_owner_selected_ten_20261102.json'))
          assert r['owner_automation_id']==q['owner_automation_id']=='6adca191603c8191a90d5190901cd034'
          assert r['work_id']=='delacroix_death_sardanapalus_1827_louvre_rf2346' and r['variant']=='critico_standard'
          assert r['public_title']=='The Death of Sardanapalus' and r['accession']=='RF 2346'
          assert r['run_once_only'] and r['one_tts_call_at_most'] and not r['allow_paid_calls']
          assert not r['social_publish'] and not r['gold_v25'] and r['preserve_cinema_v168']
          work=[w for w in q['works'] if w['id']==r['work_id']]
          assert len(work)==1 and work[0]['slots_delivered_this_selection'] in (0,1)
          assert not work[0].get('critico_standard_v169')
          print('ONE_OWNER_CRITICO_SLOT_AUTHORIZED_NO_DUPLICATES')
          PY
      - name: Download genuine prior V168 artifact and compare independently verified CC0 source SHA BEFORE TTS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/delacroix_v168 /tmp/delacroix_sardanapalus_critico_v169
          gh run download 41969938939 --repo "$GITHUB_REPOSITORY" --name ART_V168_DELACROIX_SARDANAPALUS_CINEMA_REVIEW --dir /tmp/delacroix_v168
          cp /tmp/delacroix_v168/ORIGINAL_ARTWORK.jpg /tmp/delacroix_sardanapalus_critico_v169/ORIGINAL_ARTWORK.jpg
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          d=Path('/tmp/delacroix_v168'); p=d/'ORIGINAL_ARTWORK.jpg'
          q=json.loads((d/'QA_V168.json').read_text())
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert p.stat().st_size==q['source']['bytes']==25369869
          assert q['source']['pixels']==[6875,5358]
          assert sha==q['source']['sha256']=='9aee50cf6ecb8b266d64d0ab0e4fa09bf7fc6f80dcae9059906fc555233021e6'
          assert q['accession']=='RF 2346' and q['work']=='The Death of Sardanapalus'
          with zipfile.ZipFile(d/'DELACROIX_SARDANAPALUS_CINEMA_V168_REVIEW_PACKAGE.zip') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('ORIGINAL_ARTWORK.jpg')).hexdigest()==sha
          print('V168_SOURCE_EXACT_SHA256_AND_ZIP_CRC_PASS_BEFORE_VOICE')
          PY
      - name: Gate explicitly owner-attested second Free no-billing account only
        env:
          SECOND_KEY: ${{ secrets.GEMINI_API_KEY2 }}
          OWNER_FREE_ACCOUNT_ATTESTATION: "attested-2026-10-30"
        run: |
          test -n "$SECOND_KEY" || { echo 'BLOCKED: owner Free second-account secret absent; no TTS'; exit 2; }
          test "$OWNER_FREE_ACCOUNT_ATTESTATION" = "attested-2026-10-30" || { echo 'BLOCKED: owner attestation absent; no TTS'; exit 2; }
          echo "Using previously owner-attested no-billing second Free Google account only; no fallback. Billing independently unverified."
      - name: Install compatible free local rendering dependencies and FFmpeg
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "google-genai>=2.25.0" numpy pillow soundfile scipy "faster-whisper==1.2.1" "av==17.1.0" "huggingface-hub==0.34.4" "fsspec==2025.7.0" opencv-python-headless imageio-ffmpeg
          mkdir -p /tmp/artvision-bin
          python - <<'PY'
          from pathlib import Path
          from imageio_ffmpeg import get_ffmpeg_exe
          e=Path(get_ffmpeg_exe())
          assert e.is_file()
          Path('/tmp/artvision-bin/ffmpeg').symlink_to(e)
          PY
          echo /tmp/artvision-bin >> "$GITHUB_PATH"
          /tmp/artvision-bin/ffmpeg -version | head -1
      - name: One Gacrux narration and offline ASR alignment no repeat
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY2 }}
          ARTVISION_GEMINI_PROJECT_BILLING_TIER: Free # user-attested second account; not independently verified
          ARTVISION_ASR_MODEL: small
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python src/artvision_delacroix_sardanapalus_critico_v169.py --phase voice
      - name: Render one full narrated MP4, preserving WAV for the eventual Museum
        run: python src/artvision_delacroix_sardanapalus_critico_v169.py --phase render
      - name: Independently verify physical file FFmpeg full decode SHA and archive CRC
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,zipfile
          d=Path('/tmp/delacroix_sardanapalus_critico_v169')
          q=json.loads((d/'QA_V169.json').read_text())
          m=q['file']; f=d/m['name']
          assert q['work']=='The Death of Sardanapalus' and q['accession']=='RF 2346'
          assert q['variant']=='critico_standard' and not q['museum_variant_rendered'] and not q['Gold_V25'] and not q['social_published']
          assert f.stat().st_size==m['bytes'] and hashlib.sha256(f.read_bytes()).hexdigest()==m['sha256']
          assert m['frames']>1500 and m['full_ffmpeg_decode']=='PASS'
          subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(f),'-map','0','-f','null','-'],check=True)
          z=d/'DELACROIX_SARDANAPALUS_CRITICO_STANDARD_V169_REVIEW_PACKAGE.zip'
          with zipfile.ZipFile(z) as a:
            assert a.testzip() is None and hashlib.sha256(a.read(f.name)).hexdigest()==m['sha256']
            assert 'VOCE.wav' in a.namelist() and 'ORIGINAL_ARTWORK.jpg' in a.namelist()
          print('V169_ONE_REAL_MP4_FULL_FFMPEG_SHA_ZIP_CRC_PASS_ARTISTIC_REVIEW_PENDING')
          PY
      - name: Preserve original WAV even on any downstream failure, no TTS rerun
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ART_V169_DELACROIX_SARDANAPALUS_CRITICO_AND_ONE_PRESERVED_WAV
          path: |
            /tmp/delacroix_sardanapalus_critico_v169/VOCE.wav
            /tmp/delacroix_sardanapalus_critico_v169/VOICE_CACHE_V13.json
            /tmp/delacroix_sardanapalus_critico_v169/ALLINEAMENTO_VOCE.json
            /tmp/delacroix_sardanapalus_critico_v169/VOICE_RESULT_V169.json
            /tmp/delacroix_sardanapalus_critico_v169/COPIONE_ESATTO_V169.txt
            /tmp/delacroix_sardanapalus_critico_v169/DELACROIX_THE_DEATH_OF_SARDANAPALUS_CRITICO_STANDARD_V169_REVIEW.mp4
            /tmp/delacroix_sardanapalus_critico_v169/DELACROIX_SARDANAPALUS_CRITICO_STANDARD_V169_REVIEW_PACKAGE.zip
            /tmp/delacroix_sardanapalus_critico_v169/QA_V169.json
            /tmp/delacroix_sardanapalus_critico_v169/ORIGINAL_ARTWORK.jpg
            /tmp/delacroix_sardanapalus_critico_v169/COVER.jpg
            /tmp/delacroix_sardanapalus_critico_v169/CONTACT_SHEET_V169.jpg
            /tmp/delacroix_sardanapalus_critico_v169/RIGHTS_AND_CREDITS.txt
            /tmp/delacroix_sardanapalus_critico_v169/SOCIAL_DRAFT_UNPUBLISHED.txt
          retention-days: 30
          if-no-files-found: warn
