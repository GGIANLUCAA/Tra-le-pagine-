name: "ArtVision Blake — NGA Open Access source 20261027"
on:
  push:
    paths:
      - ".github/workflows/artvision-blake-nga-source-20261027.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download-original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acquire NGA Open Access original and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --location --retry 1 --retry-delay 3 --connect-timeout 15 --max-time 180 -A 'ArtVisionResearch/1.0 (https://github.com/GGIANLUCAA/Tra-le-pagine-)' 'https://api.nga.gov/iiif/9f7230ef-aaf7-4cf9-8b4b-b5e7d914cdb0/full/full/0/default.jpg' -o source/BLAKE_GREAT_RED_DRAGON_NGA.jpg
          file source/BLAKE_GREAT_RED_DRAGON_NGA.jpg
          test "$(stat -c%s source/BLAKE_GREAT_RED_DRAGON_NGA.jpg)" -gt 250000
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of default=noprint_wrappers=1 source/BLAKE_GREAT_RED_DRAGON_NGA.jpg
          sha256sum source/* > source/SHA256SUMS.txt
          printf '%s\n' 'William Blake, The Great Red Dragon and the Woman Clothed with the Sun, c.1805; National Gallery of Art accession 1943.3.8999' 'Source: https://www.nga.gov/artworks/11502-great-red-dragon-and-woman-clothed-sun' 'NGA page explicitly states image public domain / Open Access.' > source/SOURCE_RIGHTS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ArtVision-20261027-Blake-NGA-OpenAccess-Source
          path: source/
          if-no-files-found: error
          retention-days: 7
