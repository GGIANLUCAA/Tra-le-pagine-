name: "ArtVision OWNER | Rheam Sleeping Beauty | new Cinema private review"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-owner-rheam-sleeping-beauty-cinema-v1.yml"
permissions:
  contents: read
concurrency:
  group: artvision-owner-single-heavy-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm exactly one selected work and no previously delivered Sleeping Beauty Cinema
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_owner_rheam_sleeping_beauty_cinema_v1.py
          python - <<'PY'
          import json,pathlib
          q=json.loads(pathlib.Path('research/artvision_owner_selected_30_future_20261109.json').read_text())
          w=[x for x in q['works'] if x.get('title_as_chosen')=='Sleeping Beauty' and x.get('artist_as_chosen')=='Henry Meynell Rheam']
          assert len(w)==1 and w[0]['selection_order']==23
          assert not list(pathlib.Path('queue').glob('artvision_owner_30_render_checkpoint_*sleeping*beauty*.json'))
          print('ONE OWNER-SELECTED UNPRODUCED RHEAM CINEMA PRIVATE CANDIDATE. No paid calls.')
          PY
      - name: Install local rendering tools (free)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5'
      - name: Download exact original, verify Commons image and render a new MP4
        run: python scripts/artvision_owner_rheam_sleeping_beauty_cinema_v1.py
      - name: Independently validate source/MP4/ZIP in rendering job
        shell: bash
        run: |
          set -euo pipefail
          d=output/artvision-owner-rheam-sleeping-beauty-v1
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID.mp4" -map 0 -f null -
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          d=Path('output/artvision-owner-rheam-sleeping-beauty-v1')
          qa=json.loads((d/'QA_TECHNICAL.json').read_text())
          assert qa['video_sha256']==hashlib.sha256((d/'VIDEO_ANDROID.mp4').read_bytes()).hexdigest()
          assert 43<=qa['duration_s']<=50 and qa['shots']==10
          assert not qa['gold'] and not qa['published'] and qa['paid_calls']==0
          with zipfile.ZipFile(d/'ANDROID_REVIEW_PACKAGE.zip') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('VIDEO_ANDROID.mp4')).hexdigest()==qa['video_sha256']
          print('RENDER_JOB_SHA_FFMPEG_ZIP_CRC_PASS; ARTISTIC_REVIEW_PENDING')
          PY
      - name: Archive real MP4, Android ZIP, cover and sources for private QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_OWNER_RHEAM_SLEEPING_BEAUTY_NEW_CINEMA_REVIEW
          retention-days: 30
          if-no-files-found: error
          path: |
            output/artvision-owner-rheam-sleeping-beauty-v1/VIDEO_ANDROID.mp4
            output/artvision-owner-rheam-sleeping-beauty-v1/ANDROID_REVIEW_PACKAGE.zip
            output/artvision-owner-rheam-sleeping-beauty-v1/COVER.jpg
            output/artvision-owner-rheam-sleeping-beauty-v1/CONTACT_SHEET.jpg
            output/artvision-owner-rheam-sleeping-beauty-v1/QA_TECHNICAL.json
            output/artvision-owner-rheam-sleeping-beauty-v1/SOURCES_RIGHTS.json
            output/artvision-owner-rheam-sleeping-beauty-v1/STORYBOARD.json
            output/artvision-owner-rheam-sleeping-beauty-v1/SOCIAL_DRAFTS.json
  independent_readback:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install FFmpeg for fresh runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - uses: actions/download-artifact@v4
        with:
          name: ARTVISION_OWNER_RHEAM_SLEEPING_BEAUTY_NEW_CINEMA_REVIEW
          path: /tmp/rheam-readback
      - name: Full video/audio decode, original SHA and embedded ZIP checks after separate download
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/rheam-readback
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID.mp4" -map 0 -f null -
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          p=Path('/tmp/rheam-readback')
          q=json.loads((p/'QA_TECHNICAL.json').read_text())
          b=(p/'VIDEO_ANDROID.mp4').read_bytes()
          assert hashlib.sha256(b).hexdigest()==q['video_sha256']
          with zipfile.ZipFile(p/'ANDROID_REVIEW_PACKAGE.zip') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('VIDEO_ANDROID.mp4')).hexdigest()==q['video_sha256']
          assert q['ffmpeg_full_decode']=='PASS'
          print('INDEPENDENT_MEDIA_READBACK_PASS; VIDEO_REVIEW_ONLY_NOT_GOLD_NOT_PUBLISHED')
          PY
