name: "ArtVision OWNER · Ulysses and the Sirens · new Cinema private review"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-owner-ulysses-sirens-cinema-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artvision-owner-single-heavy-render
  cancel-in-progress: false
jobs:
  one_new_private_cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source and zero-duplicate preflight (exact selected work)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_owner_ulysses_sirens_cinema_v1.py
          python - <<'PY'
          import json,pathlib
          q=json.loads(pathlib.Path('research/artvision_owner_selected_30_future_20261109.json').read_text())
          works=[w for w in q['works'] if w.get('title_as_chosen')=='Ulysses and the Sirens' and w.get('artist_as_chosen')=='John William Waterhouse']
          assert len(works)==1 and works[0]['selection_order']==7
          assert not list(pathlib.Path('queue').glob('artvision_owner_30_render_checkpoint_*ulysses_sirens*.json')), 'Duplicate existing slot'
          print('ONE NEW ULYSSES CINEMA CANDIDATE. ZERO PAID SERVICES, NO SITE/SOCIAL PUBLICATION.')
          PY
      - name: Install only free local libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
      - name: Download original public domain reproduction, verify SHA1 and render video
        run: python scripts/artvision_owner_ulysses_sirens_cinema_v1.py
      - name: Full FFmpeg decode, SHA256, ZIP integrity and complete readback
        shell: bash
        run: |
          set -euo pipefail
          d=output/artvision-owner-ulysses-sirens-cinema-v1
          ffprobe -v error -show_format -show_streams -of json "$d/VIDEO_REVIEW.mp4" > "$d/FFPROBE.json"
          ffmpeg -v error -xerror -i "$d/VIDEO_REVIEW.mp4" -map 0:v:0 -f null -
          ffmpeg -v error -xerror -i "$d/VIDEO_REVIEW.mp4" -map 0:a:0 -f null -
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          d=Path('output/artvision-owner-ulysses-sirens-cinema-v1')
          src=d/'ORIGINAL_WATERHOUSE_PD_ART.jpg';mp4=d/'VIDEO_REVIEW.mp4'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert src.stat().st_size==28945314
          assert hashlib.sha1(src.read_bytes()).hexdigest()=='11c5f0c46db3ea0e5572c95f0b230b5395b7ed15'
          assert mp4.stat().st_size>1000000
          probe=json.loads((d/'FFPROBE.json').read_text())
          v=[s for s in probe['streams'] if s.get('codec_type')=='video']
          a=[s for s in probe['streams'] if s.get('codec_type')=='audio']
          assert len(v)==1 and v[0]['codec_name']=='h264' and (v[0]['width'],v[0]['height'])==(1080,1920)
          assert len(a)==1 and a[0]['codec_name']=='aac'
          assert 70<float(probe['format']['duration'])<90
          rights=json.loads((d/'SOURCES_RIGHTS.json').read_text())
          assert rights['photo_author']=='Wikimedia Commons faithful PD-Art digital reproduction'
          assert 'Public Domain' in rights['photo_license']
          assert rights['source_sha256']==sha(src)
          assert rights['distribution_allowed'] is False
          storyboard=json.loads((d/'STORYBOARD.json').read_text())
          assert len(storyboard['shots'])==18 and storyboard['human_full_speed_QA']=='PENDING'
          report={'work':'Ulysses and the Sirens','artist':'John William Waterhouse',
            'variant':'cinema_standard','museum_object':'NGV p.396.3-1',
            'original_photo_sha1':'11c5f0c46db3ea0e5572c95f0b230b5395b7ed15',
            'original_photo_sha256':sha(src),'original_photo_bytes':src.stat().st_size,
            'mp4_sha256':sha(mp4),'mp4_bytes':mp4.stat().st_size,
            'ffmpeg_video_full_decode':'PASS','ffmpeg_audio_full_decode':'PASS',
            'status':'rendered_needs_visual_and_semantic_review','commercial_rights_final':'PENDING',
            'human_artistic_review':'PENDING','published':False,'gold':False,
            'new_main_queue_slots':0,'new_paid_api_spend':0}
          (d/'QA_TECHNICAL.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
          files=['VIDEO_REVIEW.mp4','COVER.jpg','ORIGINAL_WATERHOUSE_PD_ART.jpg','ORIGINAL_SCORE.wav',
            'SOURCES_RIGHTS.json','STORYBOARD.json','SOCIAL_DRAFTS.json','READ_ME_FIRST.md',
            'CONTACT_SHEET.jpg','FFPROBE.json','QA_TECHNICAL.json']
          z=d/'REVIEW_PACKAGE.zip'
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=3) as f:
              for n in files:f.write(d/n,arcname=n)
          with zipfile.ZipFile(z) as f:
              assert f.testzip() is None
              for n in files:assert f.read(n)==(d/n).read_bytes()
          print('NEW_ULYSSES_SIRENS_MP4_SHA256',sha(mp4),flush=True)
          print('NEW_ULYSSES_SIRENS_ZIP_SHA256',sha(z),flush=True)
          print('ORIGINAL_SOURCE_SHA256',sha(src),flush=True)
          print('TECH_PASS_CRC_PASS_REVIEW_PENDING_NO_GOLD_NO_PUBLICATION',flush=True)
          PY
      - name: Upload genuinely new Cinema review, cover, QA frame sheet and ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_OWNER_ULYSSES_SIRENS_NEW_CINEMA_REVIEW
          path: |
            output/artvision-owner-ulysses-sirens-cinema-v1/VIDEO_REVIEW.mp4
            output/artvision-owner-ulysses-sirens-cinema-v1/REVIEW_PACKAGE.zip
            output/artvision-owner-ulysses-sirens-cinema-v1/COVER.jpg
            output/artvision-owner-ulysses-sirens-cinema-v1/CONTACT_SHEET.jpg
            output/artvision-owner-ulysses-sirens-cinema-v1/QA_TECHNICAL.json
          if-no-files-found: error
          retention-days: 14
