name: "ArtVision Lotto 4 - ripresa cinque film"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-lotto4-retry-v6.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  film:
    name: "Film ${{ matrix.artist }}"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        artist: [modigliani, durer, turner, chagall, kandinsky]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Install video tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
          python -m py_compile modules/artvision/batch5_lotto4_v6.py
      - name: "Render approved V6 cinematic film"
        run: python modules/artvision/batch5_lotto4_v6.py --artist "${{ matrix.artist }}"
      - name: "Save actual MP4 cover and credits"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "ARTVISION_LOTTO4_RETRY_${{ matrix.artist }}"
          path: |
            output/artvision-lotto4-v6/${{ matrix.artist }}/film/*.mp4
            output/artvision-lotto4-v6/${{ matrix.artist }}/film/*.jpg
            output/artvision-lotto4-v6/${{ matrix.artist }}/film/*.json
            output/artvision-lotto4-v6/${{ matrix.artist }}/film/*.txt
          if-no-files-found: error
          retention-days: 7
