name: "ArtVision V31 • Friedrich • The Sea of Ice"
on:
  push:
    branches: [main]
    paths:
      - "scripts/artvision_autoproduction_20261025_1415.py"
      - "config/artvision_autoproduction_20261025_1415.json"
      - ".github/workflows/artvision-autoproduction-v31-20261025-1415.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: artvision-v31-20261025-1415
  cancel-in-progress: false
jobs:
  artvision:
    name: "New authentic Friedrich painting • 9:16 • Cinema V6"
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare free open-source renderer
        run: |
          set -euo pipefail
          command -v ffmpeg || sudo apt-get install -y -qq ffmpeg
          command -v ffprobe || sudo apt-get install -y -qq ffmpeg
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf || sudo apt-get install -y -qq fonts-dejavu-core
          python -m pip install --disable-pip-version-check "Pillow>=10,<14" numpy requests
      - name: Verify museum research and real scene preflight
        id: preflight
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_autoproduction_20261025_1415.py
          python scripts/artvision_autoproduction_20261025_1415.py --painting sea_of_ice --preflight-only
          python - <<'PY'
          import sys
          sys.path.insert(0,"src")
          import artvision_editorial_post_v28 as e
          slug="caspar_friedrich_sea_of_ice_20261025_1415"
          errors=e.validate_entry(slug,e.config()["entries"][slug])
          assert not errors,errors
          print("V28_EDITORIAL_PREFLIGHT_PASS")
          PY
      - name: Download verified authentic painting and CC BY audio; render master and posts
        id: render
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/artvision_autoproduction_20261025_1415.py --painting sea_of_ice --out output/artvision-autoproduction-v31
      - name: Independent full MP4 decode, codecs, opening, ZIP and editorial QA
        id: validate
        if: steps.render.outcome == 'success'
        run: |
          set -euo pipefail
          folder="output/artvision-autoproduction-v31/caspar_friedrich_sea_of_ice_20261025_1415"
          film="$folder/VIDEO_MASTER.mp4"
          bundle="output/artvision-autoproduction-v31/ARTVISION_V30_CASPAR_FRIEDRICH_SEA_OF_ICE_20261025_1415_COMPLETE.zip"
          test -s "$film" && test -s "$bundle" && test -s "$folder/COPERTINA.jpg"
          ffmpeg -hide_banner -loglevel error -xerror -i "$film" -f null -
          python src/artvision_editorial_post_v28.py --validate-folder "$folder"
          python - "$film" "$bundle" <<'PY'
          import json,subprocess,zipfile,sys
          film,bundle=sys.argv[1:]
          d=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration,size","-show_entries","stream=codec_type,codec_name,width,height","-of","json",film]))
          dur=float(d["format"]["duration"])
          assert 45 <= dur <= 120,dur
          assert any(s.get("codec_type")=="video" and s.get("codec_name")=="h264" and s.get("width")==1080 and s.get("height")==1920 for s in d["streams"])
          assert any(s.get("codec_type")=="audio" and s.get("codec_name")=="aac" for s in d["streams"])
          needed=["VIDEO_MASTER.mp4","COPERTINA.jpg","POST_EDITORIAL_RESEARCH.json","POST_FACEBOOK.txt","POST_INSTAGRAM.txt","POST_TIKTOK.txt","POST_YOUTUBE.txt","VIDEO_RECIPE_V13.json","TECNICHE_REGIA.md","ISTRUZIONI_REPLICA.md","MUSIC_RELEASE_V20.json","ARTVISION_CONTRACT_V25.json","SOURCES_AND_RIGHTS.md","TECHNICAL_QA_V30.json","QA_CONTACT_SHEET.jpg","ORIGINAL_ARTWORK.jpg","ORIGINAL_LICENSED_MUSIC.mp3","QA_V25/FRAME_00.jpg","QA_V25/FRAME_01.jpg","QA_V25/FRAME_03.jpg","QA_V25/FRAME_05.jpg","QA_V25/FRAME_07.jpg"]
          with zipfile.ZipFile(bundle) as z:
              assert z.testzip() is None
              assert set(needed).issubset(z.namelist()),set(needed)-set(z.namelist())
              qa=json.loads(z.read("TECHNICAL_QA_V30.json"))
              assert qa["full_ffmpeg_decode"] and qa["v25_preflight"]=="PASS" and qa["v28_editorial"]=="PASS_OBJECTIVE_CAPTION_CHECKS"
              assert qa["approval"]=="human_visual_review_pending"
          print("REAL_MP4_ZIP_PASS",dur,d["format"]["size"])
          PY
      - name: Upload MP4, cover, preview, posts and complete ZIP
        id: archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArtVision-V31-20261025-Friedrich-The-Sea-Of-Ice
          path: |
            output/artvision-autoproduction-v31/caspar_friedrich_sea_of_ice_20261025_1415/VIDEO_MASTER.mp4
            output/artvision-autoproduction-v31/caspar_friedrich_sea_of_ice_20261025_1415/COPERTINA.jpg
            output/artvision-autoproduction-v31/caspar_friedrich_sea_of_ice_20261025_1415/QA_CONTACT_SHEET.jpg
            output/artvision-autoproduction-v31/caspar_friedrich_sea_of_ice_20261025_1415/POST_FACEBOOK.txt
            output/artvision-autoproduction-v31/ARTVISION_V30_CASPAR_FRIEDRICH_SEA_OF_ICE_20261025_1415_COMPLETE.zip
          if-no-files-found: warn
          retention-days: 60
      - name: Record factual status without changing approved masters
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          RENDER: ${{ steps.render.outcome }}
          VERIFY: ${{ steps.validate.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const path='queue/artvision_autoproduction_v31_state.json';
            const folder='output/artvision-autoproduction-v31/caspar_friedrich_sea_of_ice_20261025_1415';
            const film=folder+'/VIDEO_MASTER.mp4';
            const ok=['PREFLIGHT','RENDER','VERIFY','ARCHIVE'].every(k=>process.env[k]==='success');
            const hasFile=fs.existsSync(film);
            let qa=null;
            try{qa=JSON.parse(fs.readFileSync(folder+'/TECHNICAL_QA_V30.json','utf8'));}catch(e){}
            const event={
              cycle_id:'20261025T1415+0100',created_at:new Date().toISOString(),
              artist:'Caspar David Friedrich',work:'The Sea of Ice',format:'artvision_cinema',
              baseline:'cinema_v6',subtype:'new_standalone_authentic_artwork',
              reason_fallback:'Approved natural Gacrux narration not verified; no robotic voice or change of a narrated brief',
              status:ok?'technical_pass_not_gold_master':'blocked_or_rendered_needs_review',
              mp4_verified:ok&&hasFile,
              duration_seconds:ok?qa?.duration_seconds:null,
              size_bytes:hasFile?fs.statSync(film).size:null,
              sha256_mp4:hasFile?crypto.createHash('sha256').update(fs.readFileSync(film)).digest('hex'):null,
              workflow_run_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              artifact_name:'ArtVision-V31-20261025-Friedrich-The-Sea-Of-Ice',
              steps:{preflight:process.env.PREFLIGHT,render:process.env.RENDER,verify:process.env.VERIFY,archive:process.env.ARCHIVE},
              gold_master_approved:false,social_published:false,
              external_video_library_import:'not_attempted'
            };
            for(let attempt=0;attempt<3;attempt++){
              const old=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
              const state=JSON.parse(Buffer.from(old.data.content,'base64').toString('utf8'));
              state.cycle_log=state.cycle_log||[];
              const idx=state.cycle_log.findIndex(x=>x.cycle_id===event.cycle_id);
              if(idx>=0)state.cycle_log[idx]=event;else state.cycle_log.push(event);
              state.updated=new Date().toISOString();
              if(ok)state.next_preferred_format='artvision_critico';
              try{
                await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,
                  message:'ArtVision V31: record factual Sea of Ice render and QA outcome',
                  content:Buffer.from(JSON.stringify(state,null,2)+'\n').toString('base64'),
                  sha:old.data.sha,branch:'main'});
                break;
              }catch(e){if(attempt===2)throw e;}
            }
            core.summary.addHeading('ArtVision V31 — The Sea of Ice')
              .addRaw(`Outcome: **${event.status}**; MP4: ${hasFile?'present':'not present'}; duration: ${event.duration_seconds??'unknown'} seconds.\n\n`)
              .addRaw(`Artifact: ${event.artifact_name}. Social publishing: NOT performed. Artistic approval: PENDING.\n`)
              .write();
