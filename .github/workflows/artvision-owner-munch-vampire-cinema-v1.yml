name: "ArtVision OWNER | Munch Vampire | new Cinema private review"
on:
  pull_request:
    paths:
      - "scripts/artvision_owner_munch_vampire_cinema_v1.py"
      - ".github/workflows/artvision-owner-munch-vampire-cinema-v1.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-owner-munch-vampire-cinema-v1.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: artvision-owner-single-heavy-render
  cancel-in-progress: false
jobs:
  new_private_cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fast source and duplicate preflight, no external calls
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_owner_munch_vampire_cinema_v1.py
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
          python scripts/artvision_owner_munch_vampire_cinema_v1.py --preflight-only
      - name: Install FFmpeg if absent, produce source-locked private Cinema with original synthesized score
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core; fi
          python scripts/artvision_owner_munch_vampire_cinema_v1.py
      - name: Upload real MP4, title cover, source rights, QA and ZIP
        if: github.event_name != 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_OWNER_MUNCH_VAMPIRE_NEW_CINEMA_REVIEW
          retention-days: 30
          if-no-files-found: error
          path: |
            output/artvision-owner-munch-vampire-cinema-v1/VIDEO_ANDROID.mp4
            output/artvision-owner-munch-vampire-cinema-v1/COVER.jpg
            output/artvision-owner-munch-vampire-cinema-v1/CONTACT_SHEET.jpg
            output/artvision-owner-munch-vampire-cinema-v1/ANDROID_REVIEW_PACKAGE.zip
            output/artvision-owner-munch-vampire-cinema-v1/QA_TECHNICAL.json
            output/artvision-owner-munch-vampire-cinema-v1/SOURCES_RIGHTS.json
            output/artvision-owner-munch-vampire-cinema-v1/STORYBOARD.json
            output/artvision-owner-munch-vampire-cinema-v1/SOCIAL_POSTS.json
  independent_readback:
    needs: new_private_cinema
    if: github.event_name != 'pull_request' && needs.new_private_cinema.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ARTVISION_OWNER_MUNCH_VAMPIRE_NEW_CINEMA_REVIEW
          path: /tmp/munch-vampire-readback
      - name: Install missing FFmpeg and independently full-decode downloaded MP4
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          d=/tmp/munch-vampire-readback
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID.mp4" -map 0 -f null -
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,subprocess
          p=Path('/tmp/munch-vampire-readback')
          qa=json.loads((p/'QA_TECHNICAL.json').read_text())
          h=lambda x:hashlib.sha256(x.read_bytes()).hexdigest()
          assert qa['gold'] is False and qa['published'] is False and qa['new_paid_api_calls']==0
          assert (p/'VIDEO_ANDROID.mp4').stat().st_size==qa['video_bytes']
          assert h(p/'VIDEO_ANDROID.mp4')==qa['video_sha256']
          z=zipfile.ZipFile(p/'ANDROID_REVIEW_PACKAGE.zip')
          assert z.testzip() is None and hashlib.sha256(z.read('VIDEO_ANDROID.mp4')).hexdigest()==qa['video_sha256']
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(p/'VIDEO_ANDROID.mp4')]))
          assert 40<float(d['format']['duration'])<55
          assert any(s['codec_name']=='h264' and s.get('width')==1080 for s in d['streams'])
          assert any(s['codec_name']=='aac' for s in d['streams'])
          print('INDEPENDENT_ARTIFACT_BYTES_HASH_CRC_AND_FFMPEG_FULL_PASS',qa['video_sha256'],'NO_GOLD_NO_PUBLISH')
          PY
