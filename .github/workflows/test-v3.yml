name: "Tra le Pagine V3 - Test gratuito"
on:
  push:
    paths:
      - ".github/workflows/test-v3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  valida:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Installa soltanto Pillow"
        run: python -m pip install 'pillow>=10,<13'
      - name: "Sintassi e verifica scene EP01"
        run: |
          python -m py_compile src/episode_v3.py
          python src/episode_v3.py --episode 01_scacchi
      - name: "Conferma che EP02 senza immagini su GitHub venga fermato"
        run: |
          if python src/episode_v3.py --episode 02_arte_della_gioia; then
            echo "::error::Sicurezza fallita: EP02 senza immagini non deve essere renderizzabile"
            exit 1
          else
            echo "OK: nessuna illustrazione provvisoria verrà trasformata in video."
          fi
      - name: "Controlla grafica della copertina 9:16"
        run: |
          mkdir -p /tmp/tlp-cover
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          from PIL import Image
          sp=importlib.util.spec_from_file_location("ep","src/episode_v3.py")
          m=importlib.util.module_from_spec(sp);sp.loader.exec_module(m)
          p=Path("/tmp/tlp-cover")
          Image.new("RGB",(1080,1920),(52,92,101)).save(p/"COPERTINA.jpg")
          m.branded_cover(p,Path("episodes/01_scacchi"),{"title":"La novella degli scacchi","author":"Stefan Zweig"})
          target=p/"COPERTINA_SERIE.jpg"
          assert target.exists() and Image.open(target).size==(1080,1920)
          print("OK copertina di serie:",target.stat().st_size,"byte")
          PY
