name: "ArtVision OWNER | Munch Death and the Child | new Cinema private review"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-owner-munch-dead-mother-cinema-v1.yml"
permissions:
  contents: read
concurrency:
  group: artvision-owner-single-heavy-render
  cancel-in-progress: false
jobs:
  render_new_private_cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Zero-duplicate owner selection and exact Munch inventory preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_owner_munch_dead_mother_cinema_v1.py
          python - <<'PY'
          import json,pathlib
          q=json.loads(pathlib.Path('research/artvision_owner_selected_30_future_20261109.json').read_text())
          a=[w for w in q['works'] if w.get('title_as_chosen')=='The Dead Mother and Child' and w.get('artist_as_chosen')=='Edvard Munch']
          assert len(a)==1 and a[0]['selection_order']==18
          assert not list(pathlib.Path('queue').glob('artvision_owner_30_render_checkpoint_*dead*mother*.json')), 'Already produced owner Munch Cinema'
          assert not list(pathlib.Path('queue').glob('artvision_owner_30_render_checkpoint_*death*child*.json')), 'Alias duplicate of same painting'
          print('ONE UNPRODUCED OWNER-SELECTED MUNCH MM.M.00420 CINEMA — NO OTHER EDITION.')
          PY
      - name: Install free Linux media tools and libraries
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5'
      - name: Verify exact Commons original, compose soundtrack and render MP4
        run: python scripts/artvision_owner_munch_dead_mother_cinema_v1.py
      - name: Independently check source SHA1, MP4 H264/AAC, V326 QA, complete ZIP CRC
        shell: bash
        run: |
          set -euo pipefail
          d=output/artvision-owner-munch-dead-mother-cinema-v1
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID_REVIEW.mp4" -map 0 -f null -
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path('output/artvision-owner-munch-dead-mother-cinema-v1')
          src=p/'ORIGINAL_MUNCH_MM_M_00420.jpg'
          v=p/'VIDEO_ANDROID_REVIEW.mp4'
          q=json.loads((p/'QA_TECHNICAL.json').read_text())
          sha=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert src.stat().st_size==297684
          assert hashlib.sha1(src.read_bytes()).hexdigest()=='49ef76c0108bdf4df4382c1567f65ddb45748ac3'
          assert q['source_sha256']==sha(src)
          assert q['mp4_sha256']==sha(v) and q['mp4_bytes']>1_000_000
          assert q['fps']==20 and q['shots']==9
          assert q['v326_blocking_errors']==0 and 45<q['duration_s']<51
          assert not q['gold'] and not q['published'] and q['paid_api_calls']==0
          with zipfile.ZipFile(p/'ANDROID_REVIEW_PACKAGE.zip') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('VIDEO_ANDROID_REVIEW.mp4')).hexdigest()==q['mp4_sha256']
          print('ORIGINAL_IMAGE_PASS MP4_ALL_STREAMS_PASS SHA256_PASS ZIP_CRC_PASS V326_PASS; PRIVATE_NOT_GOLD')
          PY
      - name: Save real private video, Android ZIP, cover, storyboard and QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_OWNER_MUNCH_DEATH_CHILD_NEW_CINEMA_REVIEW
          retention-days: 30
          if-no-files-found: error
          path: |
            output/artvision-owner-munch-dead-mother-cinema-v1/VIDEO_ANDROID_REVIEW.mp4
            output/artvision-owner-munch-dead-mother-cinema-v1/ANDROID_REVIEW_PACKAGE.zip
            output/artvision-owner-munch-dead-mother-cinema-v1/COVER.jpg
            output/artvision-owner-munch-dead-mother-cinema-v1/CONTACT_SHEET.jpg
            output/artvision-owner-munch-dead-mother-cinema-v1/SOURCE_RIGHTS.json
            output/artvision-owner-munch-dead-mother-cinema-v1/STORYBOARD.json
            output/artvision-owner-munch-dead-mother-cinema-v1/SOCIAL_DRAFTS.json
            output/artvision-owner-munch-dead-mother-cinema-v1/QA_TECHNICAL.json
            output/artvision-owner-munch-dead-mother-cinema-v1/FFPROBE.json
            output/artvision-owner-munch-dead-mother-cinema-v1/DIRECTOR_V326.json
  independent_artifact_readback:
    needs: render_new_private_cinema
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Ensure actual FFmpeg on independent runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - uses: actions/download-artifact@v4
        with:
          name: ARTVISION_OWNER_MUNCH_DEATH_CHILD_NEW_CINEMA_REVIEW
          path: /tmp/munch-death-child
      - name: Check all real bytes and decode whole video+audio and ZIP after re-download
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/munch-death-child
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID_REVIEW.mp4" -map 0 -f null -
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path('/tmp/munch-death-child')
          q=json.loads((p/'QA_TECHNICAL.json').read_text())
          v=(p/'VIDEO_ANDROID_REVIEW.mp4').read_bytes()
          assert hashlib.sha256(v).hexdigest()==q['mp4_sha256']
          with zipfile.ZipFile(p/'ANDROID_REVIEW_PACKAGE.zip') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('VIDEO_ANDROID_REVIEW.mp4')).hexdigest()==q['mp4_sha256']
          d=json.loads((p/'DIRECTOR_V326.json').read_text())
          assert d['blocking']==[]
          print('SEPARATE_JOB_ARTIFACT_READBACK_PASS ALL_MEDIA_DECODE_AND_SHA_AND_ZIP_CRC. NO_GOLD NO_PUBLICATION')
          PY
