name: "La Storia Rivive V116 · source motion regression (offline)"
on:
  pull_request:
    paths:
      - "src/storia_rivive_motion_window_v115.py"
      - "tests/test_storia_rivive_motion_window_v115.py"
      - ".github/workflows/storia-rivive-v116-motion-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion_window_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify FFmpeg and compile motion guard
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          python -m py_compile src/storia_rivive_motion_window_v115.py tests/test_storia_rivive_motion_window_v115.py
      - name: Test genuine encoded motion vs static, SHA and PTS (no API)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_storia_rivive_motion_window_v115.py' -v
