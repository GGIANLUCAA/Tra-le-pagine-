name: La Storia Rivive V190 exact freeze source-lock for I2I and Vidu
on:
  push:
    branches: [storia-v183-production-candidate-20261101]
    paths:
      - 'src/storia_rivive_v190_exact_frame_handoff.py'
      - 'tests/test_storia_rivive_v190_exact_frame_handoff.py'
      - '.github/workflows/storia-v190-exact-frame-handoff.yml'
  pull_request:
    paths:
      - 'src/storia_rivive_v190_exact_frame_handoff.py'
      - 'tests/test_storia_rivive_v190_exact_frame_handoff.py'
      - '.github/workflows/storia-v190-exact-frame-handoff.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: storia-v190-source-handoff-pr180
  cancel-in-progress: false
jobs:
  offline-byte-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for real decoded-frame tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Eight regressions on real encoded synthetic clips
        run: |
          python -m py_compile src/storia_rivive_v190_exact_frame_handoff.py tests/test_storia_rivive_v190_exact_frame_handoff.py
          python -m unittest discover -s tests -p 'test_storia_rivive_v190_exact_frame_handoff.py' -v
  verify-authentic-v189-artifact:
    # Reuse the existing real-film V189 artifact; no 318MB redownload, APIs or credits.
    if: github.event_name == 'pull_request' && github.head_ref == 'storia-v183-production-candidate-20261101' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download SHA-locked V189 original film motion proof (9MB)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v190_v189
          gh run download 41340599822 --repo GGIANLUCAA/Tra-le-pagine- \
            --name v189-five-real-film-moving-scenes-bw-proof-not-final \
            --dir /tmp/v190_v189
          test -f /tmp/v190_v189/V189_REAL_MOTION_PROOF_REPORT.json
      - name: Validate exact last decoded frame and prepare safe 4+1 source-only handoff
        run: |
          set -euo pipefail
          python src/storia_rivive_v190_exact_frame_handoff.py \
            --report /tmp/v190_v189/V189_REAL_MOTION_PROOF_REPORT.json \
            --assets /tmp/v190_v189 \
            --out /tmp/v190_v189/V190_I2I_VIDU_SOURCE_HANDOFF.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/v190_v189/V190_I2I_VIDU_SOURCE_HANDOFF.json').read_text())
          assert len(d['source_frames'])==5 and len(d['i2i_requests'])==4
          assert all(x['last_decoded_frame_pixel_identical_to_freeze'] for x in d['source_frames'])
          assert d['photos_generated']==0 and d['vidu_clips_generated']==0
          assert d['provider_requests_sent']==0 and not d['publication_permitted']
          assert d['vidu_anchor']['user_approved_this_exact_scene'] is False
          print('V190_FIVE_ACTUAL_V189_FRAMES_PIXEL_IDENTICAL_TO_REAL_MOTION_END')
          print('V190_FOUR_I2I_SOURCE_INPUTS_AND_ONE_VIDU_ANCHOR_ONLY')
          print('V190_RIGHTS_AND_PROVIDER_AND_ARTISTIC_REVIEW_BLOCKED')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v190-verified-source-anchors-no-ai-no-vidu-not-final
          path: |
            /tmp/v190_v189/V190_I2I_VIDU_SOURCE_HANDOFF.json
            /tmp/v190_v189/*_last_real_film_frame.png
            /tmp/v190_v189/V189_REAL_MOTION_PROOF_REPORT.json
          if-no-files-found: error
          retention-days: 3
