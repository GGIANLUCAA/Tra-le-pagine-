name: "Vidu Personal - Free Source Quality Probe"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vidu-personal-source-probe.yml"
      - "personal_vidu/source_probe_request.json"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check exact photo size and accessibility without any Vidu credit usage
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import json, urllib.request, subprocess, base64, hashlib, io
          from PIL import Image
          source="https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F204fdba2-2cc9-4401-891d-ff97ee50a493/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAACUkHQT03_2pZfpa_p3b6ioQ1dBfe3JnWVCz3mzP9x_P&exp=1793430646&osig=AAAAAAAAAAAAAAAAAAAAAKCMKYv7D50psQuCR0GNHIZKqqENhy-RB1WK0ZqWeLIZ&signer=media-rpc&token=AAIAAU0AJDIwNGZkYmEyLTJjYzktNDQwMS04OTFkLWZmOTdlZTUwYTQ5MwAAAAABoZDL7PDSqv47gTbhzdGpnP9v8zINtv_nRmKVfi_FQGeOjhX2Yw&x-canva-quality=thumbnail"
          urls=[
            ("thumbnail_signed",source),
            ("full_signed_1536",source.replace("height:200","height:1536").replace("width:112","width:864")),
            ("large_signed_1024",source.replace("height:200","height:1024").replace("width:112","width:576")),
            ("large_no_x_canva_quality",source.replace("height:200","height:1024").replace("width:112","width:576").replace("&x-canva-quality=thumbnail","")),
          ]
          data=[]
          for name,url in urls:
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"image/jpeg,*/*"})
              with urllib.request.urlopen(req,timeout=25) as response:
                raw=response.read(12_000_000)
              im=Image.open(io.BytesIO(raw)); im.verify()
              data.append({"kind":name,"accessible":True,"bytes":len(raw),"size":list(Image.open(io.BytesIO(raw)).size),"sha256":hashlib.sha256(raw).hexdigest()})
            except Exception as exc: data.append({"kind":name,"error":type(exc).__name__+": "+str(exc)[:200]})
          payload=base64.b64encode((json.dumps(data,indent=2)+"\n").encode()).decode()
          endpoint="repos/GGIANLUCAA/Tra-le-pagine-/contents/personal_vidu/source_probe_result.json"
          old=json.loads(subprocess.run(["gh","api",endpoint],capture_output=True,text=True).stdout or "{}").get("sha")
          args=["gh","api",endpoint,"-X","PUT","-f","message=Check signed image source fidelity, zero Vidu credits","-f","content="+payload,"-f","branch=main"]
          if old:args+=["-f","sha="+old]
          subprocess.run(args,check=True)
          PY
