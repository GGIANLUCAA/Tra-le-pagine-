name: ArtVision Socrates V60 — authentic frame photo only
on:
  push:
    branches:
      - artvision-socrates-real-frame-v60
    paths:
      - src/artvision_socrates_real_frame_v60.py
      - .github/workflows/artvision-socrates-frame-source-v60.yml
  pull_request:
    paths:
      - src/artvision_socrates_real_frame_v60.py
      - .github/workflows/artvision-socrates-frame-source-v60.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download-photo-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public image decoder
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Download exactly licensed historical photograph of same frame and audit bytes
        run: python src/artvision_socrates_real_frame_v60.py --out output/socrates-authentic-frame-v60
      - name: Preserve source-only assets, do not claim a film
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_SOCRATES_AUTHENTIC_FRAME_CC_BY_SA_V60_SOURCE_ONLY
          path: output/socrates-authentic-frame-v60
          retention-days: 30
          if-no-files-found: error
