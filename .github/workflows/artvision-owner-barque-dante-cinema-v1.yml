name: "ArtVision OWNER · The Barque of Dante · new Cinema private review"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-owner-barque-dante-cinema-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artvision-owner-single-heavy-render
  cancel-in-progress: false
jobs:
  one_new_private_cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preflight exact in-queue artwork and no duplicate output checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_owner_barque_dante_cinema_v1.py
          python - <<'PY'
          import pathlib,json
          q=json.loads(pathlib.Path('research/artvision_owner_selected_30_future_20261109.json').read_text())
          matches=[w for w in q['works'] if w.get('title_as_chosen')=='The Barque of Dante' and w.get('artist_as_chosen')=='Eugène Delacroix']
          assert len(matches)==1 and matches[0]['selection_order']==27, 'Queue mismatch'
          checkpoints=list(pathlib.Path('queue').glob('artvision_owner_30_render_checkpoint_*barque_dante*.json'))
          assert len(checkpoints)==1,'One exact known failed checkpoint required for safe retry'
          cp=json.loads(checkpoints[0].read_text())
          assert cp['work']['status']=='FAILED_PRE_RENDER_GEOMETRY_SAFE_RETRY_ONCE'
          assert cp['attempts']['completed']==1 and cp['attempts']['maximum']==2
          assert cp['github']['first_run_id']==42878663658
          assert cp['counts']['new_verified_mp4_this_cycle']==0
          print("ONE_SAFE_RETRY_AFTER_NO_MP4_GEOMETRY_FAILURE; same vetted source; no paid calls",flush=True)
          PY
      - name: Install licensed local rendering dependencies only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
      - name: One safe retry with pixel-clamped matte; exact source SHA1; render Cinema MP4
        run: python scripts/artvision_owner_barque_dante_cinema_v1.py
      - name: Independent FFmpeg full decode, SHA256, ZIP CRC, full ZIP file readback
        shell: bash
        run: |
          set -euo pipefail
          d=output/artvision-owner-barque-dante-cinema-v1
          ffprobe -v error -show_format -show_streams -of json "$d/VIDEO_REVIEW.mp4" > "$d/FFPROBE.json"
          ffmpeg -v error -xerror -i "$d/VIDEO_REVIEW.mp4" -map 0:v:0 -f null -
          ffmpeg -v error -xerror -i "$d/VIDEO_REVIEW.mp4" -map 0:a:0 -f null -
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          d=Path('output/artvision-owner-barque-dante-cinema-v1')
          src=d/'ORIGINAL_DELACROIX_PD_ART.jpg';mp4=d/'VIDEO_REVIEW.mp4'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert src.stat().st_size==20968161
          assert hashlib.sha1(src.read_bytes()).hexdigest()=='f400b554befea0d06d8344a3c58c99b0c2e0718a'
          assert mp4.stat().st_size>1000000
          spec=json.loads((d/'FFPROBE.json').read_text())
          v=[s for s in spec['streams'] if s.get('codec_type')=='video']
          a=[s for s in spec['streams'] if s.get('codec_type')=='audio']
          assert len(v)==1 and v[0]['codec_name']=='h264' and (v[0]['width'],v[0]['height'])==(1080,1920)
          assert len(a)==1 and a[0]['codec_name']=='aac'
          assert 70<float(spec['format']['duration'])<90
          rights=json.loads((d/'SOURCES_RIGHTS.json').read_text())
          assert rights['photo_author']=='Shonagon (2024)'
          assert 'Public Domain Mark' in rights['photo_license']
          assert rights['source_sha256']==sha(src)
          assert rights['distribution_allowed'] is False
          story=json.loads((d/'STORYBOARD.json').read_text())
          assert len(story['shots'])==18 and story['human_full_speed_QA']=='PENDING'
          report={'work':'The Barque of Dante','artist':'Eugène Delacroix','variant':'cinema_standard',
            'museum_object':'Louvre INV 3820','original_photo_sha1':'f400b554befea0d06d8344a3c58c99b0c2e0718a',
            'original_photo_sha256':sha(src),'original_photo_bytes':src.stat().st_size,
            'mp4_sha256':sha(mp4),'mp4_bytes':mp4.stat().st_size,
            'ffmpeg_video_full_decode':'PASS','ffmpeg_audio_full_decode':'PASS',
            'status':'rendered_needs_visual_and_semantic_review','commercial_rights_final':'PENDING',
            'human_artistic_review':'PENDING','published':False,'gold':False,
            'new_main_queue_slots':0,'new_paid_api_spend':0}
          (d/'QA_TECHNICAL.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
          names=['VIDEO_REVIEW.mp4','COVER.jpg','ORIGINAL_DELACROIX_PD_ART.jpg','ORIGINAL_SCORE.wav',
            'SOURCES_RIGHTS.json','STORYBOARD.json','SOCIAL_DRAFTS.json','READ_ME_FIRST.md',
            'CONTACT_SHEET.jpg','FFPROBE.json','QA_TECHNICAL.json']
          zip_path=d/'REVIEW_PACKAGE.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=3) as f:
              for n in names:f.write(d/n,arcname=n)
          with zipfile.ZipFile(zip_path) as f:
              assert f.testzip() is None
              for n in names: assert f.read(n)==(d/n).read_bytes(),n
          print('NEW_BARQUE_DANTE_MP4_SHA256',sha(mp4),flush=True)
          print('NEW_BARQUE_DANTE_ZIP_SHA256',sha(zip_path),flush=True)
          print('ORIGINAL_SOURCE_SHA256',sha(src),flush=True)
          print('TECH_PASS_CRC_PASS_REVIEW_PENDING_NO_GOLD_NO_PUBLICATION',flush=True)
          PY
      - name: Upload new nonpublic review MP4, cover, contact sheet and ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_OWNER_BARQUE_DANTE_NEW_CINEMA_REVIEW
          path: |
            output/artvision-owner-barque-dante-cinema-v1/VIDEO_REVIEW.mp4
            output/artvision-owner-barque-dante-cinema-v1/REVIEW_PACKAGE.zip
            output/artvision-owner-barque-dante-cinema-v1/COVER.jpg
            output/artvision-owner-barque-dante-cinema-v1/CONTACT_SHEET.jpg
            output/artvision-owner-barque-dante-cinema-v1/QA_TECHNICAL.json
          if-no-files-found: error
          retention-days: 14
