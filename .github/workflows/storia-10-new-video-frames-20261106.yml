name: "La Storia Rivive - 10 NEW still frames from verified historical movies"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storia-10-new-video-frames-20261106.yml"
permissions:
  contents: read
jobs:
  film-thumbnail-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install image libraries
        run: pip install -q pillow requests
      - name: Retrieve still-frame previews rendered by Wikimedia FROM actual film files
        shell: bash
        run: |
          cat > /tmp/frames.py <<'PY'
          import os,sys,json,hashlib,unicodedata,urllib.parse,time,zipfile,io
          import requests
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          os.makedirs('out/frames',exist_ok=True)
          entries=[
            ('Fabbri al lavoro',1893,'Blacksmith Scene (1893).webm'),
            ('Colazione in famiglia',1895,'Repas de bébé (1895).webm'),
            ('Arrivo del treno',1895,'Arrival of a Train at La Ciotat (The Lumière Brothers, 1895).webm'),
            ('Danza serpentina',1897,'Danse serpentine (Lumière, 1897).webm'),
            ('Il mago',1898,'Le magicien (1898).webm'),
            ('Torre Eiffel',1900,'Eiffel Tower from the Trocadero Palace (1900).webm'),
            ('Palazzo elettricità',1900,'Palace of Electricity (1900).webm'),
            ('Castello misterioso',1896,'The Haunted Castle 1896.ogv'),
            ('Demolizione del muro',1896,"Démolition d'un mur.webm"),
            ('Il disegno incantato',1900,'The Enchanted Drawing.ogv'),
            ('Trucco teatrale',1900,'Ching Ling Foo outdone (1900).webm'),
            ('Auto esplosiva',1900,'Explosion of a Motor Car (1900).webm'),
            ('Il cielo e la luna',1898,'La Lune à un mètre (1898).webm'),
            ('Danza giavanese',1900,'Danse javanaise (1900).webm'),
            ('Ferrovia in corsa',1898,"Panorama pris d'un train en marche (1898).webm"),
            ('Uscita dalla fabbrica',1895,'Auguste & Louis Lumière- Sortie des Usines Lumière à Lyon (1895).webm')]
          sess=requests.Session();sess.headers.update({'User-Agent':'LaStoriaRiviveHistoricalFrameReview/1.0 (collecting ten noncommercial film-frame examples)','Accept':'image/jpeg,image/*;q=0.9,*/*;q=0.1'})
          data=[];fail=[]
          for title,year,fn in entries:
            if len(data)>=10:break
            f=unicodedata.normalize('NFC',fn.replace(' ','_'))
            d=hashlib.md5(f.encode()).hexdigest()
            enc=urllib.parse.quote(f,safe="()!,'")
            base=f"{d[0]}/{d[:2]}/{enc}"
            ok=False
            for width in [500,330,250,960]:
              for host in ['https://thumb.wikimedia.org','https://upload.wikimedia.org']:
                url=f'{host}/wikipedia/commons/thumb/{base}/{width}px--{enc}.jpg'
                try:
                  res=sess.get(url,timeout=17)
                  if res.status_code!=200 or len(res.content)<3000:
                    raise Exception(f"HTTP{res.status_code}")
                  im=Image.open(io.BytesIO(res.content)).convert('RGB')
                  if im.width<230 or im.height<150:raise Exception("preview too small")
                  n=len(data)+1
                  filename=f"{n:02d}_{year}_PREVIEW_DA_FILM.jpg"
                  im.save('out/frames/'+filename,quality=95)
                  info={'number':n,'title':title,'year':year,'source_filename':fn,'source_video_url':'https://commons.wikimedia.org/wiki/File:'+urllib.parse.quote(f),'preview_generated_from_video_url':url,'preview_sha256':hashlib.sha256(res.content).hexdigest(),'width':im.width,'height':im.height,'frame_filename':filename,'method':'OFFICIAL_HOST_AUTO_GENERATED_VIDEO_POSTER_FRAME; NOT an individually timed FFmpeg extraction; NOT generative AI'}
                  data.append(info);print('PASS',n,title,im.size,flush=True);ok=True;break
                except Exception as exc:
                  print('TRY_FAIL',title,width,host,str(exc)[:110],flush=True)
              if ok:break
            if not ok:fail.append(fn)
          json.dump({'count':len(data),'frames':data,'failures':fail,'note':'Authentic auto-generated Wikimedia preview frames from separate actual historical film files. Poster-frame timestamp is not known; no AI reconstruction or previous processed episode included.'},open('out/VIDEO_FRAMES_SOURCES.json','w'),indent=2,ensure_ascii=False)
          if len(data)<10:sys.exit('INSUFFICIENT_USABLE_VIDEO_POSTER_FRAMES '+str(len(data)))
          sheet=Image.new('RGB',(1230,2090),(12,16,23));draw=ImageDraw.Draw(sheet)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',20)
          fonttitle=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',25)
          draw.text((22,12),'LA STORIA RIVIVE  |  10 NUOVI FOTOGRAMMI DA FILMATI',fill='white',font=fonttitle)
          for i,r in enumerate(data):
            x=10+(i%2)*610;y=57+(i//2)*405
            frame=Image.open('out/frames/'+r['frame_filename']).convert('RGB')
            im=ImageOps.contain(frame,(600,340))
            sheet.paste(im,(x+(600-im.width)//2,y+(340-im.height)//2))
            draw.rectangle((x,y+342,x+600,y+404),fill=(32,37,46))
            draw.text((x+8,y+347),f"{r['number']:02d}. {r['title']} ({r['year']})",fill='white',font=font)
            draw.text((x+8,y+374),f"Fotogramma anteprima video  |  {r['width']}x{r['height']}",fill='#dedede',font=font)
          sheet.save('out/10_NUOVI_FOTOGRAMMI_DA_FILMATI.jpg',quality=93,optimize=True)
          with zipfile.ZipFile('out/10_NUOVI_FOTOGRAMMI_VIDEO_STORICI.zip','w',zipfile.ZIP_DEFLATED) as z:
            for x in sorted(os.listdir('out/frames')):z.write('out/frames/'+x,'frames/'+x)
            z.write('out/10_NUOVI_FOTOGRAMMI_DA_FILMATI.jpg','10_NUOVI_FOTOGRAMMI_DA_FILMATI.jpg')
            z.write('out/VIDEO_FRAMES_SOURCES.json','VIDEO_FRAMES_SOURCES.json')
          with zipfile.ZipFile('out/10_NUOVI_FOTOGRAMMI_VIDEO_STORICI.zip') as z:assert z.testzip() is None
          print('SUCCESS 10 different video preview frames, ZIP CRC PASS',flush=True)
          PY
          python /tmp/frames.py
      - name: Save downloadable original frame candidate board
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_10_NEW_MOVING_FILM_SOURCE_FRAMES
          path: out/
          retention-days: 14
