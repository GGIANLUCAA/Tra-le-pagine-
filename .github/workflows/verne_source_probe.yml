name: Verne — Source catalog preflight (no TTS)
on:
  push:
    branches: [main, feature/verne-nautilus-20261027]
    paths:
      - "src/verne_source_probe.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect original illustrations without fetching image assets
        run: python src/verne_source_probe.py
