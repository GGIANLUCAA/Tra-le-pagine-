name: Creative Reveals V5 — selective narrative quality
on:
  pull_request:
    paths:
      - experiments/creative_reveals/**
      - tests/test_selective_reveal_quality_v5.py
      - .github/workflows/creative-reveals-quality-v5.yml
permissions:
  contents: read
jobs:
  tests-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FREE software
        run: |
          python -m pip install 'numpy>=1.25,<3' 'pillow>=10,<13' 'opencv-python-headless>=4.8,<5'
      - name: Verify no-master-overwrite and no-ArtVision-repainting
        run: python -m unittest discover -s tests -p 'test_selective_reveal_quality_v5.py' -v
