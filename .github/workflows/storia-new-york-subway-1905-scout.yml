name: "La Storia Rivive NEW 1905 NYC Subway · original source film scout"
on:
  push:
    branches: [main]
    paths: [".github/workflows/storia-new-york-subway-1905-scout.yml"]
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Install no-charge source-analysis dependencies"
        run: |
          python -m pip install -q "opencv-python-headless>=4.9,<5" "numpy>=1.26,<3" "pillow>=10,<13"
      - name: "Verify 1905 authentic original film and scout 13 visually distinct shots"
        run: python -u tools/storia_nyc_subway_1905_source_scout_v1.py
      - name: "Retain real source and contact frames for review, no Vidu"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NY_SUBWAY_1905_REAL_ARCHIVAL_PREPAY_SCOUT
          path: output/storia_subway_1905_v1/
          if-no-files-found: warn
          retention-days: 14
