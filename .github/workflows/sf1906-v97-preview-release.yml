name: "San Francisco 1906 - publish QA preview only"
on:
  push:
    branches: [main]
    paths: [".github/workflows/sf1906-v97-preview-release.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover successfully generated preview MP4 and four I2I stills
        shell: bash
        run: |
          gh run download 41049248482 --repo "$GITHUB_REPOSITORY" --name SF1906_V97_REAL_ARCHIVE_QA_PREVIEW --dir sf1906
          test -s sf1906/SF1906_V97_FOUR_RESTORATIONS_QA_PREVIEW_NOT_FINAL.mp4
          test -s sf1906/SF1906_FIVE_SCENE_SOURCE_VS_PHOTO.jpg
          test -s sf1906/V97_PREVIEW_STATUS.json
      - name: Publish downloadable QA review, never mislabel as finished
        shell: bash
        run: |
          tag=storia-rivive-sf1906-v97-i2i-qa-review
          gh release create "$tag" \
            sf1906/SF1906_V97_FOUR_RESTORATIONS_QA_PREVIEW_NOT_FINAL.mp4 \
            sf1906/SF1906_FIVE_SCENE_SOURCE_VS_PHOTO.jpg \
            sf1906/V97_PREVIEW_STATUS.json \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "San Francisco 1906 V97 - true I2I QA review, not final" \
            --notes "Actual Miles Brothers 1906 film, four free image-to-image photographic reconstructions. Review-only because Vidu scene, source-face review and Italian rights clearance are pending. No paid Vidu call."
