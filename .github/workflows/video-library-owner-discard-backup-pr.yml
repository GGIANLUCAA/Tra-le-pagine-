name: Video Library - Owner rejected content recovery backup

# Recovery backup already created, downloaded and SHA-checked before cleanup:
# https://github.com/GGIANLUCAA/Tra-le-pagine-/actions/runs/43950515320
# Archive artifact 14266173436, SHA256 ZIP 482bcc5137fe361c6399307877c92941c2680fe92ab8b0ffeb50bd29ea92d5b5
# Never rerun on PR pushes after source videos have been deleted.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vls-cleanup-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-before-deleting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install small HTTP client only
        run: python3 -m pip -q install requests
      - name: Download each exact old MP4 and cover to a SHA-verified ZIP
        run: python3 src/video_library_owner_rejected_backup.py --output-dir private_backup
      - name: Upload rollback ZIP as workflow artifact before any R2 deletion
        uses: actions/upload-artifact@v4
        with:
          name: VLS_OWNER_REJECTED_BACKUP_${{ github.run_id }}
          path: |
            private_backup/VIDEO_LIBRARY_REJECTED_RECOVERY_20261116.zip
            private_backup/verified_manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
