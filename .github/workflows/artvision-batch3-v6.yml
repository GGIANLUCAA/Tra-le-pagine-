name: "ArtVision - 3 artisti Cinema V6 (produzione in serie)"
run-name: "Lotto sperimentale 3 artisti — V6"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-batch3-v6.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artvision-batch:
    name: "Film artistico — ${{ matrix.artist }}"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        artist: [monet, hokusai, rembrandt]
    steps:
      - name: "Progetto originale e versioni precedenti intatti"
        uses: actions/checkout@v4
      - name: "Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "FFmpeg e librerie open-source"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
          python -m py_compile modules/artvision/batch3_cinema_v6.py modules/artvision/director_cinema_v6.py modules/artvision/identita_visiva_v6.py
      - name: "Ricerca opere originali, curatela V6 e film completo"
        run: python modules/artvision/batch3_cinema_v6.py --artist "${{ matrix.artist }}"
      - name: "Consegna MP4, copertina, diritti e report (senza pubblicare)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "ARTVISION_V6_${{ matrix.artist }}"
          path: |
            output/artvision-batch-v6/${{ matrix.artist }}/film/*.mp4
            output/artvision-batch-v6/${{ matrix.artist }}/film/*.jpg
            output/artvision-batch-v6/${{ matrix.artist }}/film/*.json
            output/artvision-batch-v6/${{ matrix.artist }}/film/*.txt
          if-no-files-found: error
          retention-days: 7
