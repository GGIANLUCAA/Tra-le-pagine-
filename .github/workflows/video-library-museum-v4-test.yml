name: Video Library Studio · Museum V4 interactive checks
on:
  push:
    paths:
      - site/video-library-v2.html
      - .github/workflows/video-library-museum-v4-test.yml
  pull_request:
    paths:
      - site/video-library-v2.html
      - .github/workflows/video-library-museum-v4-test.yml
permissions:
  contents: read
jobs:
  museum:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML transport size and inline JavaScript
        run: |
          python3 - <<'PY'
          import re,subprocess
          from pathlib import Path
          html=Path('site/video-library-v2.html').read_text()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',html)
          assert len(scripts)==1
          for el in ('museumMainFrame','museumPicks','museumWatch','museumDetails','museumLeftImage','museumRightImage','latestRail','socialOpen','playerDownload'):
              assert 'id="'+el+'"' in html,el
          p=subprocess.run(['node','--check'],input=scripts[0],capture_output=True,text=True)
          assert p.returncode==0,p.stderr
          parts=re.split(r'(<script[^>]*>[\s\S]*?</script>)',html,flags=re.I)
          compact=[]
          for i,chunk in enumerate(parts):
              chunk=re.sub(r'/\*[\s\S]*?\*/','',chunk)
              if i%2==0:
                  chunk=re.sub(r'^[ \t]+(?=<)','',chunk,flags=re.M)
                  chunk=re.sub(r'\n[ \t]*\n+','\n',chunk)
                  chunk=re.sub(r'>\s+<','><',chunk)
              compact.append(chunk)
          size=len(''.join(compact).encode('utf-8'))
          assert size<220000,size
          print('PASS: museum + core UI present, syntax valid, publish transport:',size)
          PY
      - name: Install isolated DOM runtime
        run: npm install --prefix /tmp/museum-v4 --silent --no-audit --no-fund jsdom@26
      - name: Exercise real catalog UI bindings with fixed fixtures
        run: |
          cat > /tmp/museum-v4/check.cjs <<'JS'
          const {JSDOM,VirtualConsole}=require('/tmp/museum-v4/node_modules/jsdom');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const html=fs.readFileSync('site/video-library-v2.html','utf8');
          const model={admin:false,items:[
            {key:'ARTVISION_BRUEGEL_MUSEUM.mp4',name:'ARTVISION_BRUEGEL_MUSEUM.mp4',size:1200000,available:true,cover:'/cover/ARTVISION_BRUEGEL_MUSEUM',category:'Arte',uploaded:'2026-11-08T09:00:00Z'},
            {key:'STORIA_CARMENCITA_1894.mp4',name:'STORIA_CARMENCITA_1894.mp4',size:700000,available:true,cover:'/cover/STORIA_CARMENCITA_1894',category:'Storia',uploaded:'2026-11-08T08:00:00Z'},
            {key:'WOW_LAB_FANTASIA.mp4',name:'WOW_LAB_FANTASIA.mp4',size:600000,available:true,cover:'/cover/WOW_LAB_FANTASIA',category:'Video-creativi',uploaded:'2026-11-08T07:00:00Z'},
            {key:'ARTVISION_GPT_UNAVAILABLE.mp4',name:'ARTVISION_GPT_UNAVAILABLE.mp4',size:620000,available:false,cover:null,category:'Arte'}
          ]};
          const errs=[],vc=new VirtualConsole();vc.on('jsdomError',e=>errs.push(e.stack||e.message));
          const dom=new JSDOM(html,{url:'https://video-library-studio.600led.workers.dev/',runScripts:'dangerously',pretendToBeVisual:true,virtualConsole:vc,beforeParse(w){
            w.fetch=async()=>({ok:true,json:async()=>model});
            w.HTMLElement.prototype.scrollIntoView=()=>{};
            w.HTMLDialogElement.prototype.showModal=function(){this.open=true};
            w.HTMLDialogElement.prototype.close=function(){this.open=false};
            w.HTMLMediaElement.prototype.play=()=>Promise.resolve();
            w.HTMLMediaElement.prototype.pause=()=>{};
          }});
          (async()=>{
            await new Promise(r=>setTimeout(r,1100));
            const d=dom.window.document;
            assert.equal(d.querySelector('#museumPicks').children.length,1,'ArtVision must show only its playable item');
            assert.match(d.querySelector('#museumFilmTitle').textContent,/BRUEGEL/i);
            assert.equal(d.querySelector('#museumMainImage').getAttribute('src'),'/cover/ARTVISION_BRUEGEL_MUSEUM');
            d.querySelector('#museumWatch').click();
            assert(d.querySelector('#player').open,'Museum play must open original player');
            assert.match(d.querySelector('#video').src,/ARTVISION_BRUEGEL_MUSEUM/);
            d.querySelector('#player').close();
            d.querySelector('[data-museum-room="history"]').click();
            assert.match(d.querySelector('#museumFilmTitle').textContent,/CARMENCITA/i);
            d.querySelector('[data-museum-room="wow"]').click();
            assert.match(d.querySelector('#museumFilmTitle').textContent,/WOW LAB/i);
            assert.equal(d.querySelectorAll('#museumPicks .museum-pick').length,1);
            assert.equal(d.querySelector('#playerDownload')!==null,true,'Original download must remain present');
            assert.equal(errs.length,0,errs.join('\n'));
            console.log('PASS: 3 rooms, real covers, playable only, existing player and download controls preserved');
            dom.window.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/museum-v4/check.cjs
