name: "Tra le Pagine - Miniature episodi V10"
on:
  pull_request:
    paths:
      - "tools/build_episode_previews_v10.py"
      - "tests/test_episode_previews_v10.py"
      - "docs/episode_gallery_v10.js"
      - "docs/app.js"
      - "docs/index.html"
      - "docs/styles.css"
      - ".github/workflows/episode-previews-v10.yml"
  push:
    branches: [main]
    paths:
      - "tools/build_episode_previews_v10.py"
      - "tests/test_episode_previews_v10.py"
      - ".github/workflows/episode-previews-v10.yml"
      - "episodes/**/scene_premium.zip"
      - "episodes/**/images/**"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Installa solo libreria immagini già utilizzata nel renderer"
        run: python -m pip install "pillow>=10,<13"
      - name: "Prova archivi e materiali mancanti"
        run: python -m unittest discover -s tests -p "test_episode_previews_v10.py" -v
      - name: "Estrai vere foto per l'anteprima, mai video o copertine sintetiche"
        run: python tools/build_episode_previews_v10.py --repo .
      - name: "Controlla catalogo e 1a copertina disponibile"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("docs/previews/catalog.json").read_text(encoding="utf-8"))
          assert not p["videos_published_automatically"]
          assert len(p["episodes"]) >= 7
          assert any(x["poster"] for x in p["episodes"].values())
          print("Anteprime vere create per",sum(bool(x["poster"]) for x in p["episodes"].values()),"episodi.")
          PY
      - name: "Pubblica SOLO JPG già pubblici e catalogo su Pages"
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews
          if git diff --cached --quiet; then
            echo "Nessuna modifica alle immagini."
          else
            git commit -m "assets: generate genuine story thumbnails V10"
            git push origin HEAD:main
          fi
      - name: "Copia di sicurezza anteprime"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANTEPRIME_EPISODI_V10
          path: docs/previews/
          if-no-files-found: warn
          retention-days: 14
