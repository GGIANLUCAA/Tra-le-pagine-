name: "ArtVision Cinema V6 - lotto 5 nuovi artisti"
run-name: "Cinque artisti, cinque durate e cinque musiche"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-batch5-v6.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artvision:
    name: "Cinema V6 — ${{ matrix.artist }}"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        artist: [klimt, vermeer, bosch, botticelli, mucha]
    steps:
      - name: "Preserva repository e Gold Master"
        uses: actions/checkout@v4
      - name: "Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "FFmpeg e librerie video gratuite"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
          python -m py_compile modules/artvision/batch5_cinema_v6.py modules/artvision/director_cinema_v6.py modules/artvision/identita_visiva_v6.py
      - name: "Fonti museali, regia e montaggio cinematografico"
        run: python modules/artvision/batch5_cinema_v6.py --artist "${{ matrix.artist }}"
      - name: "Consegna MP4 unico, copertina, fonti e report"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "ARTVISION_V6_5_${{ matrix.artist }}"
          path: |
            output/artvision-batch5-cinema/${{ matrix.artist }}/film/*.mp4
            output/artvision-batch5-cinema/${{ matrix.artist }}/film/*.jpg
            output/artvision-batch5-cinema/${{ matrix.artist }}/film/*.json
            output/artvision-batch5-cinema/${{ matrix.artist }}/film/*.txt
          if-no-files-found: error
          retention-days: 7
