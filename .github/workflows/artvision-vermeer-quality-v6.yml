name: "ArtVision - Vermeer final iconic opening revision"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-vermeer-quality-v6.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vermeer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Setup FFmpeg and Python"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
          python -m py_compile modules/artvision/batch5_cinema_v6.py
      - name: "Vermeer — iconic pearl opening and distinct artwork selection"
        run: python modules/artvision/batch5_cinema_v6.py --artist vermeer
      - name: "Final MP4 cover and sources"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "ARTVISION_V6_VERMEER_FINALE_CURATO"
          path: |
            output/artvision-batch5-cinema/vermeer/film/*.mp4
            output/artvision-batch5-cinema/vermeer/film/*.jpg
            output/artvision-batch5-cinema/vermeer/film/*.json
            output/artvision-batch5-cinema/vermeer/film/*.txt
          if-no-files-found: error
          retention-days: 7
