name: "ArtVision - Atelier V4 (V1/V2/V3 conservate)"
run-name: "ARTVISION V4 - ${{ inputs.artist || 'richiesta automatica' }}"
on:
  workflow_dispatch:
    inputs:
      style:
        description: "Regia: Cinema WOW o vecchio motore museo"
        type: choice
        required: true
        default: atelier_v4
        options:
          - atelier_v4
          - harmonic_reveal
          - cinematic_wow
          - museum_legacy
      artist:
        description: "Nome esatto dell'artista"
        required: true
        default: "Vincent van Gogh"
        type: string
      duration:
        description: "Durata MP4 in secondi (120-180)"
        required: true
        default: "150"
        type: choice
        options:
          - "120"
          - "150"
          - "180"
      music:
        description: "Musica registrata con licenza CC BY 4.0; per Atelier V4"
        type: choice
        required: true
        default: evening_fall_piano
        options:
          - evening_fall_piano
          - calmant
      max_works:
        description: "Numero massimo di opere distinte"
        required: true
        default: "16"
        type: choice
        options:
          - "8"
          - "12"
          - "16"
          - "20"
          - "24"
  push:
    branches: [main]
    paths:
      - "modules/artvision/queue.json"

permissions:
  contents: read
concurrency:
  group: artvision-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  artvision:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ARTIST: ${{ github.event.inputs.artist || 'Vincent van Gogh' }}
      VIDEO_DURATION: ${{ github.event.inputs.duration || '150' }}
      MAX_WORKS: ${{ github.event.inputs.max_works || '16' }}
      PYTHONUNBUFFERED: "1"
      ARTVISION_STYLE: ${{ github.event.inputs.style || 'atelier_v4' }}
      ARTVISION_MUSIC: ${{ github.event.inputs.music || 'evening_fall_piano' }}
    steps:
      - name: "Scarica progetto (sistema originale intatto)"
        uses: actions/checkout@v4

      - name: "Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Carica richiesta automatica dalla coda"
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path("modules/artvision/queue.json").read_text(encoding="utf-8"))
          assert request.get("approved_for_render") is True, "Richiesta non autorizzata: non genero MP4"
          assert request.get("publish") is False, "ArtVision non pubblica automaticamente"
          artist = str(request.get("artist", "")).strip()
          assert 2 <= len(artist) <= 100 and "\n" not in artist and "\r" not in artist, "Nome artista non valido"
          duration = int(request.get("duration", 150))
          works = int(request.get("max_works", 16))
          style = str(request.get("style", "atelier_v4"))
          assert style in ("atelier_v4", "harmonic_reveal", "cinematic_wow", "museum_legacy"), "Regia sconosciuta"
          music = str(request.get("music", "evening_fall_piano"))
          assert music in ("evening_fall_piano", "calmant"), "Brano non autorizzato"
          assert 120 <= duration <= 180 and 6 <= works <= 24, "Durata o numero opere non valido"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ARTIST={artist}\n")
              env.write(f"VIDEO_DURATION={duration}\n")
              env.write(f"MAX_WORKS={works}\n")
              env.write(f"ARTVISION_STYLE={style}\n")
              env.write(f"ARTVISION_MUSIC={music}\n")
          print("Richiesta verificata:", request.get("request_id"), artist, duration, works)
          PY

      - name: "Installa FFmpeg e ffprobe"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: "Controlli preventivi, nessuna API a pagamento"
        shell: bash
        run: |
          python -m py_compile modules/artvision/artvision.py modules/artvision/cinema_wow_v2.py modules/artvision/artvision_cinema_run.py modules/artvision/harmonic_reveal_v3.py modules/artvision/atelier_v4.py
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
          python - <<'PY'
          import os
          artist=os.environ['ARTIST'].strip()
          assert 2 <= len(artist) <= 100, 'Il nome artista deve avere 2-100 caratteri'
          assert 120 <= int(os.environ['VIDEO_DURATION']) <= 180
          assert 6 <= int(os.environ['MAX_WORKS']) <= 24
          print('Artist:',artist,'- no voice - no Gemini - no paid API')
          PY

      - name: "Librerie open-source gratuite"
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"

      - name: "Genera MP4, musica originale e manifest fonti (regia selezionata)"
        shell: bash
        run: |
          if [[ "$ARTVISION_STYLE" == "atelier_v4" ]]; then
            python modules/artvision/atelier_v4.py \
              --artist "$ARTIST" \
              --duration "$VIDEO_DURATION" \
              --max-works "$MAX_WORKS" \
              --music "$ARTVISION_MUSIC" \
              --out output/artvision
          elif [[ "$ARTVISION_STYLE" == "harmonic_reveal" ]]; then
            python modules/artvision/harmonic_reveal_v3.py \
              --artist "$ARTIST" \
              --duration "$VIDEO_DURATION" \
              --max-works "$MAX_WORKS" \
              --out output/artvision
          elif [[ "$ARTVISION_STYLE" == "cinematic_wow" ]]; then
            python modules/artvision/artvision_cinema_run.py \
              --artist "$ARTIST" \
              --duration "$VIDEO_DURATION" \
              --max-works "$MAX_WORKS" \
              --out output/artvision
          else
            python modules/artvision/artvision.py \
              --artist "$ARTIST" \
              --duration "$VIDEO_DURATION" \
              --max-works "$MAX_WORKS" \
              --out output/artvision
          fi

      - name: "Deposita soltanto file finali (NON pubblica)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "ARTVISION_${{ github.run_number }}"
          path: |
            output/artvision/ARTVISION_VIDEO.mp4
            output/artvision/COPERTINA.jpg
            output/artvision/OPERE_FONTI_E_DIRITTI.json
            output/artvision/CREDITI_E_FONTI.txt
            output/artvision/DESCRIZIONE_SOCIAL.txt
            output/artvision/MONTAGGIO.json
            output/artvision/REPORT_PRODUZIONE.json
            output/artvision/STORYBOARD_REGIA.json
            output/artvision/MUSICA_LICENZA_E_CREDITI.json
          if-no-files-found: error
          retention-days: 7
