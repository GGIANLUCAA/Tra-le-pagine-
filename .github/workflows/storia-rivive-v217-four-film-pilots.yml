name: "La Storia Rivive V217 · four new source-film pilot reviews (NO PAID API)"
on:
  pull_request:
    paths:
      - ".github/workflows/storia-rivive-v217-four-film-pilots.yml"
      - "queue/storia_rivive_four_pilots_v217.json"
      - "src/storia_rivive_v217_four_pilot_source_review.py"
      - "src/storia_rivive_v241_full_length_source_roughcut.py"
      - "src/storia_rivive_v243_freeze_endpoint_roughcut.py"
      - "tests/test_storia_rivive_v243_freeze_endpoint_roughcut.py"
      - "src/storia_rivive_v244_real_endpoint_pixel_qa.py"
      - "src/storia_rivive_v247_motion_intertitle_qa.py"
      - "src/storia_rivive_v291_final_motion_window_qa.py"
      - "tests/test_storia_rivive_v291_final_motion_window_qa.py"
      - "tests/test_storia_rivive_v247_motion_intertitle_qa.py"
      - "tests/test_storia_rivive_v244_real_endpoint_pixel_qa.py"
      - "tests/test_storia_rivive_v245_real_five_shot_framecount.py"
      - "tests/test_storia_rivive_v241_full_length_source_roughcut.py"
      - "src/storia_v240_portrait_contact_sheet.py"
      - "tests/test_storia_v240_portrait_contact_sheet.py"
      - "src/storia_rivive_i2i_prepare_v102.py"
      - "src/storia_rivive_frame_rank_v101.py"
      - "src/storia_rivive_v210_shot_aware_selection.py"
      - "config/storia_rivive_v221_source_frame_exclusions.json"
      - "tests/test_storia_rivive_v210_shot_aware_selection.py"
      - "tests/test_storia_rivive_v217_four_pilot_source_review.py"
      - "tests/test_storia_rivive_v218_global_temporal_selection.py"
      - "src/storia_rivive_v236_reject_bad_source.py"
      - "tests/test_storia_rivive_v236_reject_bad_source.py"
  workflow_dispatch:
    inputs:
      episode:
        description: "One archive to inspect (all = full four-film research); no paid generation"
        required: false
        default: all
        type: choice
        options:
          - all
          - delhi_ruins_1910_v217
          - early_cinema_sorrows_1910_v225
          - lusitania_departure_1915_v220
          - fiesole_straw_hats_1912_v220
permissions:
  contents: read
concurrency:
  group: storia-v217-four-scout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline_v217_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual local video toolchain and no-cost image dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core
          python -m pip install -q "pillow>=10,<13"
      - name: Six V217 regressions including decodable actual synthetic source preview MP4
        run: |
          python -m py_compile src/storia_rivive_v217_four_pilot_source_review.py
          python -m unittest discover -s tests -p "test_storia_rivive_v210_shot_aware_selection.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v217_four_pilot_source_review.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v218_global_temporal_selection.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v241_full_length_source_roughcut.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v243_freeze_endpoint_roughcut.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v244_real_endpoint_pixel_qa.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v245_real_five_shot_framecount.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v247_motion_intertitle_qa.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v291_final_motion_window_qa.py" -v
          python -m unittest discover -s tests -p "test_storia_v240_portrait_contact_sheet.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v236_reject_bad_source.py" -v

  source_scout:
    needs: offline_v217_tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Four independent source-only research jobs; no paid I2I/Vidu calls.
      # Run in parallel to shorten the wall-clock wait for candidate review.
      max-parallel: 4
      matrix:
        episode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.episode != 'all' && format('["{0}"]', inputs.episode) || '["delhi_ruins_1910_v217","early_cinema_sorrows_1910_v225","lusitania_departure_1915_v220","fiesole_straw_hats_1912_v220"]') }}
    env:
      EPISODE_ID: ${{ matrix.episode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg to inspect actual archival original bytes only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core
          python -m pip install -q "pillow>=10,<13"
      - name: Prepare safe order for one of four new, distinct original archives
        run: |
          set -euo pipefail
          python src/storia_rivive_v217_four_pilot_source_review.py \
            --manifest queue/storia_rivive_four_pilots_v217.json \
            --episode "$EPISODE_ID" \
            --out "output/v217/$EPISODE_ID"
      - name: Download original Wikimedia film and generate 12 REAL contact-sheet frames
        run: |
          set -euo pipefail
          python src/storia_rivive_scout_v101.py \
            --order "output/v217/$EPISODE_ID/WORK_ORDER.json" \
            --out "output/v217/source/$EPISODE_ID"
      - name: Rank native archival pixels and test five candidate distinct camera cuts
        shell: bash
        run: |
          set -euo pipefail
          REPORT="output/v217/source/$EPISODE_ID/SCOUT_REPORT.json"
          TARGET="output/v217/$EPISODE_ID"
          SRC="output/v217/source/$EPISODE_ID"
          if python - "$REPORT" <<'PY'
          import json,sys
          from pathlib import Path
          report_path = Path(sys.argv[1])
          if not report_path.is_file():
              print("V290_SCOUT_REPORT_MISSING_SKIP_RANKING_NO_I2I")
              raise SystemExit(2)
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              print("V290_SCOUT_REPORT_UNREADABLE_SKIP_RANKING_NO_I2I", type(exc).__name__)
              raise SystemExit(2)
          if report.get("status") == "REAL_BW_FILM_FRAMES_READY_FOR_PHOTO_SOURCE_REVIEW":
              raise SystemExit(0)
          print("V217_SOURCE_SKIPPED", report.get("status"))
          raise SystemExit(2)
          PY
          then
            python src/storia_rivive_frame_rank_v101.py \
              --frames "$SRC/original_frames" \
              --out "$TARGET/V101_RANKING.json"
            python src/storia_rivive_v210_shot_aware_selection.py \
              --ranking "$TARGET/V101_RANKING.json" \
              --scout "$REPORT" \
              --cache "$SRC" \
              --exclusions config/storia_rivive_v221_source_frame_exclusions.json \
              --out "$TARGET/SHOT_AWARE_SELECTION_V210.json"
          else
            echo "Source not ready: no ranked scenes and no preview; free skip."
          fi
      - name: Render real five-shot grayscale MOTION review only when sourced, never I2I or Vidu fake
        run: |
          set -euo pipefail
          python src/storia_rivive_v217_four_pilot_source_review.py \
            --manifest queue/storia_rivive_four_pilots_v217.json \
            --episode "$EPISODE_ID" \
            --out "output/v217/$EPISODE_ID" \
            --cache "output/v217/source/$EPISODE_ID" --finish
      - name: Render 24-second authentic archival-motion pacing review, NOT final
        shell: bash
        run: |
          set -euo pipefail
          TARGET="output/v217/$EPISODE_ID"
          SOURCE="output/v217/source/$EPISODE_ID"
          if python - "$TARGET/V217_RESEARCH_REPORT.json" <<'PY'
          import json,sys
          from pathlib import Path
          report_path = Path(sys.argv[1])
          if not report_path.is_file():
              print("V289_SOURCE_REPORT_MISSING_SKIP_ROUGHCUT_NOT_FINAL")
              raise SystemExit(1)
          try:
              data = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              print("V289_SOURCE_REPORT_UNREADABLE_SKIP_ROUGHCUT_NOT_FINAL", type(exc).__name__)
              raise SystemExit(1)
          raise SystemExit(0 if data.get("status")=="FIVE_SOURCE_SHOTS_REVIEW_PENDING" else 1)
          PY
          then
            if python src/storia_rivive_v243_freeze_endpoint_roughcut.py \
              --film "$SOURCE/ORIGINAL_ARCHIVE.webm" \
              --selection "$TARGET/SHOT_AWARE_SELECTION_V210.json" \
              --alignment "$TARGET/SOURCE_ENDPOINT_ALIGNMENT_V223.json" \
              --frames "$SOURCE/original_frames" \
              --out "$TARGET/SOURCE_24S_FREEZE_ENDPOINT_REVIEW_NOT_FINAL.mp4"; then
              python src/storia_rivive_v244_real_endpoint_pixel_qa.py \
                --video "$TARGET/SOURCE_24S_FREEZE_ENDPOINT_REVIEW_NOT_FINAL.mp4" \
                --manifest "$TARGET/SOURCE_24S_FREEZE_ENDPOINT_REVIEW_NOT_FINAL.json" \
                --frames "$SOURCE/original_frames" \
                --out "$TARGET/V244_REAL_DECODED_ENDPOINT_QA.json" || \
                echo "V244_DECODED_ENDPOINT_REJECTED_NOT_FINAL"
              python src/storia_rivive_v247_motion_intertitle_qa.py \
                --video "$TARGET/SOURCE_24S_FREEZE_ENDPOINT_REVIEW_NOT_FINAL.mp4" \
                --manifest "$TARGET/SOURCE_24S_FREEZE_ENDPOINT_REVIEW_NOT_FINAL.json" \
                --out "$TARGET/V247_REAL_MOTION_INTERTITLE_QA.json" || \
                echo "V247_DECODED_MOTION_QA_UNAVAILABLE_NOT_FINAL"
              # V291 checks the REAL 1.25-1.50s motion windows actually intended
              # for each final 4+1 B/W lead-in, even when a 4.8s research
              # roughcut crosses a historical intertitle. Never a final video.
              python src/storia_rivive_v291_final_motion_window_qa.py \
                --video "$TARGET/SOURCE_24S_FREEZE_ENDPOINT_REVIEW_NOT_FINAL.mp4" \
                --manifest "$TARGET/SOURCE_24S_FREEZE_ENDPOINT_REVIEW_NOT_FINAL.json" \
                --out "$TARGET/V291_REAL_LAST_MOTION_EDIT_WINDOW_QA.json" \
                --preview "$TARGET/SOURCE_7S_REAL_MOTION_EDIT_REVIEW_NOT_FINAL.mp4" || \
                echo "V291_ACTUAL_SHORT_MOTION_DECODE_FAILED_NOT_FINAL"
              echo "V243_SOURCE_LOCKED_FREEZE_ENDPOINT_REVIEW_READY_NOT_FINAL"
            else
              echo "V243_REJECTED_MOTION_WINDOW_OR_SOURCE_ALIGNMENT_NOT_FINAL"
            fi
          else
            echo "V241_SKIP_SOURCE_NOT_READY"
          fi
      - name: V224 prepare actual source-locked I2I requests and Vidu anchor, zero provider calls
        shell: bash
        run: |
          set -euo pipefail
          python - "$EPISODE_ID" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from storia_rivive_i2i_prepare_v102 import build

          episode = sys.argv[1]
          target = Path("output/v217") / episode
          source = Path("output/v217/source") / episode
          report_path = target / "V217_RESEARCH_REPORT.json"
          if not report_path.is_file():
              print("V224_SOURCE_REPORT_MISSING_SKIP_NO_I2I_HANDOFF", episode)
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("status") != "FIVE_SOURCE_SHOTS_REVIEW_PENDING":
              print("V224_SOURCE_NOT_QUALIFIED_NO_I2I_HANDOFF", report.get("reason"))
              raise SystemExit(0)
          # Fail closed on decoded source-motion defects before preparing costly I2I/Vidu work.
          # These reports are only preliminary source evidence, never artistic approval.
          endpoint_path = target / "V244_REAL_DECODED_ENDPOINT_QA.json"
          motion_path = target / "V247_REAL_MOTION_INTERTITLE_QA.json"
          edit_path = target / "V291_REAL_LAST_MOTION_EDIT_WINDOW_QA.json"
          roughcut_path = target / "SOURCE_24S_FREEZE_ENDPOINT_REVIEW_NOT_FINAL.mp4"
          if not all(p.is_file() for p in (endpoint_path, motion_path, edit_path, roughcut_path)):
              print("V291_SOURCE_DECODED_QA_MISSING_NO_I2I_HANDOFF", episode)
              raise SystemExit(0)
          endpoint = json.loads(endpoint_path.read_text(encoding="utf-8"))
          motion = json.loads(motion_path.read_text(encoding="utf-8"))
          short = json.loads(edit_path.read_text(encoding="utf-8"))
          short_video = target / "SOURCE_7S_REAL_MOTION_EDIT_REVIEW_NOT_FINAL.mp4"
          if (endpoint.get("status") != "REVIEW_ENDPOINTS_PASS"
                  or len(endpoint.get("checks", [])) != 5
                  or not all(row.get("pass_candidate") is True for row in endpoint["checks"])
                  or motion.get("status") not in (
                      "NO_INTERTITLE_HEURISTIC_FLAGS_NOT_ARTISTIC_APPROVAL",
                      "REJECT_MOTION_WINDOW_FOR_EDITORIAL_REVIEW")
                  or motion.get("sampled_decoded_frames") != 15
                  or not isinstance(motion.get("flagged_shots"), list)
                  or short.get("version") != "V291_REAL_LAST_MOTION_EDIT_WINDOW_PREFLIGHT"
                  or short.get("status") != "FIVE_REAL_1P5S_EDIT_WINDOWS_PASS_NOT_ARTISTIC_APPROVAL"
                  or short.get("must_use_these_exact_short_windows_in_final_render") is not True
                  or short.get("source_roughcut_sha256") != hashlib.sha256(roughcut_path.read_bytes()).hexdigest()
                  or motion.get("source_video_sha256") != short.get("source_roughcut_sha256")
                  or not short_video.is_file()
                  or short.get("edited_motion_preview_sha256") != hashlib.sha256(short_video.read_bytes()).hexdigest()
                  or len(short.get("shots", [])) != 5
                  or not all(row.get("motion_candidate") is True
                      and row.get("decoded_final_frames_inspected", 0) >= 30
                      and row.get("remaining_title_frames") == []
                      and row.get("motion_seconds", 0) >= 1.25
                      for row in short["shots"])):
              print("V291_SOURCE_SHORT_MOTION_REJECTED_NO_I2I_HANDOFF", episode)
              raise SystemExit(0)
          # Long 4.8s archival research windows can contain real intertitles.
          # Hand off ONLY the source-verified short-motion frames; any later
          # renderer must use their exact ranges and re-run the final QA.
          if motion.get("flagged_shots"):
              print("V291_LONG_RESEARCH_WINDOW_HAS_INTERTITLES_SHORT_EDIT_SOURCE_ONLY", episode)
          alignment = json.loads((target / "SOURCE_ENDPOINT_ALIGNMENT_V223.json").read_text())
          selection = json.loads((target / "SHOT_AWARE_SELECTION_V210.json").read_text())
          checks = alignment.get("checks", [])
          chosen = selection.get("preselected", [])
          if (len(checks) != 5 or len(chosen) != 5
                  or any(check.get("endpoint_visually_aligned") is not True
                         or check.get("source_frame") != row.get("filename")
                         for check, row in zip(checks, chosen))):
              raise SystemExit("V224_SOURCE_ALIGNMENT_FAILED_CANNOT_PREPARE_I2I")
          for check in checks:
              frame = source / "original_frames" / check["source_frame"]
              if hashlib.sha256(frame.read_bytes()).hexdigest() != check["source_frame_sha256"]:
                  raise SystemExit("V224_SOURCE_FRAME_HASH_CHANGED")
          order = json.loads((target / "WORK_ORDER.json").read_text())
          jobs = build(order, selection, source)
          if (jobs["photos_generated"] != 0 or jobs["provider_requests_sent"] != 0
                  or jobs["vidu_calls"] != 0 or jobs["photo_jobs_prepared"] != 4
                  or jobs["source_frames_prepared"] != 5
                  or jobs["publication_permitted"] is not False):
              raise SystemExit("V224_UNSAFE_I2I_HANDOFF")
          jobs["v224_handoff"] = "FIVE_SOURCE_CANDIDATES_SOURCE_LOCKED_NOT_ARTISTICALLY_APPROVED"
          jobs["endpoint_alignment_is_not_exact_frame_certification"] = True
          jobs["v291_source_only_edit"] = {
              "status": short["status"],
              "source_roughcut_sha256": short["source_roughcut_sha256"],
              "motion_preview_file": short_video.name,
              "motion_preview_sha256": short["edited_motion_preview_sha256"],
              "original_decoded_frame_ranges": [shot["original_decoded_frame_range"] for shot in short["shots"]],
              "exact_short_motion_windows_required_in_final_renderer": True,
              "long_roughcut_intertitle_flags": motion["flagged_shots"],
              "not_final_or_artistic_approval": True,
          }
          (target / "I2I_INPUT_MANIFEST_V102.json").write_text(
              json.dumps(jobs, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("V224_FOUR_REAL_FRAME_I2I_INPUTS_PREPARED_ONE_VIDU_ANCHOR_NO_GENERATION", episode)
          PY
      - name: V240 show five authentic portrait crops before any generative request
        shell: bash
        run: |
          set -euo pipefail
          TARGET="output/v217/$EPISODE_ID"
          SOURCE="output/v217/source/$EPISODE_ID/original_frames"
          if test -f "$TARGET/SHOT_AWARE_SELECTION_V210.json"; then
            python src/storia_v240_portrait_contact_sheet.py \
              --selection "$TARGET/SHOT_AWARE_SELECTION_V210.json" \
              --frames "$SOURCE" --out "$TARGET"
          else
            echo "V240_SOURCE_NOT_READY_NO_CROPS"
          fi
      - name: Upload source footage evidence, contact sheet and any REAL preview for QA
        # Preserve actual source/scout diagnostics even when a downstream ranking or render step fails.
        # An incomplete artifact is evidence for diagnosis, NEVER a final video or source approval.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v217-four-pilot-source-${{ matrix.episode }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            output/v217/${{ matrix.episode }}/
            output/v217/source/${{ matrix.episode }}/SCOUT_REPORT.json
            output/v217/source/${{ matrix.episode }}/ORIGINAL_FILM_CONTACT_SHEET.jpg
            output/v217/source/${{ matrix.episode }}/original_frames/frame_*.png
          # Exclude ORIGINAL_ARCHIVE.webm: do not re-distribute unapproved historic source.
