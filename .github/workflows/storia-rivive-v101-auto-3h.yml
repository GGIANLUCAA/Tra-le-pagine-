name: "La Storia Rivive V101 · preparazione archivistica ogni 3 ore (senza API a pagamento)"
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/storia-rivive-v101-auto-3h.yml"
      - "src/storia_rivive_v196_scout_gate.py"
      - "src/storia_rivive_v202_source_handoff.py"
      - "tests/test_storia_rivive_v202_source_handoff.py"
      - "src/storia_rivive_autopilot_v101.py"
      - "queue/storia_rivive_episode_history_v200.json"
      - "tests/test_storia_rivive_v101.py"
      - "tests/test_storia_rivive_v196_scout_gate.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/storia-rivive-v101-auto-3h.yml"
      - "src/storia_rivive_autopilot_v101.py"
      - "src/storia_rivive_scout_v101.py"
      - "src/storia_rivive_flag_title_v101.py"
      - "src/storia_rivive_frame_rank_v101.py"
      - "src/storia_rivive_i2i_prepare_v102.py"
      - "src/storia_rivive_v196_scout_gate.py"
      - "config/storia_rivive_autopilot_v101.json"
      - "queue/storia_rivive_episode_history_v200.json"
      - "tests/test_storia_rivive_v101.py"
      - "tests/test_storia_rivive_v196_scout_gate.py"
permissions:
  contents: read
concurrency:
  group: storia-rivive-v101-single-source-research
  cancel-in-progress: false
jobs:
  offline_v196_regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q "pillow>=10,<13"
      - name: Verify fail-closed V196 cache and V101 compatibility without provider calls
        run: |
          python -m py_compile src/storia_rivive_v196_scout_gate.py
          python -m unittest discover -s tests -p "test_storia_rivive_v196_scout_gate.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v101.py" -v
  scheduled_preparation:
    if: github.event_name != 'pull_request' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing repository, no changes to other formats
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline photo/title and archival inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core
          python -m pip install -q "pillow>=10,<13"
      - name: Run fail-closed safety and flag geometry tests before research
        run: |
          set -euo pipefail
          python -m py_compile src/storia_rivive_autopilot_v101.py src/storia_rivive_scout_v101.py src/storia_rivive_flag_title_v101.py src/storia_rivive_frame_rank_v101.py src/storia_rivive_i2i_prepare_v102.py src/storia_rivive_v196_scout_gate.py src/storia_rivive_v202_source_handoff.py
          python -m unittest discover -s tests -p "test_storia_rivive_v101.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v196_scout_gate.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v202_source_handoff.py" -v
      - name: Create deterministic research work order for current UTC 3-hour window
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python src/storia_rivive_autopilot_v101.py --history queue/storia_rivive_episode_history_v200.json --now "$now" --out output/storia_v101/WORK_ORDER.json
          python - <<'PY'
          import json,os
          p=json.load(open("output/storia_v101/WORK_ORDER.json"))
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("STORIA_EPISODE_ID="+(p.get("episode_id") or "")+"\n")
              f.write("STORIA_SOURCE_READY="+("true" if p.get("episode_id") else "false")+"\n")
          print("SOURCE_RESEARCH_ONLY_3H",p.get("episode_id"),p["status"])
          PY
      - name: Cache archival source research by candidate, avoid repeated downloads
        id: film_cache
        if: env.STORIA_SOURCE_READY == 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/storia_v101/source-cache/${{ env.STORIA_EPISODE_ID }}
          key: storia-v101-archival-scout-v3-${{ env.STORIA_EPISODE_ID }}
      - name: Fetch bounded original film and make genuine B/W contact sheet
        if: env.STORIA_SOURCE_READY == 'true' && steps.film_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_scout_v101.py --order output/storia_v101/WORK_ORDER.json --out "output/storia_v101/source-cache/$STORIA_EPISODE_ID"
      - name: V196 verify actual cached film SHA and decodable PNGs before any frame ranking
        id: scout_status
        if: env.STORIA_SOURCE_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v196_scout_gate.py \
            --order output/storia_v101/WORK_ORDER.json \
            --cache "output/storia_v101/source-cache/$STORIA_EPISODE_ID" \
            --out output/storia_v101/SCOUT_GATE_V196.json
      - name: Cache successful original source film and true source frames only
        if: env.STORIA_SOURCE_READY == 'true' && steps.film_cache.outputs.cache-hit != 'true' && steps.scout_status.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: output/storia_v101/source-cache/${{ env.STORIA_EPISODE_ID }}
          key: storia-v101-archival-scout-v3-${{ env.STORIA_EPISODE_ID }}
      - name: Rank actual native-resolution source frames without claiming facial identity
        if: steps.scout_status.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_frame_rank_v101.py \
            --frames "output/storia_v101/source-cache/$STORIA_EPISODE_ID/original_frames" \
            --out output/storia_v101/FIVE_BW_FRAME_CANDIDATES.json
      - name: Prepare five source-SHA-locked I2I requests without invoking any paid or free provider
        if: steps.scout_status.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_i2i_prepare_v102.py \
            --order output/storia_v101/WORK_ORDER.json \
            --selection output/storia_v101/FIVE_BW_FRAME_CANDIDATES.json \
            --source-dir "output/storia_v101/source-cache/$STORIA_EPISODE_ID" \
            --out output/storia_v101/I2I_INPUT_MANIFEST_V102.json
      - name: V202 attest four photo source frames and the fifth Vidu anchor against actual scout bytes
        if: steps.scout_status.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python src/storia_rivive_v202_source_handoff.py \
            --manifest output/storia_v101/I2I_INPUT_MANIFEST_V102.json \
            --order output/storia_v101/WORK_ORDER.json \
            --scout-report "output/storia_v101/source-cache/$STORIA_EPISODE_ID/SCOUT_REPORT.json" \
            --cache "output/storia_v101/source-cache/$STORIA_EPISODE_ID" \
            --out output/storia_v101/SOURCE_HANDOFF_V202.json || status=$?
          # A rejected source is a normal skip, not a false production success.
          # Unexpected exit codes or a missing/unsafe rejection report still fail CI.
          if [ "$status" -ne 0 ]; then
            [ "$status" -eq 2 ] || exit "$status"
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("output/storia_v101/SOURCE_HANDOFF_V202.json").read_text())
          assert data["status"] == "SOURCE_HANDOFF_BLOCKED"
          assert data["provider_calls_permitted"] is False
          assert data["publish_permitted"] is False
          print("V203_SAFE_SOURCE_SKIP", data["reason"])
          PY
          fi
      - name: Generate historically constrained small country flag and title draft
        if: env.STORIA_SOURCE_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"src")
          from storia_rivive_flag_title_v101 import produce
          root=Path("output/storia_v101")
          order=json.loads((root/"WORK_ORDER.json").read_text())
          title=order["title"]
          result={"title_overlay_status":"OMITTED_PENDING_HISTORICAL_EVIDENCE"}
          if title.get("flag") and title.get("place") and title.get("year"):
              result=produce(title,str(root/"TITLE_FLAG_DRAFT.png"))
              result["title_overlay_status"]="DRAFT_ONLY_NOT_APPROVED_MP4"
          (root/"TITLE_FLAG_REPORT.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print(result["title_overlay_status"])
          PY
      - name: Record readiness honestly, no fake video delivery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("output/storia_v101")
          order=json.loads((root/"WORK_ORDER.json").read_text())
          candidate=order.get("episode_id")
          if candidate is None:
              if order["status"]!="SOURCE_REJECTED_QUEUE_EXHAUSTED":
                  raise RuntimeError("Unexpected empty candidate without safe skip status")
              scout_status=None
              ready=False
              reason="NO_UNUSED_CANDIDATES"
              status_name="SOURCE_REJECTED_QUEUE_EXHAUSTED"
              next_required="Review evidence-backed editorial holds or add new legitimate sources; no I2I/Vidu"
          else:
              check=root/"source-cache"/candidate/"SCOUT_REPORT.json"
              scout=json.loads(check.read_text()) if check.is_file() else {"status":"SOURCE_SCOUT_NOT_AVAILABLE"}
              gate=json.loads((root/"SCOUT_GATE_V196.json").read_text())
              scout_status=scout.get("status")
              handoff_path=root/"SOURCE_HANDOFF_V202.json"
              handoff=json.loads(handoff_path.read_text()) if handoff_path.is_file() else {}
              ready=gate["ready"] and handoff.get("status")=="SOURCE_HANDOFF_BYTES_VERIFIED_REVIEW_PENDING"
              reason=None if ready else (handoff.get("reason") if gate["ready"] else gate["reason"])
              status_name="SOURCE_HANDOFF_VERIFIED_REVIEW_PENDING" if ready else "SOURCE_HANDOFF_BLOCKED_NO_PRODUCTION"
              next_required=("4 verified source-locked I2I photos, real Vidu, V91/V94/V96/V99 and real artistic review"
                             if ready else "Replace/reacquire invalid source; do not start I2I or Vidu")
          status={"cycle_id":order["cycle_id"],"candidate":candidate,
              "source_scout":scout_status,"restored_i2i_photos_approved":0,
              "real_vidu_clips_approved":0,"finished_mp4":False,"published":False,
              "charged_api_requests":0,
              "source_cache_verified":ready,"source_cache_block_reason":reason,
              "status":status_name,"next_required":next_required}
          (root/"CYCLE_STATUS.json").write_text(json.dumps(status,ensure_ascii=False,indent=2)+"\n")
          print("V101_CYCLE_STATUS",json.dumps(status))
          PY
      - name: Preserve work order and genuine archival previews as private Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_V101_RESEARCH_${{ github.run_id }}
          path: |
            output/storia_v101/WORK_ORDER.json
            output/storia_v101/SCOUT_GATE_V196.json
            output/storia_v101/CYCLE_STATUS.json
            output/storia_v101/FIVE_BW_FRAME_CANDIDATES.json
            output/storia_v101/I2I_INPUT_MANIFEST_V102.json
            output/storia_v101/SOURCE_HANDOFF_V202.json
            output/storia_v101/TITLE_FLAG_DRAFT.png
            output/storia_v101/TITLE_FLAG_REPORT.json
            output/storia_v101/source-cache/*/SCOUT_REPORT.json
            output/storia_v101/source-cache/*/ORIGINAL_FILM_CONTACT_SHEET.jpg
            output/storia_v101/source-cache/*/original_frames/*.png
          retention-days: 14
          if-no-files-found: warn
