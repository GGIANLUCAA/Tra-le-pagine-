name: "La Storia Rivive V101 · preparazione archivistica ogni 3 ore (senza API a pagamento)"
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storia-rivive-v101-auto-3h.yml"
      - "src/storia_rivive_autopilot_v101.py"
      - "src/storia_rivive_scout_v101.py"
      - "src/storia_rivive_shot_boundaries_v113.py"
      - "src/storia_rivive_flag_title_v101.py"
      - "src/storia_rivive_frame_rank_v101.py"
      - "src/storia_rivive_i2i_prepare_v102.py"
      - "src/storia_rivive_v134_cache_readiness.py"
      - "tests/test_storia_rivive_v134_cache_readiness.py"
      - "config/storia_rivive_autopilot_v101.json"
      - "config/storia_rivive_v133_rejected_films.json"
      - "config/storia_rivive_v140_low_raster_sources.json"
      - "tests/test_storia_rivive_v140_native_raster_queue.py"
      - "src/storia_rivive_v141_live_sd_recheck.py"
      - "tests/test_storia_rivive_v141_live_sd_recheck.py"
      - "tests/test_storia_rivive_v101.py"
      - "tests/test_storia_rivive_v121.py"
      - "tests/test_storia_rivive_v122.py"
      - "tests/test_storia_rivive_v123.py"
permissions:
  contents: read
concurrency:
  group: storia-rivive-v101-single-source-research
  cancel-in-progress: false
jobs:
  scheduled_preparation:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing repository, no changes to other formats
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline photo/title and archival inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core
          python -m pip install -q "pillow>=10,<13"
      - name: Run fail-closed safety and flag geometry tests before research
        run: |
          set -euo pipefail
          python -m py_compile src/storia_rivive_autopilot_v101.py src/storia_rivive_scout_v101.py src/storia_rivive_shot_boundaries_v113.py src/storia_rivive_flag_title_v101.py src/storia_rivive_frame_rank_v101.py src/storia_rivive_i2i_prepare_v102.py src/storia_rivive_v134_cache_readiness.py src/storia_rivive_v141_live_sd_recheck.py
          python -m unittest discover -s tests -p "test_storia_rivive_v101.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v140_native_raster_queue.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v141_live_sd_recheck.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v134_cache_readiness.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v121.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v122.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v123.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v122_cache_contract.py" -v
      - name: Create deterministic research work order for current UTC 3-hour window
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python src/storia_rivive_autopilot_v101.py --now "$now" --out output/storia_v101/WORK_ORDER.json
          python - <<'PY'
          import hashlib,json,os
          p=json.load(open("output/storia_v101/WORK_ORDER.json"))
          page=p.get("source_page")
          # V135: a candidate ID alone cannot identify a revised Commons film page.
          page_fingerprint=hashlib.sha256(page.encode("utf-8")).hexdigest()[:16] if isinstance(page,str) else "no-source"
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("STORIA_EPISODE_ID="+p["episode_id"]+"\n")
              f.write("STORIA_SOURCE_PAGE_SHA256="+page_fingerprint+"\n")
              f.write("STORIA_SOURCE_SKIPPED="+("true" if p.get("skip_source_acquisition") else "false")+"\n")
          print("SOURCE_RESEARCH_ONLY_3H",p["episode_id"],p["status"])
          PY
      - name: V141 recheck excluded Commons SD originals for a changed native raster
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v141_live_sd_recheck.py \
            --out output/storia_v101/LIVE_SD_SNAPSHOT_RECHECK_V141.json
      - name: Cache archival source research by candidate, avoid repeated downloads
        if: env.STORIA_SOURCE_SKIPPED != 'true'
        id: film_cache
        uses: actions/cache/restore@v4
        with:
          path: output/storia_v101/source-cache/${{ env.STORIA_EPISODE_ID }}
          key: storia-v101-archival-scout-v8-source-page-${{ env.STORIA_EPISODE_ID }}-${{ env.STORIA_SOURCE_PAGE_SHA256 }}
      - name: Fetch bounded original film and make genuine B/W contact sheet
        if: env.STORIA_SOURCE_SKIPPED != 'true' && steps.film_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_scout_v101.py --order output/storia_v101/WORK_ORDER.json --out "output/storia_v101/source-cache/$STORIA_EPISODE_ID"
      - name: V134 verify cached original film and PNG bytes before downstream steps
        if: env.STORIA_SOURCE_SKIPPED != 'true'
        id: scout_status
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v134_cache_readiness.py \
            --cache-dir "output/storia_v101/source-cache/$STORIA_EPISODE_ID" \
            --order output/storia_v101/WORK_ORDER.json \
            --out output/storia_v101/SOURCE_READINESS_V134.json
          python - <<'PY'
          import json,os
          report=json.load(open("output/storia_v101/SOURCE_READINESS_V134.json"))
          ready=report.get("ready") is True
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              print("ready="+("true" if ready else "false"),file=f)
          print("V134_VERIFIED_SOURCE_BYTES",ready,report["status"])
          PY
      - name: Cache successful original source film and true source frames only
        if: env.STORIA_SOURCE_SKIPPED != 'true' && steps.film_cache.outputs.cache-hit != 'true' && steps.scout_status.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: output/storia_v101/source-cache/${{ env.STORIA_EPISODE_ID }}
          key: storia-v101-archival-scout-v8-source-page-${{ env.STORIA_EPISODE_ID }}-${{ env.STORIA_SOURCE_PAGE_SHA256 }}
      - name: Rank actual native-resolution source frames without claiming facial identity
        if: env.STORIA_SOURCE_SKIPPED != 'true' && steps.scout_status.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_frame_rank_v101.py \
            --frames "output/storia_v101/source-cache/$STORIA_EPISODE_ID/original_frames" \
            --out output/storia_v101/FIVE_BW_FRAME_CANDIDATES.json
      - name: Prepare five source-SHA-locked I2I requests without invoking any paid or free provider
        if: env.STORIA_SOURCE_SKIPPED != 'true' && steps.scout_status.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_i2i_prepare_v102.py \
            --order output/storia_v101/WORK_ORDER.json \
            --selection output/storia_v101/FIVE_BW_FRAME_CANDIDATES.json \
            --source-dir "output/storia_v101/source-cache/$STORIA_EPISODE_ID" \
            --out output/storia_v101/I2I_INPUT_MANIFEST_V102.json
      - name: V118 reject nonmoving source windows before any I2I integration
        if: env.STORIA_SOURCE_SKIPPED != 'true' && steps.scout_status.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_motion_preflight_v118.py \
            --manifest output/storia_v101/I2I_INPUT_MANIFEST_V102.json \
            --scout "output/storia_v101/source-cache/$STORIA_EPISODE_ID/SCOUT_REPORT.json" \
            --film "output/storia_v101/source-cache/$STORIA_EPISODE_ID/ORIGINAL_ARCHIVE.webm" \
            --out output/storia_v101/MOTION_EVIDENCE_V118.json
      - name: Generate historically constrained small country flag and title draft
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"src")
          from storia_rivive_flag_title_v101 import produce
          root=Path("output/storia_v101")
          order=json.loads((root/"WORK_ORDER.json").read_text())
          title=order["title"]
          result={"title_overlay_status":"OMITTED_PENDING_HISTORICAL_EVIDENCE"}
          if title.get("flag") and title.get("place") and title.get("year"):
              result=produce(title,str(root/"TITLE_FLAG_DRAFT.png"))
              result["title_overlay_status"]="DRAFT_ONLY_NOT_APPROVED_MP4"
          (root/"TITLE_FLAG_REPORT.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print(result["title_overlay_status"])
          PY
      - name: Record readiness honestly, no fake video delivery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("output/storia_v101")
          order=json.loads((root/"WORK_ORDER.json").read_text())
          check=root/"source-cache"/order["episode_id"]/"SCOUT_REPORT.json"
          scout=json.loads(check.read_text()) if check.is_file() else {"status":"SOURCE_SCOUT_NOT_AVAILABLE"}
          rank_path=root/"FIVE_BW_FRAME_CANDIDATES.json"
          rank=json.loads(rank_path.read_text()) if rank_path.is_file() else {"status":"SOURCE_FRAME_SELECTION_BLOCKED"}
          i2i_path=root/"I2I_INPUT_MANIFEST_V102.json"
          i2i=json.loads(i2i_path.read_text()) if i2i_path.is_file() else {"status":"I2I_INPUTS_BLOCKED"}
          motion_path=root/"MOTION_EVIDENCE_V118.json"
          motion=json.loads(motion_path.read_text()) if motion_path.is_file() else {"status":"BLOCKED"}
          readiness_path=root/"SOURCE_READINESS_V134.json"
          readiness=json.loads(readiness_path.read_text()) if readiness_path.is_file() else {"ready":False,"status":"SOURCE_NOT_VERIFIED"}
          scout_ready=readiness.get("ready") is True
          low_detail=rank.get("status")=="SOURCE_NATIVE_DETAIL_INSUFFICIENT_FOR_FIVE_SHOTS"
          insufficient_cuts=scout.get("shot_boundary_analysis",{}).get("status")=="INSUFFICIENT_CUT_CANDIDATES"
          native_media_rejected=scout.get("status") in ("SOURCE_NATIVE_DETAIL_INSUFFICIENT_SKIP_DOWNLOAD","SOURCE_RASTER_METADATA_MISSING_SKIP_DOWNLOAD")
          insufficient_selected_shots=rank.get("status") in (
              "INSUFFICIENT_DISTINCT_SHOT_CANDIDATES","SHOT_SEGMENT_PROVENANCE_INCOMPLETE",
              "SHOT_BOUNDARY_PTS_EVIDENCE_INVALID","INSUFFICIENT_PRE_FREEZE_SOURCE_WINDOWS",
              "INSUFFICIENT_PHOTOGRAPHIC_SCENE_CANDIDATES")
          live_path=root/"LIVE_SD_SNAPSHOT_RECHECK_V141.json"
          live=json.loads(live_path.read_text()) if live_path.is_file() else {"status":"SOURCE_SNAPSHOT_CHECK_UNAVAILABLE"}
          status={"cycle_id":order["cycle_id"],"candidate":order["episode_id"],
              "low_raster_live_recheck_status":live.get("status"),
              "source_scout":scout.get("status"),
              "source_cache_integrity":readiness.get("status"),
              "source_cache_reason":readiness.get("reason"),
              "native_original_raster_px":[scout.get("original_width_px"),scout.get("original_height_px")],
              "native_media_rejected_before_download":native_media_rejected,
              "source_preflight_blocking_issues":order.get("blocking_issues",[]),
              "excluded_sha_bound_sources":order.get("excluded_sha_bound_sources",[]),
              "excluded_low_native_raster_sources":order.get("excluded_low_native_raster_sources",[]),
              "source_acquisition_skipped_by_rejection_registry":order.get("skip_source_acquisition",False),
              "native_frame_selection":rank.get("status"),
              "eligible_pre_freeze_source_windows":rank.get("eligible_pre_freeze_source_windows",0),
              "eligible_photographic_scene_candidates":rank.get("eligible_photographic_scene_candidates",0),
              "i2i_input_preparation":i2i.get("status"),
              "source_bw_motion_preflight":motion.get("status"),
              "i2i_block_reason":i2i.get("reason"),
              "restored_i2i_photos_approved":0,
              "real_vidu_clips_approved":0,"finished_mp4":False,"published":False,
              "charged_api_requests":0,
              "status":("SOURCE_RESEARCH_RECHECK_REQUIRED" if order.get("skip_source_acquisition") and live.get("status")=="SOURCE_SNAPSHOT_REVIEW_REQUIRED" else order["status"]) if order.get("skip_source_acquisition") else ("SOURCE_REJECTED" if (not scout_ready or low_detail or native_media_rejected or insufficient_cuts or insufficient_selected_shots) else "ASSETS_PENDING"),
              "cut_candidate_count":scout.get("shot_boundary_analysis",{}).get("cut_candidate_count"),
              "historical_camera_shots_verified":False,
              "next_required":("Discover a genuinely new native-HD historical source before any asset generation" if order.get("skip_source_acquisition") else "Resolve source rights and native quality, then 4 genuine I2I photos, 1 real Vidu, V91/V94/V96/V99 and artistic review")}
          (root/"CYCLE_STATUS.json").write_text(json.dumps(status,ensure_ascii=False,indent=2)+"\n")
          print("V101_CYCLE_STATUS",json.dumps(status))
          PY
      - name: Preserve work order and genuine archival previews as private Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_V101_RESEARCH_${{ github.run_id }}
          path: |
            output/storia_v101/WORK_ORDER.json
            output/storia_v101/SOURCE_READINESS_V134.json
            output/storia_v101/CYCLE_STATUS.json
            output/storia_v101/FIVE_BW_FRAME_CANDIDATES.json
            output/storia_v101/I2I_INPUT_MANIFEST_V102.json
            output/storia_v101/MOTION_EVIDENCE_V118.json
            output/storia_v101/TITLE_FLAG_DRAFT.png
            output/storia_v101/TITLE_FLAG_REPORT.json
            output/storia_v101/source-cache/*/SCOUT_REPORT.json
            output/storia_v101/source-cache/*/ORIGINAL_FILM_CONTACT_SHEET.jpg
            output/storia_v101/source-cache/*/original_frames/*.png
          retention-days: 14
          if-no-files-found: warn
