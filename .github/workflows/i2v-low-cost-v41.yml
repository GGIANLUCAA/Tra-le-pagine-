name: "V41/V42 - Image-to-video Vidu economico (Android manuale)"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan GRATIS; submit richiede credito; collect recupera un task"
        type: choice
        required: true
        default: plan
        options: [plan, submit, collect]
      preset:
        description: "economy540: 540p economico / cinema720: 720p di qualita"
        type: choice
        default: economy540
        options: [economy540, cinema720]
      seconds:
        description: "Durata effettiva; 2-8 secondi"
        type: choice
        default: "3"
        options: ["2", "3", "4", "5", "6", "7", "8"]
      episodio:
        description: "Nome cartella episodio in episodes/"
        type: string
        default: "01_scacchi"
      scena:
        description: "Numero scena da 1 a 35"
        type: string
        default: "1"
      prompt:
        description: "Azione fisica nella scena, in inglese"
        type: string
        default: "In a dim 1940s hotel room, the imprisoned man slowly turns toward the locked door and clenches his hands. Realistic breathing. Preserve his face, clothes and room. No new people."
      task_id:
        description: "SOLO collect: ID task Vidu ottenuto nella fase submit"
        type: string
        default: ""
      submit_run_id:
        description: "SOLO collect: run ID GitHub della fase submit per recuperare piano e ricevuta intatti"
        type: string
        default: ""
      conferma_spesa:
        description: "SOLO submit: scrivere AUTORIZZO_10_CENT"
        type: string
        default: ""
      codice_piano_approvato:
        description: "SOLO submit: codice del piano GRATUITO gia controllato (12 caratteri)"
        type: string
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  video:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIDU_API_KEY: "${{ secrets.VIDU_API_KEY }}"
      MODE: "${{ inputs.mode }}"
      PRESET: "${{ inputs.preset }}"
      SECONDS: "${{ inputs.seconds }}"
      EPISODIO: "${{ inputs.episodio }}"
      SCENA: "${{ inputs.scena }}"
      VIDEO_PROMPT: "${{ inputs.prompt }}"
      TASK_ID: "${{ inputs.task_id }}"
      SUBMIT_RUN_ID: "${{ inputs.submit_run_id }}"
      CONFERMA_SPESA: "${{ inputs.conferma_spesa }}"
      APPROVED_PLAN_CODE: "${{ inputs.codice_piano_approvato }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Installa validatore immagini"
        run: python -m pip install "pillow>=10,<13"
      - name: "Preflight: zero pagamenti"
        shell: bash
        run: |
          mkdir -p output/v41
          if [[ "$MODE" == "collect" ]]; then
            if [[ -n "$SUBMIT_RUN_ID" ]]; then
              if [[ ! "$SUBMIT_RUN_ID" =~ ^[0-9]{6,15}$ ]]; then
                echo "::error::Run ID di submit non valido"
                exit 2
              fi
              GH_TOKEN="${{ github.token }}" gh run download "$SUBMIT_RUN_ID" --repo "$GITHUB_REPOSITORY"                 --name I2V_V41_Android_Da_Revisionare --dir output/v41
              python - <<'PY'
          import json,os
          from pathlib import Path
          record=json.loads(Path("output/v41/VIDU_TASK.json").read_text())
          plan=json.loads(Path("output/v41/I2V_PLAN.json").read_text())
          if (record.get("fingerprint")!=plan.get("fingerprint")
              or not record.get("task_id")):
              raise SystemExit("Piano/Task ID incoerenti, non avviare nuovi job")
          given=os.getenv("TASK_ID","")
          if given and given!=record["task_id"]:
              raise SystemExit("Task ID non corrisponde al submit originale")
          PY
            else
              if [[ ! "$TASK_ID" =~ ^[A-Za-z0-9_-]{4,100}$ ]]; then
                echo "::error::Inserire task_id o submit_run_id, nessun submit automatico"
                exit 2
              fi
              python - <<'PY'
          import json, os
          from pathlib import Path
          Path("output/v41/VIDU_TASK.json").write_text(json.dumps({
              "task_id": os.environ["TASK_ID"], "status": "created"}))
          PY
            fi
          else
            python src/i2v_scene_v41.py \
              --episode "$EPISODIO" --scene "$SCENA" --output-dir output/v41
          fi
      - name: "Allega l'immagine originale per la revisione PRIMA del pagamento"
        if: env.MODE != 'collect'
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          source=Path(os.environ["I2V_SOURCE_IMAGE"])
          target=Path("output/v41")/("ANTEPRIMA_SCENA"+source.suffix.lower())
          shutil.copy2(source,target)
          PY
      - name: "Preventivo gratis, invio autorizzato, oppure recupero"
        shell: bash
        run: |
          if [[ "$MODE" == "collect" ]]; then
            if ! command -v ffprobe >/dev/null; then
              timeout 140s sudo apt-get install -y -qq ffmpeg
            fi
            python src/i2v_budget_v41.py collect --out output/v41
          elif [[ "$MODE" == "submit" ]]; then
            if [[ "$CONFERMA_SPESA" != "AUTORIZZO_10_CENT" || -z "$VIDU_API_KEY" || ! "$APPROVED_PLAN_CODE" =~ ^[A-Fa-f0-9]{12}$ ]]; then
              echo "::error::Servono autorizzazione esplicita e Secret VIDU_API_KEY"
              exit 3
            fi
            python src/i2v_budget_v41.py submit \
              --image "$I2V_SOURCE_IMAGE" --prompt "$VIDEO_PROMPT" \
              --seconds "$SECONDS" --preset "$PRESET" --max-cost-usd 0.10 \
              --approve-charge YES --approved-plan-code "$APPROVED_PLAN_CODE" --out output/v41
          else
            python src/i2v_budget_v41.py plan \
              --image "$I2V_SOURCE_IMAGE" --prompt "$VIDEO_PROMPT" \
              --seconds "$SECONDS" --preset "$PRESET" --max-cost-usd 0.10 --out output/v41
          fi
      - name: "Artifact: piano, task ID o MP4/ZIP verificati"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: I2V_V41_Android_Da_Revisionare
          path: |
            output/v41/ANTEPRIMA_SCENA.*
            output/v41/SCENA_NARRAZIONE_V41.json
            output/v41/I2V_PLAN.json
            output/v41/VIDU_TASK.json
            output/v41/I2V_V41_DA_REVISIONARE.mp4
            output/v41/I2V_V41_ANDROID.zip
          if-no-files-found: warn
          retention-days: 14
