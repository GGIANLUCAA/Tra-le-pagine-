name: Ventimila leghe - Gacrux voice experiment
on:
  pull_request:
    paths:
      - experiments/ventimila_leghe_v1/copione.txt
      - .github/workflows/ventimila-gacrux-experiment.yml
permissions:
  contents: read
jobs:
  voice:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing voice dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install "numpy>=1.25,<3" "soundfile>=0.12" "scipy>=1.11" "google-genai>=2.25,<3"
      - name: Existing Gacrux model - single narration only, fail closed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p output/ventimila-gacrux
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'VOICE_UNAVAILABLE: no existing GEMINI_API_KEY secret' > output/ventimila-gacrux/VOICE_STATUS.txt
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,"src")
          from gemini_voice import synthesize
          text=Path("experiments/ventimila_leghe_v1/copione.txt").read_text(encoding="utf8")
          target=Path("output/ventimila-gacrux")
          try:
              audio,phrases=synthesize(text,target)
              import json
              (target/"SCENE_TIMING.json").write_text(json.dumps({"method":"existing_Gacrux_voice_v13_alignment","sentence_timing":phrases,"needs_human_sync_review":True},ensure_ascii=False,indent=2),encoding="utf8")
              (target/"VOICE_STATUS.txt").write_text("Generated with existing Gemini Gacrux voice profile; inspect narration before integrating.\n",encoding="utf8")
          except Exception as exc:
              (target/"VOICE_STATUS.txt").write_text("VOICE_UNAVAILABLE: "+type(exc).__name__+" (no alternate voice substituted)\n",encoding="utf8")
              print("Voice not produced:",type(exc).__name__)
          PY
      - name: Deliver reviewable voice without publishing
        uses: actions/upload-artifact@v4
        with:
          name: VENTIMILA_GACRUX_VOICE_TEST
          path: output/ventimila-gacrux/
          if-no-files-found: error
          retention-days: 7
