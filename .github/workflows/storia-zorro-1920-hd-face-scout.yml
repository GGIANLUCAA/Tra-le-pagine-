name: "La Storia Rivive - Zorro 1920 HD resilient face and footage scout"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storia-zorro-1920-hd-face-scout.yml"
      - "src/storia_zorro_1920_resilient_scout.py"
permissions:
  contents: read
concurrency:
  group: storia-zorro-1920-source-scout
  cancel-in-progress: false
jobs:
  genuine_source:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: "Install image inspection (no paid APIs)"
        run: |
          set -euo pipefail
          python -m pip install -q "opencv-python-headless>=4.9,<5" "pillow>=10,<13" "requests>=2.31,<3"
          python -m py_compile src/storia_zorro_1920_resilient_scout.py src/public_archive_sources_v1.py
      - name: "Scout a true short historical HD excerpt; alternate source on 429"
        run: |
          set -euo pipefail
          python -u src/storia_zorro_1920_resilient_scout.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/storia_zorro_1920_hd/SOURCE_LOCK_QA.json")
          assert p.is_file(),"NO_SOURCE_STATUS_REPORT"
          report=json.loads(p.read_text())
          state=report["status"]
          print("ZORRO_RESCUE_STATUS",state)
          assert state in (
              "TRUE_SHORT_SOURCE_EXCERPT_AND_FACE_SCOUT_ONLY_NOT_FINAL",
              "INDEPENDENT_ARCHIVE_FALLBACK_DISCOVERED_NO_VERIFIED_VIDEO")
          assert report["new_final_mp4"] is False
          PY
      - name: "Preserve real frames or clearly labelled independent archive fallback (never final video)"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZORRO_1920_RESILIENT_FACE_SCOUT_OR_FALLBACK_NO_FINAL
          path: output/storia_zorro_1920_hd/
          retention-days: 14
          if-no-files-found: warn
