name: "La Storia Rivive - Zorro 1920 high-definition source and face scout"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/storia-zorro-1920-hd-face-scout.yml"]
permissions:
  contents: read
jobs:
  genuine_source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install image inspection
        run: python -m pip install -q "opencv-python-headless>=4.9,<5" "pillow>=10,<13" "requests>=2.31,<3"
      - name: Recover actual Wikimedia file and verify provenance
        run: |
          set -euo pipefail
          mkdir -p output/storia_zorro_1920_hd
          python - <<'PY'
          import requests,json,pathlib
          p=pathlib.Path("output/storia_zorro_1920_hd")
          title="File:The Mark of Zorro 1920.webm"
          api="https://commons.wikimedia.org/w/api.php"
          headers={"User-Agent":"LaStoriaRiviveResearch/1.0 (historical source scout)"}
          r=requests.get(api,params={"action":"query","titles":title,"prop":"imageinfo","iiprop":"url|size|extmetadata","format":"json"},headers=headers,timeout=35)
          r.raise_for_status()
          page=next(iter(r.json()["query"]["pages"].values()))
          if "imageinfo" not in page: raise RuntimeError("COMMONS_FILE_NOT_FOUND_NO_FAKE_VIDEO")
          info=page["imageinfo"][0]
          (p/"COMMONS_SOURCE_METADATA.json").write_text(json.dumps({"title":title,"url":info["url"],"width":info.get("width"),"height":info.get("height"),"size":info.get("size"),"extmetadata":info.get("extmetadata",{})},indent=2))
          with requests.get(info["url"],headers=headers,timeout=90,stream=True) as stream:
              stream.raise_for_status()
              with open(p/"SOURCE.webm","wb") as f:
                  for block in stream.iter_content(1024*1024):
                      if block:f.write(block)
          assert (p/"SOURCE.webm").stat().st_size>1000000,"SOURCE_TOO_SMALL"
          PY
          sha256sum output/storia_zorro_1920_hd/SOURCE.webm > output/storia_zorro_1920_hd/SOURCE_SHA256.txt
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json output/storia_zorro_1920_hd/SOURCE.webm > output/storia_zorro_1920_hd/SOURCE_PROBE.json
      - name: Select face-rich frames and authentic motion, without fabricated reconstruction
        run: |
          python - <<'PY'
          import cv2,json,hashlib,math,subprocess
          from pathlib import Path
          from PIL import Image,ImageDraw
          p=Path("output/storia_zorro_1920_hd")
          cap=cv2.VideoCapture(str(p/"SOURCE.webm"))
          assert cap.isOpened()
          fps=cap.get(cv2.CAP_PROP_FPS)
          n=cap.get(cv2.CAP_PROP_FRAME_COUNT)
          dur=n/fps
          w=int(cap.get(cv2.CAP_PROP_FRAME_WIDTH));h=int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
          assert fps>0 and dur>60 and w>=700 and h>=500,"INSUFFICIENT_SOURCE"
          detector=cv2.CascadeClassifier(cv2.data.haarcascades+"haarcascade_frontalface_default.xml")
          ts=[min(dur-2,(dur*(i+1)/21)) for i in range(20)]
          board=Image.new("RGB",(5*320,4*265),(16,18,22));draw=ImageDraw.Draw(board)
          samples=[]
          for i,t in enumerate(ts):
              idx=round(t*fps)
              cap.set(cv2.CAP_PROP_POS_FRAMES,idx)
              ok,frame=cap.read()
              if not ok:continue
              gray=cv2.cvtColor(frame,cv2.COLOR_BGR2GRAY)
              faces=detector.detectMultiScale(cv2.equalizeHist(gray),scaleFactor=1.08,minNeighbors=4,minSize=(35,35))
              boxes=[list(map(int,f)) for f in faces]
              sharp=float(cv2.Laplacian(gray,cv2.CV_32F).var())
              score=sum(min(b[2]*b[3]/(w*h),.1) for b in boxes)+.00001*sharp
              annotated=frame.copy()
              for x,y,bw,bh in boxes:cv2.rectangle(annotated,(x,y),(x+bw,y+bh),(0,225,255),2)
              img=Image.fromarray(cv2.cvtColor(cv2.resize(annotated,(312,234)),cv2.COLOR_BGR2RGB))
              x=(i%5)*320;y=(i//5)*265
              board.paste(img,(x+4,y+25))
              draw.text((x+5,y+4),f"{t:.1f}s / {len(boxes)} faces / {sharp:.0f} sharp",fill="white")
              samples.append({"time_s":round(t,3),"frame_index":idx,"face_boxes_auto_unreliable":boxes,"sharpness":round(sharp,2),"preliminary_score":round(score,5)})
          cap.release()
          assert len(samples)>=12
          board.save(p/"ORIGINAL_FACE_CONTACT_SHEET.jpg",quality=92)
          chosen=max(samples,key=lambda s:s["preliminary_score"])
          t=chosen["time_s"];idx=chosen["frame_index"]
          cap=cv2.VideoCapture(str(p/"SOURCE.webm"))
          cap.set(cv2.CAP_PROP_POS_FRAMES,idx)
          ok,anchor=cap.read();assert ok
          cv2.imwrite(str(p/"EXACT_ORIGINAL_ANCHOR.png"),anchor)
          for off in [-.3,-.1,0,.1,.3,1.0]:
              cap.set(cv2.CAP_PROP_POS_FRAMES,max(0,idx+round(off*fps)))
              ok,fr=cap.read()
              if ok:cv2.imwrite(str(p/f"NEIGHBOR_{off:+.1f}.jpg"),fr)
          cap.release()
          start=max(0,t-5)
          subprocess.run(["ffmpeg","-nostdin","-y","-loglevel","error","-ss",str(start),"-i",str(p/"SOURCE.webm"),"-t","12","-an","-c:v","libx264","-preset","fast","-crf","20","-pix_fmt","yuv420p",str(p/"ORIGINAL_MOTION_SCOUT_NOT_RESTORED.mp4")],check=True,timeout=240)
          subprocess.run(["ffmpeg","-nostdin","-v","error","-xerror","-i",str(p/"ORIGINAL_MOTION_SCOUT_NOT_RESTORED.mp4"),"-f","null","-"],check=True,timeout=120)
          sha=hashlib.sha256((p/"SOURCE.webm").read_bytes()).hexdigest()
          report={"source_sha256":sha,"fps":fps,"resolution":[w,h],"duration_s":dur,"selected_exact_frame_index":idx,"timecode_s":idx/fps,"crop":"NONE_SOURCE_FULL_FRAME","sampled":samples,"stage":"ORIGINAL_MOVING_SCOUT_ONLY_NO_I2I_NO_FINISHED_VIDEO","rights_italy":"PENDING_INDIVIDUAL_REVIEW","human_face_quality":"PENDING","artistic_review":"PENDING","paid_calls":0,"published":False}
          (p/"SOURCE_LOCK_QA.json").write_text(json.dumps(report,indent=2))
          print("SOURCE_SCOUT_CREATED",json.dumps({k:report[k] for k in ["source_sha256","fps","resolution","selected_exact_frame_index","timecode_s","stage"]}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZORRO_1920_HD_SOURCE_FACE_SCOUT_NOT_FINISHED
          path: output/storia_zorro_1920_hd/
          retention-days: 14
          if-no-files-found: warn
