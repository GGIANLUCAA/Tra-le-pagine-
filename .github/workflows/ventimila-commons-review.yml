name: Ventimila - One-time Commons Illustrations Review
on:
  pull_request:
    paths:
      - experiments/ventimila_leghe_v1/commons_review.py
      - .github/workflows/ventimila-commons-review.yml
permissions:
  contents: read
jobs:
  illustrations:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31' 'pillow>=10,<13'
      - run: python experiments/ventimila_leghe_v1/commons_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: VENTIMILA_COMMONS_RESEARCH
          path: output/ventimila-commons/
          if-no-files-found: error
          retention-days: 7
