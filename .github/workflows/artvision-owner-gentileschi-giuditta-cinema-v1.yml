name: "ArtVision OWNER | Artemisia Gentileschi | Giuditta (Uffizi) | New Cinema private review"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-owner-gentileschi-giuditta-cinema-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artvision-owner-single-heavy-render
  cancel-in-progress: false
jobs:
  render_new_cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail-closed pilot-lock authorization check
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_owner_gentileschi_giuditta_cinema_v1.py
          python - <<'PY'
          import json,pathlib
          lock=json.loads(pathlib.Path('config/artvision_pilot_lock_v58.json').read_text())
          assert lock.get('active') is True
          a=lock.get('authorized_gentileschi_cinema_20261116',{})
          assert a.get('enabled') is True
          assert a.get('allowed_title')=='Judith Slaying Holofernes'
          assert a.get('allowed_artist')=='Artemisia Gentileschi'
          assert a.get('museum_slots_authorized') is False
          assert a.get('no_paid_video_ai') is True and a.get('no_social_auto_publish') is True
          print('VERIFIED owner authorization: ONE silent Cinema slot; 0 paid calls; no publication.')
          PY
      - name: Install local free rendering libraries
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5'
      - name: Verify exact artwork + licensed recording, then render two MP4 encodings
        run: python scripts/artvision_owner_gentileschi_giuditta_cinema_v1.py
      - name: Independently check duration, rights metadata, source hash and Android ZIP
        shell: bash
        run: |
          set -euo pipefail
          d=output/artvision_artemisia_giuditta
          ffprobe -v error -show_streams -show_format -of json "$d/VIDEO_REVIEW.mp4" > "$d/FFPROBE.json"
          ffmpeg -v error -xerror -i "$d/VIDEO_REVIEW.mp4" -map 0 -f null -
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID_720_REVIEW.mp4" -map 0 -f null -
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          p=Path('output/artvision_artemisia_giuditta')
          src=p/'assets/giuditta_uffizi_full.jpg'
          hq=p/'VIDEO_REVIEW.mp4';phone=p/'VIDEO_ANDROID_720_REVIEW.mp4';zp=p/'ANDROID_REVIEW_PACKAGE.zip'
          sha=lambda x:hashlib.sha256(x.read_bytes()).hexdigest()
          qa=json.loads((p/'QA_TECHNICAL.json').read_text())
          assert sha(src)==qa['source_sha256']=='22952779803e03f1c3e289fc5ce894e6c1f37967f5172c143b924d388301c920'
          assert qa['mp4_sha256']==sha(hq)
          assert qa['android_mp4_sha256']==sha(phone)
          assert qa['scene_count']==14 and 64<qa['duration_seconds']<68
          assert not qa['gold'] and not qa['published'] and qa['paid_api_calls']==0
          rights=json.loads((p/'SOURCES_RIGHTS.json').read_text())
          assert rights['music']['license']=='CC BY 4.0' and 'http' in rights['music']['license_url']
          assert rights['music']['recording_sha256']==qa['music_recording_sha256']
          probe=json.loads((p/'FFPROBE.json').read_text())
          v=[s for s in probe['streams'] if s.get('codec_type')=='video']
          a=[s for s in probe['streams'] if s.get('codec_type')=='audio']
          assert len(v)==1 and v[0]['codec_name']=='h264' and v[0]['width']==1080 and v[0]['height']==1920
          assert len(a)==1 and a[0]['codec_name']=='aac'
          with zipfile.ZipFile(zp) as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read(phone.name)).hexdigest()==qa['android_mp4_sha256']
          print('SOURCE_SHA256_VERIFIED',qa['source_sha256'])
          print('MP4_1080_SHA256:',sha(hq))
          print('MP4_ANDROID_SHA256:',sha(phone))
          print('ANDROID_ZIP_SHA256:',sha(zp))
          print('FFMPEG_DECODE_PASS ZIP_CRC_PASS HUMAN_REVIEW_PENDING NOT_GOLD NOT_PUBLISHED')
          PY
      - name: Save video, cover, sources and Android delivery package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_OWNER_GENTILESCHI_GIUDITTA_CINEMA_REVIEW
          retention-days: 30
          if-no-files-found: error
          path: |
            output/artvision_artemisia_giuditta/VIDEO_REVIEW.mp4
            output/artvision_artemisia_giuditta/VIDEO_ANDROID_720_REVIEW.mp4
            output/artvision_artemisia_giuditta/ANDROID_REVIEW_PACKAGE.zip
            output/artvision_artemisia_giuditta/COVER.jpg
            output/artvision_artemisia_giuditta/CONTACT_SHEET.jpg
            output/artvision_artemisia_giuditta/SOURCES_RIGHTS.json
            output/artvision_artemisia_giuditta/STORYBOARD.json
            output/artvision_artemisia_giuditta/QA_TECHNICAL.json
            output/artvision_artemisia_giuditta/FFPROBE.json
            output/artvision_artemisia_giuditta/RICETTA_RENDER_GITHUB_ACTIONS.md
  independent_artifact_readback:
    needs: render_new_cinema
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ARTVISION_OWNER_GENTILESCHI_GIUDITTA_CINEMA_REVIEW
          path: /tmp/gentileschi-readback
      - name: Ensure ffmpeg on independent runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Re-download, full-decode, compare SHA and ZIP CRC in separate job
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/gentileschi-readback
          ffmpeg -v error -xerror -i "$d/VIDEO_REVIEW.mp4" -map 0 -f null -
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID_720_REVIEW.mp4" -map 0 -f null -
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          p=Path('/tmp/gentileschi-readback')
          qa=json.loads((p/'QA_TECHNICAL.json').read_text())
          h=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert h(p/'VIDEO_REVIEW.mp4')==qa['mp4_sha256']
          assert h(p/'VIDEO_ANDROID_720_REVIEW.mp4')==qa['android_mp4_sha256']
          with zipfile.ZipFile(p/'ANDROID_REVIEW_PACKAGE.zip') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('VIDEO_ANDROID_720_REVIEW.mp4')).hexdigest()==qa['android_mp4_sha256']
          print('SEPARATE_JOB_PHYSICAL_ARTIFACT_READBACK_PASS NO_GOLD NO_PUBLICATION')
          PY
