name: "ArtVision V55 — Turner Cinema Museum — real gallery photo"
run-name: "Turner The Fighting Temeraire · Cinema Museum V55 · real photo · review only"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-turner-cinema-museum-v55-20261028.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: artvision-turner-cinema-museum-v55-20261028
  cancel-in-progress: false
jobs:
  turner_museum:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local CPU tools, no paid API
        run: |
          set -euo pipefail
          command -v ffmpeg || sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "requests>=2.31,<3"
          python -m py_compile scripts/artvision_turner_cinema_museum_v55.py scripts/artvision_turner_cinema_standard_v55.py src/artvision_delivery_v55.py
      - name: Official V54 four-check, structural only
        run: |
          python src/video_director_v13.py four-check --plan docs/productions/2026-10-28-turner-temeraire-v55-research-1915/ARTVISION_4X1_PLAN.json
      - name: V28 editorial and zero paid APIs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0,'src')
          import artvision_editorial_post_v28 as v28
          v28.CATALOG=Path('config/artvision_turner_cinema_museum_v55_editorial.json')
          key='turner_fighting_temeraire_cinema_museum_v55'
          errors=v28.validate_entry(key,v28.config()['entries'][key])
          assert not errors, errors
          code=Path('scripts/artvision_turner_cinema_museum_v55.py').read_text()
          for forbidden in ('VIDU_API_KEY','RUNWARE_API_KEY','KLING_API_KEY','SEEDANCE_API_KEY','GEMINI_API_KEY','requests.post('):
              assert forbidden not in code, forbidden
          print('V28_VALID; ZERO_PAID_VIDEO_APIS; NO_SOCIAL_AUTOPUBLISH')
          PY
      - name: Render real framed Turner Museum, no fake room
        run: |
          python scripts/artvision_turner_cinema_museum_v55.py
      - name: Independent full decode, rights, post and ZIP CRC
        run: |
          set -euo pipefail
          root="output/artvision-turner-cinema-museum-v55"
          folder="$root/turner_fighting_temeraire_cinema_museum_v55"
          film="$folder/VIDEO_MASTER.mp4"
          test -s "$film"
          test -s "$folder/ORIGINAL_REAL_GALLERY_PHOTO_CC_BY_SA_4_0.jpg"
          test -s "$folder/ORIGINAL_ARTWORK.jpg"
          test -s "$folder/ORIGINAL_LICENSED_MUSIC.mp3"
          test -s "$root/V55_DELIVERY/VIDEO_MASTER_COMPLETO.zip"
          test -s "$root/V55_DELIVERY/ARTVISION_TURNER_CINEMA_MUSEUM_V55_SOLO_VIDEO_ANDROID.zip"
          ffmpeg -nostdin -hide_banner -loglevel error -xerror -i "$film" -f null -
          python - <<'PY'
          import pathlib,subprocess,json,zipfile,hashlib
          root=pathlib.Path('output/artvision-turner-cinema-museum-v55')
          folder=root/'turner_fighting_temeraire_cinema_museum_v55'
          film=folder/'VIDEO_MASTER.mp4'
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_name,codec_type,width,height','-of','json',str(film)]))
          assert any(s.get('codec_name')=='h264' and (s.get('width'),s.get('height'))==(1080,1920) for s in p['streams'])
          assert any(s.get('codec_name')=='aac' for s in p['streams'])
          for z in list(root.glob('*.zip'))+list((root/'V55_DELIVERY').glob('*.zip')):
              with zipfile.ZipFile(z) as f:assert f.testzip() is None, str(z)
          for name in ('FACEBOOK','INSTAGRAM','TIKTOK','YOUTUBE'):
              assert (folder/('POST_'+name+'.txt')).stat().st_size>150
          rights=(folder/'SOURCES_AND_RIGHTS.md').read_text()
          assert 'CC BY-SA 4.0' in rights and 'CC BY 4.0' in rights
          release=json.loads((root/'RELEASE_STATE_V55.json').read_text())
          assert release['state']=='rendered_needs_review' and not release['human_full_speed_watch']
          print('REAL_RENDER_NEEDS_REVIEW',hashlib.sha256(film.read_bytes()).hexdigest())
          PY
      - name: Save original media and review-only V55 packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_TURNER_CINEMA_MUSEUM_V55_REAL_PHOTO_RENDERED_NEEDS_REVIEW
          path: |
            output/artvision-turner-cinema-museum-v55/turner_fighting_temeraire_cinema_museum_v55/VIDEO_MASTER.mp4
            output/artvision-turner-cinema-museum-v55/turner_fighting_temeraire_cinema_museum_v55/COPERTINA.jpg
            output/artvision-turner-cinema-museum-v55/turner_fighting_temeraire_cinema_museum_v55/QA_CONTACT_SHEET.jpg
            output/artvision-turner-cinema-museum-v55/turner_fighting_temeraire_cinema_museum_v55/QA_FIRST_FRAME_V55.jpg
            output/artvision-turner-cinema-museum-v55/ARTVISION_TURNER_CINEMA_MUSEUM_V55_ORIGINALS.zip
            output/artvision-turner-cinema-museum-v55/V55_DELIVERY/*.zip
            output/artvision-turner-cinema-museum-v55/V55_DELIVERY/DELIVERY_STATUS_V55.json
            output/artvision-turner-cinema-museum-v55/RELEASE_STATE_V55.json
          if-no-files-found: error
          retention-days: 30
