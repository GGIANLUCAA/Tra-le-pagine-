name: "Giuliano - Terracotta Army Critico"
on:
  push:
    branches: ["feature/giuliano-terracotta-20261109"]
    paths:
      - "giuliano/terracotta/**"
  pull_request:
    branches: [main]
    paths:
      - "giuliano/terracotta/**"
      - ".github/workflows/giuliano-terracotta.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARTVISION_ASR_MODEL: base
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout branch (isolated from ArtVision)
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate TTS secret configured
        run: test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY absent; do not substitute an unapproved robotic voice" && exit 2)
      - name: Dependencies - no paid generative video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1 fonts-dejavu-core
          python -m pip install -q 'numpy>=1.25,<3' 'Pillow>=10,<12' 'requests>=2.31,<3' 'soundfile>=0.12' 'scipy>=1.11' 'google-genai>=2.25,<3' 'faster-whisper>=1.1,<2'
      - name: Render real video with license manifest
        run: python giuliano/terracotta/render_terracotta.py
      - name: Upload review MP4 and Android ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GIULIANO_TERRACOTTA_CRITICO_REVIEW
          path: |
            output/giuliano_terracotta/GIULIANO_TERRACOTTA_CRITICO_REVIEW.mp4
            output/giuliano_terracotta/GIULIANO_TERRACOTTA_VIDEO_COVER_TESTI.zip
            output/giuliano_terracotta/COVER.jpg
            output/giuliano_terracotta/QA.json
          if-no-files-found: error
          retention-days: 14

  report-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Monitor isolated push render without generating again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,requests,time
          repo=os.environ["GH_REPO"]
          uri=f"https://api.github.com/repos/{repo}/actions/runs"
          headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                   "Accept":"application/vnd.github+json"}
          found=None
          for _ in range(40):
              r=requests.get(uri,headers=headers,params={
                  "branch":"feature/giuliano-terracotta-20261109",
                  "event":"push","per_page":40},timeout=20)
              r.raise_for_status()
              runs=[a for a in r.json().get("workflow_runs",[])
                    if a.get("name")=="Giuliano - Terracotta Army Critico"]
              print("FOUND_PUSH_RUNS:",[(a.get("id"),a.get("head_sha"),a.get("status"),a.get("conclusion")) for a in runs[:10]],flush=True)
              runs=[a for a in runs if a.get("head_sha")=="475b9b8e1d80e145636d3644049c558b00b2fa29"]
              if runs:
                  found=runs[0]
                  print("RENDER_RUN_ID:",found["id"],"STATUS:",found["status"],
                        "CONCLUSION:",found.get("conclusion"),
                        "URL:",found.get("html_url"),flush=True)
                  if found["status"]=="completed":break
              else:
                  print("No push render workflow run found yet",flush=True)
              time.sleep(18)
          if not found:raise RuntimeError("Render push not observed")
          if found["status"]!="completed":raise RuntimeError("Render not yet complete")
          r=requests.get(found["artifacts_url"],headers=headers,timeout=25)
          r.raise_for_status()
          print("ARTIFACTS:",[(a.get("id"),a.get("name"),a.get("expired"))
                              for a in r.json().get("artifacts",[])],flush=True)
          if found.get("conclusion")!="success":
              raise RuntimeError("Render failed; do not claim downloadable MP4")
          if not any(a.get("name")=="GIULIANO_TERRACOTTA_CRITICO_REVIEW"
              for a in r.json().get("artifacts",[])):
              raise RuntimeError("Render success but no video artifact")
          PY
