name: Dracula Gacrux voice - lightweight runner
on:
  pull_request:
    paths:
      - .github/workflows/dracula-gacrux-fast.yml
permissions:
  contents: read
jobs:
  voice:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install voice python deps only; no apt update
        run: python -m pip install --disable-pip-version-check -q "numpy>=1.25,<3" "soundfile>=0.12" "scipy>=1.11" "google-genai>=2.25,<3"
      - name: Existing Gemini Gacrux voice, one attempt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p output/dracula-voice
          python - <<'PY'
          import os,sys,json
          from pathlib import Path
          if not os.getenv("GEMINI_API_KEY"):
              raise SystemExit("GEMINI_API_KEY missing")
          sys.path.insert(0,"src")
          from gemini_voice import synthesize
          text=Path("experiments/dracula_selective_reveal_20261027/copione.txt").read_text(encoding="utf8")
          d=Path("output/dracula-voice")
          voice,times=synthesize(text,d)
          (d/"SCENE_TIMING.json").write_text(json.dumps(times,ensure_ascii=False,indent=2))
          print("VOICE SUCCESS samples:",len(voice),"seconds:",len(voice)/24000)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRACULA_GACRUX_FAST
          path: output/dracula-voice/
          if-no-files-found: warn
          retention-days: 14
