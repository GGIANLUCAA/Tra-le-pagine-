name: "WOW LAB only — tiger CC0 high-resolution preflight"
on:
  push:
    branches:
      - experiment/wow-lab-tiger-burst-20261107
    paths:
      - "wow_lab/tiger_burst_source_scout.py"
      - ".github/workflows/wow-lab-tiger-burst-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wow-lab-tiger-burst-20261107
  cancel-in-progress: false
jobs:
  source_scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free image reader only
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - name: Check official Met CC0 record and download original pixels
        run: python wow_lab/tiger_burst_source_scout.py
      - name: Keep scout source for high resolution human mask audit — NO RENDERING
        uses: actions/upload-artifact@v4
        with:
          name: WOW_LAB_TIGER_73553_SOURCE_${{ github.run_id }}
          path: wow_lab/runs/${{ github.run_id }}/*
          retention-days: 30
          if-no-files-found: error
