name: "ArtVision · probe modelli Gemini TTS"
run-name: "PROBE v3 · Gemini TTS su api_version v1beta"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/artvision-gemini-tts-model-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Installa SDK Google"
        run: python -m pip install --disable-pip-version-check "google-genai>=2.25,<4"
      - name: "Testa Gemini TTS con api_version v1beta"
        run: |
          python - <<'PY'
          import os
          from google import genai
          from google.genai import types
          key=os.environ["GEMINI_API_KEY"]
          def synth(client,model,voice="Gacrux"):
              it=client.interactions.create(
                  model=model,
                  input=[{"type":"user_input","content":[{"type":"text",
                          "text":"Ciao, questa è una prova della voce narrante.","annotations":[
                          {"type":"speech_metadata","style":"neutral"}]}]}],
                  response_format={"type":"audio"},
                  generation_config={"speech_config":[{"voice":voice}]})
              d=it.output_audio.data if it.output_audio else None
              if isinstance(d,str):
                  import base64; d=base64.b64decode(d)
              return len(d) if d else 0
          variants={
            "dict": genai.Client(api_key=key,http_options={"api_version":"v1beta"}),
            "HttpOptions": genai.Client(api_key=key,http_options=types.HttpOptions(api_version="v1beta")),
          }
          for name,client in variants.items():
              for m in ["gemini-3.8-flash-tts","gemini-3.8-flash-lite-tts","gemini-2.5-flash-preview-tts"]:
                  try:
                      n=synth(client,m)
                      print(f"[{name}] WORKING {m} -> audio_bytes={n}",flush=True)
                  except Exception as e:
                      print(f"[{name}] FAIL {m} {repr(e)[:150]}",flush=True)
          PY
