name: "ArtVision · probe modelli Gemini TTS"
run-name: "PROBE · elenca modelli TTS Google disponibili"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/artvision-gemini-tts-model-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Installa SDK Google"
        run: |
          python -m pip install --disable-pip-version-check "google-genai>=2.25,<4"
      - name: "Elenca modelli e prova sintesi TTS"
        run: |
          python - <<'PY'
          import os, traceback
          from google import genai
          key=os.environ["GEMINI_API_KEY"]
          client=genai.Client(api_key=key)
          names=[]
          try:
              for m in client.models.list():
                  n=getattr(m,"name","")
                  names.append(n)
              print("TOT MODELS:",len(names),flush=True)
              for n in sorted(names):
                  ln=n.lower()
                  if "tts" in ln or "speech" in ln or "audio" in ln:
                      print("  CANDIDATE:",n,flush=True)
          except Exception as e:
              print("LIST ERROR:",repr(e)[:300],flush=True)
          print("--- tutti i modelli ---",flush=True)
          for n in sorted(names): print("  ",n,flush=True)

          candidates=[n.split("/")[-1] for n in names if "tts" in n.lower()]
          candidates=sorted(set(candidates)) or [
              "gemini-3.8-flash-tts","gemini-3-flash-tts","gemini-2.5-flash-preview-tts",
              "gemini-2.5-pro-preview-tts","gemini-3-pro-tts"]
          ok=[]
          for model in candidates:
              try:
                  it=client.interactions.create(
                      model=model,
                      input=[{"type":"user_input","content":[{"type":"text","text":"Prova voce Gacrux.",
                              "annotations":[{"type":"speech_metadata","style":"neutral"}]}]}],
                      response_format={"type":"audio"},
                      generation_config={"speech_config":[{"voice":"Gacrux"}]})
                  if it.output_audio and it.output_audio.data:
                      print("WORKING MODEL:",model,flush=True); ok.append(model)
                  else:
                      print("NO AUDIO:",model,flush=True)
              except Exception as e:
                  print("FAIL:",model,repr(e)[:200],flush=True)
          print("RESULT_OK:",ok,flush=True)
          PY
