name: "La Storia Rivive V176 - prevent SD source regression in V101 autopilot"
on:
  push:
    branches: [storia-v173-film1917-native-quality-scout-20261101]
    paths:
      - ".github/workflows/storia-v176-source-quality-tests.yml"
      - ".github/workflows/storia-rivive-v101-auto-3h.yml"
      - "src/storia_rivive_scout_v101.py"
      - "tests/test_storia_rivive_v176_quality_source_gate.py"
      - "src/storia_rivive_v179_cycle_status.py"
      - "tests/test_storia_rivive_v179_cycle_status.py"
  pull_request:
    paths:
      - ".github/workflows/storia-v176-source-quality-tests.yml"
      - ".github/workflows/storia-rivive-v101-auto-3h.yml"
      - "src/storia_rivive_scout_v101.py"
      - "tests/test_storia_rivive_v176_quality_source_gate.py"
      - "src/storia_rivive_v179_cycle_status.py"
      - "tests/test_storia_rivive_v179_cycle_status.py"
permissions:
  contents: read
concurrency:
  group: storia-v176-source-quality-tests
  cancel-in-progress: false
jobs:
  real_source_quality_fail_closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free dependencies and compile actual V101 code
        run: |
          python -m pip install -q "Pillow>=10,<13"
          python -m py_compile src/storia_rivive_scout_v101.py src/storia_rivive_autopilot_v101.py
      - name: Existing V101 contract tests
        run: python -m unittest discover -s tests -p "test_storia_rivive_v101.py" -v
      - name: New V176 quality gate tests including real known raster sizes
        run: python -m unittest discover -s tests -p "test_storia_rivive_v176_quality_source_gate.py" -v
      - name: V179 source-rejection cycle status and no false I2I preparation
        run: |
          python -m py_compile src/storia_rivive_v179_cycle_status.py
          python -m unittest discover -s tests -p "test_storia_rivive_v179_cycle_status.py" -v
      - name: Verify old V101 cache cannot bypass the new quality preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path(".github/workflows/storia-rivive-v101-auto-3h.yml").read_text()
          script=Path("src/storia_rivive_scout_v101.py").read_text()
          assert "storia-v101-archival-scout-v3-" not in workflow
          assert workflow.count("storia-v101-archival-scout-v4-v176-quality-")==2
          assert "REJECT_LOW_SOURCE_PIXELS_FOR_REFERENCE_LEVEL_MOTION" in script
          assert "m[\"source_raster_quality_gate_v176\"]=quality" in script
          assert "if quality[\"status\"]!=\"SOURCE_ENCODED_RASTER_ELIGIBLE_FOR_VISUAL_REVIEW\"" in script
          print("V176_SOURCE_PIXEL_GATE_AND_CACHE_INVALIDATION_PASS")
          PY
