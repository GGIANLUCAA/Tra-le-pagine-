name: "La Storia Rivive ONLY - Boxing Cats 1894 fast verified owner Android download"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storia-boxing-cats-1894-fast-android.yml"
permissions:
  actions: write
  contents: write
  issues: write
jobs:
  owner_review_delivery:
    strategy:
      fail-fast: false
      matrix:
        include:
          - episode: boxing_cats_1894
            label: BOXING_CATS_1894
            hue: "0.58"
            tag: storia-cinema-boxing-cats-1894-v2-android-review

    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Stop stalled duplicate boxing download without spending any AI credits
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/42309161280/cancel" || true
      - uses: actions/checkout@v4
      - name: Install FFmpeg for actual moving video correction
        run: |
          set -euo pipefail
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      - name: Download exact VERIFIED NEW FILM artifact (never regenerate Finegrain)
        run: |
          set -euo pipefail
          mkdir -p /tmp/archival_first output/storia_serial_delivery_${{ matrix.episode }}
          gh run download 42308037083 --repo "$GITHUB_REPOSITORY" --name "STORIA_SERIAL_${{ matrix.episode }}_REAL_TEST_NO_PUBLISH" --dir /tmp/archival_first
          test -s "/tmp/archival_first/${{ matrix.label }}_SOCIAL_REVIEW.mp4"
          test -s "/tmp/archival_first/${{ matrix.label }}_SOCIAL_REVIEW_WITH_SOCIAL.zip"
          test -s /tmp/archival_first/GENERATIVE_PHOTO_REAL_CANDIDATE.png
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path("/tmp/archival_first"); info=json.loads((p/"SERIAL_QA.json").read_text())
          v=p/info["filename"]; print("EXACT_ORIGINAL_NEW_FILM_SHA_VERIFIED",hashlib.sha256(v.read_bytes()).hexdigest()==info["movie_sha256"])
          assert hashlib.sha256(v.read_bytes()).hexdigest()==info["movie_sha256"]
          PY
      - name: REAL second MP4 render - lower unnatural chroma, same footage & matched I2I
        run: |
          set -euo pipefail
          ffmpeg -nostdin -y -v error -i "/tmp/archival_first/${{ matrix.label }}_SOCIAL_REVIEW.mp4" -vf "hue=s=${{ matrix.hue }},eq=contrast=1.035:gamma=1.008" -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -c:a copy -movflags +faststart "output/storia_serial_delivery_${{ matrix.episode }}/${{ matrix.label }}_V2_SOCIAL_REVIEW.mp4"
          ffmpeg -nostdin -v error -xerror -i "output/storia_serial_delivery_${{ matrix.episode }}/${{ matrix.label }}_V2_SOCIAL_REVIEW.mp4" -f null -
      - name: New ZIP, cover, and technical SHA/CRC audit + FOUR social drafts
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,hashlib,zipfile,json,subprocess
          episode="${{ matrix.episode }}";prefix="${{ matrix.label }}"
          raw=pathlib.Path("/tmp/archival_first")
          folder=pathlib.Path("output")/("storia_serial_delivery_"+episode)
          video=folder/(prefix+"_V2_SOCIAL_REVIEW.mp4")
          z=folder/(prefix+"_V2_SOCIAL_AND_COVER.zip")
          old=raw/(prefix+"_SOCIAL_REVIEW_WITH_SOCIAL.zip")
          with zipfile.ZipFile(old) as src:
            entries=src.namelist()
            assert len([x for x in entries if x.startswith("POST_")])==4,entries
            with zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=4) as dest:
              dest.write(video,video.name)
              for name in entries:
                if name.endswith(".mp4"):continue
                dest.writestr(name,src.read(name))
              dest.writestr("V2_OWNER_REVIEW_NOTE.txt","TRUE NEW HISTORICAL MOVING FILM: prior real source; actual previous free same-frame I2I still. V2 reduces unnatural saturation in still and film, not new image generation, not full neural I2V. Not editorially approved for site/social. Public GitHub prerelease only for owner preview. Zero new AI calls. No Vidu. 1080x1920 upscaled, not native 4K.")
          with zipfile.ZipFile(z) as a:assert a.testzip() is None
          def sha(x):return hashlib.sha256(x.read_bytes()).hexdigest()
          qa=json.loads((raw/"SERIAL_QA.json").read_text())
          obj={"status":"REAL_NEW_FILM_V2_GRADED_OWNER_REVIEW","original_film":qa["title"],"year":qa["year"],
            "mp4":video.name,"sha256":sha(video),"mp4_bytes":video.stat().st_size,
            "zip":z.name,"zip_sha256":sha(z),"zip_crc_pass":True,
            "source_original_video_sha256":qa["movie_sha256"],"duration_s":qa["duration_s"],
            "dimensions":qa["resolution"],"real_i2i_photo_produced_in_v1":True,
            "source":json.loads((raw/"RIGHTS.json").read_text())["source_commons"],
            "artistic_approval":"OWNER_REVIEW_PENDING","actual_full_i2v":False,
            "no_new_vidu":True,"new_paid_ai_calls":0,"published_site_social":False}
          (folder/"V2_REVIEW_QA.json").write_text(json.dumps(obj,indent=2)+"\n")
          for typ,expect in [("v","h264"),("a","aac")]:
            p=subprocess.run(["ffprobe","-v","error","-select_streams",typ,"-show_entries","stream=codec_name","-of","default=nw=1:nk=1",str(video)],capture_output=True,text=True,check=True)
            assert p.stdout.strip()==expect
          print("REAL_NEW_FILM_COLOUR_FIXED_MP4_ZIP_QA_PASS",obj)
          PY
      - name: Preserve actual files as GitHub Action artifact
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_${{ matrix.episode }}_V2_REAL_MP4_ZIP
          retention-days: 14
          path: output/storia_serial_delivery_${{ matrix.episode }}/*
      - name: Public prerelease for Android owner-only editorial REVIEW (not social/site)
        run: |
          set -euo pipefail
          cd "output/storia_serial_delivery_${{ matrix.episode }}"
          gh release create "${{ matrix.tag }}" "${{ matrix.label }}_V2_SOCIAL_REVIEW.mp4" "${{ matrix.label }}_V2_SOCIAL_AND_COVER.zip" V2_REVIEW_QA.json --repo "$GITHUB_REPOSITORY" --prerelease --title "${{ matrix.label }} · V2 color corrected · OWNER REVIEW" --notes "Publicly accessible GitHub prerelease only for owner download, not social/site publication or artistic approval. Truly distinct historical film, real motion + source-matched Finegrain photo from V1. V2 neutral color grade with no additional Finegrain/Vidu calls. Details in JSON."
          for f in "${{ matrix.label }}_V2_SOCIAL_REVIEW.mp4" "${{ matrix.label }}_V2_SOCIAL_AND_COVER.zip"; do
            curl --fail --location --silent --show-error --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/${{ matrix.tag }}/$f" -o "/tmp/$f"
            cmp "$f" "/tmp/$f"
          done
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("/tmp/${{ matrix.label }}_V2_SOCIAL_AND_COVER.zip") as z:assert z.testzip() is None
          print("PUBLIC_ANDROID_DOWNLOAD_SHA_EQUIV_ZIP_CRC_PASS")
          PY
      - name: Report factual production (not approval) in issue 144
        if: success()
        run: |
          gh issue comment 144 --repo "$GITHUB_REPOSITORY" --body "REAL NEW HISTORICAL FILM produced in batch #42308037083: **${{ matrix.label }}**. V1 source-locked genuine moving film, new real free Finegrain photographic I2I, 1080x1920 original-era motion, matched B/W freeze->photo->chroma-restored motion. V2 actually re-encoded with reduced unnatural saturation WITHOUT regenerating same photo or consuming credits. MP4 H264/AAC decode PASS, ZIP CRC/cover/4 social drafts PASS, public external Android downloads byte-identical PASS. Owner ARTISTIC REVIEW PENDING, no new Vidu, no paid calls, no site/social publication. Download: https://github.com/GGIANLUCAA/Tra-le-pagine-/releases/tag/${{ matrix.tag }}."
