name: "V79 Volti del passato · 1894-1900 original moving films"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storia-v79-volti-scout.yml"
      - "src/storia_v79_volti_scout.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: python -m pip install -q --no-cache-dir opencv-python-headless pillow numpy
      - name: Download independent PD archival moving films and compare native faces
        run: python -u src/storia_v79_volti_scout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V79_VERI_FILMATI_VOLTI_ORIGINALI_E_SCHEDE
          path: |
            output/storia_v79_volti/SNEEZE_1894_FOTOGRAMMI.jpg
            output/storia_v79_volti/KISS_1896_FOTOGRAMMI.jpg
            output/storia_v79_volti/KISS_1900_FOTOGRAMMI.jpg
            output/storia_v79_volti/FONTI_VERIFICATE.json
          if-no-files-found: warn
          retention-days: 14
