name: "Tra le Pagine - Montecristo voce Gacrux"
on:
  push:
    branches: ["feature/tra-le-pagine-montecristo-20261025"]
    paths: ["voice_jobs/montecristo_20261025.txt"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verifica segreto TTS
        run: test -n "$GEMINI_API_KEY" || (echo 'GEMINI_API_KEY non configurata' && exit 2)
      - name: Installa dipendenze
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install --quiet 'numpy>=1.25,<3' 'soundfile>=0.12' 'scipy>=1.11' 'google-genai>=2.25,<3' 'faster-whisper>=1.1,<2'
      - name: Sintetizza audiolibro naturale
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          import json
          from gemini_voice import synthesize
          out=Path("output/montecristo_voice")
          script=Path("voice_jobs/montecristo_20261025.txt").read_text(encoding="utf-8")
          audio,timed=synthesize(script,out)
          def fmt(t):
              ms=int(round(t*1000));h,ms=divmod(ms,3600000);m,ms=divmod(ms,60000);s,ms=divmod(ms,1000)
              return f"{h:02}:{m:02}:{s:02},{ms:03}"
          (out/"NARRAZIONE.srt").write_text("".join(f"{i}\n{fmt(a)} --> {fmt(b)}\n{phrase}\n\n" for i,(phrase,a,b) in enumerate(timed,1)),encoding="utf-8")
          (out/"REPORT.json").write_text(json.dumps({"engine":"Gemini Gacrux","duration_seconds":round(len(audio)/24000,2),"phrases":len(timed),"published":False},ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Consegna tracce
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: montecristo-voice-${{ github.run_id }}
          path: output/montecristo_voice/
          retention-days: 14
          if-no-files-found: error
