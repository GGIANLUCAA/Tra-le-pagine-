name: Bruegel 1559 Immersive Art Critic | Offline Italian V2
run-name: "Bruegel · original painting + natural offline Italian voice · actual MP4"
on:
  push:
    branches: [experiment/critico-immersivo-bruegel-wow-20261107]
    paths:
      - .github/workflows/bruegel-1559-open-voice-v2.yml
      - experiments/bruegel_immersivo_v2/free_supertonic.py
      - experiments/bruegel_immersivo_v2/render_offline.py
permissions:
  contents: read
  actions: read
concurrency:
  group: bruegel-1559-open-voice-standalone
  cancel-in-progress: false
jobs:
  make_narrated_film:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preflight syntax and no-cloud-voice policy
        run: |
          python -m py_compile experiments/bruegel_immersivo_v2/render.py experiments/bruegel_immersivo_v2/free_supertonic.py experiments/bruegel_immersivo_v2/render_offline.py
      - name: Install free voices, image tools and bundled FFmpeg
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "supertonic>=1.3.0" "huggingface_hub>=0.29" \
            numpy pillow "requests>=2.31" "soundfile>=0.12" "scipy>=1.11" "imageio-ffmpeg>=0.6" "av>=14,<18"
          mkdir -p /tmp/bruegel-bin
          python - <<'PY'
          import os
          from imageio_ffmpeg import get_ffmpeg_exe
          exe=get_ffmpeg_exe()
          os.symlink(exe,"/tmp/bruegel-bin/ffmpeg")
          print("FFmpeg encoder",exe)
          PY
          echo "/tmp/bruegel-bin" >> "$GITHUB_PATH"
      - name: Recover verified 1559 painting already downloaded, without hitting Wikimedia rate limit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bruegel-recovered output/bruegel_1559_critico_immersivo_v2/build
          gh run download 42417285289 --repo "$GITHUB_REPOSITORY" \
            --name BRUEGEL_V2_RECOVERY_SOURCE_VOICE_NO_REBILL --dir /tmp/bruegel-recovered
          cp /tmp/bruegel-recovered/build/ORIGINAL_ARTWORK_AUTHENTIC.jpg output/bruegel_1559_critico_immersivo_v2/build/ORIGINAL_ARTWORK_AUTHENTIC.jpg
          echo "Only authentic source cache will be used"
      - name: Get open-weight Supertonic 3 male Italian voice (no commercial AI API)
        env:
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          hf download supertone-oss-archive/supertonic-3 --local-dir assets
          OMP_NUM_THREADS=4 python -u experiments/bruegel_immersivo_v2/free_supertonic.py
          test -s output/bruegel_1559_critico_immersivo_v2/build/VOCE.wav
      - name: Render one genuine vertical art film from original Bruegel pixels
        run: |
          set -euo pipefail
          python -u experiments/bruegel_immersivo_v2/render_offline.py
      - name: Independent decode and provenance QA
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,zipfile,subprocess
          from pathlib import Path
          r=Path("output/bruegel_1559_critico_immersivo_v2")
          m=json.loads((r/"VERIFICA_QA.json").read_text())
          f=r/m["video"]
          assert m["full_decode"]=="PASS" and m["resolution"]==[1080,1920]
          assert m["voice_engine"]=="Supertonic 3 Italian M3 open weights"
          assert m["published"] is False and m["artistically_approved"] is False
          assert f.stat().st_size==m["bytes"] and hashlib.sha256(f.read_bytes()).hexdigest()==m["sha256"]
          subprocess.run(["ffmpeg","-v","error","-xerror","-i",str(f),"-f","null","-"],check=True)
          with zipfile.ZipFile(r/"BRUEGEL_1559_CRITICO_IMMERSIVO_V2_CONSEGNA.zip") as z:
            assert z.testzip() is None
          print("REAL MASTER VERIFIED",m["video"],m["bytes"],m["duration_seconds"])
          PY
      - name: Deliver MP4 and downloadable complete Android package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BRUEGEL_1559_IMMERSIVE_CRITIC_OPEN_VOICE_REAL_MP4
          path: |
            output/bruegel_1559_critico_immersivo_v2/*.mp4
            output/bruegel_1559_critico_immersivo_v2/*.zip
            output/bruegel_1559_critico_immersivo_v2/COPERTINA.jpg
            output/bruegel_1559_critico_immersivo_v2/VOCE_ITALIANA_NATURALE.wav
            output/bruegel_1559_critico_immersivo_v2/*.srt
            output/bruegel_1559_critico_immersivo_v2/*.txt
            output/bruegel_1559_critico_immersivo_v2/VERIFICA_QA.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve generated voice bytes on failure without regenerating
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BRUEGEL_V2_OPEN_VOICE_RECOVERY
          path: |
            output/bruegel_1559_critico_immersivo_v2/build/VOCE.wav
            output/bruegel_1559_critico_immersivo_v2/build/VOICE_CHAPTER_RANGES.json
            output/bruegel_1559_critico_immersivo_v2/build/ORIGINAL_ARTWORK_AUTHENTIC.jpg
          if-no-files-found: warn
          retention-days: 10
