name: Canterville - authentic Goldsmith illustrated assets
on:
  pull_request:
    paths:
      - experiments/canterville_20261027/acquire_goldsmith.py
      - .github/workflows/canterville-goldsmith.yml
permissions:
  contents: read
jobs:
  assets:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pillow>=10,<13"
      - name: Acquire the original book illustrations
        run: python experiments/canterville_20261027/acquire_goldsmith.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CANTERVILLE_GOLDSMITH_1906_ARTWORK
          path: output/canterville-illustrations/
          retention-days: 14
          if-no-files-found: warn
