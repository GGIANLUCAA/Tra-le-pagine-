name: "La Storia Rivive V277 · REAL V98 Finegrain I2I on Delhi (free)"
on:
  push:
    branches: [storia-v196-v101-cache-fail-closed-20261101]
    paths:
      - ".github/workflows/storia-rivive-v277-delhi-finegrain.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: storia-v277-delhi-v98-finegrain-once-${{ github.sha }}
  cancel-in-progress: false
jobs:
  same_model_as_v98_one_source_locked_photo:
    if: github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - name: "Gate: one free Finegrain restoration only from a verified 1910 frame"
        id: gate
        shell: bash
        env:
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin "$HEAD"
          if [[ "$(git log -1 --format=%s "$HEAD")" == 'storia V277: retry Finegrain after source-manifest field fix [V277-ONCE-2]' ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.allowed == 'true'
        with:
          python-version: '3.11'
      - name: Install image tools and free Gradio Space client, not paid API
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          python -m pip install -q 'Pillow>=10,<13' 'gradio_client>=1.3,<2'
      - name: Real-source/identity tests before any external inference
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python -m py_compile src/storia_rivive_v277_delhi_finegrain_v98_method.py
          python -m unittest discover -s tests -p 'test_storia_rivive_v277_delhi_finegrain.py' -v
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.allowed == 'true'
        with:
          name: storia-v273-delhi-one-real-I2I-ARTISTIC-QA-NOT-FINAL
          run-id: 41790131206
          github-token: ${{ github.token }}
          path: output/v277/previous
      - name: Verify exactly the prior REAL Delhi photo and original source crop bytes
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          echo 'ff6190681d97d306e27c7d77ad5716dc0a5854382c0b96f965ea7c9bb2a5aca3  output/v277/previous/DELHI_1910_SHOT03_ONE_TRUE_I2I_CANDIDATE_NOT_FINAL.png' | sha256sum -c -
          echo '816e1555d547e5df8170b242d6ce0ec59c9e8518f2402588d3da902875320add  output/v277/previous/V273_ACTUAL_DELHI_ORIGINAL_CROP.png' | sha256sum -c -
          python src/storia_rivive_v277_delhi_finegrain_v98_method.py \
            --source-crop output/v277/previous/V273_ACTUAL_DELHI_ORIGINAL_CROP.png \
            --base output/v277/previous/DELHI_1910_SHOT03_ONE_TRUE_I2I_CANDIDATE_NOT_FINAL.png \
            --prior-manifest output/v277/previous/DELHI_V273_REAL_I2I_TRIAL_NOT_FINAL.json \
            --out output/v277/photo --offline
      - name: "ONE exact V98 Finegrain I2I call via free Hugging Face ZeroGPU"
        if: steps.gate.outputs.allowed == 'true'
        id: restore
        continue-on-error: true
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          timeout 1500s python -u src/storia_rivive_v277_delhi_finegrain_v98_method.py \
            --source-crop output/v277/previous/V273_ACTUAL_DELHI_ORIGINAL_CROP.png \
            --base output/v277/previous/DELHI_1910_SHOT03_ONE_TRUE_I2I_CANDIDATE_NOT_FINAL.png \
            --prior-manifest output/v277/previous/DELHI_V273_REAL_I2I_TRIAL_NOT_FINAL.json \
            --out output/v277/photo
      - name: Check actual photo SHA and identity, never mark it a finished video
        if: always() && steps.gate.outputs.allowed == 'true'
        env:
          INFERENCE: ${{ steps.restore.outcome }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from PIL import Image
          p=Path('output/v277/photo')
          rp=p/'V277_FINEGRAIN_REAL_I2I_QA_NOT_FINAL.json'
          r=json.loads(rp.read_text()) if rp.is_file() else {}
          photo=p/'DELHI_1910_V277_FINEGRAIN_V98_METHOD_REAL_I2I_NOT_APPROVED.jpg'
          ok=(os.environ.get('INFERENCE')=='success' and photo.is_file()
              and r.get('photo_generated') is True
              and r.get('provider_calls_attempted')==1
              and r.get('real_photo_sha256')==hashlib.sha256(photo.read_bytes()).hexdigest()
              and r.get('geometric_preflight_passed') is True
              and r.get('non_monochrome_preflight_passed') is True
              and r.get('vidu_count')==0 and r.get('vidu_credits_spent')==0
              and r.get('artistic_approval') is False
              and r.get('italian_rights_verified') is False
              and r.get('new_final_episodes_delivered')==0)
          if ok:
            with Image.open(photo) as img:
              ok=img.format=='JPEG' and img.size==(720,1280)
          print('V277_V98_FINEGRAIN_REAL_PHOTO_NEEDS_VISUAL_QA',ok,'FINAL_0_OF_4')
          if not ok:raise SystemExit('V277_NO_VALID_V98_QUALITY_PHOTO_YET')
          PY
      - name: Preserve true photo/side-by-side or quota error for QA only
        if: always() && steps.gate.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storia-v277-delhi-genuine-Finegrain-V98-method-NOT-FINAL
          retention-days: 14
          if-no-files-found: warn
          path: output/v277/photo/
