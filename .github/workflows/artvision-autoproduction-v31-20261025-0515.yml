name: "ArtVision V31 • Vrubel • The Demon Seated • 05:15"
on:
  push:
    branches: [main]
    paths:
      - "scripts/artvision_autoproduction_20261025_0515.py"
      - "config/artvision_autoproduction_20261025_0515.json"
      - ".github/workflows/artvision-autoproduction-v31-20261025-0515.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: artvision-v31-20261025-0515
  cancel-in-progress: false
jobs:
  artvision:
    name: "Tretyakov Vrubel original • V6 Cinema • researched V28 captions"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing free rendering tools
        run: |
          set -euo pipefail
          command -v ffmpeg || sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<14" "numpy>=1.26,<3" "requests>=2.31,<3"
      - name: Preflight V25/V28/V31
        id: preflight
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_autoproduction_20261025_0515.py
          python scripts/artvision_autoproduction_20261025_0515.py --painting vrubel_demon_seated_20261025_0515 --preflight-only
      - name: Render genuine Vrubel 1890 work with licensed recording and V6 opening
        id: render
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python scripts/artvision_autoproduction_20261025_0515.py --painting vrubel_demon_seated_20261025_0515 --out output/artvision-v31-vrubel
      - name: Full MP4 decode and complete ZIP validation
        id: verify
        run: |
          set -euo pipefail
          folder="output/artvision-v31-vrubel/vrubel_demon_seated_20261025_0515"
          film="$folder/VIDEO_MASTER.mp4"
          archive="output/artvision-v31-vrubel/ARTVISION_V30_VRUBEL_DEMON_SEATED_20261025_0515_COMPLETE.zip"
          test -s "$film" && test -s "$archive" && test -s "$folder/COPERTINA.jpg"
          ffmpeg -hide_banner -loglevel error -xerror -i "$film" -f null -
          python src/artvision_editorial_post_v28.py --validate-folder "$folder"
          python - "$film" "$archive" "$folder" <<'PY'
          import json,sys,subprocess,zipfile,pathlib,hashlib
          film,archive,folder=sys.argv[1:]
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size','-show_entries','stream=codec_type,codec_name,width,height,r_frame_rate','-of','json',film]))
          duration=float(meta['format']['duration'])
          assert 45<=duration<=120,duration
          assert any(s.get('codec_type')=='video' and s.get('codec_name')=='h264' and s.get('width')==1080 and s.get('height')==1920 for s in meta['streams'])
          assert any(s.get('codec_type')=='audio' and s.get('codec_name')=='aac' for s in meta['streams'])
          required={'VIDEO_MASTER.mp4','COPERTINA.jpg','POST_FACEBOOK.txt','POST_INSTAGRAM.txt','POST_TIKTOK.txt','POST_YOUTUBE.txt','POST_EDITORIAL_RESEARCH.json','VIDEO_RECIPE_V13.json','TECNICHE_REGIA.md','ISTRUZIONI_REPLICA.md','SOURCES_AND_RIGHTS.md','MUSIC_RELEASE_V20.json','TECHNICAL_QA_V30.json','QA_CONTACT_SHEET.jpg','ORIGINAL_ARTWORK.jpg','ORIGINAL_LICENSED_MUSIC.mp3'}
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert required<=set(z.namelist()),required-set(z.namelist())
          f=pathlib.Path(folder)/'TECHNICAL_QA_V31.json'
          qa={"schema":"artvision-technical-qa-v31","status":"technical_pass_not_gold_master","duration_seconds":duration,"codec_video":"h264","codec_audio":"aac","width":1080,"height":1920,"full_ffmpeg_decode":True,"source":"Tretyakov Gallery / Wikimedia Commons PD-Art","recording":"Dark Times — Kevin MacLeod, CC BY 4.0","no_cross_scene_alpha":True,"opening_samples":[0,1,3,5,7],"v28_posts_validated":True,"approval":"human_artistic_review_pending","social_published":False,"sha256_mp4":hashlib.sha256(pathlib.Path(film).read_bytes()).hexdigest()}
          f.write_text(json.dumps(qa,indent=2)+'\n',encoding='utf8')
          (pathlib.Path(folder)/'ARTISTIC_REVIEW_V31.md').write_text('# Artistic review\n\nFull technical decode and sampled stills pass. Human full-speed evaluation is still pending. One opaque painting per frame; no transparent crossfades. Not a Gold Master. No social publication.\n',encoding='utf8')
          with zipfile.ZipFile(archive,'a',compression=zipfile.ZIP_DEFLATED) as z:
              z.write(f,f.name)
              z.write(pathlib.Path(folder)/'ARTISTIC_REVIEW_V31.md','ARTISTIC_REVIEW_V31.md')
          with zipfile.ZipFile(archive) as z: assert z.testzip() is None
          print('REAL_VRUBEL_MASTER_VERIFIED',duration,meta['format']['size'])
          PY
      - name: Archive real video, cover, four posts and reproducible ZIP
        if: always()
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: ArtVision-V31-20261025-Vrubel-The-Demon-Seated
          path: |
            output/artvision-v31-vrubel/vrubel_demon_seated_20261025_0515/VIDEO_MASTER.mp4
            output/artvision-v31-vrubel/vrubel_demon_seated_20261025_0515/COPERTINA.jpg
            output/artvision-v31-vrubel/vrubel_demon_seated_20261025_0515/QA_CONTACT_SHEET.jpg
            output/artvision-v31-vrubel/vrubel_demon_seated_20261025_0515/POST_FACEBOOK.txt
            output/artvision-v31-vrubel/vrubel_demon_seated_20261025_0515/POST_INSTAGRAM.txt
            output/artvision-v31-vrubel/vrubel_demon_seated_20261025_0515/POST_TIKTOK.txt
            output/artvision-v31-vrubel/vrubel_demon_seated_20261025_0515/POST_YOUTUBE.txt
            output/artvision-v31-vrubel/ARTVISION_V30_VRUBEL_DEMON_SEATED_20261025_0515_COMPLETE.zip
          if-no-files-found: warn
          retention-days: 60
      - name: Register only the real verified outcome in V31 state
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          RENDER: ${{ steps.render.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const path='queue/artvision_autoproduction_v31_state.json';
            const folder='output/artvision-v31-vrubel/vrubel_demon_seated_20261025_0515';
            const film=folder+'/VIDEO_MASTER.mp4',qaFile=folder+'/TECHNICAL_QA_V31.json';
            const ok=['PREFLIGHT','RENDER','VERIFY','ARCHIVE'].every(k=>process.env[k]==='success');
            let qa=null;try{qa=JSON.parse(fs.readFileSync(qaFile,'utf8'))}catch(e){}
            const exists=fs.existsSync(film);
            const event={cycle_id:'20261025T0515+0100',created_at:new Date().toISOString(),
              artist:'Mikhail Vrubel',work:'The Demon Seated',format:'artvision_cinema',baseline:'cinema_v6',
              reason_fallback:'Gacrux newly available for Holbein only; avoid unapproved new paid/free-tier-unknown API calls and do not reuse mismatched voice',
              status:ok?'technical_pass_not_gold_master':'blocked_or_rendered_needs_review',
              mp4_verified:ok&&exists,duration_seconds:ok?qa?.duration_seconds:null,
              size_bytes:exists?fs.statSync(film).size:null,
              sha256_mp4:exists?crypto.createHash('sha256').update(fs.readFileSync(film)).digest('hex'):null,
              workflow_run_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              artifact_name:'ArtVision-V31-20261025-Vrubel-The-Demon-Seated',
              steps:{preflight:process.env.PREFLIGHT,render:process.env.RENDER,verify:process.env.VERIFY,archive:process.env.ARCHIVE},
              gold_master_approved:false,social_published:false};
            for(let attempt=0;attempt<4;attempt++){
              const old=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
              const state=JSON.parse(Buffer.from(old.data.content,'base64').toString('utf8'));
              state.cycle_log=state.cycle_log||[];
              const i=state.cycle_log.findIndex(x=>x.cycle_id===event.cycle_id);
              if(i>=0)state.cycle_log[i]=event;else state.cycle_log.push(event);
              state.updated=new Date().toISOString();state.next_preferred_format='artvision_critico';
              try{
                await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,
                  message:'Record real V31 Vrubel production outcome, no fictional MP4',
                  content:Buffer.from(JSON.stringify(state,null,2)+'\n').toString('base64'),sha:old.data.sha,branch:'main'});
                break;
              }catch(e){if(attempt===3)throw e;await new Promise(r=>setTimeout(r,1500));}
            }
            core.summary.addHeading('ArtVision V31 — The Demon Seated')
              .addRaw(`Status: **${event.status}**. Verified duration: ${event.duration_seconds??'not measured'} seconds.\n\nNo social publication; artistic approval pending.`).write();
