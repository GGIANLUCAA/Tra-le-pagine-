name: "La Storia Rivive V90.3 - Paris 1900 verified color + safe one Vidu"
# One-off workflow intentionally disabled from automatic push triggers.
# Old Vidu task has already billed 16 credits; do not run again on each fix.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: storia-cleo-paris-1900-v90-single-paid-request
  cancel-in-progress: false
jobs:
  render:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VIDU_API_KEY: ${{ secrets.VIDUOK || secrets.VIDU_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real photo restoration and authentic media utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet "numpy>=1.26,<2.3" "opencv-python-headless>=4.9,<5" "pillow>=10,<13" "gradio_client>=1.9,<3" "onnxruntime>=1.18,<2" "huggingface_hub>=0.25,<2"
          python -m py_compile tools/storia_cleo_1900_v90_once.py
      - name: Retrieve three previously verified AI color photographs (no extra GPU quota)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/storia_cleo_1900_v90
          gh api -H "Accept: application/vnd.github+json" \
             "repos/$GITHUB_REPOSITORY/actions/artifacts/12932090029/zip" > /tmp/v90_verified_photos.zip
          unzip -jo /tmp/v90_verified_photos.zip 'COLOR_AI_0[1-3].jpg' -d output/storia_cleo_1900_v90/
          cd output/storia_cleo_1900_v90
          printf '%s\n' \
            '4f09b4a2cc5fc1191ef33b645347ed8db9de92072542531b79d0bd9c738a1e20  COLOR_AI_01.jpg' \
            '43fd3253c1d42ae3261d2690ba33f7832a72983eb023537f5e7a042bad453394  COLOR_AI_02.jpg' \
            'a781538c0754c4d1ac8f13055d0944a175c1f4d66b4d2f556025ac2ed8f7541d  COLOR_AI_03.jpg' | sha256sum -c -
      - name: Four archival BW/color stills plus ONE real moving Vidu scene (single bounded paid POST)
        run: python -u tools/storia_cleo_1900_v90_once.py
      - name: Preserve Android MP4 and QA privately, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PARIS_CLEO_1900_V90_NEW_HISTORY_VIDEO
          path: |
            output/storia_cleo_1900_v90/PARIS_1900_CLEO_DANCE_V90.mp4
            output/storia_cleo_1900_v90/PARIS_1900_CLEO_V90_ANDROID.zip
            output/storia_cleo_1900_v90/COVER.jpg
            output/storia_cleo_1900_v90/QA_SOURCES_RIGHTS.json
            output/storia_cleo_1900_v90/POST_*.txt
            output/storia_cleo_1900_v90/COLOR_AI_*.jpg
            output/storia_cleo_1900_v90/ARCHIVE_FRAME_*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Fail closed on artistic identity, pacing, Vidu continuity and release quality
        if: success()
        run: python src/storia_rivive_final_gate_v91.py --video output/storia_cleo_1900_v90/PARIS_1900_CLEO_DANCE_V90.mp4 --manifest output/storia_cleo_1900_v90/QA_SOURCES_RIGHTS.json
      - name: Create direct-download GitHub prerelease only after passed artistic V91 gate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd output/storia_cleo_1900_v90
          tag="la-storia-rivive-cleo-1900-v90-ai-photo-vidu-test"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release; refusing overwrite or duplicate"
            exit 0
          fi
          gh release create "$tag" PARIS_1900_CLEO_DANCE_V90.mp4 PARIS_1900_CLEO_V90_ANDROID.zip COVER.jpg QA_SOURCES_RIGHTS.json POST_*.txt \
            --title "Paris 1900 - Cleo de Merode - historical restoration + Vidu V90" \
            --notes "Archive: Danse javanaise (1900), Wikimedia Commons/PDM. Four source-anchored AI photographs + one 5s Vidu moving insert. Color, microdetails and AI motion are reconstructions, not original historical evidence. Technically complete preview subject to artistic review. No social autopublishing." \
            --repo "$GITHUB_REPOSITORY" --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name'
