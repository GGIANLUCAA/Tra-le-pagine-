name: Video Library - Private R2 staging PR safety checks
on:
  pull_request:
    paths:
      - 'site/video-library-importer-with-editorial.js'
      - 'tests/video-library-private-ingest.test.cjs'
      - 'tests/video-library-importer-v55.test.cjs'
      - '.github/workflows/video-library-private-owner-archive.yml'
      - 'src/video_library_private_auto_reconcile.py'
      - 'tests/test_video_library_private_reconcile.py'
      - '.github/workflows/video-library-private-ingest-pr-check.yml'

permissions:
  contents: read

concurrency:
  group: vls-private-ingest-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-private-archive-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check private import Worker
        run: node --check site/video-library-importer-with-editorial.js
      - name: Verify private storage isolated from public site
        run: node tests/video-library-private-ingest.test.cjs
      - name: Preserve existing V55 importer behavior
        run: node tests/video-library-importer-v55.test.cjs
      - name: Verify artifact selection, owner-private hash and routes
        run: |
          python3 -m pip -q install requests
          python3 -m unittest discover -s tests -p 'test_video_library_private_reconcile.py' -v
          python3 -m py_compile src/video_library_private_auto_reconcile.py
