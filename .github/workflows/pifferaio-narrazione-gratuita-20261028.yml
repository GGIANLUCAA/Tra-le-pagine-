name: "Tra le Pagine — Pifferaio narrazione gratuita, solo voce"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pifferaio-narrazione-gratuita-20261028.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pifferaio-hamelin-voice-only-20261028
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies — no paid model or secret used
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet "edge-tts>=7,<9"
      - name: Narrate Italian story, keep exact paragraph timing
        run: |
          python - <<'PY'
          import asyncio,subprocess,json,wave,array,hashlib
          from pathlib import Path
          import edge_tts
          src=Path("episodes/pifferaio_hamelin_20261028/testo.txt")
          paras=[p.strip() for p in src.read_text(encoding="utf8").split("\n\n") if p.strip()]
          assert len(paras)==16,len(paras)
          out=Path("output/pifferaio_voce");out.mkdir(parents=True,exist_ok=True)
          SR=24000;gap=int(SR*.28);allframes=array.array('h');timing=[]
          async def make(i,txt):
              mp3=out/f"scene_{i:02d}.mp3"
              comm=edge_tts.Communicate(text=txt,voice="it-IT-DiegoNeural",rate="-6%",pitch="-2Hz")
              await comm.save(str(mp3))
              assert mp3.stat().st_size>3000,("no voice",i)
              pcm=subprocess.check_output(["ffmpeg","-hide_banner","-loglevel","error","-i",str(mp3),
                 "-ar",str(SR),"-ac","1","-f","s16le","-"])
              a=array.array('h');a.frombytes(pcm)
              if len(a)<SR*3: raise RuntimeError("short narration segment "+str(i))
              return a
          async def main():
              for i,p in enumerate(paras,1):
                  audio=await make(i,p)
                  start=len(allframes)/SR
                  allframes.extend(audio)
                  end=len(allframes)/SR
                  timing.append({"scene":i,"start":round(start,3),"end":round(end,3),"text":p})
                  if i<16:allframes.extend(array.array('h',[0])*gap)
                  print("SEGMENT",i,"start",round(start,2),"end",round(end,2),flush=True)
          asyncio.run(main())
          with wave.open(str(out/"VOCE.wav"),"wb") as f:
              f.setnchannels(1);f.setsampwidth(2);f.setframerate(SR);f.writeframes(allframes.tobytes())
          sec=len(allframes)/SR
          if not 105<=sec<=285:raise RuntimeError("Unusual duration "+str(sec))
          subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(out/"VOCE.wav"),
             "-codec:a","libmp3lame","-b:a","160k",str(out/"VOCE.mp3")],check=True)
          (out/"SCENE_TIMING.json").write_text(json.dumps({
             "voice":"Microsoft Edge Neural Diego it-IT","provider":"Edge Neural via edge-tts, NO Google Gacrux",
             "fee_eur":0,"video_api_paid_calls":0,"seconds":round(sec,3),
             "scenes":timing},ensure_ascii=False,indent=2),encoding="utf8")
          (out/"COPIONE.txt").write_text(src.read_text(encoding="utf8"),encoding="utf8")
          print("VOICE_READY",round(sec,2),"s SHA256",hashlib.sha256((out/"VOCE.wav").read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PIFFERAIO_VOCE_ITALIANA_GRATUITA_ALTERNATIVA_NON_GACRUX
          path: output/pifferaio_voce/
          retention-days: 14
          if-no-files-found: error
