name: "La Storia Rivive V257 · one TRUE I2I from THIRD Fiesole archival frame (CPU)"
on:
  pull_request:
    paths:
      - ".github/workflows/storia-rivive-v257-fiesole-original-hands-cpu-i2i.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: storia-v257-third-shot-instructpix2pix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one_real_source_anchored_cpu_photo:
    if: github.event_name == 'pull_request' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - name: One single V257 source-bound attempt; never replay automatically
        id: gate
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin "$HEAD"
          if [[ "$(git log -1 --format=%s "$HEAD")" == 'storia V257: run third real Fiesole frame I2I once [V257-ONCE]' ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'V257_DUPLICATE_CPU_GENERATION_BLOCKED'
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.allowed == 'true'
        with:
          python-version: '3.11'
      - name: Install CPU torch and InstructPix2Pix MIT model runtime, NO PAID API
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install -q 'diffusers==0.32.2' 'transformers==4.44.2' 'accelerate==1.2.1' 'huggingface_hub>=0.23,<1' 'safetensors>=0.4' 'Pillow>=10,<13' 'numpy>=1.26,<2'
      - name: Real-source SHA and fail-closed regressions
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python -m py_compile src/storia_rivive_v257_fiesole_third_source_i2i.py
          python -m unittest discover -s tests -p 'test_storia_rivive_v257_fiesole_third_source_i2i.py' -v
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.allowed == 'true'
        with:
          name: storia-v251-fiesole-real-I2I-photo-inputs-NOT-FINAL
          run-id: 41635322340
          github-token: ${{ github.token }}
          path: output/v257/V251_VERIFIED
      - name: Retrieve the EXACT original historical film frame, not the V257 hallucination
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/v257/original
          unzip -oq output/v257/V251_VERIFIED/FIESOLE_V251_FIVE_AUTHENTIC_SOURCE_FRAMES_NOT_FINAL.zip -d output/v257/original
          echo 'e2bdfc9ece63e4f66e4ddf62c438551e4cbf72badd013e1b774ed5be4a9bb8ee  output/v257/original/original_shot_03_frame_06.png' | sha256sum -c -
          python src/storia_rivive_v257_fiesole_third_source_i2i.py \
            --source output/v257/original/original_shot_03_frame_06.png --out output/v257/photo --offline
      - name: One instruction-guided CPU diffusion I2I, stronger source geometry, zero credits
        id: generation
        if: steps.gate.outputs.allowed == 'true'
        continue-on-error: true
        shell: bash
        env:
          HF_TOKEN: ''
          HUGGING_FACE_HUB_TOKEN: ''
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          set -euo pipefail
          timeout 2100s python -u src/storia_rivive_v257_fiesole_third_source_i2i.py \
            --source output/v257/original/original_shot_03_frame_06.png --out output/v257/photo
      - name: On actual generated bytes, block fake finish and any publication
        if: always() && steps.gate.outputs.allowed == 'true'
        shell: bash
        env:
          ACTUAL_STEP_RESULT: ${{ steps.generation.outcome }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('output/v257/photo')
          r=p/'V257_SOURCE_LOCKED_I2I_QA.json'
          qa=json.loads(r.read_text()) if r.is_file() else {}
          photo=p/'V257_ONE_TRUE_DIFFUSION_I2I_NOT_APPROVED.png'
          okay=(os.environ.get('ACTUAL_STEP_RESULT')=='success'
            and photo.is_file() and qa.get('generated_sha256')==hashlib.sha256(photo.read_bytes()).hexdigest()
            and qa.get('actual_generated_photos')==1
            and qa.get('real_vidu_clips')==0)
          if not okay:qa.update(status='V257_NO_VERIFIED_GENERATIVE_PHOTO',actual_generated_photos=0)
          qa.update(new_final_episodes_delivered=0,artistic_approval=False,
                    publish_allowed=False,paid_credits_spent=0,italian_rights_verified=False)
          p.mkdir(parents=True,exist_ok=True)
          r.write_text(json.dumps(qa,indent=2)+'\n')
          print('V257_REAL_PHOTO_VERIFIED',okay,'NEW_FINAL_0_OF_4')
          if not okay:raise SystemExit('NO_REAL_IMAGE_DO_NOT_COUNT_AS_FINISHED_VIDEO')
          PY
      - name: Archive genuine image candidate or failure report ONLY for visual QA
        if: always() && steps.gate.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storia-v257-third-source-Fiesole-real-CPU-I2I-NOT-FINAL
          retention-days: 14
          if-no-files-found: warn
          path: output/v257/photo/
