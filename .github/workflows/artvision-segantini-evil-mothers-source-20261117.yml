name: "ArtVision | Segantini Evil Mothers | Exact Belvedere 485 source and Music20"
on:
  push:
    branches: [production/artvision-segantini-evil-mothers-20261117]
    paths:
      - ".github/workflows/artvision-segantini-evil-mothers-source-20261117.yml"
permissions:
  contents: read
jobs:
  source_acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strict queue identity and anti-duplicate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          q=json.loads(pathlib.Path("queue/artvision_new_series_20261114.json").read_text())
          w=[x for x in q["works"] if x["artist"]=="Giovanni Segantini" and x["title"]=="Le cattive madri (The Evil Mothers)"]
          assert len(w)==1
          assert not list(pathlib.Path("queue").glob("*checkpoint*segantini*"))
          archive=json.loads(pathlib.Path("data/archivio-generale/opere.json").read_text())
          matches=[x for x in archive.get("works",[]) if "segantini" in x.get("artist","").lower() and ("cattive" in x.get("title","").lower() or "evil mothers" in x.get("title","").lower())]
          assert all(x.get("variants",{}).get("cinema_standard",{}).get("state")!="render_documentato" for x in matches)
          music=json.loads(pathlib.Path("config/artvision_music_20_v1.json").read_text())
          assert len([t for t in music["tracks"] if t["id"]=="evening_fall_piano" and t["license"]=="CC BY 4.0"])==1
          print("SEGANTINI_1894_BELVEDERE_485_UNRENDERED_SLOT_AND_MUSIC20_CONFIRMED")
          PY
      - name: Download and verify exact painting, reproduce rights evidence, real music
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/segantini_source
          python - <<'PY'
          import urllib.request,hashlib,pathlib,json,io
          from PIL import Image
          PY
        continue-on-error: true
      - name: Download source bytes and music, verify hash + dimensions with Pillow and FFprobe
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install "Pillow>=10,<13"
          if ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python - <<'PY'
          import urllib.request,hashlib,pathlib,json,io,subprocess
          from PIL import Image
          out=pathlib.Path("output/segantini_source");out.mkdir(parents=True,exist_ok=True)
          painting="https://upload.wikimedia.org/wikipedia/commons/a/ad/Giovanni_Segantini_-_Die_b%C3%B6sen_M%C3%BCtter_-_485_-_%C3%96sterreichische_Galerie_Belvedere.jpg"
          music="https://incompetech.com/music/royalty-free/mp3-royaltyfree/Evening%20Fall%20-%20Piano.mp3"
          def fetch(url,limit):
           request=urllib.request.Request(url,headers={"User-Agent":"ArtVision/1.0 (source proof and private art review)"})
           with urllib.request.urlopen(request,timeout=80) as r:
            b=r.read(limit+1)
           assert 300000<len(b)<=limit,f"UNEXPECTED_BINARY_SIZE_{len(b)}"
           return b
          img=fetch(painting,20_000_000)
          assert hashlib.sha1(img).hexdigest()=="2ddc44385c2e3d081b33e68c609f9b602837b0c8", "WRONG_SOURCE_IMAGE_SHA1"
          with Image.open(io.BytesIO(img)) as im:
           assert im.format=="JPEG" and im.size==(3508,1820),f"WRONG_PAINTING_PIXELS_FORMAT {im.format} {im.size}"
           im.verify()
          p=out/"SEGANTINI_BELVEDERE_485_ORIGINAL.jpg";p.write_bytes(img)
          wav=fetch(music,30_000_000)
          m=out/"Evening_Fall_Piano_Kevin_MacLeod.mp3";m.write_bytes(wav)
          meta=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(m)]))
          aud=[x for x in meta["streams"] if x.get("codec_type")=="audio"]
          assert aud and aud[0]["codec_name"]=="mp3" and float(meta["format"]["duration"])>65
          report={
           "title":"The Evil Mothers / Le cattive madri", "artist":"Giovanni Segantini",
           "year":1894,"museum":"Belvedere, Vienna, Austria","museum_object":"485","museum_object_id":"6224",
           "source_url":painting,"source_image_page":"https://commons.wikimedia.org/wiki/File:Giovanni_Segantini_-_Die_b%C3%B6sen_M%C3%BCtter_-_485_-_%C3%96sterreichische_Galerie_Belvedere.jpg",
           "source_pixels":[3508,1820],"source_sha1":hashlib.sha1(img).hexdigest(),"source_sha256":hashlib.sha256(img).hexdigest(),
           "image_license":"faithful public-domain artwork reproduction; Wikimedia file CC BY-SA 4.0 conditions and attribution, source metadata and changed crop must be preserved",
           "museum_open_content_policy":"https://sammlung.belvedere.at/opencontent/images",
           "music":"Evening Fall (Piano) by Kevin MacLeod",
           "music_sha256":hashlib.sha256(wav).hexdigest(),
           "music_url":music,"music_license":"CC BY 4.0",
           "music_duration_s":float(meta["format"]["duration"]),
           "purpose":"One new private Cinema Standard for queued original work; no TTS, no publish, no Gold"
          }
          (out/"SOURCE_MUSIC_RIGHTS_PROOF.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print("SEGANTINI_SOURCE_SHA256="+report["source_sha256"])
          print("SEGANTINI_MUSIC_SHA256="+report["music_sha256"])
          print("SEGANTINI_SOURCE_RIGHTS_AND_REAL_MUSIC_PASS",flush=True)
          PY
      - name: Upload verified raw artwork and music to render pipeline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_SEGANTINI_EVIL_MOTHERS_1894_SOURCE_MUSIC
          retention-days: 30
          if-no-files-found: error
          path: output/segantini_source/
