name: ArtVision V150 · Bruegel Triumph of Death Cinema genuine source
on:
  push:
    branches: [main]
    paths:
      - requests/artvision/bruegel-triumph-cinema-v150.json
permissions:
  contents: read
concurrency:
  group: artvision-owner-bruegel-triumph-cinema-v150-once
  cancel-in-progress: false
jobs:
  cinema_review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact-sourced renderer before starting
        run: python -m py_compile src/artvision_bruegel_triumph_cinema_v150.py
      - name: Verify exact authorized selected work
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("requests/artvision/bruegel-triumph-cinema-v150.json").read_text())
          q=json.loads(Path("queue/artvision_owner_selected_ten_20261102.json").read_text())
          assert r["work_id"]=="bruegel_triumph_death_1562_prado_p001393"
          assert r["owner_automation_id"]=="6adca191603c8191a90d5190901cd034"
          assert r["run_once_only"] is True
          assert r["variant"]=="cinema_standard" and r["public_title"]=="The Triumph of Death"
          assert not r["allow_paid_calls"] and not r["social_publish"] and not r["gold_v25"]
          assert any(w["id"]==r["work_id"] and w["slots_delivered_this_selection"]==0 for w in q["works"])
          PY
      - name: Install no-paid runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless imageio-ffmpeg
          mkdir -p /tmp/artvision-bin
          python - <<'PY'
          from imageio_ffmpeg import get_ffmpeg_exe
          from pathlib import Path
          src=Path(get_ffmpeg_exe())
          assert src.is_file()
          Path("/tmp/artvision-bin/ffmpeg").symlink_to(src)
          PY
          echo "/tmp/artvision-bin" >> "$GITHUB_PATH"
          /tmp/artvision-bin/ffmpeg -version | head -1
      - name: Render only one MP4 candidate
        run: python src/artvision_bruegel_triumph_cinema_v150.py --output /tmp/triumph_v150
      - name: Validate physical MP4 and SHA
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("/tmp/triumph_v150")
          q=json.loads((p/"QA_V150.json").read_text())
          f=p/q["mp4"]["filename"]
          assert f.is_file() and f.stat().st_size>100000
          assert hashlib.sha256(f.read_bytes()).hexdigest()==q["mp4"]["sha256"]
          assert q["mp4"]["full_ffmpeg_decode"]=="PASS"
          assert q["mp4"]["frames"]==960 and q["mp4"]["duration_seconds"]==48
          assert q["gold_v25"] is False and q["social_published"] is False
          assert (p/"BRUEGEL_TRIUMPH_DEATH_CINEMA_V150_REVIEW_PACKAGE.zip").is_file()
          print("VERIFIED",q["mp4"]["sha256"],f.stat().st_size)
          PY
      - name: Save real MP4 and package for readback
        uses: actions/upload-artifact@v4
        with:
          name: BRUEGEL_TRIUMPH_DEATH_V150_CINEMA_REVIEW_MP4
          path: |
            /tmp/triumph_v150/BRUEGEL_THE_TRIUMPH_OF_DEATH_CINEMA_V150_REVIEW.mp4
            /tmp/triumph_v150/BRUEGEL_TRIUMPH_DEATH_CINEMA_V150_REVIEW_PACKAGE.zip
            /tmp/triumph_v150/QA_V150.json
            /tmp/triumph_v150/COVER.jpg
            /tmp/triumph_v150/CONTACT_SHEET_V150.jpg
          if-no-files-found: error
          retention-days: 30
