name: "GIULIANO Anticitera · G0DM0D3 director, research and editorial gates"
on:
  push:
    branches: ["feature/giuliano-antikythera-g0dm0d3-director-20261112"]
    paths:
      - "research/giuliano_antikythera_v1/**"
      - "src/giuliano_antikythera_preflight_v1.py"
      - "src/giuliano_antikythera_sources_v1.py"
      - "tests/test_giuliano_antikythera_preflight_v1.py"
      - ".github/workflows/giuliano-antikythera-g0dm0d3-director.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: giuliano-antikythera-director-${{ github.ref }}
  cancel-in-progress: true
jobs:
  director:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      AI_DIRECTOR_ALLOW_FREE_CALLS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm no OpenRouter inference route approved
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('config/free_llm_zero_cost_v1.json'))
          assert p['schema']=='free-llm-zero-cost-v1'
          assert p['default_deny'] is True and p['routes']==[]
          print("G0DM0D3_COMPAT_ZERO_COST_DEFAULT_DENY_OK")
          PY
      - name: Tests — narrative alignment, rights, 4-second holds and publish safety
        run: |
          python -m py_compile src/giuliano_antikythera_preflight_v1.py
          python -m unittest discover -s tests -p 'test_giuliano_antikythera_preflight_v1.py' -v
      - name: Make compact G0DM0D3 editorial payload while preserving full source records
        run: |
          mkdir -p output/giuliano_antikythera
          python - <<'PY'
          import json,sys
          sys.path.insert(0,"src")
          from giuliano_antikythera_preflight_v1 import compact_for_director
          path="research/giuliano_antikythera_v1/BRIEF_AI_DIRECTOR.json"
          source=json.load(open(path,encoding="utf8"))
          data=compact_for_director(source)
          out="output/giuliano_antikythera/BRIEF_EDITORIAL_COMPACT.json"
          json.dump(data,open(out,"w",encoding="utf8"),ensure_ascii=False,indent=2)
          print("STORYBOARD_COMPACT",len(data["scenes"]),"all scenes maintained",flush=True)
          PY
      - name: AI Director V1 offline director/critic research prompts (no models)
        run: |
          python src/ai_director_v1.py --mode plan \
            --brief output/giuliano_antikythera/BRIEF_EDITORIAL_COMPACT.json \
            --out-dir output/giuliano_antikythera/director
      - name: AI Director V1 scene, narration, rights and pacing audit
        run: |
          python src/ai_director_v1.py --mode audit \
            --brief output/giuliano_antikythera/BRIEF_EDITORIAL_COMPACT.json \
            --out-dir output/giuliano_antikythera/audit
      - name: Independent pre-render scene/tempo QA and Android review pack
        run: |
          python src/giuliano_antikythera_preflight_v1.py \
            --brief research/giuliano_antikythera_v1/BRIEF_AI_DIRECTOR.json \
            --output-dir output/giuliano_antikythera/scene_contract
          cp research/giuliano_antikythera_v1/BRIEF_AI_DIRECTOR.json output/giuliano_antikythera/BRIEF_AI_DIRECTOR.json
      - name: Install image scout tools for real source quality control
        run: |
          python -m pip install --disable-pip-version-check -q 'Pillow>=10,<13'
          if ! command -v ffprobe >/dev/null 2>&1; then
            timeout 150 sudo apt-get update -qq
            timeout 150 sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -1
      - name: Acquire actual open licensed photos and silent 3D gear videos
        continue-on-error: true
        run: |
          python src/giuliano_antikythera_sources_v1.py --out-dir output/giuliano_antikythera/real_media
      - name: Upload licensed media source checks separately for Android review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GIULIANO_ANTIKYTHERA_MEDIA_SOURCE_SCOUT_REVIEW_ONLY
          path: output/giuliano_antikythera/real_media/
          if-no-files-found: ignore
          retention-days: 12
      - name: Upload real editorial deliverables — not an MP4 and not publication
        uses: actions/upload-artifact@v4
        with:
          name: GIULIANO_ANTIKYTHERA_G0DM0D3_DIRECTOR_ANDROID
          path: output/giuliano_antikythera/
          if-no-files-found: error
          retention-days: 20
