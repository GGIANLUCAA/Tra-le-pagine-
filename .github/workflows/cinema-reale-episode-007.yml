name: Cinema Reale 007 - Genuine NASA Hawaiian Volcano Collapse Film
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cinema-reale-episode-007.yml'
      - 'projects/cinema_reale/tools/render_episode_007.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg using runner system packages
        run: |
          sudo apt-get install -y -qq ffmpeg
      - name: Render USGS authentic volcanic collapse with original stereo score
        run: python projects/cinema_reale/tools/render_episode_007.py
      - name: Upload review MP4, cover, dossier and ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CINEMA_REALE_007_USGS_VOLCANO_MP4_ZIP_REVIEW
          path: |
            output/cinema_reale/episode_007/CINEMA_REALE_007_VOLCANO_COLLAPSE_REVIEW.mp4
            output/cinema_reale/episode_007/CINEMA_REALE_007_COMPLETE_REVIEW.zip
            output/cinema_reale/episode_007/cover_no_text.jpg
            output/cinema_reale/episode_007/qa_report.json
            output/cinema_reale/episode_007/SOURCES_AND_RIGHTS.txt
            output/cinema_reale/episode_007/SOCIAL_DESCRIPTION_DRAFT.txt
          retention-days: 14
          if-no-files-found: error
