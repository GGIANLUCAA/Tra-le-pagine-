name: "La Storia Rivive V121 | prova gratuita su pellicola storica reale (solo ricerca)"
on:
  pull_request:
    paths:
      - ".github/workflows/storia-v121-real-film-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storia-v121-one-real-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real_archival_source_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free video-analysis tools only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          python -m pip install -q "pillow>=10,<13"
      - name: Build unapproved work order for one exact Commons documentary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from src.storia_rivive_autopilot_v101 import build_work_order
          bank=json.loads(Path("queue/storia_rivive_candidates_v58.json").read_text(encoding="utf-8"))
          found=[x for x in bank["candidates"] if x["id"]=="france_cotton_mill_1920"]
          if len(found)!=1:
              raise SystemExit("Missing or duplicate historical candidate")
          profile=json.loads(Path("config/storia_rivive_autopilot_v101.json").read_text(encoding="utf-8"))
          order=build_work_order({"candidates":found},"2026-10-31T00:00:00Z",profile)
          if order["paid_api_call_permitted"] or order["publish_permitted"]:
              raise SystemExit("Unsafe source preflight permissions")
          path=Path("output/storia_v121_real/WORK_ORDER.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(order,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("REAL_ARCHIVAL_RESEARCH_ONLY",order["episode_id"],order["status"])
          PY
      - name: Download and inspect ONE real archive original, no AI APIs
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_scout_v101.py \
            --order output/storia_v121_real/WORK_ORDER.json \
            --out output/storia_v121_real/source
      - name: V122 rank actual source PNG frames for pre-freeze windows (no AI)
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_frame_rank_v101.py \
            --frames output/storia_v121_real/source/original_frames \
            --out output/storia_v121_real/FIVE_REAL_FILM_SOURCE_CANDIDATES_V122.json
      - name: V124 supplement twelve original frames from spaced authentic shot windows
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_adaptive_sampling_v124.py \
            --film output/storia_v121_real/source/ORIGINAL_ARCHIVE.webm \
            --scout output/storia_v121_real/source/SCOUT_REPORT.json \
            --out output/storia_v121_real/adaptive \
            --limit 48
      - name: V125 verify spatial B/W movement on SHA-bound real photo candidates
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v125_real_motion_audit.py \
            --film output/storia_v121_real/source/ORIGINAL_ARCHIVE.webm \
            --scout output/storia_v121_real/adaptive/SCOUT_REPORT.json \
            --rank output/storia_v121_real/adaptive/ADAPTIVE_RANK_V124.json \
            --out output/storia_v121_real/adaptive/REAL_BW_MOTION_V125.json
      - name: V126 propose five balanced motion candidates across minimum three original film regions
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v126_balanced_motion_review.py \
            --motion output/storia_v121_real/adaptive/REAL_BW_MOTION_V125.json \
            --rank output/storia_v121_real/adaptive/ADAPTIVE_RANK_V124.json \
            --scout output/storia_v121_real/adaptive/SCOUT_REPORT.json \
            --out output/storia_v121_real/adaptive/FIVE_MOVING_REVIEW_V126.json
      - name: V126b flag near-duplicate or low-detail original PNGs before artistic review
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v126_frame_diversity.py \
            --v125 output/storia_v121_real/adaptive/REAL_BW_MOTION_V125.json \
            --frames output/storia_v121_real/adaptive/original_frames \
            --scout output/storia_v121_real/adaptive/SCOUT_REPORT.json \
            --out output/storia_v121_real/adaptive/FRAME_DIVERSITY_V126.json
      - name: V128 audit balanced real PNGs and create a review-only five-frame contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v128_balanced_frame_review.py \
            --balanced output/storia_v121_real/adaptive/FIVE_MOVING_REVIEW_V126.json \
            --motion output/storia_v121_real/adaptive/REAL_BW_MOTION_V125.json \
            --scout output/storia_v121_real/adaptive/SCOUT_REPORT.json \
            --frames output/storia_v121_real/adaptive/original_frames \
            --out output/storia_v121_real/adaptive/BALANCED_VISUAL_REVIEW_V128.json \
            --contact output/storia_v121_real/adaptive/BALANCED_CONTACT_SHEET_V128.jpg
      - name: V129 show 3 actual B/W film motion samples before each candidate freeze (review only)
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v129_prefreeze_motion_strips.py \
            --film output/storia_v121_real/source/ORIGINAL_ARCHIVE.webm \
            --balanced output/storia_v121_real/adaptive/FIVE_MOVING_REVIEW_V126.json \
            --motion output/storia_v121_real/adaptive/REAL_BW_MOTION_V125.json \
            --scout output/storia_v121_real/adaptive/SCOUT_REPORT.json \
            --frames output/storia_v121_real/adaptive/original_frames \
            --out output/storia_v121_real/adaptive/PREFREEZE_MOTION_STRIPS_V129.json \
            --sheet output/storia_v121_real/adaptive/PREFREEZE_MOTION_STRIPS_V129.jpg
      - name: V131 apply SHA-bound editorial veto from real V130 visual review (no provider)
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v131_editorial_hold.py \
            --visual output/storia_v121_real/adaptive/BALANCED_VISUAL_REVIEW_V128.json \
            --motion output/storia_v121_real/adaptive/PREFREEZE_MOTION_STRIPS_V129.json \
            --vetoes config/storia_rivive_v131_reviewed_source_vetoes.json \
            --out output/storia_v121_real/adaptive/SOURCE_EDITORIAL_GATE_V131.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/storia_v121_real/adaptive/SOURCE_EDITORIAL_GATE_V131.json")
          report=json.loads(p.read_text(encoding="utf-8"))
          assert report["status"]=="SOURCE_ARTISTIC_REVIEW_HOLD", report["status"]
          assert {r["frame"] for r in report["source_review_vetoes"]}=={"frame_34.png","frame_48.png"}
          assert report["exact_native_freeze_pts_crosschecked"] is True
          assert report["prefreeze_proxy_frame_counts_crosschecked"] is True
          assert not any(report[k] for k in ("i2i_permitted","vidu_permitted","paid_api_call_permitted","publish_permitted"))
          print("V131_VERIFIED_COTTON_EDITORIAL_HOLD",report["status"])
          PY
      - name: V132 assess whether vetoed original shots can be replaced without paid APIs
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v132_veto_aware_alternatives.py \
            --motion output/storia_v121_real/adaptive/REAL_BW_MOTION_V125.json \
            --rank output/storia_v121_real/adaptive/ADAPTIVE_RANK_V124.json \
            --scout output/storia_v121_real/adaptive/SCOUT_REPORT.json \
            --vetoes config/storia_rivive_v131_reviewed_source_vetoes.json \
            --out output/storia_v121_real/adaptive/VETO_AWARE_ALTERNATIVES_V132.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/storia_v121_real/adaptive/VETO_AWARE_ALTERNATIVES_V132.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["source_film_sha256"]=="e3022cb130442f7695d411724ae619fc8c184696ddae30293958c1c75ec8ffd9"
          assert r["status"]=="SOURCE_REJECTED_V132_INSUFFICIENT_DIVERSITY_AFTER_VETO",r
          assert r["original_verified_motion_candidates"]==8,r
          assert r["verified_motion_candidates_after_veto"]==6,r
          assert r["timeline_regions_after_veto"]==[2,4],r
          assert r["alternative_five_frame_names"]==[],r
          assert not any(r[k] for k in ("i2i_permitted","vidu_permitted","paid_api_call_permitted","publish_permitted"))
          print("V132_REAL_SOURCE_REJECTED_AFTER_VETO",r["status"])
          PY
      - name: Record physical evidence, never label the result as approved
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("output/storia_v121_real")
          report=json.loads((root/"source"/"SCOUT_REPORT.json").read_text(encoding="utf-8"))
          source=root/"source"/"ORIGINAL_ARCHIVE.webm"
          adaptive_path=root/"adaptive"/"ADAPTIVE_STATUS_V124.json"
          adaptive=json.loads(adaptive_path.read_text(encoding="utf-8")) if adaptive_path.is_file() else {"status":"V124_NOT_RUN"}
          motion_path=root/"adaptive"/"REAL_BW_MOTION_V125.json"
          motion=json.loads(motion_path.read_text(encoding="utf-8")) if motion_path.is_file() else {"status":"V125_NOT_RUN"}
          diversity_path=root/"adaptive"/"FRAME_DIVERSITY_V126.json"
          diversity=json.loads(diversity_path.read_text(encoding="utf-8")) if diversity_path.is_file() else {"status":"V126_NOT_RUN"}
          balanced_path=root/"adaptive"/"FIVE_MOVING_REVIEW_V126.json"
          balanced=json.loads(balanced_path.read_text(encoding="utf-8")) if balanced_path.is_file() else {"status":"V126_BALANCED_NOT_RUN"}
          balanced_visual_path=root/"adaptive"/"BALANCED_VISUAL_REVIEW_V128.json"
          balanced_visual=json.loads(balanced_visual_path.read_text(encoding="utf-8")) if balanced_visual_path.is_file() else {"status":"V128_NOT_RUN"}
          motion_strips_path=root/"adaptive"/"PREFREEZE_MOTION_STRIPS_V129.json"
          motion_strips=json.loads(motion_strips_path.read_text(encoding="utf-8")) if motion_strips_path.is_file() else {"status":"V129_NOT_RUN"}
          editorial_path=root/"adaptive"/"SOURCE_EDITORIAL_GATE_V131.json"
          editorial=json.loads(editorial_path.read_text(encoding="utf-8")) if editorial_path.is_file() else {"status":"V131_NOT_RUN"}
          alternative_path=root/"adaptive"/"VETO_AWARE_ALTERNATIVES_V132.json"
          alternatives=json.loads(alternative_path.read_text(encoding="utf-8")) if alternative_path.is_file() else {"status":"V132_NOT_RUN"}


          rank_path=root/"FIVE_REAL_FILM_SOURCE_CANDIDATES_V122.json"
          rank=json.loads(rank_path.read_text(encoding="utf-8")) if rank_path.is_file() else {"status":"NO_FRAME_RANKING"}
          status={
              "episode_id":"france_cotton_mill_1920",
              "status":alternatives.get("status") if alternatives.get("status") in ("SOURCE_REJECTED_V132_INSUFFICIENT_DIVERSITY_AFTER_VETO","SOURCE_AUDIT_INVALID") else editorial.get("status",report.get("status","SOURCE_SCOUT_BLOCKED_NO_PRODUCTION")),
              "original_media_bytes_verified":bool(source.is_file() and report.get("original_sha256")),
              "original_video_sha256":report.get("original_sha256"),
              "original_raster_px":[report.get("original_width_px"),report.get("original_height_px")],
              "decoded_raster_verified":report.get("decoded_video_raster_verified",False),
              "source_frame_count":report.get("source_frames_extracted",0),
              "frame_selection_status":rank.get("status"),
              "adaptive_sampling_status":adaptive.get("status"),
              "adaptive_sampled_original_frames":adaptive.get("sampled",0),
              "adaptive_photo_candidates_not_approved":adaptive.get("photographic_candidates",0),
              "adaptive_selection_status":adaptive.get("selection_status"),
              "bw_motion_evidence_status":motion.get("status"),
              "original_frame_diversity_status":diversity.get("status"),
              "balanced_original_motion_selection_status":balanced.get("status"),
              "balanced_five_frame_files":[r.get("filename") for r in balanced.get("five_review_candidates",[])],
              "balanced_visual_review_status":balanced_visual.get("status"),
              "actual_prefreeze_motion_strip_status":motion_strips.get("status"),
              "source_editorial_gate_status":editorial.get("status"),
              "veto_aware_alternative_status":alternatives.get("status"),
              "motion_candidates_after_veto":alternatives.get("verified_motion_candidates_after_veto",0),
              "timeline_regions_after_veto":alternatives.get("timeline_regions_after_veto",[]),
              "source_editorial_veto_frames":[r.get("frame") for r in editorial.get("source_review_vetoes",[])],
              "source_paid_api_permitted":editorial.get("paid_api_call_permitted",False),
              "actual_prefreeze_motion_proxy_samples":[x.get("source_frame") for x in motion_strips.get("five_prefreeze_proxy_strips",[])],
              "balanced_visual_source_sha_pts_checked":balanced_visual.get("original_pts_sha_motion_evidence_crosschecked",False),
              "near_duplicate_original_frame_pairs":diversity.get("near_duplicate_pairs",[]),
              "bw_moving_photo_candidates":motion.get("source_motion_candidates_pass",0),
              "bw_source_5_review_frame_files":[r["filename"] for r in motion.get("five_review_shots",[])],


              "eligible_pre_freeze_source_windows":rank.get("eligible_pre_freeze_source_windows",0),
              "eligible_photographic_scene_candidates":rank.get("eligible_photographic_scene_candidates",0),
              "proposed_frame_files":[entry.get("filename") for entry in rank.get("preselected",[])],

              "candidate_cut_count":report.get("shot_boundary_analysis",{}).get("cut_candidate_count"),
              "italian_rights_verified":False,
              "five_genuine_camera_shots_verified":False,
              "artistic_review":False,
              "photos_i2i_generated":0,"vidu_generated":0,
              "mp4_finished":False,"published":False,
              "paid_api_calls":0
          }
          (root/"REAL_FILM_AUDIT_V121.json").write_text(
              json.dumps(status,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          assert status["status"]=="SOURCE_REJECTED_V132_INSUFFICIENT_DIVERSITY_AFTER_VETO",status["status"]
          print("REAL_FILM_AUDIT",json.dumps({k:v for k,v in status.items()
                if k in ("episode_id","status","original_media_bytes_verified",
                         "original_raster_px","candidate_cut_count","source_frame_count")}))
          PY
      - name: Preserve metadata evidence only; never publish original film
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_V121_ONE_REAL_ARCHIVE_AUDIT_${{ github.run_id }}
          path: |
            output/storia_v121_real/WORK_ORDER.json
            output/storia_v121_real/REAL_FILM_AUDIT_V121.json
            output/storia_v121_real/source/SCOUT_REPORT.json
            output/storia_v121_real/FIVE_REAL_FILM_SOURCE_CANDIDATES_V122.json
            output/storia_v121_real/source/ORIGINAL_FILM_CONTACT_SHEET.jpg
            output/storia_v121_real/adaptive/ADAPTIVE_STATUS_V124.json
            output/storia_v121_real/adaptive/ADAPTIVE_RANK_V124.json
            output/storia_v121_real/adaptive/SCOUT_REPORT.json
            output/storia_v121_real/adaptive/ADAPTIVE_CONTACT_SHEET_V124.jpg
            output/storia_v121_real/adaptive/REAL_BW_MOTION_V125.json
            output/storia_v121_real/adaptive/FRAME_DIVERSITY_V126.json
            output/storia_v121_real/adaptive/FIVE_MOVING_REVIEW_V126.json
            output/storia_v121_real/adaptive/BALANCED_VISUAL_REVIEW_V128.json
            output/storia_v121_real/adaptive/BALANCED_CONTACT_SHEET_V128.jpg
            output/storia_v121_real/adaptive/PREFREEZE_MOTION_STRIPS_V129.json
            output/storia_v121_real/adaptive/PREFREEZE_MOTION_STRIPS_V129.jpg
            output/storia_v121_real/adaptive/SOURCE_EDITORIAL_GATE_V131.json
            output/storia_v121_real/adaptive/VETO_AWARE_ALTERNATIVES_V132.json

          retention-days: 14
          if-no-files-found: warn
