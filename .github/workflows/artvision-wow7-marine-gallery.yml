name: "ArtVision WOW7 - marine exact art sources"
on:
  push:
    branches: [main]
    paths: [".github/workflows/artvision-wow7-marine-gallery.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Research distinct museum originals
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json
          H={'User-Agent':'ArtVisionTraLePagine/4.1 (noncommercial artwork sourcing)'}
          for search in ['Aivazovsky The Ninth Wave','Aivazovsky painting sea','Ivan Aivazovsky storm waves','Aivazovsky painting ship']:
           q={'action':'query','format':'json','formatversion':2,'generator':'search','gsrsearch':search+' filetype:bitmap','gsrnamespace':6,'gsrlimit':45,'prop':'imageinfo','iiprop':'size|url|extmetadata','iiurlwidth':2200}
           url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(q)
           try:
            data=json.load(urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=27))
            print('SEARCH',search,flush=True)
            for p in (data.get('query',{}).get('pages') or []):
             name=p.get('title','')[5:]
             if not any(x in name.lower() for x in ('aivazov','aivazovski','ayvazovski','hovhannes')):continue
             if any(x in name.lower() for x in ('museum','stamp','detail','logo','portrait of','book','gallery','signature')):continue
             info=(p.get('imageinfo')or[{}])[0];short=(info.get('extmetadata')or{}).get('LicenseShortName',{})
             print('CANDIDATE',name,'SIZE',info.get('width'),info.get('height'),'LICENSE',short.get('value') if isinstance(short,dict) else short,flush=True)
           except Exception as exc:print('SOURCE ERROR',str(exc)[:180],flush=True)
          PY
