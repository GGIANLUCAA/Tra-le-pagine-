name: ArtVision V156 Lady of Shalott one natural Critico and verified source
on:
  push:
    branches: [main]
    paths:
      - requests/artvision/waterhouse-lady-shalott-critico-v156.json
permissions:
  contents: read
  actions: read
concurrency:
  group: artvision-owner-waterhouse-shalott-critico-v156-once
  cancel-in-progress: false
jobs:
  one_missing_critico:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Compile renderer and verify recipe before any TTS call
        run: |
          python -m py_compile src/artvision_waterhouse_shalott_critico_v156.py
          python -m json.tool modules/artvision_critico/production_series/waterhouse_shalott_v156.json > /dev/null
      - name: Guard one approved work and forbid duplicates and paid calls
        run: |
          python - <<'PY'
          import json
          r=json.load(open("requests/artvision/waterhouse-lady-shalott-critico-v156.json"))
          q=json.load(open("queue/artvision_owner_selected_ten_20261102.json"))
          assert r["owner_automation_id"]=="6adca191603c8191a90d5190901cd034"
          assert r["work_id"]=="waterhouse_lady_shalott_1888_tate_n01543"
          assert r["variant"]=="critico_standard"
          assert r["public_title"]=="The Lady of Shalott"
          assert r["run_once_only"] and r["one_tts_call_at_most"]
          assert not r["allow_paid_calls"] and not r["social_publish"] and not r["gold_v25"]
          w=[x for x in q["works"] if x["id"]==r["work_id"]]
          assert len(w)==1 and w[0]["slots_delivered_this_selection"]==1
          assert "critico_standard_v156" not in w[0]
          assert w[0]["cinema_standard_v155"]["sha256"]=="977b8c54d466026564f1bd92216c6829d818656d069d9c5f8ea664e77f30a56c"
          assert w[0]["cinema_standard_v155"]["zip_crc"].startswith("PASS")
          assert w[0]["museum_approved"] is False
          PY
      - name: Recover and verify actual Tate N01543 source JPEG from prior V155 cinema zip without Wikimedia request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/waterhouse_v155 /tmp/waterhouse_shalott_critico_v156
          gh run download 41871206356 --repo "$GITHUB_REPOSITORY" --name WATERHOUSE_LADY_SHALOTT_V155_CINEMA_REVIEW_MP4 --dir /tmp/waterhouse_v155
          unzip -p /tmp/waterhouse_v155/WATERHOUSE_LADY_SHALOTT_CINEMA_V155_REVIEW_PACKAGE.zip ORIGINAL_ARTWORK.jpg > /tmp/waterhouse_shalott_critico_v156/ORIGINAL_ARTWORK.jpg
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          f=Path('/tmp/waterhouse_shalott_critico_v156/ORIGINAL_ARTWORK.jpg')
          assert f.stat().st_size==6941271
          assert hashlib.sha256(f.read_bytes()).hexdigest()=='85285c9ec190a51331d88367f68867611aaabd65dcd7f6ca45aca119511be3a9'
          with zipfile.ZipFile('/tmp/waterhouse_v155/WATERHOUSE_LADY_SHALOTT_CINEMA_V155_REVIEW_PACKAGE.zip') as z: assert z.testzip() is None
          print('WATERHOUSE_SOURCE_V155_IDENTICAL_BYTES_SHA_AND_ZIP_CRC_PASS_NO_NEW_COMMONS_REQUEST')
          PY
      - name: Gate ONLY already owner-attested no-billing second Free Google key
        env:
          SECOND_KEY: ${{ secrets.GEMINI_API_KEY2 }}
        run: |
          test -n "$SECOND_KEY" || { echo "BLOCKED_SECOND_FREE_ACCOUNT_NOT_PRESENT: NO TTS"; exit 2; }
      - name: Install offline runtime with KNOWN compatible PyAV17 ASR
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "google-genai>=2.25.0" numpy pillow soundfile scipy "faster-whisper==1.2.1" "av==17.1.0" "huggingface-hub==0.34.4" "fsspec==2025.7.0" opencv-python-headless imageio-ffmpeg
          mkdir -p /tmp/artvision-bin
          python - <<'PY'
          from imageio_ffmpeg import get_ffmpeg_exe
          from pathlib import Path
          e=Path(get_ffmpeg_exe())
          assert e.is_file()
          Path('/tmp/artvision-bin/ffmpeg').symlink_to(e)
          PY
          echo /tmp/artvision-bin >> "$GITHUB_PATH"
          /tmp/artvision-bin/ffmpeg -version | head -1
      - name: Generate ONE genuine natural Gacrux WAV and ASR-small timing (NO retry)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY2 }}
          ARTVISION_GEMINI_PROJECT_BILLING_TIER: Free
          ARTVISION_ASR_MODEL: small
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python src/artvision_waterhouse_shalott_critico_v156.py --phase voice
      - name: Render EXACTLY one real Critico Standard with original soundtrack and QA
        run: python src/artvision_waterhouse_shalott_critico_v156.py --phase render
      - name: Independently verify actual physical file and CRC, do not auto Gold
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,zipfile
          out=Path('/tmp/waterhouse_shalott_critico_v156')
          q=json.loads((out/'QA_V156.json').read_text())
          assert q['work']=="The Lady of Shalott"
          assert q['variant']=='critico_standard' and q['museum_variant_rendered'] is False
          assert not q['Gold_V25'] and not q['social_published'] and not q['museum_approved']
          m=q['file']; p=out/m['name']
          assert p.is_file() and p.stat().st_size==m['bytes'] and m['frames']>1000
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          assert m['full_ffmpeg_decode']=='PASS'
          subprocess.run(["ffmpeg","-v","error","-xerror","-i",str(p),"-f","null","-"],check=True)
          with zipfile.ZipFile(out/"WATERHOUSE_SHALOTT_CRITICO_STANDARD_V156_REVIEW_PACKAGE.zip") as z:
            assert z.testzip() is None and sum(n.endswith('.mp4') for n in z.namelist())==1
          print('ONE_GENUINE_MP4_SHA_FFMPEG_ZIP_CRC_PASS_ARTISTIC_REVIEW_PENDING')
          PY
      - name: Preserve WAV even on failed render — never regenerate TTS for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ART_V156_WATERHOUSE_REAL_CRITICO_OR_PRESERVED_WAV
          path: |
            /tmp/waterhouse_shalott_critico_v156/VOCE.wav
            /tmp/waterhouse_shalott_critico_v156/VOICE_CACHE_V13.json
            /tmp/waterhouse_shalott_critico_v156/ALLINEAMENTO_VOCE.json
            /tmp/waterhouse_shalott_critico_v156/VOICE_RESULT_V156.json
            /tmp/waterhouse_shalott_critico_v156/COPIONE_ESATTO_V156.txt
            /tmp/waterhouse_shalott_critico_v156/WATERHOUSE_THE_LADY_OF_SHALOTT_CRITICO_STANDARD_V156_REVIEW.mp4
            /tmp/waterhouse_shalott_critico_v156/WATERHOUSE_SHALOTT_CRITICO_STANDARD_V156_REVIEW_PACKAGE.zip
            /tmp/waterhouse_shalott_critico_v156/QA_V156.json
            /tmp/waterhouse_shalott_critico_v156/COVER.jpg
            /tmp/waterhouse_shalott_critico_v156/CONTACT_SHEET_V156.jpg
            /tmp/waterhouse_shalott_critico_v156/RIGHTS_AND_CREDITS.txt
            /tmp/waterhouse_shalott_critico_v156/SOCIAL_DRAFT_UNPUBLISHED.txt
          retention-days: 30
          if-no-files-found: warn
