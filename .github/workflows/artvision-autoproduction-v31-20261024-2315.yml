name: "ArtVision V31 • Hugo Simberg • The Wounded Angel • 23:15"
on:
  push:
    branches: [main]
    paths:
      - "scripts/artvision_autoproduction_20261024_2315.py"
      - "config/artvision_autoproduction_20261024_2315.json"
      - ".github/workflows/artvision-autoproduction-v31-20261024-2315.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: artvision-v31-20261024-2315
  cancel-in-progress: false
jobs:
  artvision:
    name: "Ateneum CC BY 4.0 original • V6 Cinema • V28 captions"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified image bytes and source cooldowns
        uses: actions/cache/restore@v4
        with:
          path: .artvision-assets
          key: artvision-images-v1-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            artvision-images-v1-${{ github.workflow }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verified free rendering dependencies
        run: |
          set -euo pipefail
          command -v ffmpeg || sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<14" "numpy>=1.26,<3" "requests>=2.31,<3"
      - name: Recover original Simberg production archive when cache is absent
        id: recover_original
        if: hashFiles('assets/verified/simberg_wounded_angel/ORIGINAL_ARTWORK.jpg', '.artvision-assets/*.jpg') == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ArtVision-V31-20261024-Hugo-Simberg-Wounded-Angel
          run-id: 40134086889
          github-token: ${{ github.token }}
          path: .artvision-recovery
      - name: Validate original archive identity and SHA256 before reuse
        if: steps.recover_original.outcome == 'success'
        continue-on-error: true
        run: python scripts/artvision_seed_image_archive.py --archive-dir .artvision-recovery --config config/artvision_autoproduction_20261024_2315.json --painting hugo_simberg_wounded_angel_20261024_2315
      - name: Research, V25 and V28 preflight
        id: preflight
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_autoproduction_20261024_2315.py
          python scripts/artvision_autoproduction_20261024_2315.py --painting hugo_simberg_wounded_angel_20261024_2315 --preflight-only
      - name: Produce museum-original 9:16 H264/AAC MP4 with genuine licensed recording
        id: render
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python scripts/artvision_autoproduction_20261024_2315.py --painting hugo_simberg_wounded_angel_20261024_2315 --out output/artvision-v31-wounded-angel
      - name: Full independent MP4 decode, 0/1/3/5/7s, social and ZIP integrity
        id: verify
        run: |
          set -euo pipefail
          folder="output/artvision-v31-wounded-angel/hugo_simberg_wounded_angel_20261024_2315"
          film="$folder/VIDEO_MASTER.mp4"
          archive="output/artvision-v31-wounded-angel/ARTVISION_V30_HUGO_SIMBERG_WOUNDED_ANGEL_20261024_2315_COMPLETE.zip"
          test -s "$film" && test -s "$archive" && test -s "$folder/COPERTINA.jpg"
          ffmpeg -hide_banner -loglevel error -xerror -i "$film" -f null -
          python src/artvision_editorial_post_v28.py --validate-folder "$folder"
          python - "$film" "$archive" <<'PY'
          import json,subprocess,zipfile,sys
          film,archive=sys.argv[1:]
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size','-show_entries','stream=codec_type,codec_name,width,height','-of','json',film]))
          d=float(p['format']['duration'])
          assert 45<=d<=120,d
          assert any(s.get('codec_type')=='video' and s.get('codec_name')=='h264' and s.get('width')==1080 and s.get('height')==1920 for s in p['streams'])
          assert any(s.get('codec_type')=='audio' and s.get('codec_name')=='aac' for s in p['streams'])
          required={'VIDEO_MASTER.mp4','COPERTINA.jpg','POST_FACEBOOK.txt','POST_INSTAGRAM.txt','POST_TIKTOK.txt','POST_YOUTUBE.txt','POST_EDITORIAL_RESEARCH.json','VIDEO_RECIPE_V13.json','TECNICHE_REGIA.md','ISTRUZIONI_REPLICA.md','SOURCES_AND_RIGHTS.md','MUSIC_RELEASE_V20.json','TECHNICAL_QA_V30.json','QA_CONTACT_SHEET.jpg','ORIGINAL_ARTWORK.jpg','ORIGINAL_LICENSED_MUSIC.mp3'}
          with zipfile.ZipFile(archive) as z:
            assert z.testzip() is None
            assert required<=set(z.namelist()),required-set(z.namelist())
            qa=json.loads(z.read('TECHNICAL_QA_V30.json'))
            assert qa['full_ffmpeg_decode'] and qa['approval']=='human_visual_review_pending'
          print('REAL_FILM_VALIDATED',d,p['format']['size'])
          PY
      - name: Archive real MP4, cover, post and complete reproducible ZIP
        if: always()
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: ArtVision-V31-20261024-Hugo-Simberg-Wounded-Angel
          path: |
            output/artvision-v31-wounded-angel/hugo_simberg_wounded_angel_20261024_2315/VIDEO_MASTER.mp4
            output/artvision-v31-wounded-angel/hugo_simberg_wounded_angel_20261024_2315/COPERTINA.jpg
            output/artvision-v31-wounded-angel/hugo_simberg_wounded_angel_20261024_2315/QA_CONTACT_SHEET.jpg
            output/artvision-v31-wounded-angel/hugo_simberg_wounded_angel_20261024_2315/POST_FACEBOOK.txt
            output/artvision-v31-wounded-angel/ARTVISION_V30_HUGO_SIMBERG_WOUNDED_ANGEL_20261024_2315_COMPLETE.zip
          if-no-files-found: warn
          retention-days: 60
      - name: Register verified result, no Gold Master claim, no social publish
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          RENDER: ${{ steps.render.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const path='queue/artvision_autoproduction_v31_state.json';
            const folder='output/artvision-v31-wounded-angel/hugo_simberg_wounded_angel_20261024_2315';
            const film=folder+'/VIDEO_MASTER.mp4';
            const qaFile=folder+'/TECHNICAL_QA_V30.json';
            const allOK=['PREFLIGHT','RENDER','VERIFY','ARCHIVE'].every(k=>process.env[k]==='success');
            let qa=null;try{qa=JSON.parse(fs.readFileSync(qaFile,'utf8'))}catch(e){}
            const exists=fs.existsSync(film);
            const event={
              cycle_id:'20261024T2315+0200',created_at:new Date().toISOString(),
              artist:'Hugo Simberg',work:'The Wounded Angel',format:'artvision_cinema',
              baseline:'cinema_v6',reason_fallback:'Google Gacrux natural voice not verified; no robotic TTS fallback',
              status:allOK?'technical_pass_not_gold_master':'blocked_or_rendered_needs_review',
              mp4_verified:allOK&&exists,duration_seconds:allOK?qa?.duration_seconds:null,
              size_bytes:exists?fs.statSync(film).size:null,
              sha256_mp4:exists?crypto.createHash('sha256').update(fs.readFileSync(film)).digest('hex'):null,
              workflow_run_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              artifact_name:'ArtVision-V31-20261024-Hugo-Simberg-Wounded-Angel',
              steps:{preflight:process.env.PREFLIGHT,render:process.env.RENDER,verify:process.env.VERIFY,archive:process.env.ARCHIVE},
              gold_master_approved:false,social_published:false
            };
            for(let attempt=0;attempt<3;attempt++){
              const old=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
              const state=JSON.parse(Buffer.from(old.data.content,'base64').toString('utf8'));
              state.cycle_log=state.cycle_log||[];
              const index=state.cycle_log.findIndex(x=>x.cycle_id===event.cycle_id);
              if(index>=0)state.cycle_log[index]=event;else state.cycle_log.push(event);
              state.updated=new Date().toISOString();
              if(allOK)state.next_preferred_format='artvision_critico';
              try{
                await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,
                  message:'ArtVision V31: record real Wounded Angel production outcome',
                  content:Buffer.from(JSON.stringify(state,null,2)+'\n').toString('base64'),sha:old.data.sha,branch:'main'});
                break;
              }catch(err){if(attempt===2)throw err;}
            }
            core.summary.addHeading('ArtVision V31 — Hugo Simberg, The Wounded Angel')
              .addRaw(`Outcome: **${event.status}**; MP4 exists: ${exists}; duration: ${event.duration_seconds??'unknown'} seconds.\n\n`)
              .addRaw('No automatic social publication; artistic review pending.').write();
      - name: Save verified images and cooldowns for the next attempt
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .artvision-assets
          key: artvision-images-v1-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
