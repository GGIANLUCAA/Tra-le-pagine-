name: API secrets - presence-only connection audit (zero requests)
on:
  workflow_dispatch:
  push:
    branches: [integrations/secret-presence-audit-20261104, integrations/nvidia-secret-detection-20261104]
    paths:
      - src/secret_presence_audit_v1.py
      - tests/test_secret_presence_audit_v1.py
      - .github/workflows/secret-presence-audit-v1.yml
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Secret presence audit must not leak credentials
        run: |
          python -m py_compile src/secret_presence_audit_v1.py
          python -m unittest discover -s tests -p 'test_secret_presence_audit_v1.py' -v
  actual-presence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect repository secret aliases; never request provider APIs
        env:
          AUDIT_AIHORDE_API_KEY: ${{ secrets.AIHORDE_API_KEY }}
          AUDIT_AIHORDE_API_KEY_2: ${{ secrets.AIHORDE_API_KEY_2 }}
          AUDIT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUDIT_GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          AUDIT_GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          AUDIT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AUDIT_GROQ: ${{ secrets.GROQ }}
          AUDIT_NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AUDIT_NVIDIA: ${{ secrets.NVIDIA }}
          AUDIT_NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          AUDIT_NVIDIA_NIM: ${{ secrets.NVIDIA_NIM }}
          AUDIT_NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          AUDIT_INVIDIA: ${{ secrets.INVIDIA }}
          AUDIT_INVIDIA_API_KEY: ${{ secrets.INVIDIA_API_KEY }}
          AUDIT_HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AUDIT_HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          AUDIT_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AUDIT_OPENROUTER2: ${{ secrets.OPENROUTER2 }}
          AUDIT_PIXABAY: ${{ secrets.PIXABAY }}
          AUDIT_PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          AUDIT_PRIXIBAY2: ${{ secrets.PRIXIBAY2 }}
          AUDIT_VIDUOK: ${{ secrets.VIDUOK }}
          AUDIT_VIDU_API_KEY: ${{ secrets.VIDU_API_KEY }}
          AUDIT_VIDU: ${{ secrets.VIDU }}
          AUDIT_VIDU2: ${{ secrets.VIDU2 }}
        run: python src/secret_presence_audit_v1.py
