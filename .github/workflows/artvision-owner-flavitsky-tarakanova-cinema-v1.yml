name: "ArtVision OWNER | Flavitsky Princess Tarakanova Tretyakov | Cinema V2 corrective private review"
on:
  pull_request:
    paths:
      - ".github/workflows/artvision-owner-flavitsky-tarakanova-cinema-v1.yml"
      - "scripts/artvision_owner_flavitsky_tarakanova_cinema_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-owner-flavitsky-tarakanova-cinema-v1.yml"
permissions:
  contents: read
concurrency:
  group: artvision-owner-single-heavy-render
  cancel-in-progress: false
jobs:
  new_private_cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source identity, exact edition and duplicate gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_owner_flavitsky_tarakanova_cinema_v1.py
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
          python scripts/artvision_owner_flavitsky_tarakanova_cinema_v1.py --preflight-only
      - name: Source-locked original Cinema Standard with local music
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core; fi
          python scripts/artvision_owner_flavitsky_tarakanova_cinema_v1.py
      - name: Save genuine MP4, cover, sources and ZIP (only if rendered)
        if: github.event_name != 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_OWNER_TARAKANOVA_TRETYAKOV_CINEMA_V2_DIRECTOR_REVIEW
          retention-days: 30
          if-no-files-found: error
          path: |
            output/artvision-owner-flavitsky-tarakanova-cinema-v1/VIDEO_ANDROID_REVIEW.mp4
            output/artvision-owner-flavitsky-tarakanova-cinema-v1/COVER.jpg
            output/artvision-owner-flavitsky-tarakanova-cinema-v1/CONTACT_SHEET.jpg
            output/artvision-owner-flavitsky-tarakanova-cinema-v1/ANDROID_REVIEW_PACKAGE.zip
            output/artvision-owner-flavitsky-tarakanova-cinema-v1/QA_TECHNICAL.json
            output/artvision-owner-flavitsky-tarakanova-cinema-v1/SOURCE_READBACK.json
            output/artvision-owner-flavitsky-tarakanova-cinema-v1/STORYBOARD.json
            output/artvision-owner-flavitsky-tarakanova-cinema-v1/SOCIAL_DRAFTS.json
  independent_readback:
    needs: new_private_cinema
    if: github.event_name != 'pull_request' && needs.new_private_cinema.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ARTVISION_OWNER_TARAKANOVA_TRETYAKOV_NEW_CINEMA_REVIEW
          path: /tmp/tarakanova-readback
      - name: Independent FFmpeg, SHA and ZIP readback (fresh runner)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          d=/tmp/tarakanova-readback
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID_REVIEW.mp4" -map 0 -f null -
          python - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib,subprocess
          p=Path('/tmp/tarakanova-readback');q=json.loads((p/'QA_TECHNICAL.json').read_text())
          src=json.loads((p/'SOURCE_READBACK.json').read_text())
          assert src['pixels']==[1400,1845] and src['original_exact_artwork'].startswith('Tretyakov')
          assert (p/'VIDEO_ANDROID_REVIEW.mp4').stat().st_size==q['video_bytes']
          assert hashlib.sha256((p/'VIDEO_ANDROID_REVIEW.mp4').read_bytes()).hexdigest()==q['video_sha256']
          with zipfile.ZipFile(p/'ANDROID_REVIEW_PACKAGE.zip') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('VIDEO_ANDROID_REVIEW.mp4')).hexdigest()==q['video_sha256']
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p/'VIDEO_ANDROID_REVIEW.mp4')]))
          assert 40<float(meta['format']['duration'])<60
          assert any(s.get('codec_name')=='h264' and s.get('width')==720 for s in meta['streams'])
          assert any(s.get('codec_name')=='aac' for s in meta['streams'])
          assert q['published'] is False and q['gold'] is False and q['extra_paid_calls']==0
          print('VERIFIED_INDEPENDENT_SOURCE_MP4_AND_ZIP_SHA',q['video_sha256'])
          PY
