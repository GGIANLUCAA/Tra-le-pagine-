name: FreeLLMAPI V1 - editorial adapter offline tests
on:
  pull_request:
    paths:
      - src/freellmapi_editorial_v1.py
      - src/free_llm_zero_cost_v1.py
      - config/free_llm_zero_cost_v1.json
      - docs/AI_ROUTER_ECC_ZERO_COST_V1_20261103.md
      - tests/test_freellmapi_editorial_v1.py
      - docs/FREELLMAPI_INTEGRAZIONE_V1_20261103.md
      - .github/workflows/freellmapi-v1-offline.yml
  push:
    paths:
      - src/freellmapi_editorial_v1.py
      - tests/test_freellmapi_editorial_v1.py
      - .github/workflows/freellmapi-v1-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and offline regression tests (no API keys)
        run: |
          python -m py_compile src/freellmapi_editorial_v1.py src/free_llm_zero_cost_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('config/free_llm_zero_cost_v1.json').read_text())
          assert p['default_deny'] is True and p['routes'] == [], 'Default allowlist must be empty'
          print('PASS: default zero-cost registry denies all providers')
          PY
          python -m unittest discover -s tests -p 'test_freellmapi_editorial_v1.py' -v
