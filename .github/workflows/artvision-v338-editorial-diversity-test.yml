name: ArtVision V338 · Test Regia Umana / Anti Stampino
on:
  push:
    branches: [feature/artvision-cromatica-human-director-v338-20261121]
    paths:
      - tools/artvision_cromatica_director_v338.py
      - tools/artvision_owner30_cromatica_reels_v338.py
      - tests/test_artvision_cromatica_director_v338.py
      - .github/workflows/artvision-v338-editorial-diversity-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-regia:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify variable authored storyboards and no legacy overwrite
        run: |
          python tests/test_artvision_cromatica_director_v338.py
      - uses: actions/upload-artifact@v4
        with:
          name: ARTVISION-V338-ANTI-STAMPINO-AUDIT
          path: output/artvision_v338/EDITORIAL_DIVERSITY_TEST.json
          if-no-files-found: error
          retention-days: 30
