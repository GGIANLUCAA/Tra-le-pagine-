name: "Storia Rivive V67 — scouting mercato Vienna 1920 CC0"
on:
  pull_request:
    paths:
      - "src/storia_rivive_v67_vienna_source_contact.py"
      - ".github/workflows/storia-rivive-v67-scout.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip -q install --no-cache-dir opencv-python-headless Pillow
          command -v ffmpeg
      - run: python -u src/storia_rivive_v67_vienna_source_contact.py
      - uses: actions/upload-artifact@v4
        with:
          name: VIENNA_1920_V67_SCOUT_CC0
          path: |
            output/storia_rivive_v67_vienna_1920/VIENNA_1920_ARCHIVIO_CC0.webm
            output/storia_rivive_v67_vienna_1920/CONTACT_*.jpg
            output/storia_rivive_v67_vienna_1920/SOURCE_PROVENANCE.json
            output/storia_rivive_v67_vienna_1920/FRAME_INDEX.json
          retention-days: 14
