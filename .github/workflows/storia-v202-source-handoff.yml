name: "La Storia Rivive V202 - authentic source handoff SHA gate"
on:
  push:
    branches: [storia-v196-v101-cache-fail-closed-20261101]
    paths:
      - "src/storia_rivive_v202_source_handoff.py"
      - "tests/test_storia_rivive_v202_source_handoff.py"
      - "src/storia_rivive_v204_film_frame_provenance.py"
      - "tests/test_storia_rivive_v204_film_frame_provenance.py"
      - ".github/workflows/storia-v202-source-handoff.yml"
  pull_request:
    paths:
      - "src/storia_rivive_v202_source_handoff.py"
      - "tests/test_storia_rivive_v202_source_handoff.py"
      - "src/storia_rivive_v204_film_frame_provenance.py"
      - "tests/test_storia_rivive_v204_film_frame_provenance.py"
      - ".github/workflows/storia-v202-source-handoff.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline_source_attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
      - run: python -m pip install -q "pillow>=10,<13"
      - name: Compile V202 source handoff and offline tests
        run: python -m py_compile src/storia_rivive_v202_source_handoff.py tests/test_storia_rivive_v202_source_handoff.py
      - name: Fifteen V202/V203 source integrity and native-crop tests (no provider calls)
        run: python -m unittest discover -s tests -p 'test_storia_rivive_v202_source_handoff.py' -v
      - name: V204 actual FFmpeg re-extraction and tamper regression (no API)
        run: |
          python -m py_compile src/storia_rivive_v204_film_frame_provenance.py tests/test_storia_rivive_v204_film_frame_provenance.py
          python -m unittest discover -s tests -p "test_storia_rivive_v204_film_frame_provenance.py" -v
      - name: Existing V101/V102 regression tests
        run: python -m unittest discover -s tests -p 'test_storia_rivive_v101.py' -v
