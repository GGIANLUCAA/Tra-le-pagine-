name: "La Storia Rivive · NEW genuine historic women smiles I2I review"
on:
  push:
    branches: [main]
    paths: [".github/workflows/storia-lumiere-smiles-1895-1905-real-i2i-review.yml"]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: storia-smiles-1895-1905-new
  cancel-in-progress: false
jobs:
  new_video:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video renderer and free photo AI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q "numpy>=1.26,<2.3" "opencv-python-headless>=4.9,<5" "pillow>=10,<13" "onnxruntime>=1.18,<2" "huggingface_hub>=0.25,<2" "gradio_client>=1.3,<3"
          python -m py_compile tools/storia_lumiere_smiles_new_i2i_review.py
      - name: Actual new historical film and one free anchored generative photo to MP4
        run: |
          set -euo pipefail
          python -u tools/storia_lumiere_smiles_new_i2i_review.py
      - name: Preserve original-vs-I2I visual proof and video bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_LUMIERE_NEW_SMILES_REAL_I2I_MP4_QA_IF_CREATED
          retention-days: 14
          if-no-files-found: warn
          path: |
            output/storia_lumiere_smiling_women_new_review/*.json
            output/storia_lumiere_smiling_women_new_review/*.jpg
            output/storia_lumiere_smiling_women_new_review/*.txt
            output/storia_lumiere_smiling_women_new_review/ANCHOR_REAL_ORIGINAL_BW.png
            output/storia_lumiere_smiling_women_new_review/GENERATIVE_PHOTO_REAL_CANDIDATE.png
            output/storia_lumiere_smiling_women_new_review/LUMIERE_SMILING_WOMEN_NEW_REAL_I2I_REVIEW.mp4
            output/storia_lumiere_smiling_women_new_review/LUMIERE_SMILING_WOMEN_REAL_I2I_REVIEW_ANDROID.zip
      - name: Publish only review transport and verify Android downloads IF REAL MP4 exists
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          d=output/storia_lumiere_smiling_women_new_review
          tag=storia-lumiere-new-smiles-1895-1905-source-locked-review-20261118
          video=LUMIERE_SMILING_WOMEN_NEW_REAL_I2I_REVIEW.mp4
          kit=LUMIERE_SMILING_WOMEN_REAL_I2I_REVIEW_ANDROID.zip
          python - <<'PY'
          import json,pathlib,zipfile
          p=pathlib.Path("output/storia_lumiere_smiling_women_new_review")
          q=json.loads((p/"DELIVERY.json").read_text())
          assert q["source_locked_photo_created"] and q["full_video_decode_pass"] and q["zip_crc_pass"]
          assert q["artistic_review"]=="PENDING" and q["paid_calls"]==0
          assert (p/"LUMIERE_SMILING_WOMEN_NEW_REAL_I2I_REVIEW.mp4").stat().st_size>1000000
          assert (p/"LUMIERE_SMILING_WOMEN_REAL_I2I_REVIEW_ANDROID.zip").stat().st_size>1000000
          assert zipfile.ZipFile(p/"LUMIERE_SMILING_WOMEN_REAL_I2I_REVIEW_ANDROID.zip").testzip() is None
          print("REVIEW_BYTES_OK",q["video_sha256"],q["zip_sha256"])
          PY
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "EXISTING_TAG_REFUSE_DUPLICATE";exit 1
          fi
          gh release create "$tag" "$d/$video" "$d/$kit" "$d/SOCIAL_COVER.jpg" \
            "$d/SMILES_EXACT_ORIGINAL_VS_TRUE_I2I.jpg" "$d/RIGHTS.json" "$d/PHOTO_QA.json" \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Historic women smile 1895-1905 - true new generative I2I artistic REVIEW" \
            --notes "Authentic Lumiere anthology excerpt from 1895–1905. Free generative source-locked I2I photo; genuine moving B/W and neurally colorized genuine motion. Visual face anatomy and Italian 2015 restoration rights PENDING. This public prerelease is owner transport ONLY, NOT site/social publication. No Vidu, no paid calls."
          root="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          for file in "$video" "$kit"; do
            curl -fsSL --retry 2 --connect-timeout 20 --max-time 240 "$root/$file" -o "/tmp/$file"
            cmp "$d/$file" "/tmp/$file"
            echo "ANONYMOUS_EXTERNAL_DOWNLOAD_PASS $file"
          done
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("/tmp/LUMIERE_SMILING_WOMEN_REAL_I2I_REVIEW_ANDROID.zip") as z:assert z.testzip() is None
          print("EXTERNAL_ZIP_CRC_PASS")
          PY
          printf '%s\n' "Nuovo MP4 e ZIP review verificati esternamente. Artistica PENDING, diritti Italia restauri 2015 PENDING. NO autopubblicazione, NO spese." "$root/$video" "$root/$kit" > /tmp/issue144_new_video.txt
          gh issue comment 144 --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue144_new_video.txt
