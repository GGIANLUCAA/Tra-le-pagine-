name: ArtVision Lotto 6 - Cinema delle Ombre
run-name: ArtVision - cinque film dark V6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artvision-dark-lotto6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  film:
    name: Cinema V6 - ${{ matrix.artist }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        artist: [bosch_dark, gericault, fuseli, bocklin, redon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cinematography requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
      - name: Validate production script
        run: python -m py_compile modules/artvision/artvision_dark_lotto6.py
      - name: Render licensed-art film with music
        run: python modules/artvision/artvision_dark_lotto6.py --artist "${{ matrix.artist }}"
      - name: Save verified MP4 and matching cover
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_DARK6_${{ matrix.artist }}
          path: output/artvision-lotto6-inquietudine/${{ matrix.artist }}/film/
          if-no-files-found: error
          retention-days: 7
