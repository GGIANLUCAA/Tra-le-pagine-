name: "ArtVision - Bosch diverse opere versione cinematografica"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-bosch-quality-v6.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bosch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Install FFmpeg and open tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
      - name: "Bosch true oeuvre: Garden, Haywain, Anthony, judgment"
        run: python modules/artvision/batch5_cinema_v6.py --artist bosch
      - name: "Final verified video, cover and rights"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "ARTVISION_BOSCH_DIVERSE_OPERE"
          path: |
            output/artvision-batch5-cinema/bosch/film/*.mp4
            output/artvision-batch5-cinema/bosch/film/*.jpg
            output/artvision-batch5-cinema/bosch/film/*.json
            output/artvision-batch5-cinema/bosch/film/*.txt
          if-no-files-found: error
          retention-days: 7
