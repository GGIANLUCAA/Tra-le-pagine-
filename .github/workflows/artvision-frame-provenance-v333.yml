name: ArtVision V333 Frame provenance QA
on:
  push:
    branches:
      - main
    paths:
      - "src/artvision_ai_room_integrator_v332.py"
      - "tests/test_artvision_ai_room_frame_provenance_v333.py"
      - ".github/workflows/artvision-frame-provenance-v333.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frame-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image tools
        run: python -m pip install -q pillow
      - name: Compile source
        run: python -m py_compile src/artvision_ai_room_integrator_v332.py
      - name: Test authentic frame and paired variants
        run: python -m unittest discover -s tests -p "test_artvision_ai_room_frame_provenance_v333.py" -v
