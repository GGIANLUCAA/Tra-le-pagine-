name: "La Storia Rivive V150 | longer authentic B/W source-only review"
on:
  pull_request:
    paths:
      - "src/storia_rivive_v150_longer_bw_review.py"
      - "tests/test_storia_rivive_v150_longer_bw_review.py"
      - "src/storia_rivive_v151_source_locked_handoff.py"
      - "tests/test_storia_rivive_v151_source_locked_handoff.py"
      - "src/storia_rivive_v152_editorial_preflight.py"
      - "tests/test_storia_rivive_v152_editorial_preflight.py"
      - ".github/workflows/storia-v150-longer-bw-technical-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storia-v150-longer-original-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Free FFmpeg and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q "pillow>=10,<13"
      - name: V150 and V151 isolated tests on real bytes, sha and fail-closed permissions
        run: |
          python -m unittest discover -s tests -p "test_storia_rivive_v150_longer_bw_review.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v151_source_locked_handoff.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v152_editorial_preflight.py" -v

  original_source_batch:
    needs: unit_tests
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        batch: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Free FFmpeg, no AI or paid service credentials
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q "pillow>=10,<13"
      - name: SHA-verify original archives and create 2.4s authentic B/W preview clips
        run: |
          set -euo pipefail
          python -m src.storia_rivive_v150_longer_bw_review \
            --manifest config/storia_rivive_v149_five_original_motion_preview.json \
            --batch "${{ matrix.batch }}" \
            --out "output/storia_v150_${{ matrix.batch }}"
      - name: Fail if original film motion or provenance missing
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("output/storia_v150_"+os.environ["BATCH"])/"V150_BATCH_REPORT.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["status"]=="V150_EXTENDED_BW_SOURCE_BATCH_READY",r
          assert not r["is_finished_video"] and not r["publish_permitted"]
          assert not r["rights_italy_verified"] and not r["artistic_approved"]
          assert r["paid_api_calls"]==0 and r["real_i2i_generated"]==r["real_vidu_generated"]==0
          PY
      - name: Retain only short preview clips, not original copyrighted archive files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_V150_LONGER_BW_${{ matrix.batch }}_${{ github.run_id }}
          path: |
            output/storia_v150_${{ matrix.batch }}/V150_BATCH_REPORT.json
            output/storia_v150_${{ matrix.batch }}/preview/*.mp4
            output/storia_v150_${{ matrix.batch }}/originals/*/EXACT_FREEZE.png
          retention-days: 14
          if-no-files-found: warn

  combine_longer_preview:
    needs: original_source_batch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Free FFmpeg and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q "pillow>=10,<13"
      - uses: actions/download-artifact@v4
        with:
          pattern: STORIA_V150_LONGER_BW_*
          path: output/storia_v150_batches
          merge-multiple: false
      - name: Verify all 5 source / frame / clip SHA before concatenation
        run: |
          python -m src.storia_rivive_v150_longer_bw_review \
            --manifest config/storia_rivive_v149_five_original_motion_preview.json \
            --artifacts output/storia_v150_batches \
            --out output/storia_v150_review/STORIA_V150_LONGER_REAL_BW_PREVIEW_NOT_FINAL.mp4
      - name: Upload verifiable, review-only longer preview
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_V150_LONGER_REAL_BW_TECHNICAL_PREVIEW_${{ github.run_id }}
          path: |
            output/storia_v150_review/STORIA_V150_LONGER_REAL_BW_PREVIEW_NOT_FINAL.mp4
            output/storia_v150_review/V150_REVIEW_ONLY_REPORT.json
          retention-days: 14
          if-no-files-found: error


  prepare_real_source_locked_frames:
    needs: original_source_batch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pillow only; no Finegrain/Vidu secrets, no AI provider calls
        run: python -m pip install -q "pillow>=10,<13"
      - name: Fetch exact native PNG originals from 3+2 authenticated V150 source batches
        uses: actions/download-artifact@v4
        with:
          pattern: STORIA_V150_LONGER_BW_*
          path: output/storia_v151_verified_inputs
          merge-multiple: false
      - name: Verify real 5 native PNG hashes and prepare candidate I2I/Vidu source inputs
        run: |
          set -euo pipefail
          python -m src.storia_rivive_v151_source_locked_handoff \
            --manifest config/storia_rivive_v149_five_original_motion_preview.json \
            --artifacts output/storia_v151_verified_inputs \
            --out output/storia_v151_review_ready
      - name: Assert this is neither an AI restoration nor a Vidu generation or an approved video
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/storia_v151_review_ready/V151_SOURCE_LOCKED_HANDOFF.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["real_source_frames_sha_verified"]==5
          assert r["candidate_i2i_jobs"]==4 and r["vidu_frame_anchors"]==1
          assert r["real_restored_photos_generated"]==r["real_vidu_clips_generated"]==0
          assert r["provider_requests_sent"]==r["paid_api_calls"]==0
          assert not r["rights_italy_verified"] and not r["artistic_approved"]
          assert not r["publish_permitted"] and not r["gateway_scene_permission_granted"]
          assert not r["source_subjects_are_a_coherent_single_episode_verified"]
          e=r["editorial_preflight"]
          assert e["status"]=="V152_EDITORIAL_SOURCE_COHERENCE_BLOCKED"
          assert e["source_years"]==[1896,1897,1898,1900]
          assert e["scenes_without_documented_place"]==[2,3,5]
          assert not e["provider_jobs_may_start"] and not e["rights_italy_verified"]
          print("V151_TRUE_NATIVE_FRAMES_5_NO_AI_NO_VIDU_NO_SPEND")
          PY
      - name: Store original frame pixels and contact sheet for genuine human QA only
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_V151_FIVE_REAL_ORIGINAL_FREEZES_I2I_INPUTS_NOT_GENERATED_${{ github.run_id }}
          path: |
            output/storia_v151_review_ready/V151_SOURCE_LOCKED_HANDOFF.json
            output/storia_v151_review_ready/V152_EDITORIAL_PREFLIGHT.json
            output/storia_v151_review_ready/V151_FIVE_ORIGINAL_FRAMES_VISUAL_REVIEW.jpg
            output/storia_v151_review_ready/native_frames/*.png
            output/storia_v151_review_ready/review_crops/*.png
          if-no-files-found: error
          retention-days: 14
