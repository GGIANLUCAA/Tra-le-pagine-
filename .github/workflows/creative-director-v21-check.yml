name: "Creative Director V21 — tests hooks e social"
on:
  pull_request:
    branches: [main]
    paths:
      - "src/creative_director_v21.py"
      - "src/production_runner_v16.py"
      - "config/creative_director_v21.json"
      - "tests/test_creative_director_v21.py"
      - ".github/workflows/creative-director-v21-check.yml"
  push:
    branches: [main, "feature/creative-director-v21-*"]
    paths:
      - "src/creative_director_v21.py"
      - "src/production_runner_v16.py"
      - "config/creative_director_v21.json"
      - "tests/test_creative_director_v21.py"
      - ".github/workflows/creative-director-v21-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FFmpeg, Pillow e test senza API a pagamento
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<13"
          python -m py_compile src/creative_director_v21.py src/production_runner_v16.py
          python -m unittest discover -s tests -p "test_creative_director_v21.py" -v
