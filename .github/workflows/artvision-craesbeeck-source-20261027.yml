name: "ArtVision source | Craesbeeck Saint Anthony | 2026-10-27"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-craesbeeck-source-20261027.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch and validate authentic Commons reproduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --location --retry 2 --retry-delay 3 --connect-timeout 15 --max-time 120 -A 'ArtVision/1.0 (https://github.com/GGIANLUCAA/Tra-le-pagine-)' 'https://upload.wikimedia.org/wikipedia/commons/c/ca/Joos_van_Craesbeeck_-The_Temptation_of_St_Anthony.jpg' -o source/CRAESBEECK_TEMPTATION_KARLSRUHE.jpg
          test "$(stat -c%s source/CRAESBEECK_TEMPTATION_KARLSRUHE.jpg)" -gt 500000
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          im=Image.open('source/CRAESBEECK_TEMPTATION_KARLSRUHE.jpg')
          im.verify()
          im=Image.open('source/CRAESBEECK_TEMPTATION_KARLSRUHE.jpg')
          assert im.size == (2606,1748),im.size
          print('VALID_ARTWORK_IMAGE',im.size)
          PY
          sha256sum source/*.jpg > source/SHA256SUMS.txt
          printf '%s\n' 'Joos van Craesbeeck, The Temptation of Saint Anthony, circa 1650, Staatliche Kunsthalle Karlsruhe, inventory 2764' 'https://commons.wikimedia.org/wiki/File:Joos_van_Craesbeeck_-The_Temptation_of_St_Anthony.jpg' 'Commons PD-Art reproduction of public-domain painting; EXIF claims photo copyright, territorial/commercial release review required.' 'Do not treat as automatic social-publication approval.' > source/SOURCE_RIGHTS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ArtVision-20261027-Craesbeeck-Authentic-Source
          path: source/
          retention-days: 7
          if-no-files-found: error
