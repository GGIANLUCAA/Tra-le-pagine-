name: "V40 - true live-action motion gate"
on:
  pull_request:
    paths:
      - "src/real_action_v40.py"
      - "src/effetti_v4.py"
      - "tests/test_real_action_v40.py"
      - ".github/workflows/real-action-v40-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "numpy>=1.25,<3" "opencv-python-headless>=4.8,<5" "pillow>=10,<13"
      - name: Check V40 action and no-fake-motion
        run: python -m unittest discover -s tests -p 'test_real_action_v40.py' -v
      - name: Check existing V4 code is syntactically valid
        run: python -m py_compile src/real_action_v40.py src/effetti_v4.py
