name: "LIBRI — Rip Van Winkle · 17 tavole Rackham · anteprima gratuita"
on:
  push:
    branches: [main]
    paths:
      - "queue/rip_van_winkle_20261029.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: libri-rip-van-winkle-20261029
  cancel-in-progress: false
jobs:
  visual_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate this request (no paid generation, no voice substitution)
        run: |
          python - <<'PY'
          import json
          q=json.load(open("queue/rip_van_winkle_20261029.json"))
          assert q["episode"]=="rip_van_winkle_20261029"
          assert q["paid_video_api_calls"] is False
          assert q["social_publish"] is False
          assert q["tts_mode"]=="blocked_until_gacrux_free_quota_and_visual_review"
          print("RIP VAN WINKLE: 17 historical illustrations; NO PAID I2V, NO UNAUTHORIZED TTS")
          PY
      - name: Install open-source rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1 fonts-dejavu-core
          python -m pip install --quiet "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "pillow>=10,<13" "numpy>=1.25,<3" "soundfile>=0.12,<1"
          python -m py_compile tools/rip_van_winkle_20261029.py
      - name: Download 17 authentic color plates and render 26s non-narrated visual preview
        run: python tools/rip_van_winkle_20261029.py
      - name: Upload genuine verified preview, storyboard, cover and source hashes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RIP_VAN_WINKLE_17_TAVOLE_ANTEPRIMA_NON_FINALE
          path: output/rip_van_winkle_20261029/
          if-no-files-found: error
          retention-days: 14
      - name: Declare honest state
        if: always()
        run: |
          if [ -f output/rip_van_winkle_20261029/QA_STATO_REALE.json ]; then
            cat output/rip_van_winkle_20261029/QA_STATO_REALE.json
          else
            echo "::warning::Source or rendering failed: no video claim, no paid retry."
          fi
          echo "No Gacrux TTS call; quota not confirmed. No final MP4, no Vidu charges, no archive import."

      - name: Persist verified status and real run URL (not the artifact itself)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          path=Path("output/rip_van_winkle_20261029/QA_STATO_REALE.json")
          report=json.loads(path.read_text()) if path.exists() else {
            "episode":"rip_van_winkle_20261029","status":"render_failed_or_source_unavailable",
            "narrated_master_exists":False,"paid_video_calls":0}
          report["run_id"]=os.environ["GITHUB_RUN_ID"]
          report["run_url"]="https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+report["run_id"]
          report["artifact_name"]="RIP_VAN_WINKLE_17_TAVOLE_ANTEPRIMA_NON_FINALE" if path.exists() else None
          report["artifact_uploaded"]="pending_action_result" if path.exists() else False
          report["not_final"]=True
          data=json.dumps(report,ensure_ascii=False,indent=2)+"\n"
          body=json.dumps({"message":"Record real Rip Van Winkle free preview run status",
             "content":base64.b64encode(data.encode()).decode()})
          cmd=["gh","api","-X","PUT","repos/"+os.environ["GITHUB_REPOSITORY"]+
               "/contents/reports/rip_van_winkle_20261029_run.json","--input","-"]
          r=subprocess.run(cmd,input=body,text=True,capture_output=True)
          print("REPORT_PERSISTED",r.returncode==0,report["run_url"])
          if r.returncode:print("REPORT_ERROR",r.stderr[:400])
          PY
