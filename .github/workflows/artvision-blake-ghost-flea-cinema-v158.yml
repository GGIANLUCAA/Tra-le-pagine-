name: ArtVision V158 · William Blake Ghost of a Flea Cinema authentic source
on:
  push:
    branches: [main]
    paths:
      - requests/artvision/blake-ghost-flea-cinema-v158.json
permissions:
  contents: read
concurrency:
  group: artvision-owner-blake-ghost-flea-cinema-v158-once
  cancel-in-progress: false
jobs:
  cinema_review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact-sourced renderer before starting
        run: python -m py_compile src/artvision_blake_ghost_flea_cinema_v158.py
      - name: Verify exact authorized selected work
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("requests/artvision/blake-ghost-flea-cinema-v158.json").read_text())
          q=json.loads(Path("queue/artvision_owner_selected_ten_20261102.json").read_text())
          assert r["work_id"]=="blake_ghost_flea_1819_tate_n05889"
          assert r["owner_automation_id"]=="6adca191603c8191a90d5190901cd034"
          assert r["run_once_only"] is True
          assert r["variant"]=="cinema_standard" and r["public_title"]=="The Ghost of a Flea"
          assert not r["allow_paid_calls"] and not r["social_publish"] and not r["gold_v25"]
          assert any(w["id"]==r["work_id"] and w["slots_delivered_this_selection"]==0 for w in q["works"])
          PY
      - name: Enforce exact Tate N05889 image source and PDM private review before any render
        run: |
          python - <<'PY'
          import json
          r=json.load(open('requests/artvision/blake-ghost-flea-cinema-v158.json'))
          assert r['source_sha1']=='51da1f35117b912466e4f7c330389fed546831fe'
          assert r['source_bytes']==2223999 and r['source_pixels']==[1609,2196]
          assert r['license_status']=='Commons_PD_Art_PDM_Tate_UK_claim_noted'
          assert r['no_commercial_publication_or_Gold'] and r['source_fail_closed_on_429']
          PY
      - name: Install no-paid runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless imageio-ffmpeg
          mkdir -p /tmp/artvision-bin
          python - <<'PY'
          from imageio_ffmpeg import get_ffmpeg_exe
          from pathlib import Path
          src=Path(get_ffmpeg_exe())
          assert src.is_file()
          Path("/tmp/artvision-bin/ffmpeg").symlink_to(src)
          PY
          echo "/tmp/artvision-bin" >> "$GITHUB_PATH"
          /tmp/artvision-bin/ffmpeg -version | head -1
      - name: Render only one MP4 candidate
        run: python src/artvision_blake_ghost_flea_cinema_v158.py --output /tmp/blake_ghost_v158
      - name: Validate physical MP4 and SHA
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("/tmp/blake_ghost_v158")
          q=json.loads((p/"QA_V158.json").read_text())
          f=p/q["mp4"]["filename"]
          assert f.is_file() and f.stat().st_size>100000
          assert hashlib.sha256(f.read_bytes()).hexdigest()==q["mp4"]["sha256"]
          assert q["mp4"]["full_ffmpeg_decode"]=="PASS"
          assert q["mp4"]["frames"]==960 and q["mp4"]["duration_seconds"]==48
          assert q["gold_v25"] is False and q["social_published"] is False
          assert (p/"BLAKE_GHOST_FLEA_CINEMA_V158_REVIEW_PACKAGE.zip").is_file()
          print("VERIFIED",q["mp4"]["sha256"],f.stat().st_size)
          PY
      - name: Save real MP4 and package for readback
        uses: actions/upload-artifact@v4
        with:
          name: BLAKE_GHOST_FLEA_V158_CINEMA_REVIEW_MP4
          path: |
            /tmp/blake_ghost_v158/BLAKE_THE_GHOST_OF_A_FLEA_CINEMA_V158_REVIEW.mp4
            /tmp/blake_ghost_v158/BLAKE_GHOST_FLEA_CINEMA_V158_REVIEW_PACKAGE.zip
            /tmp/blake_ghost_v158/QA_V158.json
            /tmp/blake_ghost_v158/COVER.jpg
            /tmp/blake_ghost_v158/CONTACT_SHEET_V158.jpg
          if-no-files-found: error
          retention-days: 30
