name: "V75 Parigi — longer museum-style film intro (1896-1900)"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storia-v75-paris-long-title.yml"
      - "src/storia_v75_paris_longer_elegant_title.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: storia-v75-longer-title
  cancel-in-progress: false
jobs:
  build_reference_correct:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only free CPU video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip -q install --no-cache-dir opencv-python-headless pillow numpy
      - name: Compile V75 render script
        run: python -m py_compile src/storia_v75_paris_longer_elegant_title.py
      - name: Reuse original verified Paris film and photographic AI images (zero new AI quota)
        run: |
          set -euo pipefail
          mkdir -p output/storia_v75_paris
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 160 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/12885194313/zip" --output /tmp/ARCHIVAL_FOOTAGE_AND_PHOTOS.zip
          unzip -t /tmp/ARCHIVAL_FOOTAGE_AND_PHOTOS.zip >/dev/null
          unzip -oq /tmp/ARCHIVAL_FOOTAGE_AND_PHOTOS.zip -d output/storia_v75_paris
          test -s output/storia_v75_paris/PELICOLA_PARIGI_ORIGINALE.webm
          test -s output/storia_v75_paris/FOTO_AI_03.png
          test -s output/storia_v75_paris/PHOTO_QA.json
      - name: Real B/W motion > exact historical freeze > generative AI PHOTO still > next original moving scene
        run: python -u src/storia_v75_paris_longer_elegant_title.py
      - name: Compare reference format, verify MP4 and ZIP
        run: |
          set -euo pipefail
          D=output/storia_v75_paris
          python -u src/storia_rivive_v74_effect_gate.py --video "$D/LA_STORIA_RIVIVE_PARIGI_1896_1900_V75.mp4" --min-cycles 3 --report "$D/FORMAT_QA_V75.json"
          ffmpeg -v error -xerror -i "$D/LA_STORIA_RIVIVE_PARIGI_1896_1900_V75.mp4" -f null -
          unzip -t "$D/PARIGI_1896_1900_VIDEO_COMPLETO_V75.zip"
          ffprobe -v error -show_entries stream=codec_name,width,height -of json "$D/LA_STORIA_RIVIVE_PARIGI_1896_1900_V75.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PARIGI_1896_1900_V75_CORRECT_REFERENCE_EFFECT
          path: |
            output/storia_v75_paris/LA_STORIA_RIVIVE_PARIGI_1896_1900_V75.mp4
            output/storia_v75_paris/PARIGI_1896_1900_VIDEO_COMPLETO_V75.zip
            output/storia_v75_paris/FONTI_E_QA.json
            output/storia_v75_paris/FORMAT_QA_V75.json
            output/storia_v75_paris/COPERTINA.jpg
          if-no-files-found: warn
          retention-days: 14
      - name: Make permanently downloadable Android MP4 and ZIP via GitHub release
        run: |
          set -euo pipefail
          D=output/storia_v75_paris
          TAG=storia-rivive-parigi-1896-1900-titolo-museale-v75
          files=("$D/LA_STORIA_RIVIVE_PARIGI_1896_1900_V75.mp4" "$D/PARIGI_1896_1900_VIDEO_COMPLETO_V75.zip" "$D/COPERTINA.jpg" "$D/FONTI_E_QA.json")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --latest=false --title "La Storia Rivive — Parigi 1896-1900 V75, titolo museale e durata estesa" --notes "V75 update requested by user: a slightly longer 3-scene montage with a tasteful opening title PARIGI 1896-1900 over original black-and-white moving film. Retains the approved frame freeze to photoreal AI still effect. Three real moving archival shots from Paris 1896-1900, freeze of same historical frame followed by source-locked full color photographic AI reconstruction held motionless. No continuous video colorization. Original music; no Vidu credits; source and AI photography from previous real V71 run. AI colors/face details are reconstructions. Human creative and Italian reuse-rights reviews pending. Not uploaded to social or private site." "${files[@]}"
          fi
          local_bytes=$(stat -c %s "$D/LA_STORIA_RIVIVE_PARIGI_1896_1900_V75.mp4")
          remote_bytes=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[]|select(.name=="LA_STORIA_RIVIVE_PARIGI_1896_1900_V75.mp4")|.size')
          test "$local_bytes" = "$remote_bytes"
          echo "MP4_DOWNLOAD_VERIFIED $local_bytes"
