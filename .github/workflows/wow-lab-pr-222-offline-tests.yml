name: WOW LAB PR222 — offline-only safety regression
on:
  push:
    branches:
      - experiment/wow-lab-hour-index-fix-20261107
    paths:
      - "wow_lab/**"
      - ".github/workflows/wow-lab-pr-222-offline-tests.yml"
permissions:
  contents: read
concurrency:
  group: wow-lab-pr222-tests-only
  cancel-in-progress: false
jobs:
  offline_regression:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only free CPU test libraries
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "Pillow>=10,<12" "opencv-python-headless>=4.8,<5"
      - name: Syntax and complete WOW LAB offline unit tests; no rendering
        run: |
          python -m py_compile wow_lab/engine.py
          python -m unittest discover -s wow_lab/tests -v
      - name: Assert paid/API and publication gates are preserved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("wow_lab/config.json").read_text())
          for k in ("no_paid_services", "no_vidu", "no_social_publish",
                    "no_core_config_edits", "no_core_automation_edits",
                    "no_original_master_overwrite"):
              assert cfg[k] is True, k
          assert cfg["production_ready"] is False
          print("WOW LAB OFFLINE TESTS ONLY; no model/API task or video generated")
          PY
