name: "G0DM0D3 FREE | OpenRouter read-only entitlement probe"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/g0dm0d3-free-connection-probe.yml"
permissions:
  contents: read
jobs:
  free_only_diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY_PRIMARY: ${{ secrets.OPENRUTER3 }}
      OPENROUTER_API_KEY_ALT: ${{ secrets.OPENRUTER2 }}
    steps:
      - name: GET-only key presence and live free-model pricing verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          models=("google/gemma-4-26b-a4b-it:free","google/gemma-4-31b-it:free")
          url="https://openrouter.ai/api/v1/models"
          req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"TraLePagine-ReadOnlyProbe"})
          try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                  result=json.load(resp)
              indexed={x.get('id'):x for x in result.get('data',[]) if isinstance(x,dict)}
              candidates=[(id_, obj) for id_,obj in indexed.items() if isinstance(id_,str)
                          and id_.endswith(':free') and (obj.get('architecture') or {}).get('output_modalities') in (['text'], ['text','image'])]
              print('AVAILABLE_ZERO_COST_TEXT_MODEL_CANDIDATES',json.dumps(
                  [id_ for id_,obj in candidates if str((obj.get('pricing') or {}).get('prompt')) in ('0','0.0','0.000000')
                   and str((obj.get('pricing') or {}).get('completion')) in ('0','0.0','0.000000')][:40]))
              for name in models:
                  entry=indexed.get(name)
                  pricing=entry.get('pricing') if entry else None
                  zero=bool(pricing and str(pricing.get('prompt')) in ('0','0.0','0.000000')
                            and str(pricing.get('completion')) in ('0','0.0','0.000000'))
                  print('OPENROUTER_MODEL_READ_ONLY',name,
                        'listed=',bool(entry),'zero_prompt_completion=',zero)
          except Exception as exc:
              print('OPENROUTER_MODEL_LIST_UNAVAILABLE',type(exc).__name__)
          primary=os.environ.get('OPENROUTER_API_KEY_PRIMARY','').strip()
          alt=os.environ.get('OPENROUTER_API_KEY_ALT','').strip()
          key=primary or alt
          print('GITHUB_OPENROUTER_SECRET_PRESENT',bool(key))
          print('GITHUB_OPENROUTER_SECRET_SOURCE',
                'OPENRUTER3' if primary else 'OPENRUTER2' if alt else 'NONE')
          if not key:
              print('NO_KEY_NO_MODEL_POST_NOT_CONNECTED_TO_GITHUB_ACTIONS')
          else:
              req=urllib.request.Request("https://openrouter.ai/api/v1/key",
                headers={"Authorization":"Bearer "+key,"Accept":"application/json",
                         "User-Agent":"TraLePagine-ReadOnlyProbe"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as resp:
                      doc=json.load(resp)
                  data=doc.get("data",{})
                  print('OPENROUTER_READ_ONLY_KEY_API_STATUS_200', True)
                  print('OPENROUTER_KEY_INFO_EXISTS', isinstance(data,dict))
              except urllib.error.HTTPError as exc:
                  print('OPENROUTER_READ_ONLY_KEY_API_HTTP',exc.code)
              except Exception as exc:
                  print('OPENROUTER_READ_ONLY_KEY_API_UNAVAILABLE',type(exc).__name__)
          identities=[]
          for label,token in [('OPENRUTER3',primary),('OPENRUTER2',alt)]:
              if not token:
                  print('KEY_QUOTA_READONLY',label,'absent')
                  continue
              get=urllib.request.Request("https://openrouter.ai/api/v1/key",
                  headers={'Authorization':'Bearer '+token,'Accept':'application/json',
                           'User-Agent':'TraLePagine-ReadOnlyQuota'})
              try:
                  with urllib.request.urlopen(get,timeout=20) as res:
                      info=json.load(res)['data']
                  quota=info.get('free_model_daily_requests') or {}
                  print('KEY_QUOTA_READONLY',label,'remaining=',quota.get('remaining'),
                        'used=',quota.get('used'),'limit=',quota.get('limit'))
                  identities.append(info.get('creator_user_id'))
              except urllib.error.HTTPError as e:
                  print('KEY_QUOTA_READONLY',label,'HTTP',e.code)
              except Exception as e:
                  print('KEY_QUOTA_READONLY',label,type(e).__name__)
          if len(identities)==2:
              print('TWO_EXISTING_KEYS_SAME_USER',bool(identities[0] and identities[0]==identities[1]))
          print('POST_REQUESTS=0 MODEL_CALLS=0 VIDEO_RENDER=0')
          PY
