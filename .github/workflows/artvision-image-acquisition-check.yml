name: ArtVision image acquisition offline checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<14' 'requests>=2.31,<3' 'numpy>=1.26,<3'
      - run: python -m unittest discover -s tests -p 'test_artvision_image_acquisition.py' -v
      - run: python -m unittest discover -s tests -p 'test_artvision*py' -v
      - run: python -m py_compile scripts/artvision_cinema_duo_v30.py scripts/artvision_autoproduction_20261024_2015.py scripts/artvision_seed_image_archive.py
