name: "ArtVision - Klimt film finale, opere meno ripetitive"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-klimt-quality-v6.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  klimt:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Installazione FFmpeg e librerie"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
          python -m py_compile modules/artvision/batch5_cinema_v6.py
      - name: "Klimt: meno duplicati e stile Cinema V6 approvato"
        run: python modules/artvision/batch5_cinema_v6.py --artist klimt
      - name: "Consegna MP4 e copertina finali"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "ARTVISION_KLIMT_FINALE_QUALITY"
          path: |
            output/artvision-batch5-cinema/klimt/film/*.mp4
            output/artvision-batch5-cinema/klimt/film/*.jpg
            output/artvision-batch5-cinema/klimt/film/*.json
            output/artvision-batch5-cinema/klimt/film/*.txt
          if-no-files-found: error
          retention-days: 7
