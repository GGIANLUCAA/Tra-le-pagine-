name: ArtVision V220 · Two truly new originals — source gate
on:
  push:
    branches: [pilot/artvision-two-new-paintings-v220]
    paths: [.github/workflows/artvision-two-new-source-gate-v220.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Get verified, correctly licensed original art ONLY
        run: |
          python -m pip install -q Pillow
          python - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,os,time,pathlib,io
          from PIL import Image,ImageOps,ImageDraw
          out=pathlib.Path('artvision_v220_original_sources');out.mkdir(exist_ok=True)
          choices={
           'schwabe_death_gravedigger':{'file':'Der Tod des Totengrabers.jpg','license':'CC BY-SA 4.0','pixels':(1524,2131),'year':'1895–1900','artist':'Carlos Schwabe','title':'Death and the Gravedigger','source':'https://commons.wikimedia.org/wiki/File:Der_Tod_des_Totengrabers.jpg'},
           'vasnetsov_knight_crossroads':{'file':'Victor Vasnetsov - Knight at the Crossroads - Google Art Project.jpg','license':'Public domain','pixels':(5527,3065),'year':'1882','artist':'Viktor Vasnetsov','title':'Knight at the Crossroads','source':'https://commons.wikimedia.org/wiki/File:Victor_Vasnetsov_-_Knight_at_the_Crossroads_-_Google_Art_Project.jpg'}
          }
          headers={'User-Agent':'ArtVisionSourceQA/1.0 (art attribution source review; no paid API)', 'Accept':'application/json'}
          def fetch(url,timeout=70):
           err=None
           for n in range(3):
            try:
             with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=timeout) as response:
              return response.read()
            except Exception as e:
             err=e;print('RETRY',str(e)[:120],flush=True);time.sleep(n+2)
           raise err
          results={}
          for key,c in choices.items():
           param=urllib.parse.urlencode({'action':'query','format':'json','titles':'File:'+c['file'],
                    'prop':'imageinfo','iiprop':'url|sha1|size|mime|extmetadata'})
           q=json.loads(fetch('https://commons.wikimedia.org/w/api.php?'+param))
           p=next(iter(q['query']['pages'].values()))
           if 'imageinfo' not in p:raise RuntimeError('No Commons exact file metadata: '+key)
           i=p['imageinfo'][0]
           license=i.get('extmetadata',{}).get('LicenseShortName',{}).get('value','')
           print('SOURCE_METADATA',key,license,i.get('size'),i.get('sha1'),flush=True)
           if key.startswith('schwabe') and not ('CC BY-SA 4.0' in license):raise RuntimeError('Schwabe license changed: '+license)
           if key.startswith('vasnetsov') and not ('Public domain' in license or 'PD' in license):raise RuntimeError('Vasnetsov license not safely verified: '+license)
           # Wikimedia direct originals can return 429 to Actions. Document the
           # exact original Commons SHA1 in metadata, but use a faithful JPEG
           # resize proxy only as a TRANSPARENT fallback (no original SHA claim).
           raw=None;used_url=None;byte_exact=False
           original=i['url'].split('?')[0]
           fallback=[
              original,
              original+'?width=original&download=1',
              'https://wsrv.nl/?url='+urllib.parse.quote(original,safe='')+'&w=1600&output=jpg&q=92',
              'https://images.weserv.nl/?url='+urllib.parse.quote(original,safe='')+'&w=1600&output=jpg&q=92',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+urllib.parse.quote(c['file'])+'?width=1600',
              i.get('thumburl','')
           ]
           for candidate in fallback:
            if not candidate:continue
            try:
             probe=fetch(candidate,timeout=40)
             pic=Image.open(io.BytesIO(probe));pic.verify()
             pic=Image.open(io.BytesIO(probe)).convert('RGB')
             if min(pic.size)<750 or len(probe)<90000:
              raise ValueError('proxy preview insufficient')
             raw=probe;used_url=candidate
             byte_exact=(len(raw)==i['size'] and hashlib.sha1(raw).hexdigest()==i['sha1'].lower())
             if pic.size!=c['pixels'] and byte_exact:raise RuntimeError('Exact original size mismatch')
             print('SOURCE_DELIVERED',key,pic.size,'byte_exact',byte_exact,'from',candidate[:105],flush=True)
             break
            except Exception as error:
             print('CANDIDATE_UNAVAILABLE',key,str(error)[:105],flush=True)
           if raw is None:raise RuntimeError('NO IMAGE HOST AVAILABLE for '+key)
           im=Image.open(io.BytesIO(raw)).convert('RGB')
           name=key+'.jpg'
           (out/name).write_bytes(raw)
           rec={**c,'filename':name,'original_url':i['url'],'license_verified':license,
                 'original_commons_sha1':i['sha1'],'byte_exact_commons_original':byte_exact,
                 'usable_image_url':used_url,'actual_image_pixels':list(im.size),
                 'sha1':hashlib.sha1(raw).hexdigest(),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
           results[key]=rec
           print('ORIGINAL_VERIFIED',key,im.size,rec['sha256'],flush=True)
          (out/'SOURCE_MANIFEST_V220.json').write_text(json.dumps({'status':'TWO_SOURCE_VERIFIED_PAINTING_REPRODUCTIONS_NOT_MOVIES','entries':results,'museum_frame_verified':False,'approved_final_movie':False},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ARTVISION_V220_TWO_NEW_ARTWORK_SOURCE_VERIFIED
          path: artvision_v220_original_sources/
          retention-days: 14
          if-no-files-found: warn
