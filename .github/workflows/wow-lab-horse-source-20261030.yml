name: "WOW LAB Horse Fair isolated authentic source"
on:
  push:
    branches:
      - experiment/wow-lab-horse-fair-20261030
    paths:
      - "wow_lab/experiments/horse_fair/source.py"
      - ".github/workflows/wow-lab-horse-source-20261030.yml"
permissions:
  contents: read
concurrency:
  group: wow-lab-horse-source
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "Pillow>=10,<12"
      - run: python wow_lab/experiments/horse_fair/source.py
      - uses: actions/upload-artifact@v4
        with:
          name: WOW_LAB_HORSE_FAIR_MET_CC0_SOURCE
          path: wow_lab/experiments/horse_fair/assets/*
          retention-days: 14
          if-no-files-found: error
