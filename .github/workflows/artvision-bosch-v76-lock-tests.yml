name: ArtVision V76 — Bosch-only fourth pilot lock regression
on:
  pull_request:
    paths:
      - config/artvision_pilot_lock_v58.json
      - src/artvision_pilot_guard_v58.py
      - src/artvision_next_render_v55.py
      - tests/test_artvision_bosch_fourth_pilot_v76.py
      - .github/workflows/artvision-bosch-v76-lock-tests.yml
permissions:
  contents: read
jobs:
  scoped-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run fourth-pilot exact artwork tests and old pilot guard
        run: |
          python -m unittest discover -s tests -p 'test_artvision_bosch_fourth_pilot_v76.py' -v
          python -m unittest discover -s tests -p 'test_artvision_pilot_guard_v58.py' -v
      - name: Validate Bosch completed four-review states and exact fifth Wright scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('config/artvision_pilot_lock_v58.json').read_text())
          queue=json.loads(Path('queue/artvision_four_variants_s01_20261028.json').read_text())
          fourth=lock['authorized_fourth_pilot']
          assert fourth['allowed_group_id']=='bosch_garden_earthly_delights_prado_p002823'
          assert fourth['automatic_fifth_artwork_selection'] is False
          assert lock['automatic_new_artwork_selection'] is False
          assert lock['no_paid_video_calls'] and lock['no_social_publish']
          group=[g for g in queue['groups'] if g['group_id']==fourth['allowed_group_id']]
          assert len(group)==1 and group[0]['artwork']==fourth['allowed_title']
          states=group[0]['variants']
          assert all(states[v]['status']=='rendered_needs_review' for v in
                     ('critico_standard','critico_museum','cinema_standard','cinema_museum'))
          expected={
            'critico_standard':'2c59c58185ed3d7c51d280bf9c8442414cddf163a231fef08fd7a37d657b0ded',
            'critico_museum':'73b1a97d0640123e38184db7f20334c0de4db318594a8dd728ff0e537253854b',
            'cinema_standard':'3eb4a29c00b5d937f9385fef583a39dcccb754073328258db9f8b3b940acb2ba',
            'cinema_museum':'67ad38e0c3ec63c6c6a9e2c925252a515208dd357d0e6c26b0c5dd762177d508'
          }
          assert all(states[v]['rendered_mp4_sha256']==sha for v,sha in expected.items())
          assert all(v.get('V25_approved') is False for v in states.values())
          fifth=lock['authorized_fifth_pilot']
          assert fifth['enabled'] and fifth['phase']=='fifth_pilot_wright_only'
          assert fifth['allowed_group_id']=='wright_air_pump_1768'
          assert fifth['automatic_sixth_artwork_selection'] is False
          assert all(g.get('group_id')!='a_sixth_unapproved_artwork' for g in queue['groups'])
          print('Bosch historical tests preserved; fifth Wright exact authorization; no sixth: PASS')
          PY
