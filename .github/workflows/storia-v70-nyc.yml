name: "V70 NYC 1903 — source verification before paid/free image quota"
on:
  pull_request:
    paths:
      - "src/storia_v70_nyc_new_film.py"
      - "src/storia_v70_qa_gate.py"
      - "tests/test_storia_v70_qa_gate.py"
      - "config/storia_v70_nyc_failed_source.json"
      - ".github/workflows/storia-v70-nyc.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip -q install --no-cache-dir numpy opencv-python-headless Pillow
      - run: python -m unittest discover -s tests -p "test_storia_v70_qa_gate.py" -v
      - run: python -m py_compile src/storia_v70_nyc_new_film.py src/storia_v70_qa_gate.py
  produce:
    if: github.event_name == 'workflow_dispatch'
    needs: preflight_tests
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip -q install --no-cache-dir numpy opencv-python-headless Pillow gradio_client
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: "Fail BEFORE any AI if original historical source review is rejected"
        run: python src/storia_v70_qa_gate.py --review config/storia_v70_nyc_failed_source.json
      - name: "Produce only quality-gated historical film"
        run: python -u src/storia_v70_nyc_new_film.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NYC_1903_V70_REAL_SOURCE_AI_RESTORATION
          path: output/storia_v70_nyc1903/
          retention-days: 14
          if-no-files-found: warn
