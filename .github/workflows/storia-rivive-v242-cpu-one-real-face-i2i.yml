name: "La Storia Rivive V242 · ONE real source-locked free CPU GAN photo (NO PAID API)"
on:
  pull_request:
    paths:
      - ".github/workflows/storia-rivive-v242-cpu-one-real-face-i2i.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: storia-v242-single-free-cpu-gan-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one_real_source_locked_cpu_i2i:
    if: github.event_name == 'pull_request' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Exactly one V242 no-credit run, reject future replay
        id: gate
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$PR_HEAD_SHA"
          if [[ "$(git log -1 --format=%s "$PR_HEAD_SHA")" == 'storia V242: one CPU photo after offline test fix [V242-REPAIR-ONCE]' ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.allowed == 'true'
        with:
          python-version: '3.11'
      - name: Install only free Gradio client and Pillow
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python -m pip install -q "pillow>=10,<13" "gradio_client>=1,<2"
      - name: Regressions source lock and no fake final
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python -m py_compile src/storia_rivive_v242_cpu_face_i2i_trial.py
          python -m unittest discover -s tests -p test_storia_rivive_v242_cpu_face_i2i_trial.py -v
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.allowed == 'true'
        with:
          name: v236-lusitania-face-first-real-film-and-one-free-i2i-NOT-FINAL
          run-id: 41536737929
          github-token: ${{ github.token }}
          path: output/v242/V236_AUTHENTIC_INPUT
      - name: Verify original film PNG exact SHA and editorial lockdown
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=output/v242/V236_AUTHENTIC_INPUT/lusitania_departure_1915_v220/FOUR_PHOTO_INPUTS_ONE_VIDU_ANCHOR/frame_04.png
          echo "716a886ab8583f87d2f9c28e7cb7a236f4243f029e95f29e2cfed85ddf029f10  $SOURCE" | sha256sum --check --status
          python src/storia_rivive_v242_cpu_face_i2i_trial.py --source "$SOURCE" --out output/v242/REAL_CPU_RESTORATION --offline
      - name: ONE free CPU GAN face-enhancement call on real original image
        if: steps.gate.outputs.allowed == 'true'
        id: generation
        continue-on-error: true
        env:
          HF_TOKEN: ''
          HUGGING_FACE_HUB_TOKEN: ''
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=output/v242/V236_AUTHENTIC_INPUT/lusitania_departure_1915_v220/FOUR_PHOTO_INPUTS_ONE_VIDU_ANCHOR/frame_04.png
          timeout 540s python src/storia_rivive_v242_cpu_face_i2i_trial.py --source "$SOURCE" --out output/v242/REAL_CPU_RESTORATION
      - name: Strictly distinguish a real new photo vs offline provider failure
        if: always() && steps.gate.outputs.allowed == 'true'
        env:
          ACTUAL_OUTCOME: ${{ steps.generation.outcome }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,hashlib
          p=Path('output/v242/REAL_CPU_RESTORATION')
          f=p/'V242_REAL_MEDIA_QA_NOT_FINAL.json'
          r=json.loads(f.read_text()) if f.is_file() else {}
          image=p/'V242_REAL_CPU_GFP_GAN_FACE_I2I.png'
          valid=(os.environ.get('ACTUAL_OUTCOME')=='success' and image.is_file()
                 and r.get('result_sha256')==hashlib.sha256(image.read_bytes()).hexdigest()
                 and r.get('successful_new_images')==1)
          if not valid:
              r.update(status='REAL_CPU_PROVIDER_DID_NOT_RETURN_NEW_VERIFIED_IMAGE',
                       successful_new_images=0)
          r.update(new_final_episodes_delivered=0,artistic_QA_approved=False,
                   publish_allowed=False,credits_spent=0)
          p.mkdir(parents=True,exist_ok=True)
          f.write_text(json.dumps(r,indent=2)+'\n')
          print('V242',r['status'],'NEW_FINAL_0/4')
          if not valid:
              raise SystemExit('V242_NEEDS_REAL_PROVIDER_OUTPUT')
          PY
      - name: Preserve true original/candidate A-B or failure report, NOT publish
        if: always() && steps.gate.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storia-v242-one-real-cpu-face-i2i-trial-NOT-FINAL
          retention-days: 14
          if-no-files-found: warn
          path: output/v242/REAL_CPU_RESTORATION/
