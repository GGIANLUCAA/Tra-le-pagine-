name: ArtVision Böcklin · Critico Standard + Museum V102 (one Gacrux)
on:
  push:
    branches: [main]
    paths:
      - requests/artvision/bocklin-critico-v102.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artvision-bocklin-critico-v102-one-voice-no-repeat
  cancel-in-progress: false
jobs:
  two_critico:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Preflight without API calls or secrets leakage
        env:
          ART_VOICE_TIER: ${{ vars.ARTVISION_GEMINI_PROJECT_BILLING_TIER }}
        run: |
          python - <<'PY'
          import json,os
          p='requests/artvision/bocklin-critico-v102.json'
          j=json.load(open(p))
          assert j['work_id']=='bocklin_isle_of_dead_1883_berlin_ng2_80'
          assert j['max_paid_api_calls']==0
          assert j['run_once_only'] is True
          if os.environ.get('ART_VOICE_TIER')!='Free':
              raise SystemExit('BLOCKED - Google AI Studio project Free tier not verified. No voice call authorized.')
          else:
              print('Project declared Free tier; proceed with one voice attempt.')
          PY
      - name: Python and FFmpeg dependencies
        run: |
          python -m pip install --disable-pip-version-check "google-genai>=2.25.0" numpy pillow soundfile scipy faster-whisper opencv-python-headless
          ffmpeg -version | head -1
          ffmpeg -hide_banner -encoders | grep -q libx264
      - name: Only ONE real Italian Gacrux narration (never re-bill retries)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARTVISION_GEMINI_PROJECT_BILLING_TIER: ${{ vars.ARTVISION_GEMINI_PROJECT_BILLING_TIER }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python src/artvision_bocklin_critico_voice_v102.py
          python - <<'PY'
          import json
          p='output/artvision_bocklin_critico_v102/VOICE_RESULT_V102.json'
          r=json.load(open(p))
          assert r['status']=='ONE_SHARED_GACRUX_WAV_READY',r['status']
          assert r['voice']=='Gacrux'
          PY
      - name: Download authenticated artwork/frame and compare SHA256 before render
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'src')
          from artvision_bocklin_sixth_v101 import obtain,SOURCE,FRAME,sha
          dest=Path('output/artvision_bocklin_critico_v102')
          obtain(SOURCE,dest/'art_ng2_80.jpg',(4933,2628))
          obtain(FRAME,dest/'frame_2018.jpg',(4680,2742))
          assert sha(dest/'art_ng2_80.jpg')=='f9a7c33f1b7a2aae03aacd192706faee3740cfd9d1d277516dec39795f405ce3'
          assert sha(dest/'frame_2018.jpg')=='72655ceea488c5f4ecf207dd5a419618685b0ee0c59d553f63cbbba0bb623b65'
          PY
      - name: Two genuine Critico MP4 with IDENTICAL shared AAC and complete decode
        run: |
          python src/artvision_bocklin_critico_render_v102.py \
            --recipe modules/artvision_critico/production_series/bocklin_isle_of_dead_1883_v100.json \
            --art output/artvision_bocklin_critico_v102/art_ng2_80.jpg \
            --frame output/artvision_bocklin_critico_v102/frame_2018.jpg \
            --voice-dir output/artvision_bocklin_critico_v102 \
            --output output/artvision_bocklin_critico_v102
      - name: Save actual files, SHA/QA and any failure diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_BOECKLIN_NG2-80_CRITICO_V102_REVIEW
          path: |
            output/artvision_bocklin_critico_v102/VOICE_RESULT_V102.json
            output/artvision_bocklin_critico_v102/ALLINEAMENTO_VOCE.json
            output/artvision_bocklin_critico_v102/VOICE_CACHE_V13.json
            output/artvision_bocklin_critico_v102/COPIONE_ESATTO_V102.txt
            output/artvision_bocklin_critico_v102/VOCE.wav
            output/artvision_bocklin_critico_v102/Boecklin_1883_critico_standard_V102_GACRUX_REVIEW.mp4
            output/artvision_bocklin_critico_v102/Boecklin_1883_critico_museum_V102_GACRUX_REVIEW.mp4
            output/artvision_bocklin_critico_v102/BOECKLIN_CRITICO_V102_QA.json
          retention-days: 30
          if-no-files-found: warn
