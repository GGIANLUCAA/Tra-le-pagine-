name: ArtVision · Simberg Garden of Death Cinema V134
on:
  push:
    branches: [main]
    paths:
      - requests/artvision/simberg-garden-v134.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artvision-owner-simberg-garden-v134
  cancel-in-progress: false
jobs:
  cinema_review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact authorized selected work
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("requests/artvision/simberg-garden-v134.json").read_text())
          q=json.loads(Path("queue/artvision_owner_selected_ten_20261102.json").read_text())
          assert r["work_id"]=="simberg_garden_death_1896_fng_a_ii_968_16"
          assert r["variant"]=="cinema_standard" and r["public_title"]=="The Garden of Death"
          assert not r["allow_paid_calls"] and not r["social_publish"] and not r["gold_v25"]
          assert any(w["id"]==r["work_id"] and w["slots_delivered_this_selection"]==0 for w in q["works"])
          PY
      - name: Install no-paid runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless imageio-ffmpeg
          mkdir -p /tmp/artvision-bin
          python - <<'PY'
          from imageio_ffmpeg import get_ffmpeg_exe
          from pathlib import Path
          src=Path(get_ffmpeg_exe())
          assert src.is_file()
          Path("/tmp/artvision-bin/ffmpeg").symlink_to(src)
          PY
          echo "/tmp/artvision-bin" >> "$GITHUB_PATH"
          ffprobe -version | head -1
      - name: Render only one MP4 candidate
        run: python src/artvision_garden_v134.py --output /tmp/simberg_v134
      - name: Validate physical MP4 and SHA
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("/tmp/simberg_v134")
          q=json.loads((p/"QA_V134.json").read_text())
          f=p/q["mp4"]["filename"]
          assert f.is_file() and f.stat().st_size>100000
          assert hashlib.sha256(f.read_bytes()).hexdigest()==q["mp4"]["sha256"]
          assert q["mp4"]["full_ffmpeg_decode"]=="PASS"
          assert q["mp4"]["frames"]==960 and q["mp4"]["duration_seconds"]==48
          assert q["gold_v25"] is False and q["social_published"] is False
          assert (p/"ARTVISION_SIMBERG_GARDEN_V134_REVIEW_PACKAGE.zip").is_file()
          print("VERIFIED",q["mp4"]["sha256"],f.stat().st_size)
          PY
      - name: Save real MP4 and package for readback
        uses: actions/upload-artifact@v4
        with:
          name: SIMBERG_GARDEN_OF_DEATH_V134_CINEMA_REVIEW_MP4
          path: |
            /tmp/simberg_v134/SIMBERG_THE_GARDEN_OF_DEATH_CINEMA_V134_REVIEW.mp4
            /tmp/simberg_v134/ARTVISION_SIMBERG_GARDEN_V134_REVIEW_PACKAGE.zip
            /tmp/simberg_v134/QA_V134.json
            /tmp/simberg_v134/COVER.jpg
            /tmp/simberg_v134/CONTACT_SHEET_V134.jpg
          if-no-files-found: error
          retention-days: 30
