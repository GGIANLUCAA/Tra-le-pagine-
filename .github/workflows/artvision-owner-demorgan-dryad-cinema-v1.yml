name: "ArtVision OWNER | Evelyn De Morgan The Dryad | SHA-fixed Cinema private review"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-owner-demorgan-dryad-cinema-v1.yml"
permissions:
  contents: read
concurrency:
  group: artvision-owner-single-heavy-render
  cancel-in-progress: false
jobs:
  render_new_cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact user selection and avoid already produced Dryad slot
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_owner_demorgan_dryad_cinema_v1.py
          python - <<'PY'
          import json,pathlib
          q=json.loads(pathlib.Path('research/artvision_owner_selected_30_future_20261109.json').read_text())
          matches=[w for w in q['works'] if w.get('title_as_chosen')=='The Dryad' and w.get('artist_as_chosen')=='Evelyn De Morgan']
          assert len(matches)==1, 'The Dryad missing from owner-selected 30'
          assert not list(pathlib.Path('queue').glob('artvision_owner_30_render_checkpoint_*dryad*.json')), 'already checkpointed'
          print('VERIFIED one selected Evelyn De Morgan The Dryad 1884–85; authentic source, no paid APIs.')
          PY
      - name: Install local free rendering libraries
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5'
      - name: Download canonical renamed Commons original (SHA1/82.8MB) and render genuine Dryad MP4
        run: python scripts/artvision_owner_demorgan_dryad_cinema_v1.py
      - name: Independently check media duration, rights metadata, source and Android ZIP
        shell: bash
        run: |
          set -euo pipefail
          d=output/artvision-owner-demorgan-dryad-cinema-v1
          ffprobe -v error -show_streams -show_format -of json "$d/VIDEO_REVIEW.mp4" > "$d/FFPROBE.json"
          ffmpeg -v error -xerror -i "$d/VIDEO_REVIEW.mp4" -map 0 -f null -
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID_720_REVIEW.mp4" -map 0 -f null -
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          p=Path('output/artvision-owner-demorgan-dryad-cinema-v1')
          src=p/'ORIGINAL_ARTWORK.jpg';hq=p/'VIDEO_REVIEW.mp4';phone=p/'VIDEO_ANDROID_720_REVIEW.mp4';zp=p/'ANDROID_REVIEW_PACKAGE.zip'
          sha=lambda x:hashlib.sha256(x.read_bytes()).hexdigest()
          from PIL import Image
          meta=json.loads((p/'SOURCES_RIGHTS.json').read_text())
          assert meta['museum']=='De Morgan Collection'
          assert meta['original_full_sha1_from_wikimedia_metadata']=='a46fbc28e7b9ab21bc384b7b4f684cc3a0a3871a'
          assert meta['full_original_verified_locally_against_sha1_and_bytes'] is True
          assert meta['full_original_bytes']==82826574
          assert meta['original_full_pixels_from_wikimedia_metadata']==[8726,21359]
          with Image.open(src) as im:
            assert im.size[0] in (2560,1920,1600)
            assert abs(im.size[1]/im.size[0] - 21359/8726) < .002
          assert meta['source_sha1']==hashlib.sha1(src.read_bytes()).hexdigest()
          assert meta['source_pixels'][0] in (2560,1920,1600)
          print('DRYAD_COMMONS_DERIVATIVE_IMAGE_SHA1_PIXELS_MATCH')
          qa=json.loads((p/'QA_TECHNICAL.json').read_text())
          assert qa['source_sha256']==sha(src)
          assert qa['full_original_source_sha1_verified'] is True
          assert qa['full_original_source_size_bytes']==82826574
          assert qa['source_sha1']==hashlib.sha1(src.read_bytes()).hexdigest()
          assert qa['mp4_sha256']==sha(hq)
          assert qa['android_mp4_sha256']==sha(phone)
          assert qa['scene_count']==12 and 48<qa['duration_seconds']<57
          assert not qa['gold'] and not qa['published'] and qa['paid_api_calls']==0
          probe=json.loads((p/'FFPROBE.json').read_text())
          v=[s for s in probe['streams'] if s.get('codec_type')=='video']
          a=[s for s in probe['streams'] if s.get('codec_type')=='audio']
          assert len(v)==1 and v[0]['codec_name']=='h264' and v[0]['width']==1080 and v[0]['height']==1920
          assert len(a)==1 and a[0]['codec_name']=='aac'
          with zipfile.ZipFile(zp) as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read(phone.name)).hexdigest()==qa['android_mp4_sha256']
          print('SOURCE_SHA1_ACTUAL_VERIFIED',qa['source_sha1'])
          print('MP4_1080_SHA256:',sha(hq))
          print('MP4_ANDROID_SHA256:',sha(phone))
          print('ANDROID_ZIP_SHA256:',sha(zp))
          print('FFMPEG_DECODE_PASS ZIP_CRC_PASS HUMAN_REVIEW_PENDING NOT_GOLD NOT_PUBLISHED')
          PY
      - name: V330 | select one of 20 fixed real tracks and produce music-matched Android copy
        shell: bash
        run: |
          set -euo pipefail
          d=output/artvision-owner-demorgan-dryad-cinema-v1
          python src/artvision_music_selector_v330.py \
            --title "The Dryad" \
            --artist "Evelyn De Morgan" \
            --moods "magical,mysterious" \
            --pin "magic_forest" \
            --source-video "$d/VIDEO_ANDROID_720_REVIEW.mp4" \
            --review-video "$d/VIDEO_ANDROID_MUSIC20_REVIEW.mp4" \
            --cache "$d/verified_music" \
            --prepare \
            --out-json "$d/MUSIC_V330_PROOF.json"
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          d=Path('output/artvision-owner-demorgan-dryad-cinema-v1')
          qa=json.loads((d/'QA_TECHNICAL.json').read_text())
          music=json.loads((d/'MUSIC_V330_PROOF.json').read_text())
          src=d/'VIDEO_ANDROID_720_REVIEW.mp4'
          review=d/'VIDEO_ANDROID_MUSIC20_REVIEW.mp4'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(src)==qa['android_mp4_sha256']
          assert music['selected']['track_id']=='magic_forest'
          assert music['license_status']=='ACTUAL_BINARY_SHA256_FFPROBE_VERIFIED'
          assert music['review']['source_video_sha256']==sha(src)
          assert music['review']['review_video_sha256']==sha(review)
          assert music['review']['full_decode_video_audio']=='PASS'
          assert music['published'] is False
          p=d/'ANDROID_REVIEW_MUSIC20_PACKAGE.zip'
          with zipfile.ZipFile(p,'w',zipfile.ZIP_DEFLATED,compresslevel=3) as z:
            for x in [review,d/'COVER.jpg',d/'CONTACT_SHEET.jpg',
                      d/'SOURCES_RIGHTS.json',d/'STORYBOARD.json',
                      d/'QA_TECHNICAL.json',d/'SOCIAL_DRAFTS.json',
                      d/'MUSIC_V330_PROOF.json']:
              z.write(x,x.name)
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read(review.name)).hexdigest()==sha(review)
          print('DRYAD_MUSIC20_REAL_MP3_VERIFIED',json.dumps({
            'song':'Magic Forest','isrc':music['selected']['isrc'],
            'review_video_sha256':sha(review),'review_zip_sha256':sha(p),
            'published':False,'human_review':'PENDING'}))
          PY
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID_MUSIC20_REVIEW.mp4" -map 0 -f null -
      - name: Save genuine new video, cover, sources and Android delivery package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_OWNER_DEMORGAN_DRYAD_NEW_CINEMA_REVIEW
          retention-days: 30
          if-no-files-found: error
          path: |
            output/artvision-owner-demorgan-dryad-cinema-v1/ORIGINAL_ARTWORK.jpg
            output/artvision-owner-demorgan-dryad-cinema-v1/VIDEO_REVIEW.mp4
            output/artvision-owner-demorgan-dryad-cinema-v1/VIDEO_ANDROID_720_REVIEW.mp4
            output/artvision-owner-demorgan-dryad-cinema-v1/ANDROID_REVIEW_PACKAGE.zip
            output/artvision-owner-demorgan-dryad-cinema-v1/VIDEO_ANDROID_MUSIC20_REVIEW.mp4
            output/artvision-owner-demorgan-dryad-cinema-v1/ANDROID_REVIEW_MUSIC20_PACKAGE.zip
            output/artvision-owner-demorgan-dryad-cinema-v1/MUSIC_V330_PROOF.json
            output/artvision-owner-demorgan-dryad-cinema-v1/COVER.jpg
            output/artvision-owner-demorgan-dryad-cinema-v1/CONTACT_SHEET.jpg
            output/artvision-owner-demorgan-dryad-cinema-v1/SOURCES_RIGHTS.json
            output/artvision-owner-demorgan-dryad-cinema-v1/STORYBOARD.json
            output/artvision-owner-demorgan-dryad-cinema-v1/QA_TECHNICAL.json
            output/artvision-owner-demorgan-dryad-cinema-v1/FFPROBE.json
  independent_artifact_readback:
    needs: render_new_cinema
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ARTVISION_OWNER_DEMORGAN_DRYAD_NEW_CINEMA_REVIEW
          path: /tmp/dryad-readback
      - name: Ensure ffmpeg on independent runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Re-download, full-decode, compare SHA and ZIP CRC in separate job
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/dryad-readback
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID_MUSIC20_REVIEW.mp4" -map 0 -f null -
          ffmpeg -v error -xerror -i "$d/VIDEO_REVIEW.mp4" -map 0 -f null -
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID_720_REVIEW.mp4" -map 0 -f null -
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          p=Path('/tmp/dryad-readback')
          qa=json.loads((p/'QA_TECHNICAL.json').read_text())
          h=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert h(p/'VIDEO_REVIEW.mp4')==qa['mp4_sha256']
          assert h(p/'ORIGINAL_ARTWORK.jpg')==qa['source_sha256']
          assert h(p/'VIDEO_ANDROID_720_REVIEW.mp4')==qa['android_mp4_sha256']
          with zipfile.ZipFile(p/'ANDROID_REVIEW_PACKAGE.zip') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('VIDEO_ANDROID_720_REVIEW.mp4')).hexdigest()==qa['android_mp4_sha256']
          music=json.loads((p/'MUSIC_V330_PROOF.json').read_text())
          review=p/'VIDEO_ANDROID_MUSIC20_REVIEW.mp4'
          assert h(review)==music['review']['review_video_sha256']
          with zipfile.ZipFile(p/'ANDROID_REVIEW_MUSIC20_PACKAGE.zip') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('VIDEO_ANDROID_MUSIC20_REVIEW.mp4')).hexdigest()==h(review)
          print('MUSIC20_REAL_FFMPEG_SHA_AND_ZIP_CRC_PASS')
          print('SEPARATE_JOB_PHYSICAL_ARTIFACT_READBACK_PASS NO_GOLD NO_PUBLICATION')
          PY
