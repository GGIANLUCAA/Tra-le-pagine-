name: "Tra le Pagine - Poe visual preflight"
on:
  push:
    branches: [main]
    paths:
      - "src/illustrate_cuore_20261027.py"
      - "episodes/10_cuore_rivelatore_20261027/**"
      - ".github/workflows/cuore-rivelatore-visuals.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image renderer
        run: python -m pip install "pillow>=10,<13"
      - name: Generate original illustrations and contact sheet
        run: |
          python src/illustrate_cuore_20261027.py --out episodes/10_cuore_rivelatore_20261027/images
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          base=Path('episodes/10_cuore_rivelatore_20261027/images')
          paths=sorted(base.glob('scena_*.jpg'))
          assert len(paths)==16
          sheet=Image.new('RGB',(4*240,4*448),(14,22,30))
          for i,p in enumerate(paths):
              with Image.open(p) as im:
                  im.thumbnail((230,420))
                  x=(i%4)*240+(240-im.width)//2
                  y=(i//4)*448+10
                  sheet.paste(im,(x,y))
          sheet.save('CUORE_RIVELATORE_CONTACT_SHEET.jpg',quality=88)
          print('READY',len(paths),'distinct original images')
          PY
          python src/episode_v3.py --episode 10_cuore_rivelatore_20261027
      - uses: actions/upload-artifact@v4
        with:
          name: CUORE_RIVELATORE_SCENE_PREVIEW
          path: |
            episodes/10_cuore_rivelatore_20261027/images/
            CUORE_RIVELATORE_CONTACT_SHEET.jpg
          retention-days: 14
          if-no-files-found: error
