name: "Storia Rivive V65 — selezione riprese Parigi 1918"
on:
  pull_request:
    paths:
      - "src/storia_rivive_v65_paris_source_contact.py"
      - ".github/workflows/storia-rivive-v65-scout.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scout_real_archival_scene:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Python and FFmpeg setup"
        run: |
          python -m pip -q install --no-cache-dir opencv-python-headless Pillow
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: "Verify precise CC0 license and view entire film across timed contact frames"
        run: |
          python -u src/storia_rivive_v65_paris_source_contact.py
      - name: "Save source, contact sheets and provenance for film production"
        uses: actions/upload-artifact@v4
        with:
          name: PARIS_1918_V65_CC0_SCOUT
          path: |
            output/storia_rivive_v65_paris_1918/PARIS_1918_ARCHIVIO_CC0.webm
            output/storia_rivive_v65_paris_1918/CONTACT_*.jpg
            output/storia_rivive_v65_paris_1918/SOURCE_PROVENANCE.json
            output/storia_rivive_v65_paris_1918/FRAME_INDEX.json
          retention-days: 14
