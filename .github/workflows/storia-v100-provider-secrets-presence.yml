name: "La Storia Rivive V100 - check provider secret names without disclosing keys"
on:
  push:
    branches: ["research/storia-free-hd-restoration-v100-20261030"]
    paths: [".github/workflows/storia-v100-provider-secrets-presence.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      ALIBABA_DASHSCOPE_API_KEY: ${{ secrets.ALIBABA_DASHSCOPE_API_KEY }}
      ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: "Only verify existence; print names, not values; no provider requests"
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json
          keys=("HF_TOKEN","HUGGINGFACE_TOKEN","HF_API_TOKEN",
                "DASHSCOPE_API_KEY","ALIBABA_DASHSCOPE_API_KEY","ALIBABA_API_KEY",
                "QWEN_API_KEY","FAL_KEY","REPLICATE_API_TOKEN",
                "MODELSCOPE_API_KEY","RUNPOD_API_KEY")
          result={k:bool(os.getenv(k,"").strip()) for k in keys}
          grouped={"hugging_face":any(result[k] for k in keys[:3]),
                   "alibaba_model_studio":any(result[k] for k in keys[3:7]),
                   "fal_ai":result["FAL_KEY"],
                   "replicate":result["REPLICATE_API_TOKEN"],
                   "modelscope":result["MODELSCOPE_API_KEY"],
                   "runpod":result["RUNPOD_API_KEY"]}
          report={"schema":"storia-provider-secrets-presence-v100",
                  "checked_secret_names":result,
                  "provider_groups":grouped,
                  "secret_values_read_or_logged":False,
                  "api_calls":0,
                  "billing_checked":False,
                  "credentials_validated":False,
                  "note":"Presence alone does not prove a key is valid or any free tier is active."}
          print("PROVIDER_SECRET_PRESENCE_ONLY",json.dumps(grouped,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## Provider secrets presence only (no API calls)\n\n")
            for key,present in grouped.items():
              f.write(f"- {key}: **{'configured' if present else 'missing'}**\n")
            f.write("\nSecrets values never logged. No service has been charged.\n")
          with open("PROVIDER_SECRET_PRESENCE.json","w") as f:
            json.dump(report,f,indent=2)
          PY
      - name: "Preserve key names and presence booleans (never values)"
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_V100_PROVIDER_SECRET_PRESENCE_ONLY
          path: PROVIDER_SECRET_PRESENCE.json
          retention-days: 7
