name: "AI Director | Keyless archives & Android research reports"

on:
  pull_request:
    paths:
      - "src/ai_director_keyless_archives_v1.py"
      - "src/ai_director_source_handoff_v1.py"
      - "tests/test_ai_director_source_handoff_v1.py"
      - "examples/ai_director_goldfinch_observed_catalogue_20261112.json"
      - "examples/ai_director_goldfinch_v34_source_scene.json"
      - "config/ai_director_curated_source_aliases_v1.json"
      - "src/ai_director_external_apis_v1.py"
      - "tests/test_ai_director_keyless_archives_v1.py"
      - "tests/test_ai_director_external_apis_v1.py"
      - ".github/workflows/ai-director-external-apis-v1.yml"
      - "docs/AI_DIRECTOR_API_CONNECTORS_V1.md"
      - "docs/AI_DIRECTOR_SOURCE_HANDOFF_V1.md"
  push:
    branches: [main]
    paths:
      - "src/ai_director_keyless_archives_v1.py"
      - "src/ai_director_source_handoff_v1.py"
      - "tests/test_ai_director_source_handoff_v1.py"
      - "examples/ai_director_goldfinch_observed_catalogue_20261112.json"
      - "examples/ai_director_goldfinch_v34_source_scene.json"
      - "config/ai_director_curated_source_aliases_v1.json"
      - "src/ai_director_external_apis_v1.py"
      - "tests/test_ai_director_keyless_archives_v1.py"
      - "tests/test_ai_director_external_apis_v1.py"
      - ".github/workflows/ai-director-external-apis-v1.yml"
  workflow_dispatch:
    inputs:
      category:
        description: "Subject category, or general research"
        type: choice
        required: true
        default: historical_video
        options: [historical_video, historical_photo, art, general]
      query:
        description: "Public research keywords; no private data"
        required: true
        type: string
        default: "Venice 1896"
      artist:
        description: "Optional exact artist/creator name for art queries (e.g. Carel Fabritius)"
        type: string
        required: false
        default: ""
      provider:
        description: "Auto chooses up to four keyless museums/archives; otherwise one"
        type: choice
        default: auto
        required: true
        options: [auto, loc, archive, commons, artic, met, cleveland, wellcome]
      per_provider:
        description: "Maximum candidate results per source (not bulk download)"
        type: choice
        required: true
        default: "2"
        options: ["1", "2", "3"]
      execute:
        description: "Make public read-only API calls (NO keys, NO paid AI, NO downloads)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: ai-director-keyless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline regressions, no API requests or secrets
        run: |
          set -euo pipefail
          python -m py_compile src/ai_director_keyless_archives_v1.py src/ai_director_external_apis_v1.py
          python -m unittest discover -s tests -p 'test_ai_director_keyless_archives_v1.py' -v
          python -m unittest discover -s tests -p 'test_ai_director_source_handoff_v1.py' -v
          python -m unittest discover -s tests -p 'test_ai_director_external_apis_v1.py' -v
          python - <<'PY'
          import json
          assert json.load(open("config/ai_director_external_api_v1.json"))["routes"] == []
          assert json.load(open("config/free_llm_zero_cost_v1.json"))["routes"] == []
          curated=json.load(open("config/ai_director_curated_source_aliases_v1.json"))
          assert curated["schema"]=="ai-director-curated-source-aliases-v1"
          assert all(e["publication_authorized"] is False and e["rights_review"]=="pending"
                     for e in curated["entries"])

          print("PASS: no charged inference and no Europeana key used")
          PY
      - name: Replay true observed Goldfinch catalogue metadata into unapproved V34 source packet
        run: |
          set -euo pipefail
          python src/ai_director_source_handoff_v1.py \
            --research examples/ai_director_goldfinch_observed_catalogue_20261112.json \
            --scene-brief examples/ai_director_goldfinch_v34_source_scene.json \
            --scene-id work_opening \
            --out output/ai_director_demo_intake/
      - name: Attach source-to-scene V34 Android diagnostic
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI_DIRECTOR_GOLDFINCH_SOURCE_INTAKE_${{ github.run_id }}
          path: output/ai_director_demo_intake/
          retention-days: 14
          if-no-files-found: error
  research-and-android-report:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-regression
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CATEGORY: ${{ inputs.category }}
      QUERY: ${{ inputs.query }}
      ARTIST: ${{ inputs.artist }}
      SELECTED_PROVIDER: ${{ inputs.provider }}
      PER_PROVIDER: ${{ inputs.per_provider }}
      EXECUTE: ${{ inputs.execute == true && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Keyless source scout, no media upload/download
        shell: bash
        run: |
          set -euo pipefail
          args=(--category "$CATEGORY" --query "$QUERY" --per-provider "$PER_PROVIDER")
          if [ -n "$ARTIST" ]; then
            args+=(--artist "$ARTIST")
          fi
          if [ "$SELECTED_PROVIDER" != "auto" ]; then
            args+=(--provider "$SELECTED_PROVIDER")
          fi
          if [ "$EXECUTE" = "1" ]; then
            args+=(--execute)
          fi
          if [ "$CATEGORY" = "art" ]; then
            format="artvision_4x1"
          elif [ "$CATEGORY" = "historical_video" ] || [ "$CATEGORY" = "historical_photo" ]; then
            format="storia_rivive"
          else
            format="documentario"
          fi
          python src/ai_director_keyless_archives_v1.py \
            "${args[@]}" --format "$format" \
            --output output/ai_director_archives_v1
          python src/ai_director_source_handoff_v1.py \
            --research output/ai_director_archives_v1/CANDIDATES.json \
            --out output/ai_director_archives_v1/source_handoff
      - name: Android research and AI Director report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI_DIRECTOR_KEYLESS_SOURCES_${{ github.run_id }}
          path: output/ai_director_archives_v1/
          retention-days: 14
          if-no-files-found: error
