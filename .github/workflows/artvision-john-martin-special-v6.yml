name: ArtVision John Martin - Cinema V6 special plus V17
run-name: John Martin Visioni della fine - final MP4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/artvision-john-martin-special-v6.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  john-martin:
    name: John Martin - five-act epic Cinema V6
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Open source movie toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
          python -m py_compile modules/artvision/john_martin_special_v6.py
      - name: Render John Martin film with museum-source credits
        run: python modules/artvision/john_martin_special_v6.py
      - name: Run new V17 non-destructive quality director
        run: |
          python src/quality_director_v17.py \
            --format artvision_cinema \
            --project output/artvision-john-martin-v6-special/john_martin/PROJECT_V13.json \
            --video output/artvision-john-martin-v6-special/john_martin/film/ARTVISION_JOHN_MARTIN_CINEMA_V6.mp4 \
            --out output/artvision-john-martin-v6-special/john_martin/film/QUALITY_V17
      - name: Check final film and rights metadata
        run: |
          python - <<'PY'
          import json,subprocess,pathlib
          root=pathlib.Path("output/artvision-john-martin-v6-special/john_martin")
          movie=root/"film/ARTVISION_JOHN_MARTIN_CINEMA_V6.mp4"
          assert movie.is_file() and movie.stat().st_size>2_000_000,"Missing master"
          report=json.loads((root/"film/REPORT.json").read_text())
          assert report["original_works"]>=9 and report["shots"]>=29,report
          qa=json.loads((root/"film/QUALITY_V17/QUALITY_REPORT_V17.json").read_text())
          assert not qa["blocking"],qa["blocking"]
          spec=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(movie)]))
          v=next(s for s in spec["streams"] if s["codec_type"]=="video")
          assert v["width"]==1080 and v["height"]==1920 and v["codec_name"]=="h264",v
          assert any(s["codec_type"]=="audio" and s["codec_name"]=="aac" for s in spec["streams"])
          assert 116 <= float(spec["format"]["duration"]) <= 120
          print("VERIFIED FINAL",movie,round(movie.stat().st_size/1048576,1),"MiB",report["original_works"],"artworks",report["shots"],"shots")
          PY
      - name: Save MP4 cover storyboard rights and Android QA
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_JOHN_MARTIN_CINEMA_V6_SPECIAL
          path: |
            output/artvision-john-martin-v6-special/john_martin/film/
            output/artvision-john-martin-v6-special/john_martin/PROJECT_V13.json
          if-no-files-found: error
          retention-days: 7
