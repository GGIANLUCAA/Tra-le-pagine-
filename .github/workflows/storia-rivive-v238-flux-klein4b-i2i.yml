name: "La Storia Rivive V238 · one free FLUX.2 Klein 4B real image edit (NO PAID API)"
on:
  pull_request:
    paths:
      - ".github/workflows/storia-rivive-v238-flux-klein4b-i2i.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: storia-v238-flux4b-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  free_alt_photo:
    if: github.event_name == 'pull_request' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: One-shot free model only, no replay on later PR commits
        id: gate
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$HEAD"
          SUBJECT="$(git log -1 --format=%s "$HEAD")"
          if [[ "$SUBJECT" == 'storia V238: test free FLUX2 Klein4B on exact 1915 film portrait [V238-ONCE]' ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'V238_REPLAY_PREVENTED'
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.allowed == 'true'
        with:
          python-version: '3.11'
      - name: Free CPU dependencies, no API billing credentials
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python -m pip install -q 'pillow>=10,<13' 'gradio_client>=1,<2' 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5'
      - name: Offline source/identity regressions
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_storia_rivive_v237_qwen_photo_ab.py' -q
          python -m unittest discover -s tests -p 'test_storia_rivive_v77_identity_guard.py' -q
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.allowed == 'true'
        with:
          name: v236-lusitania-face-first-real-film-and-one-free-i2i-NOT-FINAL
          run-id: 41536737929
          github-token: ${{ github.token }}
          path: output/v238/v236_original_media
      - name: Verify authentic V236 photo source and prior rejected Finegrain SHA
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          E=lusitania_departure_1915_v220
          ROOT="output/v238/v236_original_media/$E"
          SOURCE="$ROOT/FOUR_PHOTO_INPUTS_ONE_VIDU_ANCHOR/frame_04.png"
          PRIOR="$ROOT/FACE_FIRST_REAL_I2I_CANDIDATE/FOTO_RICOSTRUITA_V77_DA_VERIFICARE.png"
          echo "716a886ab8583f87d2f9c28e7cb7a236f4243f029e95f29e2cfed85ddf029f10  $SOURCE" | sha256sum --check --status
          echo "21544bcbf9acb39577141ad9a4ac1c8f7c4da183acc74932dcffd76ff20733a4  $PRIOR" | sha256sum --check --status
          python src/storia_rivive_v238_flux_klein4b_photo.py --source "$SOURCE" --prior "$PRIOR" --out output/v238/flux4b_photo_ab --offline
      - name: ONE anonymous public free ZeroGPU FLUX.2 Klein 4B edit, 4 distilled steps
        id: flux
        if: steps.gate.outputs.allowed == 'true'
        continue-on-error: true
        env:
          HF_TOKEN: ''
          HUGGING_FACE_HUB_TOKEN: ''
        run: |
          set -euo pipefail
          E=lusitania_departure_1915_v220
          ROOT="output/v238/v236_original_media/$E"
          timeout 600s python src/storia_rivive_v238_flux_klein4b_photo.py \
            --source "$ROOT/FOUR_PHOTO_INPUTS_ONE_VIDU_ANCHOR/frame_04.png" \
            --prior "$ROOT/FACE_FIRST_REAL_I2I_CANDIDATE/FOTO_RICOSTRUITA_V77_DA_VERIFICARE.png" \
            --out output/v238/flux4b_photo_ab
      - name: Record actual result, no false success from continue-on-error
        if: always() && steps.gate.outputs.allowed == 'true'
        env:
          ACTUAL_OUTCOME: ${{ steps.flux.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('output/v238/flux4b_photo_ab')
          p=root/'V238_REAL_MEDIA_STATUS.json'
          report=json.loads(p.read_text())
          photo=root/'V238_FLUX2_KLEIN4B_REAL_I2I_CANDIDATE.png'
          ok=os.getenv('ACTUAL_OUTCOME')=='success' and photo.is_file()
          if not ok:
              report['status']='FREE_ZERO_GPU_PROVIDER_REFUSED_OR_FAILED_NO_IMAGE'
              report['provider_attempts']=1
              report['new_real_i2i_candidates']=0
          elif report.get('new_real_i2i_candidates')!=1 or not report.get('generated_photo_sha256'):
              raise SystemExit('V238_UNVERIFIED_GENERATED_IMAGE')
          report.update(human_artistic_approved=False,final_mp4=False,final_zip=False,
                        new_final_episodes_delivered=0,publish_allowed=False,
                        paid_credit_spend_allowed=False)
          p.write_text(json.dumps(report,indent=2)+'\n')
          print('V238_RESULT',report['status'],'NEW_FINAL_0_OF_4')
          if not ok:
              raise SystemExit('V238_FREE_PROVIDER_DID_NOT_RETURN_A_REAL_IMAGE')
          PY
      - name: Upload only real generated image and A/B QA evidence, never release
        if: always() && steps.gate.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storia-v238-flux2-klein4b-real-i2i-ab-NOT-FINAL
          retention-days: 14
          if-no-files-found: warn
          path: output/v238/flux4b_photo_ab/
