name: "ArtVision V52 - Wright Air Pump Cinema - no paid APIs"
run-name: "Wright 1768 real painting / Cinema V6 / review required"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-wright-air-pump-v52-20261028.yml"
permissions:
  contents: read
concurrency:
  group: artvision-wright-air-pump-v52-20261028
  cancel-in-progress: false
jobs:
  wright:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free local renderer dependencies
        run: |
          set -euo pipefail
          command -v ffmpeg || sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "requests>=2.31,<3"
          python -m py_compile scripts/artvision_wright_air_pump_20261028.py
      - name: No paid video API or social publishing
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("scripts/artvision_wright_air_pump_20261028.py").read_text()
          for forbidden in ["VIDU_API_KEY","RUNWARE_API_KEY","KLING_API_KEY","SEEDANCE_API_KEY","GEMINI_API_KEY","requests.post("]:
              assert forbidden not in s, forbidden
          print("ZERO_PAID_VIDEO_API_CALLS")
          PY
      - name: Render real 1768 painting with source music and complete dossier
        run: |
          python scripts/artvision_wright_air_pump_20261028.py
      - name: Independent H264 AAC full decode and ZIP check
        run: |
          set -euo pipefail
          dir="output/artvision-wright-air-pump-20261028/wright_air_pump_20261028_0915"
          film="$dir/VIDEO_MASTER.mp4"
          archive="output/artvision-wright-air-pump-20261028/ARTVISION_V52_WRIGHT_AIR_PUMP_COMPLETE_REVIEW.zip"
          test -s "$film" && test -s "$dir/COPERTINA.jpg" && test -s "$archive"
          ffmpeg -hide_banner -loglevel error -xerror -i "$film" -f null -
          python src/artvision_editorial_post_v28.py --validate-folder "$dir"
          python - "$film" "$archive" "$dir" <<'PY'
          import sys, subprocess, json, zipfile, pathlib, hashlib
          film,archive,folder=sys.argv[1:]
          data=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries",
            "format=duration,size:stream=codec_type,codec_name,width,height","-of","json",film]))
          assert 45<float(data["format"]["duration"])<70
          assert any(s.get("codec_name")=="h264" and (s.get("width"),s.get("height"))==(1080,1920) for s in data["streams"])
          assert any(s.get("codec_name")=="aac" for s in data["streams"])
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert z.getinfo("VIDEO_MASTER.mp4").file_size==pathlib.Path(film).stat().st_size
          qa=json.loads(pathlib.Path(folder,"TECHNICAL_QA_V30.json").read_text())
          assert qa["v44_status"]=="rendered_needs_review"
          assert qa["first_frame_and_cover_verified_against_expected_brand"]
          assert qa["title"]=="An Experiment on a Bird in the Air Pump"
          assert qa["artist"]=="JOSEPH WRIGHT 'OF DERBY'"
          print("V52_VERIFIED_NOT_GOLD_MASTER",hashlib.sha256(pathlib.Path(film).read_bytes()).hexdigest())
          PY
      - name: Preserve actual video, cover, QA and ZIP for Android
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_V52_WRIGHT_AIR_PUMP_RENDERED_NEEDS_REVIEW
          path: |
            output/artvision-wright-air-pump-20261028/wright_air_pump_20261028_0915/VIDEO_MASTER.mp4
            output/artvision-wright-air-pump-20261028/wright_air_pump_20261028_0915/COPERTINA.jpg
            output/artvision-wright-air-pump-20261028/wright_air_pump_20261028_0915/QA_CONTACT_SHEET.jpg
            output/artvision-wright-air-pump-20261028/ARTVISION_V52_WRIGHT_AIR_PUMP_COMPLETE_REVIEW.zip
          retention-days: 60
          if-no-files-found: error
