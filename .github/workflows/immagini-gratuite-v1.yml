name: "Tra le Pagine — Immagini gratuite V1 (prova)"
on:
  push:
    branches: ["feature/immagini-gratuite-horde-v1-20261025"]
    paths:
      - "src/image_pipeline_v1.py"
      - "tests/test_image_pipeline_v1.py"
      - "config/image_pipeline_v1_demo.json"
      - ".github/workflows/immagini-gratuite-v1.yml"
  pull_request:
    paths:
      - "src/image_pipeline_v1.py"
      - "tests/test_image_pipeline_v1.py"
      - "config/image_pipeline_v1_demo.json"
      - ".github/workflows/immagini-gratuite-v1.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan: nessuna API; models: elenco online; generate: prova con chiave"
        required: true
        type: choice
        options:
          - plan
          - models
          - generate
        default: plan
      model:
        description: "Solo per generate: nome esatto ottenuto da models"
        required: false
        type: string
        default: ""
      max_wait:
        description: "Massimo 30-900 secondi per immagine, attesa limitata"
        required: false
        type: number
        default: 240
permissions:
  contents: read
concurrency:
  group: images-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Controlli offline, nessuna API
        run: python -m unittest discover -s tests -p 'test_image_pipeline_v1.py' -v
  image-prototype:
    needs: image-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      AIHORDE_API_KEY: ${{ secrets.AIHORDE_API_KEY }}
      IMAGE_MODE: ${{ inputs.mode }}
      IMAGE_MODEL: ${{ inputs.model }}
      IMAGE_WAIT: ${{ inputs.max_wait }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dipendenze per validare le immagini
        run: python -m pip install --quiet 'Pillow>=10,<13'
      - name: Esegui solo la modalità scelta
        shell: bash
        run: |
          mkdir -p output/image_pipeline_v1
          if [[ "$IMAGE_MODE" == "models" ]]; then
            python src/image_pipeline_v1.py --mode models > output/image_pipeline_v1/MODELLI_DISPONIBILI.json
          elif [[ "$IMAGE_MODE" == "generate" ]]; then
            if [[ -z "$AIHORDE_API_KEY" ]]; then
              echo "Manca il secret AIHORDE_API_KEY: non avvio nessuna generazione."
              exit 2
            fi
            if [[ -z "$IMAGE_MODEL" ]]; then
              echo "Indicare un modello reale dalla modalità models."
              exit 2
            fi
            python src/image_pipeline_v1.py --mode generate --model "$IMAGE_MODEL" \
              --brief config/image_pipeline_v1_demo.json --out output/image_pipeline_v1 \
              --max-wait "$IMAGE_WAIT"
          elif [[ "$IMAGE_MODE" == "plan" ]]; then
            python src/image_pipeline_v1.py --mode plan --brief config/image_pipeline_v1_demo.json \
              --out output/image_pipeline_v1
          else
            echo "Modalità non consentita."
            exit 2
          fi
      - name: Conserva il risultato di prova (non pubblica)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immagini-v1-${{ github.run_id }}
          path: output/image_pipeline_v1/
          if-no-files-found: warn
          retention-days: 14
