name: "ArtVision Socrate V66 · ASR della voce Gacrux già prodotta (zero API)"
on:
  pull_request:
    paths:
      - "src/artvision_socrates_voice_align_v66.py"
      - ".github/workflows/artvision-socrates-gacrux-asr-v66.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: socrates-voice-asr-v66
  cancel-in-progress: false
jobs:
  real-word-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download ORIGINAL WAV + cache by exact GitHub artifact/run, no regeneration
        uses: actions/download-artifact@v4
        with:
          name: SOCRATES_GACRUX_ORIGINAL_AUTHORIZED_V65
          run-id: 40901604669
          repository: GGIANLUCAA/Tra-le-pagine-
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output/artvision-socrates-gacrux-v66/voice
      - name: Install entirely local Whisper ASR and audio decoders
        run: |
          python -m pip install --disable-pip-version-check "faster-whisper>=1.1" "numpy>=1.26" "soundfile>=0.12" "scipy>=1.11"
      - name: Align spoken words to TEN Socrates critique parts, fail closed if only estimates
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python src/artvision_socrates_voice_align_v66.py
      - name: Preserve WAV and verified ASR timecodes for BOTH Critico variants
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOCRATES_GACRUX_SAME_WAV_VERIFIED_ASR_V66
          path: output/artvision-socrates-gacrux-v66/voice/
          if-no-files-found: warn
          retention-days: 30
