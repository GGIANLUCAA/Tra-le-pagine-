name: "ArtVision | Stuck 1912 exact source binary preflight"
on:
  push:
    branches: [main]
    paths: [.github/workflows/artvision-stuck-1912-exact-source-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_exact_source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Download Commons source and verify pixels and SHA
        shell: python
        run: |
          import urllib.request,urllib.parse,json,hashlib,io,pathlib
          from PIL import Image
          title="File:Franz von stuck, il peccato, 1912 ca. 00.jpg"
          api="https://commons.wikimedia.org/w/api.php?"+urllib.parse.urlencode({"action":"query","titles":title,"prop":"imageinfo","iiprop":"url|size|extmetadata","format":"json"})
          req=urllib.request.Request(api,headers={"User-Agent":"ArtVision-Private-Artwork-Research/1.0 (github.com/GGIANLUCAA/Tra-le-pagine-)"})
          with urllib.request.urlopen(req,timeout=35) as response: doc=json.load(response)
          page=next(iter(doc["query"]["pages"].values()))
          assert page.get("title")==title and "imageinfo" in page
          info=page["imageinfo"][0]
          lic=info.get("extmetadata",{}).get("LicenseShortName",{}).get("value","")
          assert lic=="CC BY 3.0",f"License mismatch: {lic}"
          assert info["width"]>=2500 and info["height"]>=3000
          url=info["url"]
          req=urllib.request.Request(url,headers={"User-Agent":"ArtVision-Private-Artwork-Research/1.0 (github.com/GGIANLUCAA/Tra-le-pagine-)"})
          with urllib.request.urlopen(req,timeout=50) as response: data=response.read(20_000_000)
          assert len(data)==info["size"] and len(data)>1_000_000
          im=Image.open(io.BytesIO(data));im.verify()
          im=Image.open(io.BytesIO(data)); assert im.size==(info["width"],info["height"])
          out=pathlib.Path("artvision_stuck_1912_source");out.mkdir(exist_ok=True)
          (out/"ORIGINAL_STUCK_BERLIN_1912.jpg").write_bytes(data)
          manifest={"status":"EXACT_SOURCE_BINARY_VERIFIED_NO_VIDEO","title":title,"object":"Berlin F.V.72 c.1912","photographer":"Sailko","license":lic,"license_url":"https://creativecommons.org/licenses/by/3.0/","source_page":"https://commons.wikimedia.org/wiki/File:Franz_von_stuck,_il_peccato,_1912_ca._00.jpg","pixels":list(im.size),"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"artistic_review":"PENDING","video_count":0}
          (out/"SOURCE_PROOF.json").write_text(json.dumps(manifest,indent=2))
          print("STUCK_EXACT_BINARY_VERIFIED",manifest["pixels"],manifest["sha256"],manifest["bytes"])
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ARTVISION_STUCK_1912_SOURCE_BINARY_VERIFIED
          path: artvision_stuck_1912_source/
          retention-days: 30
