name: "ArtVision V33 • Aivazovsky • The Ninth Wave"
on:
  push:
    branches: [main]
    paths:
      - "scripts/artvision_autoproduction_20261025_2315.py"
      - "config/artvision_autoproduction_20261025_2315.json"
      - ".github/workflows/artvision-autoproduction-v31-20261025-2315.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: artvision-v33-20261025-2315
  cancel-in-progress: false
jobs:
  artvision:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open-source tools
        run: |
          set -euo pipefail
          command -v ffmpeg || sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "Pillow>=10,<14" "numpy>=1.26,<3" "requests>=2.31,<3"
      - name: Verify V6 V25 V28 and researched subject
        id: preflight
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_autoproduction_20261025_2315.py
          python scripts/artvision_autoproduction_20261025_2315.py --painting ninth_wave --preflight-only
          python - <<'PY'
          import sys
          sys.path.insert(0,"src")
          import artvision_editorial_post_v28 as e
          slug="aivazovsky_ninth_wave_20261025_2315"
          errors=e.validate_entry(slug,e.config()["entries"][slug])
          assert not errors,errors
          print("V28_PASS")
          PY
      - name: Fetch authentic 1850 painting and licensed music; render V6
        id: render
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python scripts/artvision_autoproduction_20261025_2315.py --painting ninth_wave --out output/artvision-v31-2315
      - name: Independently verify actual MP4, captions, QA frames and ZIP
        id: verify
        if: steps.render.outcome == 'success'
        run: |
          set -euo pipefail
          folder="output/artvision-v31-2315/aivazovsky_ninth_wave_20261025_2315"
          film="$folder/VIDEO_MASTER.mp4"
          bundle="output/artvision-v31-2315/ARTVISION_V30_AIVAZOVSKY_NINTH_WAVE_20261025_2315_COMPLETE.zip"
          test -s "$film" && test -s "$bundle" && test -s "$folder/COPERTINA.jpg"
          ffmpeg -hide_banner -loglevel error -xerror -i "$film" -f null -
          python src/artvision_editorial_post_v28.py --validate-folder "$folder"
          python - "$film" "$bundle" "$folder" <<'PY'
          import json,subprocess,zipfile,sys,hashlib,pathlib
          film,bundle,folder=sys.argv[1:]
          meta=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration,size:stream=codec_type,codec_name,width,height","-of","json",film]))
          duration=float(meta["format"]["duration"])
          assert 45<=duration<=120,duration
          assert any(s.get("codec_type")=="video" and s.get("codec_name")=="h264" and s.get("width")==1080 and s.get("height")==1920 for s in meta["streams"])
          assert any(s.get("codec_type")=="audio" and s.get("codec_name")=="aac" for s in meta["streams"])
          required={"VIDEO_MASTER.mp4","COPERTINA.jpg","POST_FACEBOOK.txt","POST_INSTAGRAM.txt","POST_TIKTOK.txt","POST_YOUTUBE.txt","POST_EDITORIAL_RESEARCH.json","VIDEO_RECIPE_V13.json","TECNICHE_REGIA.md","ISTRUZIONI_REPLICA.md","SOURCES_AND_RIGHTS.md","MUSIC_RELEASE_V20.json","AUDIENCE_RESEARCH_V32.json","MEDIA_SOURCING_V33.json","TECHNICAL_QA_V30.json","QA_CONTACT_SHEET.jpg","ORIGINAL_ARTWORK.jpg","ORIGINAL_LICENSED_MUSIC.mp3"}
          with zipfile.ZipFile(bundle) as z:
            assert z.testzip() is None
            assert required.issubset(z.namelist()),required-set(z.namelist())
          qa=json.loads(pathlib.Path(folder,"TECHNICAL_QA_V30.json").read_text())
          assert qa["full_ffmpeg_decode"] and qa["v25_preflight"]=="PASS"
          assert qa["approval"]=="human_visual_review_pending"
          print("NEW_REAL_MP4_PASS",duration,meta["format"]["size"],hashlib.sha256(pathlib.Path(film).read_bytes()).hexdigest())
          PY
      - name: Upload downloadable original MP4 and complete production ZIP
        if: steps.verify.outcome == 'success'
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: ArtVision-V33-20261025-Aivazovsky-The-Ninth-Wave
          path: |
            output/artvision-v31-2315/aivazovsky_ninth_wave_20261025_2315/VIDEO_MASTER.mp4
            output/artvision-v31-2315/aivazovsky_ninth_wave_20261025_2315/COPERTINA.jpg
            output/artvision-v31-2315/aivazovsky_ninth_wave_20261025_2315/QA_CONTACT_SHEET.jpg
            output/artvision-v31-2315/ARTVISION_V30_AIVAZOVSKY_NINTH_WAVE_20261025_2315_COMPLETE.zip
          if-no-files-found: error
          retention-days: 60
      - name: Register factual result, never declare Gold Master
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          RENDER: ${{ steps.render.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const path='queue/artvision_autoproduction_v31_state.json';
            const folder='output/artvision-v31-2315/aivazovsky_ninth_wave_20261025_2315';
            const film=folder+'/VIDEO_MASTER.mp4';
            const ok=['PREFLIGHT','RENDER','VERIFY','ARCHIVE'].every(k=>process.env[k]==='success');
            const exists=fs.existsSync(film);
            let qa=null;try{qa=JSON.parse(fs.readFileSync(folder+'/TECHNICAL_QA_V30.json','utf8'))}catch(e){}
            const event={cycle_id:'20261025T2315+0100',created_at:new Date().toISOString(),
              artist:'Ivan Aivazovsky',work:'The Ninth Wave',format:'artvision_cinema',baseline:'cinema_v6',
              subtype:'new_standalone_authentic_artwork',
              reason_fallback:'Natural Google Gacrux TTS not verifiable free/available; no robotic narration or wrong voice',
              status:ok?'technical_pass_not_gold_master':'blocked_or_rendered_needs_review',
              mp4_verified:ok&&exists,duration_seconds:ok?qa?.duration_seconds:null,
              size_bytes:exists?fs.statSync(film).size:null,
              sha256_mp4:exists?crypto.createHash('sha256').update(fs.readFileSync(film)).digest('hex'):null,
              workflow_run_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              artifact_name:'ArtVision-V33-20261025-Aivazovsky-The-Ninth-Wave',
              steps:{preflight:process.env.PREFLIGHT,render:process.env.RENDER,verify:process.env.VERIFY,archive:process.env.ARCHIVE},
              gold_master_approved:false,social_published:false,external_video_library_import:'not_attempted'};
            for(let attempt=0;attempt<4;attempt++){
              const old=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
              const state=JSON.parse(Buffer.from(old.data.content,'base64').toString('utf8'));
              state.cycle_log=state.cycle_log||[];
              const i=state.cycle_log.findIndex(x=>x.cycle_id===event.cycle_id);
              if(i>=0)state.cycle_log[i]=event;else state.cycle_log.push(event);
              state.updated=new Date().toISOString();
              if(ok)state.next_preferred_format='artvision_critico';
              try{
                await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,
                  message:'ArtVision V33: factual Aivazovsky render and QA outcome',
                  content:Buffer.from(JSON.stringify(state,null,2)+'\n').toString('base64'),sha:old.data.sha,branch:'main'});
                core.info('STATE_REGISTERED '+event.status);break;
              }catch(e){if(attempt===3)throw e;await new Promise(r=>setTimeout(r,1300*(attempt+1)))}
            }
