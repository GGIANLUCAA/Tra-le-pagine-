name: "ArtVision Cole - authentic five painting image download probe"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/artvision-thomas-cole-image-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Probe five Commons images and museum originals
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,time
          files=['Cole Thomas The Course of Empire The Savage State 1836.jpg',
                 'Cole Thomas The Course of Empire The Arcadian or Pastoral State 1836.jpg',
                 'Cole Thomas The Consummation The Course of the Empire 1836.jpg',
                 'Cole Thomas The Course of Empire Destruction 1836.jpg',
                 'Cole Thomas The Course of Empire Desolation 1836.jpg']
          H={'User-Agent':'ArtVisionTraLePagine/4.0 (personal creative project; https://github.com/GGIANLUCAA/Tra-le-pagine-)'}
          q='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode({'action':'query','format':'json','formatversion':2,'titles':'|'.join('File:'+f for f in files),'prop':'imageinfo','iiprop':'url|size|extmetadata','iiurlwidth':2500})
          doc=json.load(urllib.request.urlopen(urllib.request.Request(q,headers=H),timeout=30))
          for rec in doc['query']['pages']:
           x=rec.get('imageinfo')
           if not x:
            print('MISSING',rec.get('title'),flush=True);continue
           url=x[0].get('thumburl') or x[0].get('url')
           print('FOUND',rec.get('title'),'dimensions',x[0].get('width'),x[0].get('height'),'url',url,flush=True)
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=22) as r:
             s=r.read(256)
             print('DOWNLOAD',r.status,r.headers.get('Content-Type'),r.headers.get('Content-Length'),s[:8].hex(),flush=True)
           except Exception as e:print('DOWNLOAD FAILED',str(e)[:200],flush=True)
           time.sleep(.4)
          PY
