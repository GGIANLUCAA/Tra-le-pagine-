name: "La Storia Rivive V249 · Fiesole short original film entrances (NO PAID API)"
on:
  pull_request:
    paths:
      - ".github/workflows/storia-rivive-v249-fiesole-short-motion.yml"
permissions:
  contents: read
concurrency:
  group: storia-fiesole-v249-one-recut-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fiesole_source_window_repair:
    if: github.event_name == 'pull_request' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Only run once on exact V249 request; never replay after another PR commit
        id: gate
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$HEAD"
          subject="$(git log -1 --format=%s "$HEAD")"
          if [[ "$subject" == 'storia V249: repair report contract and verify authentic five frames [V249-RETRY-ONCE]' ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'V249_REPLAY_BLOCKED'
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.allowed == 'true'
        with:
          python-version: '3.11'
      - name: Install free offline FFmpeg and image dependencies
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          python -m pip install -q 'pillow>=10,<13'
      - name: Test real source selection gates without API credits
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python -m py_compile src/storia_rivive_v249_fiesole_short_motion_selection.py
          python -m unittest discover -s tests -p 'test_storia_rivive_v248_fiesole_clean_motion_recut.py' -v
          python -m unittest discover -s tests -p 'test_storia_rivive_v249_fiesole_short_motion_selection.py' -v
      - name: Download the genuine 1912 source and 12 original PNG frames, only from Commons
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v217_four_pilot_source_review.py \
            --manifest queue/storia_rivive_four_pilots_v217.json \
            --episode fiesole_straw_hats_1912_v220 --out output/v249/source_order
          python src/storia_rivive_scout_v101.py \
            --order output/v249/source_order/WORK_ORDER.json \
            --out output/v249/real_archive
      - name: Verify 1.4-second authentic entrances before I2I and Vidu
        id: editorial
        if: steps.gate.outputs.allowed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v249_fiesole_short_motion_selection.py \
            --film output/v249/real_archive/ORIGINAL_ARCHIVE.webm \
            --scout output/v249/real_archive/SCOUT_REPORT.json \
            --frames output/v249/real_archive/original_frames \
            --out output/v249/result
      - name: Verify true report status or fail, never call roughcut a finished episode
        if: always() && steps.gate.outputs.allowed == 'true'
        shell: bash
        env:
          EDITORIAL_RESULT: ${{ steps.editorial.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report_path=Path('output/v249/result/V249_FIESOLE_SHORT_WINDOWS.json')
          if not report_path.is_file(): raise SystemExit('V249_NO_REAL_SOURCE_EVIDENCE')
          report=json.loads(report_path.read_text())
          status=report.get('status')
          print('V249_REAL_FILM_RESULT',status,'NEW_FINAL_0_OF_4')
          good=(os.getenv('EDITORIAL_RESULT')=='success'
                and status=='FIVE_SHORT_CLEAN_SOURCE_WINDOWS_READY_FOR_ARTISTIC_REVIEW_NOT_FINAL'
                and len(report.get('selected_five',[]))==5
                and report.get('final_mp4') is False
                and report.get('final_zip') is False
                and report.get('publish_allowed') is False)
          if not good: raise SystemExit('V249_REAL_FIESOLE_MOTION_NOT_ARTISTICALLY_QUALIFIED')
          PY
      - name: Save authentic short-window reports, no paid generations
        if: always() && steps.gate.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storia-v249-fiesole-clean-source-motions-NOT-FINAL
          retention-days: 14
          if-no-files-found: warn
          path: output/v249/result/
