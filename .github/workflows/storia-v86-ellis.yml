name: "V86 ELLIS ISLAND — Generative modern-photo restoration"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storia-v86-ellis.yml"
      - "src/storia_v86_ellis_generative.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generative_faces:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    env:
      HF_HUB_DISABLE_XET: "1"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archival and free image to image toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip -q install --no-cache-dir numpy opencv-python-headless Pillow huggingface_hub onnxruntime gradio_client
      - name: Render and reject missing generative photo restorations
        run: python -u src/storia_v86_ellis_generative.py
      - name: Check playable video
        run: |
          test -s output/storia_v86_ellis_1903/ELLIS_ISLAND_1903_V86.mp4
          ffmpeg -v error -xerror -i output/storia_v86_ellis_1903/ELLIS_ISLAND_1903_V86.mp4 -f null -
          unzip -t output/storia_v86_ellis_1903/ELLIS_ISLAND_1903_KIT_V86.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V86_ELLIS_GENERATIVE_PHOTO_REVIEW
          path: |
            output/storia_v86_ellis_1903/*.mp4
            output/storia_v86_ellis_1903/*.zip
            output/storia_v86_ellis_1903/*.jpg
            output/storia_v86_ellis_1903/*.json
          retention-days: 14
          if-no-files-found: warn
