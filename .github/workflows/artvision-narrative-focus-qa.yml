name: ArtVision Critico - real MP4 focus and camera regression
on:
  pull_request:
    paths:
      - 'src/artvision_narrative_focus_gate.py'
      - 'src/artvision_critico_review_capture_v1.py'
      - 'src/artvision_*critico*.py'
      - 'tests/test_artvision_narrative_focus_gate.py'
      - 'tests/test_artvision_critico_review_capture_v1.py'
      - '.github/workflows/artvision-narrative-focus-qa.yml'
  push:
    branches: [feature/artvision-focus-integration-20261108]
    paths:
      - 'src/artvision_narrative_focus_gate.py'
      - 'src/artvision_critico_review_capture_v1.py'
      - 'src/artvision_*critico*.py'
      - 'tests/test_artvision_narrative_focus_gate.py'
      - 'tests/test_artvision_critico_review_capture_v1.py'
      - '.github/workflows/artvision-narrative-focus-qa.yml'
permissions:
  contents: read
jobs:
  focus_real_media_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Provide real FFmpeg without apt
        run: |
          python -m pip install --disable-pip-version-check "imageio-ffmpeg>=0.6.0,<1"
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          python - <<'PY'
          from imageio_ffmpeg import get_ffmpeg_exe
          from pathlib import Path
          import os
          target=Path(os.environ["RUNNER_TEMP"])/"ffmpeg-bin"/"ffmpeg"
          target.symlink_to(get_ffmpeg_exe())
          assert target.is_file()
          PY
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
      - name: Syntax check every changed Critico renderer
        run: |
          command -v ffmpeg
          python -m py_compile src/artvision_narrative_focus_gate.py src/artvision_critico_review_capture_v1.py tests/test_artvision_narrative_focus_gate.py tests/test_artvision_critico_review_capture_v1.py
          python -m py_compile src/artvision_rebel_critico_standard_v144.py src/artvision_simberg_garden_critico_v146.py src/artvision_bruegel_triumph_critico_v151.py src/artvision_waterhouse_magic_circle_critico_v159.py src/artvision_blake_ghost_flea_critico_v159.py
      - name: Test full-phrase camera and real-MP4 review frame extraction
        run: |
          python -m unittest discover -s tests -p 'test_artvision_narrative_focus_gate.py' -v
          python -m unittest discover -s tests -p 'test_artvision_critico_review_capture_v1.py' -v
