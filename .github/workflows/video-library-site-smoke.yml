name: Video Library Studio - Playback and Download Check
on:
  push:
    paths:
      - .github/workflows/video-library-site-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public video and download
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 - <<'PY'
          import json,subprocess,tempfile,pathlib,urllib.request,urllib.error
          root='https://video-library-studio.600led.workers.dev'
          opener=urllib.request.build_opener()
          opener.addheaders=[('User-Agent','Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36')]
          urllib.request.install_opener(opener)
          with urllib.request.urlopen(root+'/',timeout=25) as page:
              html=page.read().decode('utf-8')
          assert 'Video Library Studio' in html,'Missing site'
          js=html.split('<script>')[-1].split('</script>')[0]
          with tempfile.TemporaryDirectory() as folder:
              jsfile=pathlib.Path(folder)/'frontend.js';jsfile.write_text(js)
              check=subprocess.run(['node','--check',str(jsfile)],capture_output=True,text=True)
              assert check.returncode==0,'Frontend JS syntax error: '+check.stderr
          print('PASS: homepage and frontend JavaScript',flush=True)
          with urllib.request.urlopen(root+'/api/catalog',timeout=45) as response:
              catalog=json.load(response)
          assert not catalog.get('admin'),'Unexpected admin access'
          assert len(catalog.get('items',[]))>=50,'Catalog missing real videos'
          offline=[v for v in catalog['items'] if v.get('available') is False]
          assert len(offline)>=60,'Expected indexed ChatGPT-only entries'
          assert any('Elise' in v.get('name','') for v in offline),'Missing Music Motion entry from ChatGPT'
          print('PASS: ChatGPT-only video records listed accurately:',len(offline),flush=True)
          with urllib.request.urlopen(root+'/api/metadata',timeout=45) as response:
              facts=json.load(response)
          print('PASS: enriched catalog,',len(catalog['items']),'videos,',len(facts),'video records',flush=True)
          assert len(facts)>=75,'Not enough indexed video metadata'
          covers=[v for v in catalog['items'] if v.get('cover')]
          assert len(covers)>=75,'Missing generated posters'
          known=[v for v in catalog['items'] if v.get('duration') and v.get('width') and v.get('height')]
          assert len(known)>=75,'Missing duration or resolution'
          with urllib.request.urlopen(root+covers[0]['cover'],timeout=25) as response:
              thumb=response.read()
              assert response.status==200 and thumb.startswith(b'\xff\xd8\xff'),'Invalid JPEG poster'
          print('PASS: original video posters:',len(covers),'durations:',len(known),'JPEG bytes:',len(thumb),flush=True)

          req=urllib.request.Request(root+'/api/manage',data=b'{}',headers={'Content-Type':'application/json'},method='POST')
          try:
              urllib.request.urlopen(req,timeout=20)
              raise AssertionError('Unprotected admin editing endpoint')
          except urllib.error.HTTPError as e:
              assert e.code==401,'Expected private management HTTP 401, got '+str(e.code)
          print('PASS: editing API rejects visitors without access',flush=True)
          req=urllib.request.Request(root+'/api/delete',data=b'{"key":"notafile.mp4","confirm":"notafile.mp4"}',headers={'Content-Type':'application/json'},method='POST')
          try:
              urllib.request.urlopen(req,timeout=20)
              raise AssertionError('Permanent deletion API is not protected')
          except urllib.error.HTTPError as e:
              assert e.code==401,'Expected private deletion HTTP 401, got '+str(e.code)
          assert 'data-act="hide"' in html or 'Rimuovi dal sito' in html,'Remove-from-catalog button absent'
          assert 'id="deleteForever"' in html,'Permanent delete button missing'
          print('PASS: remove/archive buttons present, permanent deletion protected',flush=True)

          try:
              urllib.request.urlopen(root+'/media/catalog/gpt-dates.json',timeout=20)
              raise AssertionError('Sensitive internal catalog JSON publicly readable')
          except urllib.error.HTTPError as e:
              assert e.code==404,'Expected catalog data access denied, got '+str(e.code)
          print('PASS: internal R2 catalog metadata cannot be fetched as media',flush=True)

          with urllib.request.urlopen(root+'/watch/ARTVISION_CARAVAGGIO_CINEMA_V6.mp4',timeout=25) as response:
              landing=response.read().decode('utf-8')
          assert 'og:image' in landing and 'og:video' in landing,'Missing social poster metadata'
          assert '/media/ARTVISION_CARAVAGGIO_CINEMA_V6.mp4' in landing,'Missing video playback in shared link'
          print('PASS: social share landing page has poster + video link',flush=True)
          name='PROVINO_V4_SENZA_API__535272.mp4'
          try:
              response=urllib.request.urlopen(root+'/api/files',timeout=25)
          except Exception as e:
              print('PUBLIC SITE ERROR',repr(e),getattr(e,'headers',{}),getattr(e,'read',lambda *a: b'')(1000),flush=True)
              raise
          with response:
              files=json.load(response)
          record=next((x for x in files if x['name']==name),None)
          assert record is not None, 'Video not found in site catalog'
          assert int(record['size'])==535272, 'Unexpected video size'
          for path,is_download in [('/media/'+name,False),('/download/'+name,True)]:
              request=urllib.request.Request(root+path,headers={'Range':'bytes=0-511'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  data=response.read()
                  assert response.status==206, 'Expected HTTP 206: '+str(response.status)
                  assert len(data)==512, 'Invalid partial length'
                  assert response.headers.get('Content-Range','').startswith('bytes 0-511/535272'), 'Invalid Content-Range'
                  assert response.headers.get('Content-Type','').startswith('video/mp4'),'Invalid video MIME'
                  if is_download:assert 'attachment' in response.headers.get('Content-Disposition','').lower(),'Missing attachment header'
                  print('PASS:',path,'HTTP 206 + byte range + content-type',flush=True)
          req=urllib.request.Request(root+'/download/ARTVISION_CARAVAGGIO_CINEMA_V6.mp4',headers={'Range':'bytes=0-127'})
          with urllib.request.urlopen(req,timeout=30) as response:
              friendly=response.headers.get('Content-Disposition','')
              assert 'attachment' in friendly and 'arte' in friendly.lower() and 'caravaggio' in friendly.lower(),'Missing genre and readable title in downloaded filename: '+friendly
              assert len(response.read())==128,'File byte range changed'
          with urllib.request.urlopen(root+'/info/ARTVISION_CARAVAGGIO_CINEMA_V6.mp4',timeout=30) as response:
              sheet=response.read().decode('utf-8')
              assert 'Genere:' in sheet and 'Durata:' in sheet and 'Caravaggio' in sheet,'Invalid informational TXT sheet'
              assert '.txt' in response.headers.get('Content-Disposition',''),'TXT attachment not downloadable'
          print('PASS: descriptive video filename and companion metadata TXT',flush=True)
          big='ARTVISION_DALI_SOGNO_DELL_APE_CRITICO_V1.mp4'
          large=next((x for x in files if x['name']==big),None)
          assert large is not None and int(large['size'])>200000000,'Missing large MP4'
          req=urllib.request.Request(root+'/media/'+big,headers={'Range':'bytes=0-4095'})
          with urllib.request.urlopen(req,timeout=60) as response:
              assert response.status==206 and len(response.read())==4096,'Large video range failed'
              print('PASS: 227MB video supports public streaming and seeking',flush=True)
          with urllib.request.urlopen(root+'/media/'+name,timeout=60) as response:
              raw=response.read()
              assert response.status==200 and len(raw)==535272,'Full download corrupted'
          with tempfile.TemporaryDirectory() as d:
              file=pathlib.Path(d)/name;file.write_bytes(raw)
              out=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(file)],capture_output=True,text=True)
              assert out.returncode==0 and float(out.stdout.strip())>0,'Not a valid playable MP4: '+out.stderr
              print('PASS: full video accessible; ffprobe duration',out.stdout.strip(),'seconds',flush=True)
          PY
      - name: Validate interactive gallery rendering and search
        shell: bash
        run: |
          mkdir -p /tmp/vlsdom
          cd /tmp/vlsdom
          npm install --silent --no-audit --no-fund jsdom@26
          node - <<'JS'
          const {JSDOM,VirtualConsole}=require('/tmp/vlsdom/node_modules/jsdom');
          const https=require('https'),assert=require('assert');
          function get(p){return new Promise((resolve,reject)=>{https.get('https://video-library-studio.600led.workers.dev'+p,{headers:{'User-Agent':'Mozilla/5.0 AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36'}},r=>{let d='';r.on('data',x=>d+=x);r.on('end',()=>r.statusCode===200?resolve(d):reject(Error('HTTP '+r.statusCode)))}).on('error',reject)})}
          (async()=>{
            const [html,raw]=await Promise.all([get('/'),get('/api/catalog')]);
            const model=JSON.parse(raw),errors=[],v=new VirtualConsole();
            v.on('jsdomError',e=>errors.push(e.message));
            const dom=new JSDOM(html,{url:'https://video-library-studio.600led.workers.dev/',runScripts:'dangerously',pretendToBeVisual:true,virtualConsole:v,beforeParse(w){w.fetch=async()=>({ok:true,json:async()=>model});}});
            await new Promise(done=>setTimeout(done,700));
            const d=dom.window.document;
            const total=d.querySelectorAll('.card').length;
            assert(total>=140,'Expected online+ChatGPT catalog cards, got '+total);
            assert(d.querySelectorAll('.poster img').length>=70,'Missing JPG covers in cards');
            const lib=d.querySelector('#availability');lib.value='chatgpt';lib.dispatchEvent(new dom.window.Event('change',{bubbles:true}));const only=d.querySelectorAll('.card');assert(only.length>=60&&only.length<total,'ChatGPT filter failed');assert(only[0].querySelector('[data-act="play"]')===null,'GPT card incorrectly allows playback');lib.value='';lib.dispatchEvent(new dom.window.Event('change',{bubbles:true}));const search=d.querySelector('#query');search.value='gioconda';search.dispatchEvent(new dom.window.Event('input',{bubbles:true}));
            const matches=d.querySelectorAll('.card').length;
            assert(matches>=1&&matches<total,'Search filter failed: '+matches);
            assert(errors.length===0,'Client error: '+errors.join('; '));
            console.log('PASS: browser-side cards='+total+' JPG posters; Gioconda search='+matches+' results');
            dom.window.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
