name: ArtVision V153 Rebel Angels Cinema replacement of undelivered master, no extra slot
on:
  push:
    branches: [main]
    paths:
      - requests/artvision/rebel-angels-cinema-v153-replacement.json
permissions:
  contents: read
  actions: read
concurrency:
  group: artvision-owner-rebel-angels-cinema-replacement-v153-once
  cancel-in-progress: false
jobs:
  cinema_review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact-sourced renderer before starting
        run: python -m py_compile src/artvision_rebel_cinema_replacement_v153.py
      - name: Verify exact authorized selected work
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("requests/artvision/rebel-angels-cinema-v153-replacement.json").read_text())
          q=json.loads(Path("queue/artvision_owner_selected_ten_20261102.json").read_text())
          assert r["work_id"]=="bruegel_fall_rebel_angels_1562_rmfb_584"
          assert r["owner_automation_id"]=="6adca191603c8191a90d5190901cd034"
          assert r["run_once_only"] is True
          assert r["variant"]=="cinema_standard" and r["public_title"]=="The Fall of the Rebel Angels"
          assert not r["allow_paid_calls"] and not r["social_publish"] and not r["gold_v25"]
          assert any(w["id"]==r["work_id"] and w["slots_delivered_this_selection"]==2 and w["new_cinema_standard_v135"]["sha256"]=="346c361919da8cfa652a8f451d2a9879a384f870cdbf2d0a936f290f996e92f5" for w in q["works"])
          assert r["replacement_same_slot"] is True and r["source_v131_artifact_id"]==12775741359
          PY
      - name: Install no-paid runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless imageio-ffmpeg
          mkdir -p /tmp/artvision-bin
          python - <<'PY'
          from imageio_ffmpeg import get_ffmpeg_exe
          from pathlib import Path
          src=Path(get_ffmpeg_exe())
          assert src.is_file()
          Path("/tmp/artvision-bin/ffmpeg").symlink_to(src)
          PY
          echo "/tmp/artvision-bin" >> "$GITHUB_PATH"
          /tmp/artvision-bin/ffmpeg -version | head -1
      - name: Reuse exact original image from licensed 2026 V131 artifact; no network to Wikimedia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rebel_v131_source /tmp/rebel_v153
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12775741359" > /tmp/rebel_131_metadata.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/rebel_131_metadata.json'))
          assert x['id']==12775741359 and not x['expired']
          assert x['workflow_run']['id']>0 and x['name']
          open('/tmp/rebel_131_runid','w').write(str(x['workflow_run']['id']))
          open('/tmp/rebel_131_artname','w').write(x['name'])
          print('Preserved source artifact',x['name'],'run',x['workflow_run']['id'])
          PY
          gh run download "$(cat /tmp/rebel_131_runid)" --repo "$GITHUB_REPOSITORY" --name "$(cat /tmp/rebel_131_artname)" --dir /tmp/rebel_v131_source
          cp /tmp/rebel_v131_source/ORIGINAL_ARTWORK.jpg /tmp/rebel_v153/ORIGINAL_ARTWORK.jpg
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('/tmp/rebel_v153/ORIGINAL_ARTWORK.jpg')
          assert p.stat().st_size==6748186
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='09f675e7861da808ede4bc1f85573e97884fdbcc6c1d6cb482e3e449d58aace5'
          print('Licensed art readback PASS before render')
          PY
      - name: Render only one MP4 candidate
        run: python src/artvision_rebel_cinema_replacement_v153.py --output /tmp/rebel_v153
      - name: Validate physical MP4 and SHA
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("/tmp/rebel_v153")
          q=json.loads((p/"QA_V153.json").read_text())
          f=p/q["mp4"]["filename"]
          assert f.is_file() and f.stat().st_size>100000
          assert hashlib.sha256(f.read_bytes()).hexdigest()==q["mp4"]["sha256"]
          assert q["mp4"]["full_ffmpeg_decode"]=="PASS"
          assert q["mp4"]["frames"]==960 and q["mp4"]["duration_seconds"]==48
          assert q["gold_v25"] is False and q["social_published"] is False
          assert (p/"BRUEGEL_REBEL_ANGELS_CINEMA_V153_REPLACEMENT_PACKAGE.zip").is_file()
          print("VERIFIED",q["mp4"]["sha256"],f.stat().st_size)
          PY
      - name: Save real MP4 and package for readback
        uses: actions/upload-artifact@v4
        with:
          name: BRUEGEL_REBEL_ANGELS_V153_CINEMA_REPLACEMENT_MP4
          path: |
            /tmp/rebel_v153/BRUEGEL_THE_FALL_OF_THE_REBEL_ANGELS_CINEMA_V153_REPLACEMENT_REVIEW.mp4
            /tmp/rebel_v153/BRUEGEL_REBEL_ANGELS_CINEMA_V153_REPLACEMENT_PACKAGE.zip
            /tmp/rebel_v153/QA_V153.json
            /tmp/rebel_v153/COVER.jpg
            /tmp/rebel_v153/CONTACT_SHEET_V153.jpg
          if-no-files-found: error
          retention-days: 30
