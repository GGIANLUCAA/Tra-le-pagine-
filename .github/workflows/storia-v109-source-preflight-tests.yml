name: "La Storia Rivive V109 · source-native preflight tests (offline)"
on:
  pull_request:
    paths:
      - "src/storia_rivive_autopilot_v101.py"
      - "src/storia_rivive_scout_v101.py"
      - "src/storia_rivive_shot_boundaries_v113.py"
      - "src/storia_rivive_frame_rank_v101.py"
      - "src/storia_rivive_i2i_prepare_v102.py"
      - "src/storia_rivive_v134_cache_readiness.py"
      - "tests/test_storia_rivive_v134_cache_readiness.py"
      - "tests/test_storia_rivive_v101.py"
      - "tests/test_storia_rivive_v121.py"
      - "tests/test_storia_rivive_v122.py"
      - "tests/test_storia_rivive_v123.py"
      - "src/storia_rivive_adaptive_sampling_v124.py"
      - "tests/test_storia_rivive_v124.py"
      - "src/storia_rivive_v125_real_motion_audit.py"
      - "tests/test_storia_rivive_v125.py"
      - "src/storia_rivive_v126_balanced_motion_review.py"
      - "tests/test_storia_rivive_v126.py"
      - "src/storia_rivive_v126_frame_diversity.py"
      - "tests/test_storia_rivive_v126_frame_diversity.py"
      - "src/storia_rivive_v128_balanced_frame_review.py"
      - "tests/test_storia_rivive_v128_balanced_frame_review.py"
      - "src/storia_rivive_v129_prefreeze_motion_strips.py"
      - "tests/test_storia_rivive_v129_prefreeze_motion_strips.py"
      - "src/storia_rivive_v131_editorial_hold.py"
      - "tests/test_storia_rivive_v131_editorial_hold.py"
      - "src/storia_rivive_v132_veto_aware_alternatives.py"
      - "tests/test_storia_rivive_v132_veto_aware_alternatives.py"
      - "config/storia_rivive_v131_reviewed_source_vetoes.json"
      - ".github/workflows/storia-rivive-v101-auto-3h.yml"
      - ".github/workflows/storia-v109-source-preflight-tests.yml"
      - ".github/workflows/storia-v136-white-house-source-audit.yml"
      - "src/storia_rivive_v136_source_decision.py"
      - "tests/test_storia_rivive_v136_source_decision.py"
      - "config/storia_rivive_v133_rejected_films.json"
      - "tests/test_storia_rivive_v139_rejection_rotation.py"
      - ".github/workflows/storia-v138-versailles-source-audit.yml"
      - "tests/test_storia_rivive_v138_workflow.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline image test dependency
        run: python -m pip install -q "pillow>=10,<13"
      - name: Install FFmpeg for real PTS re-decode regression (no API)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Compile source-preflight modules
        run: |
          python -m py_compile src/storia_rivive_autopilot_v101.py src/storia_rivive_scout_v101.py src/storia_rivive_shot_boundaries_v113.py src/storia_rivive_flag_title_v101.py src/storia_rivive_frame_rank_v101.py src/storia_rivive_i2i_prepare_v102.py src/storia_rivive_v134_cache_readiness.py
      - name: Regression tests - no paid API, no network, no social publication
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_storia_rivive_v101.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v134_cache_readiness.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v121.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v122.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v123.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v124.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v125.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v126.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v126_frame_diversity.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v128_balanced_frame_review.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v129_prefreeze_motion_strips.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v131_editorial_hold.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v132_veto_aware_alternatives.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v136_source_decision.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v138_workflow.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v139_rejection_rotation.py" -v

  v136_new_real_source_audit:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'V136')
    uses: ./.github/workflows/storia-v136-white-house-source-audit.yml
