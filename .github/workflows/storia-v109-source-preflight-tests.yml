name: "La Storia Rivive V109 · source-native preflight tests (offline)"
on:
  pull_request:
    paths:
      - "src/storia_rivive_autopilot_v101.py"
      - "src/storia_rivive_scout_v101.py"
      - "src/storia_rivive_shot_boundaries_v113.py"
      - "src/storia_rivive_frame_rank_v101.py"
      - "src/storia_rivive_i2i_prepare_v102.py"
      - "src/storia_rivive_v134_cache_readiness.py"
      - "tests/test_storia_rivive_v134_cache_readiness.py"
      - "tests/test_storia_rivive_v101.py"
      - "tests/test_storia_rivive_v121.py"
      - "tests/test_storia_rivive_v122.py"
      - "tests/test_storia_rivive_v123.py"
      - "src/storia_rivive_adaptive_sampling_v124.py"
      - "tests/test_storia_rivive_v124.py"
      - "src/storia_rivive_v125_real_motion_audit.py"
      - "tests/test_storia_rivive_v125.py"
      - "src/storia_rivive_v126_balanced_motion_review.py"
      - "tests/test_storia_rivive_v126.py"
      - "src/storia_rivive_v126_frame_diversity.py"
      - "tests/test_storia_rivive_v126_frame_diversity.py"
      - "src/storia_rivive_v128_balanced_frame_review.py"
      - "tests/test_storia_rivive_v128_balanced_frame_review.py"
      - "src/storia_rivive_v129_prefreeze_motion_strips.py"
      - "tests/test_storia_rivive_v129_prefreeze_motion_strips.py"
      - "src/storia_rivive_v131_editorial_hold.py"
      - "tests/test_storia_rivive_v131_editorial_hold.py"
      - "src/storia_rivive_v132_veto_aware_alternatives.py"
      - "tests/test_storia_rivive_v132_veto_aware_alternatives.py"
      - "config/storia_rivive_v131_reviewed_source_vetoes.json"
      - ".github/workflows/storia-rivive-v101-auto-3h.yml"
      - ".github/workflows/storia-v109-source-preflight-tests.yml"
      - ".github/workflows/storia-v136-white-house-source-audit.yml"
      - "src/storia_rivive_v136_source_decision.py"
      - "tests/test_storia_rivive_v136_source_decision.py"
      - "config/storia_rivive_v140_low_raster_sources.json"
      - "tests/test_storia_rivive_v140_native_raster_queue.py"
      - "src/storia_rivive_v141_live_sd_recheck.py"
      - "tests/test_storia_rivive_v141_live_sd_recheck.py"
      - "tests/test_storia_rivive_v142_pilot_source.py"
      - ".github/workflows/storia-v142-constantinople-source-audit.yml"
      - "queue/storia_rivive_candidates_v58.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline image test dependency
        run: python -m pip install -q "pillow>=10,<13"
      - name: Install FFmpeg for real PTS re-decode regression (no API)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Compile source-preflight modules
        run: |
          python -m py_compile src/storia_rivive_autopilot_v101.py src/storia_rivive_scout_v101.py src/storia_rivive_shot_boundaries_v113.py src/storia_rivive_flag_title_v101.py src/storia_rivive_frame_rank_v101.py src/storia_rivive_i2i_prepare_v102.py src/storia_rivive_v134_cache_readiness.py src/storia_rivive_v141_live_sd_recheck.py
      - name: Regression tests - no paid API, no network, no social publication
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_storia_rivive_v101.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v134_cache_readiness.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v121.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v122.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v123.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v124.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v125.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v126.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v126_frame_diversity.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v128_balanced_frame_review.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v129_prefreeze_motion_strips.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v131_editorial_hold.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v132_veto_aware_alternatives.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v136_source_decision.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v140_native_raster_queue.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v141_live_sd_recheck.py" -v
          python -m unittest discover -s tests -p "test_storia_rivive_v142_pilot_source.py" -v
      - name: V142 real 3-hour research queue selects new source without any credits
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_autopilot_v101.py --now 2026-10-31T12:00:00Z --out /tmp/STORIA_V140_WORK_ORDER.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/STORIA_V140_WORK_ORDER.json").read_text())
          assert p["status"]=="SOURCE_PREFLIGHT_REVIEW_REQUIRED",p
          assert p["episode_id"]=="constantinople_messter_1916",p
          assert p["skip_source_acquisition"] is False,p
          assert len(p["excluded_sha_bound_sources"])==3,p
          assert len(p["excluded_low_native_raster_sources"])==7,p
          assert p["paid_api_call_permitted"] is False,p
          assert p["publish_permitted"] is False,p
          assert p["video_completed"] is False,p
          print("V142_REAL_QUEUE_NEW_SOURCE",p["episode_id"],p["status"],"3_qa_rejections","7_sd_origins","0_credits")
          PY


  v136_new_real_source_audit:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'V136')
    uses: ./.github/workflows/storia-v136-white-house-source-audit.yml

  v141_real_commons_metadata_smoke:
    # Run real FREE Commons metadata reads on the V141 PR only. No archive
    # download, image generation, Vidu POST, publication or credentials.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'V141')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read current Commons original dimensions (real network)
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v141_live_sd_recheck.py \
            --out output/storia_v141_live/LIVE_SD_SNAPSHOT_RECHECK_V141.json
      - name: Assert no source or paid permission regardless of network outcome
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("output/storia_v141_live/LIVE_SD_SNAPSHOT_RECHECK_V141.json").read_text())
          assert p["contract"]=="V141_COMMONS_SD_LIVE_RECHECK_RESEARCH_ONLY"
          assert p["checked_count"]==7 and len(p["sources"])==7
          assert len({row["candidate_id"] for row in p["sources"]})==7
          assert not any(p[k] for k in ("source_acquisition_permitted",
              "i2i_permitted","vidu_post_permitted","publication_permitted"))
          allowed={"ALL_LOW_RASTER_SNAPSHOTS_CURRENT",
                   "SOURCE_SNAPSHOT_REVIEW_REQUIRED","SOURCE_SNAPSHOT_CHECK_UNAVAILABLE"}
          assert p["status"] in allowed
          print("V141_LIVE_COMMONS_RECHECK",p["status"],"sources",7,"paid_calls",0)
          if p["status"]=="SOURCE_SNAPSHOT_CHECK_UNAVAILABLE":
              print("V141_NETWORK_UNAVAILABLE_NO_SOURCE_PROMOTION")
          PY
      - name: Preserve real response evidence for manual source review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_V141_LIVE_COMMONS_RECHECK_${{ github.run_id }}
          path: output/storia_v141_live/LIVE_SD_SNAPSHOT_RECHECK_V141.json
          if-no-files-found: warn
          retention-days: 7
