name: "La Storia Rivive | Read-only image model discovery"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/storia_read_only_model_catalog_v1.py"
      - ".github/workflows/storia-read-only-model-catalog-v1.yml"
permissions:
  contents: read
jobs:
  public_model_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read public model catalogs without credentials or inference
        run: |
          python -m py_compile src/storia_read_only_model_catalog_v1.py
          python src/storia_read_only_model_catalog_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: STORIA_PUBLIC_MODEL_CATALOG_NO_SPEND
          path: output/storia_provider_audit/READ_ONLY_MODEL_CATALOG.json
          retention-days: 7
