name: Nils Holgersson — Gacrux narration one-time only
on:
  push:
    branches: [episode/nils-holgersson-20261027-narrated-v46]
    paths: [queue/nils_gacrux_once_20261027.request]
permissions:
  contents: write
concurrency:
  group: nils-20261027-gacrux-once
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight at zero voice cost
        shell: bash
        run: |
          test -n "${GEMINI_API_KEY:-}" || { echo "::error::Gemini secret unavailable"; exit 2; }
          python - <<'PY'
          from pathlib import Path
          t=Path('episodes/nils_holgersson_20261027/COPIONE_ITALIANO.txt').read_text()
          assert len(t.split('\n\n'))==16
          print('Gacrux configured; one call only; video IA paid requests: ZERO')
          PY
      - name: Install runtime libraries and free speech aligner
        run: |
          python -m pip install --disable-pip-version-check -q "numpy>=1.25,<3" "soundfile>=0.12" "scipy>=1.11" "google-genai>=2.25,<3" "imageio-ffmpeg>=0.5" "faster-whisper>=1.1,<2"
          mkdir -p "$RUNNER_TEMP/ffbin"
          ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/ffbin/ffmpeg"
          echo "$RUNNER_TEMP/ffbin" >> "$GITHUB_PATH"
      - name: Narrate with Google Gemini Gacrux — at most one API call
        run: python tools/nils_gacrux_once_20261027.py
      - name: Archive voice and timing for local editing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NILS_GACRUX_VOICE_SINGLE_RUN_20261027
          path: output/nils_gacrux_20261027/
          if-no-files-found: warn
          retention-days: 14
      - name: Save run locator for artifact retrieval
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo '{"run_id":${{ github.run_id }},"workflow":"nils-gacrux-once-20261027.yml","dispatched_once":true}' > locator.json
          gh api -X PUT "repos/${{ github.repository }}/contents/queue/nils_gacrux_run_locator_20261027.json" \
            -f branch="${{ github.ref_name }}" \
            -f message="Store single Gacrux voice-run locator" \
            -f content="$(base64 -w0 locator.json)"
