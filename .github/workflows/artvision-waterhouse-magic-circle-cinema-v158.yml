name: ArtVision V158 · Waterhouse The Magic Circle Tate N01572 1080p Cinema review
on:
  push:
    branches: [main]
    paths:
      - requests/artvision/waterhouse-magic-circle-cinema-v158.json
permissions:
  contents: read
concurrency:
  group: artvision-owner-waterhouse-magic-circle-cinema-v158-once
  cancel-in-progress: false
jobs:
  cinema_review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact-sourced renderer before starting
        run: python -m py_compile src/artvision_waterhouse_magic_circle_cinema_v158.py
      - name: Verify exact authorized selected work
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("requests/artvision/waterhouse-magic-circle-cinema-v158.json").read_text())
          q=json.loads(Path("queue/artvision_owner_selected_ten_20261102.json").read_text())
          assert r["work_id"]=="waterhouse_magic_circle_1886_tate_n01572"
          assert r["owner_automation_id"]=="6adca191603c8191a90d5190901cd034"
          assert r["run_once_only"] is True
          assert r["variant"]=="cinema_standard" and r["public_title"]=="The Magic Circle"
          assert not r["allow_paid_calls"] and not r["social_publish"] and not r["gold_v25"]
          assert any(w["id"]==r["work_id"] and w["slots_delivered_this_selection"]==0 for w in q["works"])
          PY
      - name: Validate Tate N01572 provenance and Commons private-review license source before render
        run: |
          python - <<'PY'
          import json
          r=json.load(open('requests/artvision/waterhouse-magic-circle-cinema-v158.json'))
          assert r['license_status']=='Commons_PD_Art_PDM_Tate_UK_claim_noted_and_full_N01572_not_private_study'
          assert r['source_url']=='https://upload.wikimedia.org/wikipedia/commons/3/33/The_Magic_Circle_-_John_William_Waterhouse.jpg'
          assert r['source_expected_pixels']==[2000,2942]
          assert r['source_fail_closed_on_429'] and r['no_commercial_publication_or_Gold']
          PY
      - name: Install no-paid runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless imageio-ffmpeg
          mkdir -p /tmp/artvision-bin
          python - <<'PY'
          from imageio_ffmpeg import get_ffmpeg_exe
          from pathlib import Path
          src=Path(get_ffmpeg_exe())
          assert src.is_file()
          Path("/tmp/artvision-bin/ffmpeg").symlink_to(src)
          PY
          echo "/tmp/artvision-bin" >> "$GITHUB_PATH"
          /tmp/artvision-bin/ffmpeg -version | head -1
      - name: Render only one MP4 candidate
        run: python src/artvision_waterhouse_magic_circle_cinema_v158.py --output /tmp/waterhouse_magic_circle_v158
      - name: Validate physical MP4 and SHA
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("/tmp/waterhouse_magic_circle_v158")
          q=json.loads((p/"QA_V158.json").read_text())
          f=p/q["mp4"]["filename"]
          assert f.is_file() and f.stat().st_size>100000
          assert hashlib.sha256(f.read_bytes()).hexdigest()==q["mp4"]["sha256"]
          assert q["mp4"]["full_ffmpeg_decode"]=="PASS"
          assert q["mp4"]["frames"]==960 and q["mp4"]["duration_seconds"]==48
          assert q["gold_v25"] is False and q["social_published"] is False
          assert (p/"WATERHOUSE_MAGIC_CIRCLE_CINEMA_V158_REVIEW_PACKAGE.zip").is_file()
          print("VERIFIED",q["mp4"]["sha256"],f.stat().st_size)
          PY
      - name: Save real MP4 and package for readback
        uses: actions/upload-artifact@v4
        with:
          name: WATERHOUSE_MAGIC_CIRCLE_V158_CINEMA_REVIEW_MP4
          path: |
            /tmp/waterhouse_magic_circle_v158/WATERHOUSE_THE_MAGIC_CIRCLE_CINEMA_V158_REVIEW.mp4
            /tmp/waterhouse_magic_circle_v158/WATERHOUSE_MAGIC_CIRCLE_CINEMA_V158_REVIEW_PACKAGE.zip
            /tmp/waterhouse_magic_circle_v158/QA_V158.json
            /tmp/waterhouse_magic_circle_v158/COVER.jpg
            /tmp/waterhouse_magic_circle_v158/CONTACT_SHEET_V158.jpg
          if-no-files-found: error
          retention-days: 30
