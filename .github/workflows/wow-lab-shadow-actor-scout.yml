name: "WOW LAB only — silhouette CC0 scout"
on:
  push:
    branches:
      - experiment/wow-lab-shadow-actor-20261107
    paths:
      - "wow_lab/shadow_actor_source_scout.py"
      - ".github/workflows/wow-lab-shadow-actor-scout.yml"
permissions:
  contents: read
concurrency:
  group: wow-lab-shadow-actor-20261107
  cancel-in-progress: false
jobs:
  source_scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free image reader
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - name: Check official Met CC0 record and download original pixels
        run: python wow_lab/shadow_actor_source_scout.py
      - name: Preserve original; never render before mask inspection
        uses: actions/upload-artifact@v4
        with:
          name: WOW_LAB_SHADOW_ACTOR_CC0_${{ github.run_id }}
          path: wow_lab/runs/${{ github.run_id }}/*
          retention-days: 30
          if-no-files-found: error
