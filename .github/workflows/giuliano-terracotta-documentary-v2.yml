name: "Giuliano - Terracotta Documentary V2"
on:
  push:
    branches: ["feature/giuliano-terracotta-social-v2-20261109"]
    paths:
      - "giuliano/terracotta_v2/**"
  pull_request:
    branches: [main]
    paths:
      - "giuliano/terracotta_v2/**"
      - ".github/workflows/giuliano-terracotta-documentary-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  documentary-v2:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARTVISION_ASR_MODEL: base
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Source checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Early source syntax and secret checks
        run: |
          python -m py_compile giuliano/terracotta_v2/render_documentary_v2.py
          test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY missing; no substitute voice" && exit 2)
      - name: FFmpeg and audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1 fonts-dejavu-core
          python -m pip install -q 'numpy>=1.25,<3' 'Pillow>=10,<12' 'requests>=2.31,<3' 'soundfile>=0.12' 'scipy>=1.11' 'google-genai>=2.25,<3' 'faster-whisper>=1.1,<2'
      - name: Batch-license verified images first, Google Gacrux then, render and QA
        run: python giuliano/terracotta_v2/render_documentary_v2.py
      - name: Preserve voice and preflight if rendering fails (never label this a video)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GIULIANO_V2_DIAGNOSTICS_ONLY_NOT_FINISHED
          path: |
            output/giuliano_terracotta_v2/audio/VOCE.wav
            output/giuliano_terracotta_v2/audio/VOICE_CACHE_V13.json
            output/giuliano_terracotta_v2/ATTRIBUZIONI_FOTO.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Downloadable Android MP4, cover, full pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GIULIANO_TERRACOTTA_V2_VIDEO_COVER_ZIP
          path: |
            output/giuliano_terracotta_v2/GIULIANO_TERRACOTTA_DOCUMENTARIO_V2_REVIEW.mp4
            output/giuliano_terracotta_v2/GIULIANO_TERRACOTTA_DOCUMENTARIO_V2_PACCHETTO.zip
            output/giuliano_terracotta_v2/COVER_V2.jpg
            output/giuliano_terracotta_v2/QA_V2.json
            output/giuliano_terracotta_v2/ATTRIBUZIONI_FOTO.txt
          if-no-files-found: error
          retention-days: 14

  verify-existing-render:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Verify real push run and downloadable artifacts without regenerating audio
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.parse,json,time
          base=f"https://api.github.com/repos/{os.environ['GH_REPO']}"
          head="5883a0248f5a8ff5cc998de53f40c7ed7a7e9d53"
          params=urllib.parse.urlencode({"branch":"feature/giuliano-terracotta-social-v2-20261109","event":"push","per_page":40})
          headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","User-Agent":"Gianluca-Giuliano-Documentary-QA"}
          def read(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40))
          run=None
          for attempt in range(40):
              rows=read(base+"/actions/runs?"+params).get("workflow_runs",[])
              matching=[x for x in rows if x.get("name")=="Giuliano - Terracotta Documentary V2"]
              print("DISCOVERED_PUSH_RUNS",[(x["id"],x.get("head_sha"),x["status"],x.get("conclusion")) for x in matching[:8]],flush=True)
              run=next((x for x in matching if x.get("head_sha")==head),None)
              if run:
                  print("RENDER_LINK",run.get("html_url"),"STATE",run["status"],"RESULT",run.get("conclusion"),flush=True)
                  if run["status"]=="completed":break
              time.sleep(15)
          if not run:raise RuntimeError("No expected push render job observed")
          if run["status"]!="completed":raise RuntimeError("Render not complete at verification deadline")
          arts=read(run["artifacts_url"]).get("artifacts",[])
          print("VERIFIED_ARTIFACTS",[(x["id"],x["name"],x["size_in_bytes"]) for x in arts],flush=True)
          if run.get("conclusion")!="success":raise RuntimeError("Render not successful. Check push-run logs.")
          if not any(x["name"]=="GIULIANO_TERRACOTTA_V2_VIDEO_COVER_ZIP" and x["size_in_bytes"]>1000000 for x in arts):
              raise RuntimeError("No fully uploaded MP4/ZIP artifact")
          PY
