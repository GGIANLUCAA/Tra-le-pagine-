name: "AI Director V1 | isolated director preflight (zero-cost by default)"

on:
  push:
    branches:
      - main
      - feature/ai-director-zero-cost-v1-20261112
    paths:
      - "src/ai_director_v1.py"
      - "tests/test_ai_director_v1.py"
      - "examples/ai_director_v1_sample.json"
      - ".github/workflows/ai-director-v1.yml"
      - "docs/AI_DIRECTOR_V1.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/ai_director_v1.py"
      - "tests/test_ai_director_v1.py"
      - "examples/ai_director_v1_sample.json"
      - ".github/workflows/ai-director-v1.yml"
      - "docs/AI_DIRECTOR_V1.md"
  workflow_dispatch:
    inputs:
      brief_path:
        description: "Repository-relative JSON brief (public, never include secrets)"
        required: true
        default: "examples/ai_director_v1_sample.json"
        type: string
      variant:
        description: "Existing 4x1 variant (used only if brief is a canonical ArtVision dossier)"
        type: choice
        required: true
        default: critico_standard
        options:
          - critico_standard
          - critico_museum
          - cinema_standard
          - cinema_museum
      enable_live:
        description: "Try exactly two explicitly verified zero-price LLMs (disabled by default)"
        required: true
        type: boolean
        default: false
      model_1:
        description: "Explicit approved model ID ending :free (only when enable_live)"
        required: false
        type: string
      model_2:
        description: "Second approved model ID ending :free (only when enable_live)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-director-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  director-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      AI_DIRECTOR_LIVE: ${{ inputs.enable_live == true && '1' || '0' }}
      BRIEF_FILE: ${{ inputs.brief_path || 'examples/ai_director_v1_sample.json' }}
      MODEL_1: ${{ inputs.model_1 }}
      MODEL_2: ${{ inputs.model_2 }}
      FOUR_VARIANT: ${{ inputs.variant || 'critico_standard' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify only offline regression tests (no provider requests)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/ai_director_v1.py tests/test_ai_director_v1.py
          python -m unittest discover -s tests -p 'test_ai_director_v1.py' -v
      - name: Validate safe repository-relative brief path
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          s=os.environ["BRIEF_FILE"]
          if not re.fullmatch(r"(?:examples|queue|research|docs/productions)/[A-Za-z0-9_./-]{1,150}\.json",s) or ".." in s:
              raise SystemExit("Unsafe brief path")
          root=pathlib.Path.cwd().resolve()
          p=(root/s).resolve()
          if not p.is_file() or root not in p.parents:
              raise SystemExit("Brief path missing or outside checkout")
          print("Validated brief path; no writes to production assets")
          PY
      - name: Generate standalone Android QA report
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_live == true && secrets.OPENROUTER_API_KEY || '' }}
        run: |
          set -euo pipefail
          schema=$(python -c 'import json,os;print(json.load(open(os.environ["BRIEF_FILE"]))["schema"])')
          if [ "$schema" = 'artvision-4x1-v1' ]; then
            brief_args=(--four-plan "$BRIEF_FILE" --variant "$FOUR_VARIANT")
          elif [ "$schema" = 'studio-ai-director-brief-v1' ]; then
            brief_args=(--brief "$BRIEF_FILE")
          else
            echo "Unknown storyboard schema"; exit 1
          fi
          if [ "$AI_DIRECTOR_LIVE" = '1' ]; then
            if [ -z "$MODEL_1" ] || [ -z "$MODEL_2" ]; then
              echo "Two approved free model IDs required"; exit 1
            fi
            live_args=(--live --models "$MODEL_1" "$MODEL_2")
          else
            live_args=()
          fi
          python src/ai_director_v1.py "${brief_args[@]}" \
            --out output/ai_director_v1/report.json \
            --dashboard output/ai_director_v1/report.html \
            "${live_args[@]}"
          if [ "$AI_DIRECTOR_LIVE" = '0' ] && [ "$BRIEF_FILE" = 'examples/ai_director_v1_sample.json' ]; then
            python src/ai_director_v1.py \
              --four-plan docs/productions/2026-10-28-goldfinch-cinema-standard-v55/ARTVISION_4X1_PLAN.json \
              --variant critico_standard \
              --out output/ai_director_v1/real_existing_four_plan.json \
              --dashboard output/ai_director_v1/real_existing_four_plan.html
          fi
      - name: Upload factual report, not video or public publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-director-v1-qa-${{ github.run_id }}
          path: output/ai_director_v1/
          retention-days: 7
          if-no-files-found: warn
