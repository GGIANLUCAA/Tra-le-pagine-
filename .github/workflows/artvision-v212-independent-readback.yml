name: ArtVision V212 independent MP4+ZIP artifact readback (NO RENDER)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/artvision-v212-independent-readback.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify_existing_real_video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download existing V212 artifact bytes without rendering or modifying master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/artvision-v212-proof
          gh run download 42412660940 --repo "$GITHUB_REPOSITORY" --name ARTVISION_REBEL_ROOM68_V212_REAL_REVIEW --dir /tmp/artvision-v212-proof
          ls -lh /tmp/artvision-v212-proof
      - name: Install FFmpeg binary without apt update
        run: |
          python -m pip install --disable-pip-version-check imageio-ffmpeg
      - name: Independently verify MP4 video and audio, size, SHA256, ZIP CRC, camera QA and no approval
        run: |
          python - <<'PY'
          import hashlib,json,zipfile,subprocess
          from pathlib import Path
          from imageio_ffmpeg import get_ffmpeg_exe
          p=Path('/tmp/artvision-v212-proof')
          q=json.loads((p/'QA_V212.json').read_text())
          m=p/'BRUEGEL_REBEL_ANGELS_CINEMA_MUSEUM_V212_REVIEW.mp4'
          z=p/'BRUEGEL_REBEL_V212_PACKAGE.zip'
          assert m.is_file() and m.stat().st_size==q['mp4_bytes'] and m.stat().st_size>100000
          def sha(f):
           h=hashlib.sha256()
           with open(f,'rb') as fh:
            for buf in iter(lambda:fh.read(1048576),b''):h.update(buf)
           return h.hexdigest()
          assert sha(m)==q['mp4_sha256']
          with zipfile.ZipFile(z) as zp:
           assert zp.testzip() is None
           assert hashlib.sha256(zp.read(m.name)).hexdigest()==q['mp4_sha256']
          assert q['full_ffmpeg_decode']=='PASS'
          assert q['automatic_camera_qa']=='PASS'
          assert q['original_aac_sha256'] and q['aac_bit_identical'] is True
          assert q['human_artistic_review']=='PENDING'
          assert q['new_completed_approved_slots']==0
          assert q['gold'] is False and q['published'] is False and q['museum_approved'] is False
          assert q['duration_s']==48 and q['frame_count']==960 and q['resolution']==[720,1280]
          cmd=[get_ffmpeg_exe(),'-v','error','-xerror','-i',str(m),'-map','0','-f','null','-']
          subprocess.run(cmd,check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          proof={'schema':'artvision-v212-independent-readback',
            'source_run_id':42412660940,'file':m.name,'mp4_sha256':sha(m),'mp4_bytes':m.stat().st_size,
            'zip_file':z.name,'zip_sha256':sha(z),'zip_crc':'PASS','full_video_audio_decode':'PASS',
            'auto_camera':'PASS','source_painting_registration_inliers':q['sift_inliers'],
            'human_artistic_review':'PENDING','approved_queue_slots_increment':0,
            'public_release':False,'new_paid_calls':0}
          (p/'INDEPENDENT_READBACK_V212.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof))
          PY
      - name: Archive only the verification report, not duplicate any MP4
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_V212_INDEPENDENT_READBACK_REPORT_ONLY
          path: /tmp/artvision-v212-proof/INDEPENDENT_READBACK_V212.json
          retention-days: 90
          if-no-files-found: error
