name: "Paradiso - VOCE GEMINI cantica finale"
on:
  push:
    paths:
      - ".github/workflows/paradiso-voice.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Preparazione"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install "numpy>=1.25,<3" "soundfile>=0.12" "scipy>=1.11" "google-genai>=2.25,<3" "faster-whisper>=1.1,<2" "pillow>=10,<13"
      - name: "Genera voce italiana naturale e sottotitoli sincronizzati"
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::API key missing"; exit 2; }
          mkdir -p output_paradiso
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          import json
          from gemini_voice import synthesize
          from render import subtitles,music
          ep=Path("episodes/06_paradiso")
          out=Path("output_paradiso")
          script=(ep/"testo.txt").read_text(encoding="utf-8")
          voice,timed=synthesize(script,out)
          if len(timed)<30:raise RuntimeError("Insufficient matched sentence times")
          subtitles(timed,out)
          music(out/"MUSICA_ORIGINALE.wav",len(voice)/24000)
          (out/"TIMING_FRASI.json").write_text(json.dumps([
           {"text":t,"start":float(a),"end":float(b)} for t,a,b in timed],
           indent=2,ensure_ascii=False),encoding="utf-8")
          (out/"COPIONE.txt").write_text(script,encoding="utf-8")
          print("PARADISO GEMINI SUCCESS",round(len(voice)/24000,1),"seconds",len(timed),"phrases",flush=True)
          PY
      - name: "Pubblica artifact voce per montaggio finale"
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VOCE_GEMINI_EP06_PARADISO
          path: output_paradiso/
          retention-days: 14
