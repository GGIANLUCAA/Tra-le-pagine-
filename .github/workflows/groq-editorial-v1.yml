name: Groq API - optional secret presence and offline adapter tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/groq_editorial_v1.py'
      - 'tests/test_groq_editorial_v1.py'
      - 'docs/GROQ_API_INTEGRAZIONE_V1_20261104.md'
      - '.github/workflows/groq-editorial-v1.yml'
  push:
    paths:
      - 'src/groq_editorial_v1.py'
      - 'tests/test_groq_editorial_v1.py'
      - '.github/workflows/groq-editorial-v1.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Groq integration without network or credits
        run: |
          python -m py_compile src/groq_editorial_v1.py
          python -m unittest discover -s tests -p 'test_groq_editorial_v1.py' -v
  check-secret-only:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check whether the Groq secret exists (no inference request)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Missing GROQ_API_KEY. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "GROQ_API_KEY_PRESENT (content not shown, no API call, no credits used)"
