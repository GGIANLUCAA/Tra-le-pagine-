name: "ArtVision Enigma V1 — regia/beat sync/scene QA"
on:
  push:
    branches:
      - "feat/artvision-enigma-v1-*"
      - main
    paths:
      - "modules/artvision_enigma/**"
      - "tests/test_enigma_v1.py"
      - ".github/workflows/artvision-enigma-qa-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "modules/artvision_enigma/**"
      - "tests/test_enigma_v1.py"
      - ".github/workflows/artvision-enigma-qa-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enigma-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: modules/artvision_enigma/requirements.txt
      - name: "Installa SOLO librerie effettivamente usate"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r modules/artvision_enigma/requirements.txt
      - name: "Sintassi, regia e sorgenti"
        run: |
          python -m py_compile modules/artvision_enigma/enigma_v1.py modules/artvision_enigma/assets_v1.py
          python modules/artvision_enigma/enigma_v1.py --config modules/artvision_enigma/episodes/arcimboldo_vertumnus.json --plan-only
      - name: "Test reali OpenCV + beat detection librosa + FFmpeg + PySceneDetect"
        env:
          ENIGMA_SMOKE: "1"
        run: |
          python -m unittest -v tests.test_enigma_v1
