name: "LIBRI — Pifferaio: revisione immagini originali EPUB"
on:
  push:
    branches: [main]
    paths: ["queue/pifferaio_source_review_20261028.json"]
permissions:
  contents: read
concurrency:
  group: libri-pifferaio-source-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python -m pip install --quiet "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "pillow>=10,<13"
      - name: Download one PD EPUB and make full contact sheet
        run: python tools/pied_piper_source_review_20261028.py
      - uses: actions/upload-artifact@v4
        with:
          name: PIFFERAIO_GREENAWAY_CATALOGO_TAVOLE_REVIEW
          path: output/pifferaio_hamelin_source_review/
          retention-days: 14
          if-no-files-found: error
