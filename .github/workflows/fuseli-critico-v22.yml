name: "ArtVision Critico — Füssli L incubo Critico V22"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "queue/render_requests/fuseli_incubo_20261023.json"
permissions:
  contents: read
jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "FFmpeg e strumenti Critico esistenti"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "numpy==1.26.4" "opencv-python-headless==4.10.0.84" "Pillow>=10,<13" "soundfile>=0.12" "google-genai>=1,<3" "edge-tts>=7,<8"
      - name: "Ottieni fotografia originale e crea voce Google con tempi reali"
        run: |
          python modules/artvision_critico/production_series/fuseli_v22_assets.py
      - name: "Verifica file originali (nessuna finta immagine, nessuna finta voce)"
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          out=Path("output/fuseli-critico-v22")
          m=json.loads((out/"ASSETS_TIMING.json").read_text())
          assert m["art"]["dims"][0]>=6000 and m["art"]["dims"][1]>=4000
          assert len(m["voice"]["beat_ends"])==6
          assert m["voice"]["duration"]>35
          assert (out/"PAINTING.jpg").stat().st_size>2000000
          assert (out/"VOCE.wav").stat().st_size>1000000
          assert (out/"MUSIC.mp3").stat().st_size>150000
          print("SOURCE / VOICE / MUSIC verified:",m["voice"]["engine"],m["voice"]["duration"])
          PY
      - name: "Consegna materiale verificato per regia artistica di dettaglio"
        uses: actions/upload-artifact@v4
        with:
          name: FUSELI_CRITICO_V22_ASSETS_${{ github.run_id }}
          path: |
            output/fuseli-critico-v22/PAINTING.jpg
            output/fuseli-critico-v22/VOCE.wav
            output/fuseli-critico-v22/MUSIC.mp3
            output/fuseli-critico-v22/ASSETS_TIMING.json
            output/fuseli-critico-v22/COPIONE.txt
          retention-days: 14
          if-no-files-found: error
