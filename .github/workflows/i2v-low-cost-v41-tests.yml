name: "V41 - test adapter I2V gratuiti"
on:
  pull_request:
    paths:
      - "src/i2v_budget_v41.py"
      - "src/i2v_scene_v41.py"
      - "tests/test_i2v*.py"
      - ".github/workflows/i2v*.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-billing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Install image validation"
        run: python -m pip install "pillow>=10,<13"
      - name: "Controllo locale senza API"
        run: |
          python -m py_compile src/i2v_budget_v41.py src/i2v_scene_v41.py
          python -m unittest discover -s tests -p "test_i2v*.py" -v
      - name: "Smoke test reale: estrai immagine di Scacchi, valida e prepara preventivo GRATIS"
        run: |
          mkdir -p output/v41
          python src/i2v_scene_v41.py --episode 01_scacchi --scene 1 --output-dir output/v41
          python - <<'PY'
          import subprocess,sys
          from pathlib import Path
          images=list(Path("output/v41").glob("scena_01.*"))
          images+=list(Path("episodes/01_scacchi/images").glob("scena_01.*")) if Path("episodes/01_scacchi/images").exists() else []
          if len(images)!=1:raise SystemExit("Immagine del primo capitolo non disponibile in modo univoco")
          cmd=[sys.executable,"src/i2v_budget_v41.py","plan",
               "--image",str(images[0]),
               "--prompt","In a candlelit Victorian study, the human hand carefully turns the page of the book while its paper bends realistically.",
               "--seconds","5","--out","output/v41"]
          subprocess.run(cmd,check=True)
          print("PREVENTIVO CREATO, SENZA GENERAZIONE REMOTA")
          PY
      - name: "Conserva solo i piani del test su GitHub (nessun video inventato)"
        uses: actions/upload-artifact@v4
        with:
          name: V41_PROVA_GRATUITA_EPISODIO
          path: |
            output/v41/I2V_PLAN.json
            output/v41/SCENA_NARRAZIONE_V41.json
          if-no-files-found: error
          retention-days: 7

