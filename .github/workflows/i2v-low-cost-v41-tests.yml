name: "V41 - test adapter I2V gratuiti"
on:
  pull_request:
    paths:
      - "src/i2v_budget_v41.py"
      - "src/i2v_scene_v41.py"
      - "tests/test_i2v*.py"
      - ".github/workflows/i2v*.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-billing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Controllo locale senza API"
        run: |
          python -m py_compile src/i2v_budget_v41.py src/i2v_scene_v41.py
          python -m unittest discover -s tests -p "test_i2v*.py" -v
