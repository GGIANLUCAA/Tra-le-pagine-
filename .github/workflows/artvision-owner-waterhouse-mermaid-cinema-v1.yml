name: "ArtVision OWNER | Waterhouse A Mermaid | new Cinema private review"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-owner-waterhouse-mermaid-cinema-v1.yml"
permissions:
  contents: read
concurrency:
  group: artvision-owner-single-heavy-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact owner artwork and no new duplicate checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/artvision_owner_waterhouse_mermaid_cinema_v1.py
          python - <<'PY'
          import json,pathlib
          q=json.loads(pathlib.Path('research/artvision_owner_selected_30_future_20261109.json').read_text())
          w=[v for v in q['works'] if v.get('title_as_chosen')=='The Mermaid' and v.get('artist_as_chosen')=='John William Waterhouse']
          assert len(w)==1 and w[0].get('selection_order')==20
          assert not list(pathlib.Path('queue').glob('artvision_owner_30_render_checkpoint_*mermaid*.json')), 'Existing owner Mermaid Cinema checkpoint: no duplicate'
          print('One selected WATERHOUSE A MERMAID 1900. New Cinema only, no paid APIs, not Museum.')
          PY
      - name: Install free rendering environment
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5'
      - name: Source verified original plus actual MP4 and Android ZIP
        run: python scripts/artvision_owner_waterhouse_mermaid_cinema_v1.py
      - name: Full decode and independent integrity checks
        shell: bash
        run: |
          set -euo pipefail
          d=output/artvision-owner-waterhouse-mermaid-cinema-v1
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID_REVIEW.mp4" -map 0 -f null -
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path('output/artvision-owner-waterhouse-mermaid-cinema-v1')
          video=p/'VIDEO_ANDROID_REVIEW.mp4'; original=p/'ORIGINAL_WATERHOUSE_1900.jpg'
          q=json.loads((p/'QA_TECHNICAL.json').read_text())
          sha=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          assert len(original.read_bytes())==578091
          assert hashlib.sha1(original.read_bytes()).hexdigest()=='e288cc3ad87653593f4a634256bcd595495c08fe'
          assert q['original_file_sha256']==sha(original)
          assert q['mp4_sha256']==sha(video)
          assert 51<q['duration_s']<56 and q['shots']==12
          assert not q['gold'] and not q['published'] and q['paid_api_calls']==0
          assert not q['real_museum_claim']
          with zipfile.ZipFile(p/'ANDROID_REVIEW_PACKAGE.zip') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read(video.name)).hexdigest()==q['mp4_sha256']
          print('SHA256+ORIGINAL_SHA1+FFMPEG_FULL+ZIP_CRC PASS; ARTISTIC REVIEW PENDING')
          PY
      - name: Upload genuine MP4, Android ZIP and editorial QA without publishing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_OWNER_WATERHOUSE_MERMAID_NEW_CINEMA_REVIEW
          retention-days: 30
          if-no-files-found: error
          path: |
            output/artvision-owner-waterhouse-mermaid-cinema-v1/VIDEO_ANDROID_REVIEW.mp4
            output/artvision-owner-waterhouse-mermaid-cinema-v1/ANDROID_REVIEW_PACKAGE.zip
            output/artvision-owner-waterhouse-mermaid-cinema-v1/COVER.jpg
            output/artvision-owner-waterhouse-mermaid-cinema-v1/CONTACT_SHEET.jpg
            output/artvision-owner-waterhouse-mermaid-cinema-v1/SOURCE_AND_RIGHTS.json
            output/artvision-owner-waterhouse-mermaid-cinema-v1/STORYBOARD.json
            output/artvision-owner-waterhouse-mermaid-cinema-v1/SOCIAL_DRAFTS.json
            output/artvision-owner-waterhouse-mermaid-cinema-v1/QA_TECHNICAL.json
            output/artvision-owner-waterhouse-mermaid-cinema-v1/FFPROBE.json
  readback:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Ensure FFmpeg available in fresh runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - uses: actions/download-artifact@v4
        with:
          name: ARTVISION_OWNER_WATERHOUSE_MERMAID_NEW_CINEMA_REVIEW
          path: /tmp/waterhouse_mermaid_check
      - name: Re-read real downloaded bytes video/audio and complete Android package
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/waterhouse_mermaid_check
          ffmpeg -v error -xerror -i "$d/VIDEO_ANDROID_REVIEW.mp4" -map 0 -f null -
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          d=Path('/tmp/waterhouse_mermaid_check')
          q=json.loads((d/'QA_TECHNICAL.json').read_text())
          v=(d/'VIDEO_ANDROID_REVIEW.mp4').read_bytes()
          assert hashlib.sha256(v).hexdigest()==q['mp4_sha256']
          with zipfile.ZipFile(d/'ANDROID_REVIEW_PACKAGE.zip') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('VIDEO_ANDROID_REVIEW.mp4')).hexdigest()==q['mp4_sha256']
          print('INDEPENDENT DOWNLOADED MP4 SHA FULL AUDIO VIDEO FFMPEG AND ZIP CRC PASS; NOT GOLD')
          PY
