name: ArtVision V151 Triumph of Death one genuine Critico with Free Gacrux
on:
  push:
    branches: [main]
    paths:
      - requests/artvision/bruegel-triumph-critico-standard-v151.json
permissions:
  contents: read
  actions: read
concurrency:
  group: artvision-owner-bruegel-triumph-critico-v151-once
  cancel-in-progress: false
jobs:
  one_missing_critico:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Compile renderer and verify recipe before any TTS call
        run: |
          python -m py_compile src/artvision_bruegel_triumph_critico_v151.py
          python -m json.tool modules/artvision_critico/production_series/bruegel_triumph_v151.json > /dev/null
      - name: Guard one approved work and forbid duplicates and paid calls
        run: |
          python - <<'PY'
          import json
          r=json.load(open("requests/artvision/bruegel-triumph-critico-standard-v151.json"))
          q=json.load(open("queue/artvision_owner_selected_ten_20261102.json"))
          assert r["owner_automation_id"]=="6adca191603c8191a90d5190901cd034"
          assert r["work_id"]=="bruegel_triumph_death_1562_prado_p001393"
          assert r["variant"]=="critico_standard"
          assert r["public_title"]=="The Triumph of Death"
          assert r["run_once_only"] and r["one_tts_call_at_most"]
          assert not r["allow_paid_calls"] and not r["social_publish"] and not r["gold_v25"]
          w=[x for x in q["works"] if x["id"]==r["work_id"]]
          assert len(w)==1 and w[0]["slots_delivered_this_selection"]==1
          assert "critico_standard_v151" not in w[0]
          assert w[0]["cinema_standard_v150"]["sha256"]=="c460fe7fa72ac29425de67eec40f986add502c42ec9e4166050c7ce107804138"
          assert w[0]["cinema_standard_v150"]["zip_crc"].startswith("PASS")
          assert w[0]["museum_approved"] is False
          PY
      - name: Reuse and SHA-verify the already produced V150 licensed original source before voice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/triumph_v150_source /tmp/bruegel_triumph_critico_v151
          gh run download 41840684749 --repo "$GITHUB_REPOSITORY" --name BRUEGEL_TRIUMPH_DEATH_V150_CINEMA_REVIEW_MP4 --dir /tmp/triumph_v150_source
          unzip -p /tmp/triumph_v150_source/BRUEGEL_TRIUMPH_DEATH_CINEMA_V150_REVIEW_PACKAGE.zip ORIGINAL_ARTWORK.jpg > /tmp/bruegel_triumph_critico_v151/ORIGINAL_ARTWORK.jpg
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          f=Path('/tmp/bruegel_triumph_critico_v151/ORIGINAL_ARTWORK.jpg')
          assert f.is_file() and f.stat().st_size==9520461
          assert hashlib.sha256(f.read_bytes()).hexdigest()=='2cbaefc3961b999fc5a916db06dd96b3b95789789a795da83cc1d7947f3e1fbb'
          with zipfile.ZipFile('/tmp/triumph_v150_source/BRUEGEL_TRIUMPH_DEATH_CINEMA_V150_REVIEW_PACKAGE.zip') as z: assert z.testzip() is None
          print('EXACT_REAL_BRUEGEL_PD_SOURCE_SHA_CRC_PASS_NO_WIKIMEDIA_REQUEST')
          PY
      - name: Gate ONLY already owner-attested no-billing second Free Google key
        env:
          SECOND_KEY: ${{ secrets.GEMINI_API_KEY2 }}
        run: |
          test -n "$SECOND_KEY" || { echo "BLOCKED_SECOND_FREE_ACCOUNT_NOT_PRESENT: NO TTS"; exit 2; }
      - name: Install offline runtime with KNOWN compatible PyAV17 ASR
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "google-genai>=2.25.0" numpy pillow soundfile scipy "faster-whisper==1.2.1" "av==17.1.0" "huggingface-hub==0.34.4" "fsspec==2025.7.0" opencv-python-headless imageio-ffmpeg
          mkdir -p /tmp/artvision-bin
          python - <<'PY'
          from imageio_ffmpeg import get_ffmpeg_exe
          from pathlib import Path
          e=Path(get_ffmpeg_exe())
          assert e.is_file()
          Path('/tmp/artvision-bin/ffmpeg').symlink_to(e)
          PY
          echo /tmp/artvision-bin >> "$GITHUB_PATH"
          /tmp/artvision-bin/ffmpeg -version | head -1
      - name: Generate ONE genuine natural Gacrux WAV and ASR-small timing (NO retry)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY2 }}
          ARTVISION_GEMINI_PROJECT_BILLING_TIER: Free
          ARTVISION_ASR_MODEL: small
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python src/artvision_bruegel_triumph_critico_v151.py --phase voice
      - name: Render EXACTLY one real Critico Standard with original soundtrack and QA
        run: python src/artvision_bruegel_triumph_critico_v151.py --phase render
      - name: Independently verify actual physical file and CRC, do not auto Gold
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,zipfile
          out=Path('/tmp/bruegel_triumph_critico_v151')
          q=json.loads((out/'QA_V151.json').read_text())
          assert q['work']=="The Triumph of Death"
          assert q['variant']=='critico_standard' and q['museum_variant_rendered'] is False
          assert not q['Gold_V25'] and not q['social_published'] and not q['museum_approved']
          m=q['file']; p=out/m['name']
          assert p.is_file() and p.stat().st_size==m['bytes'] and m['frames']>1000
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          assert m['full_ffmpeg_decode']=='PASS'
          subprocess.run(["ffmpeg","-v","error","-xerror","-i",str(p),"-f","null","-"],check=True)
          with zipfile.ZipFile(out/"BRUEGEL_TRIUMPH_CRITICO_STANDARD_V151_REVIEW_PACKAGE.zip") as z:
            assert z.testzip() is None and sum(n.endswith('.mp4') for n in z.namelist())==1
          print('ONE_GENUINE_MP4_SHA_FFMPEG_ZIP_CRC_PASS_ARTISTIC_REVIEW_PENDING')
          PY
      - name: Preserve WAV even on failed render — never regenerate TTS for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ART_V151_TRIUMPH_REAL_CRITICO_OR_PRESERVED_WAV
          path: |
            /tmp/bruegel_triumph_critico_v151/VOCE.wav
            /tmp/bruegel_triumph_critico_v151/VOICE_CACHE_V13.json
            /tmp/bruegel_triumph_critico_v151/ALLINEAMENTO_VOCE.json
            /tmp/bruegel_triumph_critico_v151/VOICE_RESULT_V151.json
            /tmp/bruegel_triumph_critico_v151/COPIONE_ESATTO_V151.txt
            /tmp/bruegel_triumph_critico_v151/BRUEGEL_THE_TRIUMPH_OF_DEATH_CRITICO_STANDARD_V151_REVIEW.mp4
            /tmp/bruegel_triumph_critico_v151/BRUEGEL_TRIUMPH_CRITICO_STANDARD_V151_REVIEW_PACKAGE.zip
            /tmp/bruegel_triumph_critico_v151/QA_V151.json
            /tmp/bruegel_triumph_critico_v151/COVER.jpg
            /tmp/bruegel_triumph_critico_v151/CONTACT_SHEET_V151.jpg
            /tmp/bruegel_triumph_critico_v151/RIGHTS_AND_CREDITS.txt
            /tmp/bruegel_triumph_critico_v151/SOCIAL_DRAFT_UNPUBLISHED.txt
          retention-days: 30
          if-no-files-found: warn
