name: "ArtVision | Ryder original CC0 image readback (no video)"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-ryder-source-binary-recovery-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artvision-ryder-source-binary-recovery-v1
  cancel-in-progress: false
jobs:
  source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download official CMA CC0 source and validate SHA / pixels
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,json,time
          from pathlib import Path
          folder=Path('proof');folder.mkdir(exist_ok=True)
          url='https://openaccess-cdn.clevelandart.org/1928.8/1928.8_print.jpg'
          out=folder/'Ryder_Race_Track_CMA_1928_8_PRINT.jpg'
          expected='02640803f0b848bb651f9aa5c72dda458ce001adccb2c258cd9a3d0e32c7bfed'
          err=None
          for attempt in range(2):
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'ArtVision-CC0-verification/1.0'})
              with urllib.request.urlopen(request,timeout=45) as resp, open(out,'wb') as target:
                while True:
                  chunk=resp.read(1<<20)
                  if not chunk:break
                  target.write(chunk)
              err=None
              break
            except Exception as e:
              err=str(e)
              if attempt==0:time.sleep(5)
          if err:raise SystemExit('SOURCE_DOWNLOAD_FAILED: '+err)
          raw=out.read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!=expected:raise SystemExit('SHA mismatch: '+sha)
          assert raw[:2]==b'\xff\xd8','Not JPEG'
          dims=None
          i=2
          while i<len(raw)-9:
            if raw[i]!=255:i+=1;continue
            while i<len(raw) and raw[i]==255:i+=1
            marker=raw[i];i+=1
            if marker in (0xD9,0xDA):break
            if marker==0xD8 or marker==0x01 or 0xD0<=marker<=0xD7:continue
            n=(raw[i]<<8)+raw[i+1]
            if marker in (0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF):
              dims=[(raw[i+5]<<8)+raw[i+6],(raw[i+3]<<8)+raw[i+4]]
              break
            i+=n
          if dims!=[3400,2685]:raise SystemExit('SIZE mismatch '+repr(dims))
          proof={'artist':'Albert Pinkham Ryder','work':'The Race Track (Death on a Pale Horse)','object_id':'1928.8','source_url':url,'museum_url':'https://www.clevelandart.org/art/1928.8','rights':'Cleveland Museum Open Access CC0','pixels':dims,'sha256':sha,'bytes':len(raw),'framed_dimensions_cm':'84.5 x 102 x 6.5','unframed_dimensions_cm':'70.5 x 90','frame_appearance_documented':False,'new_videos':0}
          (folder/'ORIGINAL_SOURCE_PROOF.json').write_text(json.dumps(proof,indent=2),encoding='utf-8')
          print('SOURCE_OK',sha,dims,len(raw))
          PY
      - name: Archive actual JPEG plus verification (not a video)
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_RYDER_CMA_OPENACCESS_ORIGINAL_BINARY_ONLY
          path: proof/*
          retention-days: 14
          if-no-files-found: error
