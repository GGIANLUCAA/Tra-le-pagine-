name: "Tra le Pagine - Prova Supertonic 3 indipendente"
on:
  push:
    paths: [".github/workflows/prova-supertonic.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voce-open:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa modello vocale indipendente
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install 'supertonic>=1.3.0' 'huggingface_hub>=0.29' soundfile
      - name: Recupera modello open-weight archiviato
        run: |
          hf download supertone-oss-archive/supertonic-3 --local-dir assets
      - name: Due campioni di voce maschile in italiano
        run: python src/prova_supertonic.py
      - name: Scarica i provini
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SUPERTONIC3_ITALIANO_OPEN_WEIGHT
          path: output/*.mp3
          retention-days: 14
