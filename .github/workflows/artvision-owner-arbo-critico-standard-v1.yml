name: "ArtVision OWNER | Arbo Wild Hunt | Critico Standard natural voice V1"
on:
  pull_request:
    paths:
      - ".github/workflows/artvision-owner-arbo-critico-standard-v1.yml"
      - "scripts/artvision_owner_arbo_critico_standard_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/artvision-owner-arbo-critico-standard-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artvision-owner-single-heavy-render
  cancel-in-progress: false
jobs:
  editorial_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m py_compile scripts/artvision_owner_arbo_critico_standard_v1.py
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3"
          python scripts/artvision_owner_arbo_critico_standard_v1.py --preflight-only
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_ARBO_CRITICO_V1_PREFLIGHT
          path: output/artvision-owner-arbo-critico-v1/
          if-no-files-found: warn
          retention-days: 14
  render_private_critico:
    needs: editorial_preflight
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_FREE_QUOTA_CONFIRMED: ${{ vars.GEMINI_TTS_FREE_QUOTA_CONFIRMED }}
      GEMINI_TTS_PROJECT_BILLING_DISABLED_CONFIRMED: ${{ vars.GEMINI_TTS_PROJECT_BILLING_DISABLED_CONFIRMED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check verified free-only Gacrux budget before any calls
        id: free_gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GEMINI_TTS_FREE_QUOTA_CONFIRMED,,}" = "true" ] && [ "${GEMINI_TTS_PROJECT_BILLING_DISABLED_CONFIRMED,,}" = "true" ] && [ -n "$GEMINI_API_KEY" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "VOICE_BLOCKED_NO_COST. No video claimed; no paid call." > VOICE_BLOCKED_NO_COST.txt
          fi
      - name: Install free tools and produce one genuine narrated video
        if: steps.free_gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core; fi
          python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5" "soundfile>=0.12" "scipy>=1.11" "google-genai>=1.20"
          python scripts/artvision_owner_arbo_critico_standard_v1.py
      - name: Upload actual MP4 or genuine no-cost voice blocker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_ARBO_CRITICO_STANDARD_V1_PRIVATE_OR_BLOCKED
          path: |
            output/artvision-owner-arbo-critico-v1/CRITICO_STANDARD_ANDROID_REVIEW.mp4
            output/artvision-owner-arbo-critico-v1/CONSEGNA_CRITICO_ANDROID.zip
            output/artvision-owner-arbo-critico-v1/QA_TECHNICAL.json
            output/artvision-owner-arbo-critico-v1/COPERTINA.jpg
            output/artvision-owner-arbo-critico-v1/COPIONE_IT.txt
            output/artvision-owner-arbo-critico-v1/STORYBOARD.json
            output/artvision-owner-arbo-critico-v1/TIMING.json
            output/artvision-owner-arbo-critico-v1/VOICE_BUDGET_GATE.json
            VOICE_BLOCKED_NO_COST.txt
          if-no-files-found: warn
          retention-days: 14
