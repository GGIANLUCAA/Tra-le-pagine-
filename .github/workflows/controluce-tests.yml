name: "Controluce - Test offline"
on:
  pull_request:
    paths:
      - "src/controluce*.py"
      - "formats/controluce/**"
      - "tests/test_controluce.py"
      - ".github/workflows/controluce-*.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "Test e sintassi senza crediti AI"
        run: |
          python -m compileall -q src/controluce.py src/controluce_render.py tests/test_controluce.py
          python -m unittest discover -s tests -p 'test_controluce.py' -v
