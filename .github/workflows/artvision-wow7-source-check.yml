name: "ArtVision WOW7 - source eligibility four masters"
on:
  push:
    branches: [main]
    paths: [".github/workflows/artvision-wow7-source-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect exact creators and high quality museum public domain images
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,time
          H={'User-Agent':'ArtVisionTraLePagine/4.0 (research for original artwork)' }
          artists=['Ivan Aivazovsky','William Blake','Gustave Doré','Giovanni Battista Piranesi','Albert Bierstadt','Caspar David Friedrich']
          for artist in artists:
           print('\nARTIST',artist,flush=True)
           url='https://openaccess-api.clevelandart.org/api/artworks/?'+urllib.parse.urlencode({'artists':artist,'limit':100})
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=25) as rr:
             j=json.load(rr)
            items=[(x.get('title'),x.get('accession_number'),x.get('share_license_status'),(x.get('images') or {}).get('print',{})) for x in j.get('data',[])]
            confirmed=[x for x in items if x[2]=='CC0' and x[3] and x[3].get('url')]
            print('CLEVELAND',len(items),'CC0_IMAGES',len(confirmed),flush=True)
            for x in confirmed[:17]:
             print('WORK',str(x[0])[:80],x[1],x[3].get('width'),x[3].get('height'),flush=True)
           except Exception as exc:print('CLEVELAND FAILED',str(exc)[:170],flush=True)
           time.sleep(.25)
          PY
