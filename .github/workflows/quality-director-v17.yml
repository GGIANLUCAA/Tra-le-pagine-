name: "Regia qualità V17 - gratuita, mobile e non distruttiva"
on:
  pull_request:
    paths:
      - "src/quality_director_v17.py"
      - "config/quality_director_v17.json"
      - "tests/test_quality_director_v17.py"
      - "src/studio_regia_supervisor_v1.py"
      - "tests/test_studio_regia_supervisor_v1.py"
      - ".github/workflows/quality-director-v17.yml"
  workflow_dispatch:
    inputs:
      project_path:
        description: "PROJECT_V13.json già nel repository (facoltativo)"
        required: false
        type: string
      regia_plan_path:
        description: "Shotlist regia (JSON, facoltativo), nessuna approvazione automatica"
        required: false
        type: string
      video_path:
        description: "MP4 locale al checkout (facoltativo); non scarica artifact/remoti"
        required: false
        type: string
      format:
        description: "Categoria in assenza del progetto"
        required: false
        default: "libri"
        type: choice
        options:
          - libri
          - artvision_cinema
          - artvision_critico
          - controluce
          - visual_music
          - hyperlumen
          - storia_rivive
          - documentario
          - giuliano
          - wow_lab
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Librerie gratuite e leggere
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'Pillow>=10,<13'
      - name: Test su storyboard e MP4 sintetico
        run: |
          python -m unittest discover -s tests -p "test_quality_director_v17.py" -v
          python -m unittest discover -s tests -p "test_studio_regia_supervisor_v1.py" -v
      - name: Report della regia da Android
        if: github.event_name == 'workflow_dispatch'
        env:
          QUALITY_PROJECT: ${{ inputs.project_path }}
          QUALITY_FORMAT: ${{ inputs.format }}
          REGIA_PLAN: ${{ inputs.regia_plan_path }}
          QUALITY_VIDEO: ${{ inputs.video_path }}
        run: |
          args=(--out output/quality-v17)
          if [ -n "$QUALITY_PROJECT" ]; then
            args+=(--project "$QUALITY_PROJECT")
          else
            args+=(--format "$QUALITY_FORMAT")
          fi
          if [ -n "$REGIA_PLAN" ]; then
            args+=(--regia-plan "$REGIA_PLAN")
          fi
          if [ -n "$QUALITY_VIDEO" ]; then
            args+=(--video "$QUALITY_VIDEO")
          fi
          python src/quality_director_v17.py "${args[@]}"
      - name: Crea stato leggibile da Studio e diagnosi Ripara GPT (sola lettura)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          STUDIO_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f output/quality-v17/QUALITY_REPORT_V17.json ]; then
            python src/studio_autonomy_report_v1.py \
              --quality-report output/quality-v17/QUALITY_REPORT_V17.json \
              --out output/quality-v17 \
              --run-url "$STUDIO_RUN_URL"
          else
            echo "No quality report was generated; no false status will be emitted."
          fi
      - name: Scarica la pagina HTML e il JSON di revisione
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quality-v17-report
          path: output/quality-v17/
          if-no-files-found: warn
          retention-days: 7
