name: "Regia qualità V17 - gratuita, mobile e non distruttiva"
on:
  pull_request:
    paths:
      - "src/quality_director_v17.py"
      - "src/director_reference_v326.py"
      - "src/artvision_editor_v19.py"
      - "tests/test_director_reference_v326.py"
      - "docs/REGIA_REFERENZE_V326_20261112.md"
      - "config/quality_director_v17.json"
      - "tests/test_quality_director_v17.py"
      - ".github/workflows/quality-director-v17.yml"
  workflow_dispatch:
    inputs:
      project_path:
        description: "PROJECT_V13.json già nel repository (facoltativo)"
        required: false
        type: string
      brief_path:
        description: "Brief ArtVision V19 con tempi V326 (facoltativo)"
        required: false
        type: string
      format:
        description: "Categoria in assenza del progetto"
        required: false
        default: "libri"
        type: choice
        options:
          - libri
          - artvision_cinema
          - artvision_critico
          - controluce
          - visual_music
          - hyperlumen
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Librerie gratuite e leggere
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'Pillow>=10,<13'
      - name: Test su storyboard e MP4 sintetico
        run: python -m unittest discover -s tests -p "test_quality_director_v17.py" -v
      - name: Test regressione V326 e editor V19
        run: |
          python -m unittest discover -s tests -p "test_director_reference_v326.py" -v
          python -m unittest discover -s tests -p "test_artvision_editor_v19.py" -v
      - name: Report della regia da Android
        if: github.event_name == 'workflow_dispatch'
        env:
          QUALITY_PROJECT: ${{ inputs.project_path }}
          QUALITY_FORMAT: ${{ inputs.format }}
        run: |
          if [ -n "$QUALITY_PROJECT" ]; then
            python src/quality_director_v17.py --project "$QUALITY_PROJECT" --out output/quality-v17 || true
          else
            python src/quality_director_v17.py --format "$QUALITY_FORMAT" --out output/quality-v17
          fi
      - name: Crea stato leggibile da Studio e diagnosi Ripara GPT (sola lettura)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          STUDIO_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f output/quality-v17/QUALITY_REPORT_V17.json ]; then
            python src/studio_autonomy_report_v1.py \
              --quality-report output/quality-v17/QUALITY_REPORT_V17.json \
              --out output/quality-v17 \
              --run-url "$STUDIO_RUN_URL"
          else
            echo "No quality report was generated; no false status will be emitted."
          fi
      - name: Regia ArtVision V19 + ritmo V326 da Android
        if: github.event_name == 'workflow_dispatch' && inputs.brief_path != ''
        env:
          ART_BRIEF: ${{ inputs.brief_path }}
        run: |
          case "$ART_BRIEF" in /*|*..*) echo "Unsafe brief path"; exit 2;; esac
          test -f "$ART_BRIEF" || { echo "Brief not found"; exit 2; }
          python src/artvision_editor_v19.py \
            --brief "$ART_BRIEF" \
            --out output/quality-v17/artvision-editor-v19
      - name: Scarica la pagina HTML e il JSON di revisione
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quality-v17-report
          path: output/quality-v17/
          if-no-files-found: warn
          retention-days: 7
