name: "ArtVision Critico V32 - authentic Holbein image preflight"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/artvision-critico-v32-image-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check Holbein Commons Google Art Project rendition and alternatives
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,time
          name='File:Hans Holbein the Younger - The Ambassadors - Google Art Project.jpg'
          q={'action':'query','format':'json','formatversion':2,'titles':name,'prop':'imageinfo',
             'iiprop':'url|size|extmetadata','iiurlwidth':3400}
          url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(q)
          H={'User-Agent':'ArtVisionCriticoMuseum/2.1 (original Holbein critical film, source attribution)'}
          try:
           dat=json.load(urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=28))
           p=dat['query']['pages'][0]
           x=(p.get('imageinfo') or [None])[0]
           print('COMMONS_FILE',p.get('title'),p.get('missing'),str(x)[:650],flush=True)
           if x:
            for path in [x.get('thumburl'),x.get('url')]:
             if not path:continue
             try:
              with urllib.request.urlopen(urllib.request.Request(path,headers=H),timeout=24) as r:
               b=r.read(1024);print('IMAGE_SUCCESS',r.status,r.headers.get('Content-Type'),r.headers.get('Content-Length'),b[:9].hex(),path,flush=True)
              break
             except Exception as e: print('IMAGE_FAIL',str(e)[:200],flush=True)
          except Exception as e:print('SOURCE_FAIL',str(e)[:400],flush=True)
          PY
