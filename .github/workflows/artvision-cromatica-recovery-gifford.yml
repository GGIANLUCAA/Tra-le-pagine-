name: ArtVision 10 - Repair Gifford source only
on:
  push:
    branches: [feature/artvision-cromatica-ten-real-artworks-20261120]
    paths:
      - .github/workflows/artvision-cromatica-recovery-gifford.yml
      - tools/artvision_ten_recover_gifford_20261120.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair-index-4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'pillow>=10,<13' 'requests>=2.31,<3' 'numpy>=1.26,<3'
      - name: Recover original Gifford painting and render index 4 only
        run: python -u tools/artvision_ten_recover_gifford_20261120.py
      - name: Upload verified Gifford reel (video, QA, captions)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION-CROMATICA-REAL-4-RECOVERY
          path: |
            output/artvision_cromatica_ten/*/*.mp4
            output/artvision_cromatica_ten/*/*_COVER.jpg
            output/artvision_cromatica_ten/*/*_QA.jpg
            output/artvision_cromatica_ten/*/QA_AND_EDIT.json
            output/artvision_cromatica_ten/*/SOURCES_AND_RIGHTS.md
            output/artvision_cromatica_ten/*/POST_*.txt
            output/artvision_cromatica_ten/*/dist/*_COMPLETO.zip
            output/artvision_cromatica_ten/*/dist/*_ANDROID.zip
            output/artvision_cromatica_ten/*/dist/*_META.zip
          if-no-files-found: error
          retention-days: 30
