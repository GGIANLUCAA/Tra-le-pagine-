name: ArtVision Sixth · Böcklin 1883 Cinema V100
on:
  push:
    branches:
      - main
    paths:
      - requests/artvision/bocklin-sixth-v100.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artvision-sixth-bocklin-v100
  cancel-in-progress: false
jobs:
  cinema_review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact version
        uses: actions/checkout@v4
      - name: Runtime and FFmpeg
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          ffmpeg -version | head -1
      - name: Assert exact authorization and source id
        run: |
          python - <<'PY'
          import json
          lock=json.load(open('config/artvision_pilot_lock_v58.json'))['authorized_sixth_pilot']
          queue=json.load(open('queue/artvision_four_variants_s01_20261028.json'))
          groups=[g for g in queue['groups'] if g['group_id']=='bocklin_isle_of_dead_1883_berlin_ng2_80']
          assert lock['enabled'] and lock['phase']=='sixth_pilot_bocklin_only'
          assert lock['automatic_seventh_artwork_selection'] is False
          assert len(groups)==1 and groups[0]['museum_inventory']=='NG 2/80'
          assert not groups[0].get('source_sha256_verified',False)
          PY
      - name: Validate sixth pilot guard regression
        run: python -m unittest discover -s tests -p test_artvision_bocklin_v100_guard.py -v
      - name: Render two REAL Cinema review candidates (no paid APIs)
        run: |
          python src/artvision_bocklin_sixth_v100.py --output "$RUNNER_TEMP/bocklin"
      - name: Verify presence and report
        run: |
          test -s "$RUNNER_TEMP/bocklin/Boecklin_1883_cinema_standard_V100_REVIEW.mp4"
          test -s "$RUNNER_TEMP/bocklin/Boecklin_1883_cinema_museum_V100_REVIEW.mp4"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'bocklin'/'QA_V100.json'
          x=json.loads(p.read_text())
          assert len(x['two_cinema_MP4'])==2
          assert all(s['ffmpeg_full_decode']=='PASS' for s in x['two_cinema_MP4'].values())
          assert x['V25_approved']==0 and x['critico_MP4']==0
          print(p.read_text())
          PY
      - name: Save actual MP4 review bytes and QA
        uses: actions/upload-artifact@v4
        with:
          name: BOECKLIN_NG2-80_V100_TWO_CINEMA_REVIEW
          path: |
            ${{ runner.temp }}/bocklin/Boecklin_1883_cinema_standard_V100_REVIEW.mp4
            ${{ runner.temp }}/bocklin/Boecklin_1883_cinema_museum_V100_REVIEW.mp4
            ${{ runner.temp }}/bocklin/QA_V100.json
          if-no-files-found: error
          retention-days: 30
