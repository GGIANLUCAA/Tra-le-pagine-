name: Video Library Studio - Automatic Import
on:
  push:
    paths:
      - .github/workflows/video-library-r2-import.yml
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - "Produzione V16 - coda autonoma e ripresa"
      - "ArtVision Cinema V6 - film curatoriale"
      - "Tra le Pagine - Render episodio con effetti V4"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      max_artifacts:
        description: 'Maximum GitHub artifacts to process (0 = all)'
        required: false
        default: '0'
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: video-library-studio-import
  cancel-in-progress: false
jobs:
  upload:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Transfer video artifacts to Cloudflare R2
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REQUESTED_LIMIT: ${{ inputs.max_artifacts || '0' }}
          IMPORT_ENDPOINT: https://video-library-import.600led.workers.dev
        shell: bash
        run: |
          python3 -m pip -q install requests
          python3 - <<'PY'
          import os,re,sys,zipfile,tempfile,pathlib,time,json,hashlib,io
          import requests
          S=requests.Session()
          ROOT=os.environ['IMPORT_ENDPOINT'].rstrip('/')
          REPO=os.environ['REPOSITORY']
          HEAD={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          AUD='vls-gh-import-2026'
          limit=int(os.getenv('REQUESTED_LIMIT','0') or '0')
          if os.environ['EVENT']=='push': limit=0
          cache_token='',0
          def token():
              global cache_token
              if cache_token[0] and time.time()-cache_token[1]<180:return cache_token[0]
              url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
              auth={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}
              r=S.get(url,headers=auth,params={'audience':AUD},timeout=30);r.raise_for_status()
              t=r.json()['value'];cache_token=(t,time.time());return t
          def cf(method,route,params=None,**kwargs):
              for attempt in range(3):
                  try:
                      r=S.request(method,ROOT+route,params=params,headers={'Authorization':'Bearer '+token()},timeout=180,**kwargs)
                      if r.status_code in (429,502,503,504):raise Exception('Retryable '+str(r.status_code))
                      r.raise_for_status();return r.json()
                  except Exception as e:
                      if attempt==2:raise
                      time.sleep(2**attempt)
          def status(key):return cf('GET','/status',{'key':key})
          def contract_manifests(archive):
              manifests=[]
              def read_from(zf,label):
                  for member in zf.namelist():
                      if pathlib.PurePosixPath(member).name=='ARTVISION_CONTRACT_V25.json':
                          try:
                              manifests.append((label+member,json.loads(zf.read(member).decode('utf-8'))))
                          except Exception as exc:
                              raise ValueError('Invalid V25 contract '+label+member+': '+str(exc))
              read_from(archive,'')
              for member in archive.namelist():
                  if not member.lower().endswith('.zip') or member.endswith('/'):continue
                  try:
                      with zipfile.ZipFile(io.BytesIO(archive.read(member))) as nested:
                          read_from(nested,member+'::')
                  except zipfile.BadZipFile:
                      continue
              return manifests
          def publication_gate(archive,video_members):
              contracts=contract_manifests(archive)
              if not contracts:
                  return False,'missing ARTVISION_CONTRACT_V25.json; importer is fail-closed'
              approved_hashes=set()
              required=('opening','visual','cover','music','rights','full_watch','replicability')
              for label,contract in contracts:
                  review_hash=str(contract.get('review_video_sha256') or '').lower()
                  reviews=contract.get('reviews') or {}
                  failed=[key for key in required if not isinstance(reviews.get(key),dict) or reviews[key].get('passed') is not True]
                  if not review_hash or failed:
                      return False,label+' pending reviews: '+','.join(failed or ['missing_exact_hash'])
                  approved_hashes.add(review_hash)
              actual={}
              for member in video_members:
                  digest=hashlib.sha256()
                  with archive.open(member) as source:
                      while chunk:=source.read(1024*1024):digest.update(chunk)
                  actual[member]=digest.hexdigest()
              unmatched={name:value for name,value in actual.items() if value not in approved_hashes}
              if unmatched:
                  return False,'master hash is not covered by an approved V25 review: '+repr(unmatched)
              return True,'exact-hash V25 reviews passed'
          def upload(fp,key):
              size=fp.stat().st_size
              old=status(key)
              if old.get('deleted'):
                  print('OWNER DELETED - do not restore:',key,flush=True);return False
              if old.get('exists') and old.get('size')==size:
                  print('Already stored:',key,flush=True);return False
              if old.get('exists'):
                  key=fp.stem+'__'+str(size)+fp.suffix
                  variant_status=status(key)
                  if variant_status.get('deleted') or variant_status.get('exists'):return False
              if size<=32*1024*1024:
                  with fp.open('rb') as fd:r=cf('POST','/single',{'key':key},data=fd)
              else:
                  init=cf('POST','/init',{'key':key});uid=init['uploadId'];parts=[]
                  try:
                      with fp.open('rb') as fd:
                          ix=0
                          while part:=fd.read(8*1024*1024):
                              ix+=1
                              p=cf('PUT','/part',{'key':key,'uploadId':uid,'number':ix},data=part)
                              parts.append({'partNumber':p['partNumber'],'etag':p['etag']})
                      r=cf('POST','/complete',{'key':key,'uploadId':uid},json=parts)
                  except Exception:
                      try:cf('POST','/abort',{'key':key,'uploadId':uid})
                      except Exception:pass
                      raise
              check=status(key)
              if check.get('size')!=size:raise Exception('Uploaded size mismatch for '+key)
              print('PUBLISHED:',key,'size:',size,flush=True);return True
          def self_test_publication_gate():
              sample=b'not-a-real-video-but-stable-for-gate-test'
              digest=hashlib.sha256(sample).hexdigest()
              contract={'schema':'artvision-release-contract-v25','review_video_sha256':digest,
                        'reviews':{key:{'passed':False} for key in ('opening','visual','cover','music','rights','full_watch','replicability')}}
              def make(current):
                  buf=io.BytesIO()
                  with zipfile.ZipFile(buf,'w') as test:
                      test.writestr('VIDEO_MASTER.mp4',sample)
                      test.writestr('ARTVISION_CONTRACT_V25.json',json.dumps(current))
                  buf.seek(0)
                  return buf
              without_contract=io.BytesIO()
              with zipfile.ZipFile(without_contract,'w') as test:
                  test.writestr('VIDEO_MASTER.mp4',sample)
              without_contract.seek(0)
              with zipfile.ZipFile(without_contract) as test:
                  allowed,_=publication_gate(test,['VIDEO_MASTER.mp4'])
                  assert not allowed,'Artifacts without a V25 review contract must remain blocked'
              pending=make(contract)
              with zipfile.ZipFile(pending) as test:
                  allowed,_=publication_gate(test,['VIDEO_MASTER.mp4'])
                  assert not allowed,'Unreviewed V25 artifact must remain blocked'
              for row in contract['reviews'].values():row['passed']=True
              approved=make(contract)
              with zipfile.ZipFile(approved) as test:
                  allowed,_=publication_gate(test,['VIDEO_MASTER.mp4'])
                  assert allowed,'Exact-hash fully reviewed V25 artifact must pass'
              contract['review_video_sha256']='0'*64
              wrong=make(contract)
              with zipfile.ZipFile(wrong) as test:
                  allowed,_=publication_gate(test,['VIDEO_MASTER.mp4'])
                  assert not allowed,'Mismatched V25 master hash must remain blocked'
              print('Publication gate self-test: PASS',flush=True)
          self_test_publication_gate()
          print('Checking secure importer...',flush=True)
          r=S.get(ROOT+'/health',timeout=20);r.raise_for_status();print(r.json(),flush=True)
          artifacts=[]
          for page in range(1,12):
              r=S.get('https://api.github.com/repos/'+REPO+'/actions/artifacts',headers=HEAD,params={'per_page':100,'page':page},timeout=40)
              r.raise_for_status();chunk=r.json().get('artifacts',[])
              artifacts.extend(a for a in chunk if not a.get('expired') and a.get('name')!='github-pages')
              if len(chunk)<100:break
          artifacts.sort(key=lambda a:(a.get('size_in_bytes') or 0,a.get('id') or 0))
          print('Nonexpired candidate artifacts:',len(artifacts),flush=True)
          downloaded=published=errors=0
          for a in artifacts:
              if limit>0 and downloaded>=limit:break
              with tempfile.TemporaryDirectory() as tmp:
                  wd=pathlib.Path(tmp);zpath=wd/'a.zip'
                  try:
                      if cf('GET','/artifact-status',{'artifact':a['id']}).get('synced'):continue
                      u='https://api.github.com/repos/'+REPO+'/actions/artifacts/'+str(a['id'])+'/zip'
                      with S.get(u,headers=HEAD,stream=True,timeout=240) as r:
                          r.raise_for_status()
                          with zpath.open('wb') as f:
                              for chunk in r.iter_content(1048576):f.write(chunk)
                      with zipfile.ZipFile(zpath) as z:
                          files=[n for n in z.namelist() if n.lower().endswith(('.mp4','.m4v','.mov','.jpg','.jpeg','.png','.webp')) and not n.endswith('/')]
                          videos=[n for n in files if n.lower().endswith(('.mp4','.m4v','.mov'))]
                          if not videos:
                              cf('POST','/artifact-mark',{'artifact':a['id']},json={'name':a['name']});continue
                          allowed,reason=publication_gate(z,videos)
                          if not allowed:
                              print('SKIPPED UNREVIEWED:',a['name'],reason,flush=True)
                              cf('POST','/artifact-mark',{'artifact':a['id']},json={'name':a['name']})
                              continue
                          print('PUBLICATION GATE:',a['name'],reason,flush=True)
                          downloaded+=1
                          for n in files:
                              name=pathlib.PurePosixPath(n).name
                              safe=re.sub(r'[^A-Za-z0-9_(). -]','_',name)[:180]
                              if not safe:continue
                              fp=wd/safe
                              with z.open(n) as src,fp.open('wb') as dst:
                                  import shutil;shutil.copyfileobj(src,dst)
                              if upload(fp,safe):published+=1
                          # V55: save source posts and production records next to their video in R2.
                          # The site then recovers authentic copy instead of auto-generated placeholders.
                          known={
                            'POST_FACEBOOK.txt','POST_INSTAGRAM.txt','POST_TIKTOK.txt','POST_YOUTUBE.txt',
                            'PROJECT_V13.json','VIDEO_RECIPE_V13.json','RICETTA.json',
                            'FONTI_E_DIRITTI.md','FONTI_E_DIRITTI.txt','SOURCES_AND_RIGHTS.md',
                            'DELIVERY_MANIFEST_V55.json','ARTVISION_DELIVERY_V55.json',
                            'REVIEW_APERTURA.json','OPENING_REVIEW_V55.json',
                            'TECNICHE_REGIA.md','POST_EDITORIAL_RESEARCH.json'}
                          v55=any(pathlib.PurePosixPath(m).name in ('DELIVERY_MANIFEST_V55.json','ARTVISION_DELIVERY_V55.json') for m in z.namelist())
                          text_items=[m for m in z.namelist() if pathlib.PurePosixPath(m).name in known and not m.endswith('/')]
                          if v55:
                              for social in ('POST_FACEBOOK.txt','POST_INSTAGRAM.txt','POST_TIKTOK.txt','POST_YOUTUBE.txt'):
                                  if not any(pathlib.PurePosixPath(m).name==social for m in text_items):
                                      raise ValueError('V55 missing required social attachment: '+social)
                          if text_items:
                              hashes=set()
                              if len(videos)>1:
                                  for member in videos:
                                      h=hashlib.sha256()
                                      with z.open(member) as stream:
                                          while chunk:=stream.read(1048576):h.update(chunk)
                                      hashes.add(h.hexdigest())
                                  if len(hashes)>1:
                                      print('WARNING: multiple different videos; shared editorial documents ambiguous',flush=True)
                                      if v55:raise ValueError('V55 expects one unique MP4 per release package')
                              if len(videos)==1 or len(hashes)==1:
                                  video_file=pathlib.PurePosixPath(videos[0]).name
                                  base_name=re.sub(r'[^A-Za-z0-9_(). -]','_',video_file)[:180]
                                  original_fp=wd/base_name
                                  video_key=base_name
                                  if status(video_key).get('size')!=original_fp.stat().st_size:
                                      video_key=original_fp.stem+'__'+str(original_fp.stat().st_size)+original_fp.suffix
                                  if not status(video_key).get('exists'):
                                      raise ValueError('MP4 not verified in archive before editorial attachments')
                                  unique={}
                                  for member_name in text_items:
                                      short=pathlib.PurePosixPath(member_name).name
                                      raw=z.read(member_name)
                                      if not raw or len(raw)>250000:
                                          if v55:raise ValueError('V55 attachment empty or oversized: '+short)
                                          continue
                                      if short in unique and unique[short]!=raw:
                                          raise ValueError('Conflicting editorial files named '+short)
                                      unique[short]=raw
                                  for short,raw in unique.items():
                                      h=hashlib.sha256(raw).hexdigest()
                                      saved=cf('POST','/production-file',
                                               {'video':video_key,'name':short,'sha256':h},data=raw)
                                      if not saved.get('ok') or saved.get('sha256')!=h:
                                          raise ValueError('Editorial attachment not verified: '+short)
                                  print('V55 EDITORIAL ATTACHMENTS:',video_key,len(unique),flush=True)
                          covers=[n for n in files if pathlib.PurePosixPath(n).name.lower().startswith(('copertina','cover')) and n.lower().endswith(('.jpg','.jpeg'))]
                          if covers:
                              for n in files:
                                  if not n.lower().endswith(('.mp4','.m4v','.mov')):continue
                                  base=pathlib.PurePosixPath(n).stem
                                  coverkey=re.sub(r'[^A-Za-z0-9_(). -]','_',base)[:175]+'.jpg'
                                  fp=wd/coverkey
                                  with z.open(covers[0]) as source,fp.open('wb') as target:
                                      import shutil;shutil.copyfileobj(source,target)
                                  if upload(fp,coverkey):published+=1
                      cf('POST','/artifact-mark',{'artifact':a['id']},json={'name':a['name']})
                      print('Completed artifact:',a['name'],flush=True)
                  except Exception as e:
                      errors+=1
                      print('ERROR in artifact',a['name'],str(e)[:220],flush=True)
          print('TOTAL:',{'artifacts':downloaded,'new_files':published,'errors':errors},flush=True)
          if errors:sys.exit(1)
          PY
