name: Video Library Studio - Automatic Import
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/video-library-r2-import.yml
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - "Produzione V16 - coda autonoma e ripresa"
      - "ArtVision Cinema V6 - film curatoriale"
      - "Tra le Pagine - Render episodio con effetti V4"
      - "ArtVision V116 - 4 original artworks 16 videos with refined gallery"
      - "VIDU · Gateway condiviso ChatGPT (tutte le chat del progetto)"
      - "WOW LAB V1 — Autonomous isolated 2-hour visual studio"
      - "ArtVision Babel V141 OFFLINE stronger Italian ASR on one existing WAV"
      - "ArtVision V149 Night Watch official Rijksmuseum IIIF Critico one-shot"
      - "ArtVision V150 · Bruegel Triumph of Death Cinema genuine source"
      - "ArtVision V151 Triumph of Death one genuine Critico with Free Gacrux"
      - "ArtVision V153 Rebel Angels Cinema replacement of undelivered master, no extra slot"
      - "ArtVision V155 · Waterhouse The Lady of Shalott Cinema original PD review"
      - "ArtVision V156 Lady of Shalott one natural Critico and verified source"
      - "ArtVision V158 · Waterhouse The Magic Circle Tate N01572 1080p Cinema review"
      - "ArtVision V158 · William Blake Ghost of a Flea Cinema authentic source"
      - "ArtVision V159 Blake Ghost of Flea one real natural Critico from locked source"
      - "ArtVision V159 Waterhouse Magic Circle one real natural Critico from locked source"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      max_artifacts:
        description: 'Maximum GitHub artifacts to process (0 = all)'
        required: false
        default: '0'
      include_legacy:
        description: 'Backfill pre-2-Nov artifacts (default is fresh videos only)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  # Separate from pre-November legacy importer already running a long backlog.
  group: video-library-studio-direct-import-v2
  cancel-in-progress: false
jobs:
  upload:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Transfer video artifacts to Cloudflare R2
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REQUESTED_LIMIT: ${{ inputs.max_artifacts || '0' }}
          INCLUDE_LEGACY: ${{ inputs.include_legacy || 'false' }}
          IMPORT_ENDPOINT: https://video-library-import.600led.workers.dev
        shell: bash
        run: |
          python3 -m pip -q install requests
          python3 - <<'PY'
          import os,re,sys,zipfile,tempfile,pathlib,time,json,hashlib,io,datetime
          import requests
          S=requests.Session()
          ROOT=os.environ['IMPORT_ENDPOINT'].rstrip('/')
          REPO=os.environ['REPOSITORY']
          HEAD={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          AUD='vls-gh-import-2026'
          limit=int(os.getenv('REQUESTED_LIMIT','0') or '0')
          if os.environ['EVENT']=='push': limit=0
          include_legacy=os.getenv('INCLUDE_LEGACY','false').lower()=='true'
          fresh_since='2026-11-02T09:00:00Z'
          assert '2026-11-02T09:01:00Z'>=fresh_since and not ('2026-11-01T23:59:59Z'>=fresh_since)
          # Private archive receives finished production MP4s, not source footage or test cuts.
          # This protects the owner without reintroducing an artistic-review gate.
          def archive_candidate(member, artifact_name=''):
              base=pathlib.PurePosixPath(member).name.upper()
              artifact=(artifact_name or '').upper()
              # Owner site: production masters/reviews only, never scout or raw source artifacts.
              # Keep legitimate *_REVIEW.mp4 videos eligible for the private owner catalog.
              if re.search(r'(^|[_-])(SOURCE|SCOUT|CONTACT|FRAMES|ASSETS|PROBE)([_-]|$)', artifact):
                  return False
              if base.startswith(('SOURCE_SHOT_', 'SOURCE_REVIEW_ONLY_', 'SOURCE_24S_',
                                  'SCENE02_BW_FREEZE_', 'TRUE_BW_MOTION_', 'RAW_', 'FRAME_')):
                  return False
              # Audio-polish exports are intermediate cuts, not independent owner videos.
              if base.startswith('AUDIO_POLISHED_REVIEW'):
                  return False
              if 'NOT_FINAL' in base or 'NON_FINALE' in base:
                  return False
              return True
          assert archive_candidate('BRUEGEL_THE_TOWER_OF_BABEL_CRITICO_STANDARD_V138_REVIEW.mp4')
          assert archive_candidate('ArtVision_Malczewski_Cinema_Museum_V112.mp4')
          assert not archive_candidate('AUDIO_POLISHED_REVIEW.mp4')
          assert not archive_candidate('AUDIO_POLISHED_REVIEW__9666695.mp4')
          assert not archive_candidate('SOURCE_SHOT_01__158381.mp4')
          assert not archive_candidate('SOURCE_REVIEW_ONLY_NOT_FINAL__478918.mp4')
          assert not archive_candidate('SOURCE_24S_ROUGHCUT_NOT_FINAL__4374707.mp4')
          assert not archive_candidate('LA_STORIA_RIVIVE_PARIGI_1918_V162_NEURAL_REVIEW_NON_FINALE.mp4')
          assert archive_candidate('BRUEGEL_REBEL_ANGELS_CINEMA_MUSEUM_V212_REVIEW.mp4',
                                   'ARTVISION_REBEL_ROOM68_V212_REAL_REVIEW')
          assert not archive_candidate('TRUE_BW_MOTION_9S.mp4',
                                       'STORIA_MARTINETTI_1894_SOURCE_CONTACT_REAL_MOTION')
          assert not archive_candidate('SAMPLE.mp4', 'MELIES_SCOUT_CONTACT_SHEET')
          assert not archive_candidate('RAW_SCAN_01.mp4', 'SOURCE_ASSETS_ONLY')
          assert not archive_candidate('TRUE_BW_MOTION_9S.mp4', 'STORIA_FINISHED_FILM')
          # Artistic review is not required for the private owner archive, but an
          # artifact that explicitly says publication is not authorized must never
          # be auto-imported. This is a rights/source boundary, not an art gate.
          def explicit_archive_block_reason(archive,artifact_name):
              documents=[]
              def collect(zf,label=''):
                  for member in zf.namelist():
                      if member.endswith('/'):continue
                      base=pathlib.PurePosixPath(member).name.upper()
                      if base in ('QA_REPORT.JSON','DELIVERY_MANIFEST_V55.JSON','ARTVISION_DELIVERY_V55.JSON') or (base.startswith('QA_') and base.endswith('.JSON')):
                          try:
                              documents.append((label+member,zf.read(member)[:250000].decode('utf-8','replace').upper()))
                          except Exception as exc:
                              return label+member+' unreadable authorization metadata: '+str(exc)
                      if base in ('SOURCES_AND_RIGHTS.TXT','SOURCES_AND_RIGHTS.MD','FONTI_E_DIRITTI.TXT','FONTI_E_DIRITTI.MD',
                                  'RIGHTS_AND_CREDITS.TXT','RIGHTS_AND_CREDITS.MD'):
                          documents.append((label+member,zf.read(member)[:250000].decode('utf-8','replace').upper()))
                      if base.endswith('.ZIP'):
                          try:
                              with zipfile.ZipFile(io.BytesIO(zf.read(member))) as nested:
                                  reason=collect(nested,label+member+'::')
                                  if reason:return reason
                          except zipfile.BadZipFile:
                              pass
                  return None
              problem=collect(archive)
              if problem:return problem
              blocked_tokens=('"PUBLICATION": "NOT AUTHORIZED"','"PUBLICATION":"NOT AUTHORIZED"',
                              'PUBLICATION: NOT AUTHORIZED','PUBLICATION NOT AUTHORIZED',
                              'NOT YET CLEARED FOR PUBLICATION','DO NOT PUBLISH','NON PUBBLICARE',
                              '"PUBLICATION_AUTHORIZED": FALSE','"PUBLICATION_AUTHORIZED":FALSE',
                              'PUBLICATION_AUTHORIZED: FALSE','PRIVATE REVIEW ONLY',
                              'NOT AUTHORIZED TO PUBLISH','NOT_PUBLISHED','NOT PUBLISHED')
              for label,text in documents:
                  hit=next((token for token in blocked_tokens if token in text),None)
                  if hit:return label+' explicitly blocks archive publication: '+hit
              return None
          def self_test_explicit_archive_block():
              def bundle(files):
                  buf=io.BytesIO()
                  with zipfile.ZipFile(buf,'w') as test:
                      for name,value in files.items():test.writestr(name,value)
                  buf.seek(0);return buf
              allowed=bundle({'OWNER_MASTER.mp4':b'owner'})
              with zipfile.ZipFile(allowed) as test:
                  assert explicit_archive_block_reason(test,'OWNER_MASTER_PACKAGE') is None
              denied=bundle({'PILOT.mp4':b'pilot','qa_report.json':json.dumps({'publication':'NOT AUTHORIZED'})})
              with zipfile.ZipFile(denied) as test:
                  assert explicit_archive_block_reason(test,'PILOT_PACKAGE')
              # A review-oriented name alone is not a blocker: owner originals may
              # be archived before artistic QA. Only explicit publication/rights denial blocks.
              review_only=bundle({'OWNER_REVIEW.mp4':b'owner'})
              with zipfile.ZipFile(review_only) as test:
                  assert explicit_archive_block_reason(test,'OWNER_REVIEW_ONLY') is None
              rights_pending=bundle({
                  'OWNER_REVIEW.mp4':b'owner',
                  'QA_V166.json':json.dumps({'publication_authorized':False}),
                  'RIGHTS_AND_CREDITS.txt':'Commercial reuse clearance PENDING: private review only.'
              })
              with zipfile.ZipFile(rights_pending) as test:
                  assert explicit_archive_block_reason(test,'OWNER_RIGHTS_PENDING')
              print('Explicit authorization gate self-test: PASS',flush=True)
          self_test_explicit_archive_block()
          cache_token='',0
          def token():
              global cache_token
              if cache_token[0] and time.time()-cache_token[1]<180:return cache_token[0]
              url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
              auth={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}
              r=S.get(url,headers=auth,params={'audience':AUD},timeout=30);r.raise_for_status()
              t=r.json()['value'];cache_token=(t,time.time());return t
          def cf(method,route,params=None,**kwargs):
              for attempt in range(3):
                  try:
                      r=S.request(method,ROOT+route,params=params,headers={'Authorization':'Bearer '+token()},timeout=180,**kwargs)
                      if r.status_code in (429,502,503,504):raise Exception('Retryable '+str(r.status_code))
                      r.raise_for_status();return r.json()
                  except Exception as e:
                      if attempt==2:raise
                      time.sleep(2**attempt)
          def status(key):return cf('GET','/status',{'key':key})
          def contract_manifests(archive):
              manifests=[]
              def read_from(zf,label):
                  for member in zf.namelist():
                      if pathlib.PurePosixPath(member).name=='ARTVISION_CONTRACT_V25.json':
                          try:
                              manifests.append((label+member,json.loads(zf.read(member).decode('utf-8'))))
                          except Exception as exc:
                              raise ValueError('Invalid V25 contract '+label+member+': '+str(exc))
              read_from(archive,'')
              for member in archive.namelist():
                  if not member.lower().endswith('.zip') or member.endswith('/'):continue
                  try:
                      with zipfile.ZipFile(io.BytesIO(archive.read(member))) as nested:
                          read_from(nested,member+'::')
                  except zipfile.BadZipFile:
                      continue
              return manifests
          def publication_gate(archive,video_members):
              contracts=contract_manifests(archive)
              if not contracts:
                  return False,'missing ARTVISION_CONTRACT_V25.json; importer is fail-closed'
              approved_hashes=set()
              required=('opening','visual','cover','music','rights','full_watch','replicability')
              for label,contract in contracts:
                  review_hash=str(contract.get('review_video_sha256') or '').lower()
                  reviews=contract.get('reviews') or {}
                  failed=[key for key in required if not isinstance(reviews.get(key),dict) or reviews[key].get('passed') is not True]
                  if not review_hash or failed:
                      return False,label+' pending reviews: '+','.join(failed or ['missing_exact_hash'])
                  approved_hashes.add(review_hash)
              actual={}
              for member in video_members:
                  digest=hashlib.sha256()
                  with archive.open(member) as source:
                      while chunk:=source.read(1024*1024):digest.update(chunk)
                  actual[member]=digest.hexdigest()
              unmatched={name:value for name,value in actual.items() if value not in approved_hashes}
              if unmatched:
                  return False,'master hash is not covered by an approved V25 review: '+repr(unmatched)
              return True,'exact-hash V25 reviews passed'
          name_size_conflicts=set()
          def existing_object_policy(current,size):
              if current.get('deleted'):return 'deleted'
              if not current.get('exists'):return 'new'
              if current.get('size')==size:return 'same'
              return 'name_size_conflict'
          def self_test_existing_object_policy():
              assert existing_object_policy({},10)=='new'
              assert existing_object_policy({'exists':True,'size':10},10)=='same'
              assert existing_object_policy({'exists':True,'size':11},10)=='name_size_conflict'
              assert existing_object_policy({'exists':True,'deleted':True,'size':10},10)=='deleted'
              print('Existing object name/size policy self-test: PASS',flush=True)
          self_test_existing_object_policy()
          def upload(fp,key):
              size=fp.stat().st_size
              old=status(key)
              policy=existing_object_policy(old,size)
              if policy=='deleted':
                  print('OWNER DELETED - do not restore:',key,flush=True);return False
              if policy=='same':
                  print('Already stored:',key,flush=True);return False
              if policy=='name_size_conflict':
                  name_size_conflicts.add(key)
                  print('NAME/SIZE CONFLICT - ambiguous variant not imported:',key,
                        'stored:',old.get('size'),'candidate:',size,flush=True)
                  return False
              if size<=32*1024*1024:
                  with fp.open('rb') as fd:r=cf('POST','/single',{'key':key},data=fd)
              else:
                  init=cf('POST','/init',{'key':key});uid=init['uploadId'];parts=[]
                  try:
                      with fp.open('rb') as fd:
                          ix=0
                          while part:=fd.read(8*1024*1024):
                              ix+=1
                              p=cf('PUT','/part',{'key':key,'uploadId':uid,'number':ix},data=part)
                              parts.append({'partNumber':p['partNumber'],'etag':p['etag']})
                      r=cf('POST','/complete',{'key':key,'uploadId':uid},json=parts)
                  except Exception:
                      try:cf('POST','/abort',{'key':key,'uploadId':uid})
                      except Exception:pass
                      raise
              check=status(key)
              if check.get('size')!=size:raise Exception('Uploaded size mismatch for '+key)
              print('PUBLISHED:',key,'size:',size,flush=True);return True
          def self_test_publication_gate():
              sample=b'not-a-real-video-but-stable-for-gate-test'
              digest=hashlib.sha256(sample).hexdigest()
              contract={'schema':'artvision-release-contract-v25','review_video_sha256':digest,
                        'reviews':{key:{'passed':False} for key in ('opening','visual','cover','music','rights','full_watch','replicability')}}
              def make(current):
                  buf=io.BytesIO()
                  with zipfile.ZipFile(buf,'w') as test:
                      test.writestr('VIDEO_MASTER.mp4',sample)
                      test.writestr('ARTVISION_CONTRACT_V25.json',json.dumps(current))
                  buf.seek(0)
                  return buf
              without_contract=io.BytesIO()
              with zipfile.ZipFile(without_contract,'w') as test:
                  test.writestr('VIDEO_MASTER.mp4',sample)
              without_contract.seek(0)
              with zipfile.ZipFile(without_contract) as test:
                  allowed,_=publication_gate(test,['VIDEO_MASTER.mp4'])
                  assert not allowed,'Artifacts without a V25 review contract must remain blocked'
              pending=make(contract)
              with zipfile.ZipFile(pending) as test:
                  allowed,_=publication_gate(test,['VIDEO_MASTER.mp4'])
                  assert not allowed,'Unreviewed V25 artifact must remain blocked'
              for row in contract['reviews'].values():row['passed']=True
              approved=make(contract)
              with zipfile.ZipFile(approved) as test:
                  allowed,_=publication_gate(test,['VIDEO_MASTER.mp4'])
                  assert allowed,'Exact-hash fully reviewed V25 artifact must pass'
              contract['review_video_sha256']='0'*64
              wrong=make(contract)
              with zipfile.ZipFile(wrong) as test:
                  allowed,_=publication_gate(test,['VIDEO_MASTER.mp4'])
                  assert not allowed,'Mismatched V25 master hash must remain blocked'
              print('Publication gate self-test: PASS',flush=True)
          self_test_publication_gate()
          print('Checking secure importer...',flush=True)
          r=S.get(ROOT+'/health',timeout=20);r.raise_for_status();print(r.json(),flush=True)
          artifacts=[]
          for page in range(1,12):
              r=S.get('https://api.github.com/repos/'+REPO+'/actions/artifacts',headers=HEAD,params={'per_page':100,'page':page},timeout=40)
              r.raise_for_status();chunk=r.json().get('artifacts',[])
              artifacts.extend(a for a in chunk if not a.get('expired') and a.get('name')!='github-pages')
              if len(chunk)<100:break
          # The automatic channel is ONLY for new videos; the historic archive remains
          # untouched. Older artifacts can be backfilled through manual dispatch.
          found=len(artifacts)
          if not include_legacy:
              artifacts=[a for a in artifacts if (a.get('created_at') or '')>=fresh_since]
          # Newest first, so a fresh MP4 is never stuck behind old backlog.
          artifacts.sort(key=lambda a:(a.get('created_at') or '',a.get('id') or 0),reverse=True)
          print('Import queue:',{'all':found,'selected':len(artifacts),'backfill':include_legacy},flush=True)
          downloaded=published=errors=0
          for a in artifacts:
              if limit>0 and downloaded>=limit:break
              with tempfile.TemporaryDirectory() as tmp:
                  wd=pathlib.Path(tmp);zpath=wd/'a.zip'
                  try:
                      state=cf('GET','/artifact-status',{'artifact':a['id']})
                      # A legacy worker run could have marked unreviewed NEW videos
                      # as 'complete' without uploading their bytes. Recheck recent
                      # artifacts until the old import run has fully retired.
                      made=a.get('created_at') or ''
                      recent=False
                      if made>=fresh_since:
                          created=datetime.datetime.fromisoformat(made.replace('Z','+00:00'))
                          recent=created>=datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(hours=6)
                      if state.get('synced') and not recent:continue
                      if state.get('synced') and recent:
                          print('REVERIFY RECENT ARTIFACT even if legacy marked complete:',a['name'],flush=True)
                      u='https://api.github.com/repos/'+REPO+'/actions/artifacts/'+str(a['id'])+'/zip'
                      with S.get(u,headers=HEAD,stream=True,timeout=240) as r:
                          r.raise_for_status()
                          with zpath.open('wb') as f:
                              for chunk in r.iter_content(1048576):f.write(chunk)
                      with zipfile.ZipFile(zpath) as z:
                          files=[n for n in z.namelist() if n.lower().endswith(('.mp4','.m4v','.mov','.jpg','.jpeg','.png','.webp')) and not n.endswith('/')]
                          videos=[n for n in files if n.lower().endswith(('.mp4','.m4v','.mov')) and archive_candidate(n,a['name'])]
                          if not videos:
                              cf('POST','/artifact-mark',{'artifact':a['id']},json={'name':a['name']});continue
                          blocked=explicit_archive_block_reason(z,a['name'])
                          if blocked:
                              print('EXPLICITLY NOT AUTHORIZED - excluded from private archive:',a['name'],blocked,flush=True)
                              cf('POST','/artifact-mark',{'artifact':a['id']},json={'name':a['name']})
                              continue
                          # 2026-11-02 owner request: automatically archive NEW finished video files
                          # on the website even if artistic V25 approval is pending.
                          # This is site ingestion only, never social publishing or Gold approval.
                          is_auto_archive=(a.get('created_at') or '')>=fresh_since
                          if is_auto_archive:
                              print('DIRECT SITE IMPORT (ART REVIEW NOT REQUIRED):',a['name'],flush=True)
                          else:
                              allowed,reason=publication_gate(z,videos)
                              if not allowed:
                                  print('LEGACY UNREVIEWED (not new auto-import):',a['name'],reason,flush=True)
                                  continue
                              print('LEGACY APPROVED IMPORT:',a['name'],reason,flush=True)
                          downloaded+=1
                          for n in videos:
                              name=pathlib.PurePosixPath(n).name
                              safe=re.sub(r'[^A-Za-z0-9_(). -]','_',name)[:180]
                              if not safe:continue
                              fp=wd/safe
                              with z.open(n) as src,fp.open('wb') as dst:
                                  import shutil;shutil.copyfileobj(src,dst)
                              if upload(fp,safe):published+=1
                          # Add actual video objects to the website's editorial catalog now;
                          # missing social copy/cover must NOT block the MP4 transfer.
                          saved_keys=[]
                          for n in videos:
                              clean=re.sub(r'[^A-Za-z0-9_(). -]','_',pathlib.PurePosixPath(n).name)[:180]
                              src_fp=wd/clean
                              key=clean
                              current=status(key)
                              if current.get('deleted'):
                                  print('OWNER DELETED - excluded from catalog:',key,flush=True)
                                  continue
                              if current.get('exists') and current.get('size')!=src_fp.stat().st_size:
                                  name_size_conflicts.add(key)
                                  print('NAME/SIZE CONFLICT - excluded from catalog:',key,
                                        'stored:',current.get('size'),'candidate:',src_fp.stat().st_size,flush=True)
                                  continue
                              current=status(key)
                              if current.get('deleted'):
                                  print('OWNER DELETED - excluded from catalog:',key,flush=True)
                                  continue
                              if not current.get('exists'):
                                  raise ValueError('Video missing after direct website upload: '+key)
                              saved_keys.append(key)
                          if saved_keys:
                              seeded=cf('POST','/editorial-seed',json={'items':saved_keys})
                              if not seeded.get('ok'):
                                  raise ValueError('Site editorial catalog seed failed: '+repr(seeded))
                              print('SITE CATALOG REGISTERED:',saved_keys,flush=True)
                          # V55: save source posts and production records next to their video in R2.
                          # The site then recovers authentic copy instead of auto-generated placeholders.
                          known={
                            'POST_FACEBOOK.txt','POST_INSTAGRAM.txt','POST_TIKTOK.txt','POST_YOUTUBE.txt',
                            'PROJECT_V13.json','VIDEO_RECIPE_V13.json','RICETTA.json',
                            'FONTI_E_DIRITTI.md','FONTI_E_DIRITTI.txt','SOURCES_AND_RIGHTS.md',
                            'DELIVERY_MANIFEST_V55.json','ARTVISION_DELIVERY_V55.json',
                            'REVIEW_APERTURA.json','OPENING_REVIEW_V55.json',
                            'TECNICHE_REGIA.md','POST_EDITORIAL_RESEARCH.json'}
                          v55=any(pathlib.PurePosixPath(m).name in ('DELIVERY_MANIFEST_V55.json','ARTVISION_DELIVERY_V55.json') for m in z.namelist())
                          text_items=[m for m in z.namelist() if pathlib.PurePosixPath(m).name in known and not m.endswith('/')]
                          if v55 and is_auto_archive:
                              missing=[social for social in ('POST_FACEBOOK.txt','POST_INSTAGRAM.txt','POST_TIKTOK.txt','POST_YOUTUBE.txt') if not any(pathlib.PurePosixPath(m).name==social for m in text_items)]
                              if missing: print('EDITORIAL DRAFT (MP4 already archived), missing:',missing,flush=True)
                          elif v55:
                              for social in ('POST_FACEBOOK.txt','POST_INSTAGRAM.txt','POST_TIKTOK.txt','POST_YOUTUBE.txt'):
                                  if not any(pathlib.PurePosixPath(m).name==social for m in text_items):
                                      raise ValueError('V55 missing required social attachment: '+social)
                          if any(re.sub(r'[^A-Za-z0-9_(). -]','_',pathlib.PurePosixPath(member).name)[:180] in name_size_conflicts for member in videos):
                              print('NAME/SIZE CONFLICT - editorial attachments skipped for ambiguous filename',flush=True)
                              text_items=[]
                          if text_items:
                              hashes=set()
                              if len(videos)>1:
                                  for member in videos:
                                      h=hashlib.sha256()
                                      with z.open(member) as stream:
                                          while chunk:=stream.read(1048576):h.update(chunk)
                                      hashes.add(h.hexdigest())
                                  if len(hashes)>1:
                                      print('WARNING: multiple different videos; shared editorial documents ambiguous',flush=True)
                                      if v55:raise ValueError('V55 expects one unique MP4 per release package')
                              if len(videos)==1 or len(hashes)==1:
                                  video_file=pathlib.PurePosixPath(videos[0]).name
                                  base_name=re.sub(r'[^A-Za-z0-9_(). -]','_',video_file)[:180]
                                  original_fp=wd/base_name
                                  video_key=base_name
                                  if status(video_key).get('size')!=original_fp.stat().st_size:
                                      video_key=original_fp.stem+'__'+str(original_fp.stat().st_size)+original_fp.suffix
                                  if not status(video_key).get('exists'):
                                      raise ValueError('MP4 not verified in archive before editorial attachments')
                                  unique={}
                                  for member_name in text_items:
                                      short=pathlib.PurePosixPath(member_name).name
                                      raw=z.read(member_name)
                                      if not raw or len(raw)>250000:
                                          if v55:raise ValueError('V55 attachment empty or oversized: '+short)
                                          continue
                                      if short in unique and unique[short]!=raw:
                                          raise ValueError('Conflicting editorial files named '+short)
                                      unique[short]=raw
                                  for short,raw in unique.items():
                                      h=hashlib.sha256(raw).hexdigest()
                                      saved=cf('POST','/production-file',
                                               {'video':video_key,'name':short,'sha256':h},data=raw)
                                      if not saved.get('ok') or saved.get('sha256')!=h:
                                          raise ValueError('Editorial attachment not verified: '+short)
                                  print('V55 EDITORIAL ATTACHMENTS:',video_key,len(unique),flush=True)
                          covers=[n for n in files if pathlib.PurePosixPath(n).name.lower().startswith(('copertina','cover')) and n.lower().endswith(('.jpg','.jpeg'))]
                          if covers:
                              for n in videos:
                                  base=pathlib.PurePosixPath(n).stem
                                  coverkey=re.sub(r'[^A-Za-z0-9_(). -]','_',base)[:175]+'.jpg'
                                  fp=wd/coverkey
                                  with z.open(covers[0]) as source,fp.open('wb') as target:
                                      import shutil;shutil.copyfileobj(source,target)
                                  if upload(fp,coverkey):published+=1
                      cf('POST','/artifact-mark',{'artifact':a['id']},json={'name':a['name']})
                      print('Completed artifact:',a['name'],flush=True)
                  except Exception as e:
                      errors+=1
                      print('ERROR in artifact',a['name'],str(e)[:220],flush=True)
          print('TOTAL:',{'artifacts':downloaded,'new_files':published,'errors':errors},flush=True)
          if errors:sys.exit(1)
          PY
