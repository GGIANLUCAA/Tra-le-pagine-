name: ArtVision Voice Cloud V1 | Android + Hugging Face Qwen (no PC)
on:
  pull_request:
    paths:
      - "src/artvision_voice_cloud_hf_v1.py"
      - "tests/test_artvision_voice_cloud_hf_v1.py"
      - "config/artvision_voice_profiles_v1.json"
      - ".github/workflows/artvision-voice-autopilot-v1.yml"
  push:
    branches: [main]
    paths: ["voice_jobs/requests/**"]
  workflow_dispatch:
    inputs:
      job_file:
        description: "Existing voice job path in the repository"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: "artvision-voice-cloud-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  offline_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests run without any voice API or billing
        run: python -m unittest discover -s tests -p "test_artvision_voice_cloud_hf_v1.py" -v
  cloud_voice:
    if: github.event_name != 'pull_request'
    needs: offline_tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ARTVISION_HF_VOICE_DATASET: ${{ vars.ARTVISION_HF_VOICE_DATASET }}
      EVENT_NAME: ${{ github.event_name }}
      BEFORE_SHA: ${{ github.event.before }}
      MANUAL_JOB: ${{ inputs.job_file }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cloud API adapter dependencies only, not Qwen model
        run: |
          python -m pip install --disable-pip-version-check "gradio_client>=1.10,<3" "huggingface_hub>=0.34,<2" "numpy>=1.26,<3" "soundfile>=0.12,<1"
          command -v ffmpeg
      - name: Select committed voice requests
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' "$MANUAL_JOB" > voice_jobs_selected.txt
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE_SHA" HEAD -- voice_jobs/requests/ | grep -E '^voice_jobs/requests/[^/]+\.json$' > voice_jobs_selected.txt || true
          else
            git ls-files 'voice_jobs/requests/*.json' > voice_jobs_selected.txt
          fi
          test -s voice_jobs_selected.txt || { echo "No new voice request"; exit 2; }
      - name: Qwen voice request via remote Hugging Face ZeroGPU
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r file; do
            if [[ "$file" != voice_jobs/requests/*.json ]] || [[ ! -f "$file" ]]; then
              echo "::error::Invalid voice request path"
              bad=1
              continue
            fi
            python src/artvision_voice_cloud_hf_v1.py --job "$file" --out-root output/voice_cloud || bad=1
          done < voice_jobs_selected.txt
          exit "$bad"
      - name: Preserve review audio and metadata without private source recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARTVISION_QWEN_CLOUD_REVIEW_${{ github.run_id }}
          path: output/voice_cloud/
          if-no-files-found: warn
          retention-days: 14
