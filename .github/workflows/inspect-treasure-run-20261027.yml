name: Inspect one-off book film run
on:
  push:
    branches:
      - episode/isola-tesoro-originale-20261027
    paths:
      - queue/inspect_treasure_run_20261027.txt
permissions:
  contents: write
  actions: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Find the actual one-off run, save outcome on feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/treasure-oneoff-20261027.yml/runs?branch=episode/isola-tesoro-originale-20261027&per_page=5" \
            --jq '{"runs": [.workflow_runs[]|{id,html_url,status,conclusion,created_at,head_sha}], "checked_at":"2026-10-27"}' > status.json
          echo "Found:"
          cat status.json
          gh api -X PUT "repos/${{ github.repository }}/contents/queue/treasure_run_status_20261027.json" \
            -f message="Record isolated book-production run status" \
            -f branch="${{ github.ref_name }}" \
            -f content="$(base64 -w0 status.json)"
