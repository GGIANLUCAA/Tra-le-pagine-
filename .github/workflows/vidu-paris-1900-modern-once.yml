name: "Vidu Paris 1900 - trasformazione antico moderno una sola volta"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vidu-paris-1900-modern-once.yml"
permissions:
  contents: write
concurrency:
  group: vidu-paris-1900-modern-20261029-single-billable-post
  cancel-in-progress: false
jobs:
  generate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VIDU_API_KEY: ${{ secrets.VIDUOK || secrets.VIDU_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Verify source, credit caps and syntax before payment"
        run: |
          python -m pip install "pillow>=10,<13"
          python -m py_compile tools/vidu_paris_1900_modern_once.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: "One authorized Vidu 720p 5s start-to-end transformation, no paid retries"
        run: python tools/vidu_paris_1900_modern_once.py
      - name: "Upload user-only draft MP4, ZIP and technical receipt"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VIDU_PARIS_1900_ANTICO_MODERNO_REAL_TEST
          path: |
            output/vidu_paris_1900_20261029/PARIS_1900_PASSATO_DIVENTA_PRESENTE_VIDU.mp4
            output/vidu_paris_1900_20261029/PARIS_1900_VIDU_ANDROID.zip
            output/vidu_paris_1900_20261029/VIDU_TRANSIZIONE_ORIGINALE.mp4
            output/vidu_paris_1900_20261029/VIDU_TASK.json
            output/vidu_paris_1900_20261029/QA_E_CREDITI.json
            output/vidu_paris_1900_20261029/CREDITI_PRIVATI_PER_PROPRIETARIO.json
            output/vidu_paris_1900_20261029/START_BW.jpg
            output/vidu_paris_1900_20261029/END_MODERN.jpg
          retention-days: 7
          if-no-files-found: warn
