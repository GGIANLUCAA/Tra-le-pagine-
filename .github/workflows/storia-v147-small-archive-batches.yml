name: "La Storia Rivive V147 | recover Commons throttled original reels, no credits"

on:
  pull_request:
    paths:
      - "config/storia_rivive_v147_remaining_five_reels.json"
      - "src/storia_rivive_v147_archival_rate_limit_batches.py"
      - "src/storia_rivive_v147_aggregate_batches.py"
      - "tests/test_storia_rivive_v147_batch_audit.py"
      - ".github/workflows/storia-v147-small-archive-batches.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storia-v147-finish-real-archive-source-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  three_plus_two_real_originals:
    # Split to avoid the Wikimedia Commons 429 that followed three video
    # downloads in one V146 runner. Never re-download the first three verified.
    if: github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || github.head_ref == 'storia-v147-batched-multireel-local-motion-20261031')
    strategy:
      fail-fast: false
      matrix:
        batch: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only free FFmpeg and PIL, no providers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          python -m pip install -q "pillow>=10,<13"
      - name: V147 regress source URLs, prior SHA evidence and no credit gates
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_storia_rivive_v147_batch_audit.py" -v
      - name: Download only this small independent batch of REAL originals
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v147_archival_rate_limit_batches.py \
            --batch "${{ matrix.batch }}" \
            --manifest config/storia_rivive_v147_remaining_five_reels.json \
            --out "output/storia_v147_archive_batch_${{ matrix.batch }}"
      - name: Verify no charges, no social or false final on this batch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path("output/storia_v147_archive_batch_"+os.environ["BATCH"])
          report=json.loads((base/"V147_BATCH_REPORT.json").read_text())
          assert report["batch"]==os.environ["BATCH"]
          assert report["status"]=="V147_SOURCE_REVIEW_ONLY"
          assert report["sources_checked"]==(3 if report["batch"]=="a" else 2)
          assert report["api_paid_calls"]==0
          assert report["photo_i2i_generated"]==0 and report["vidu_clips_generated"]==0
          assert not report["video_completed"] and not report["publish_permitted"]
          print("V147_BATCH_PASSED",report["batch"],[(x["reel_id"],x["status"]) for x in report["source_reels"]])
          PY
        env:
          BATCH: ${{ matrix.batch }}
      - name: Preserve only selected frame metadata and 3-source contact JPEG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_V147_BATCH_${{ matrix.batch }}_${{ github.run_id }}
          path: |
            output/storia_v147_archive_batch_${{ matrix.batch }}/V147_BATCH_REPORT.json
            output/storia_v147_archive_batch_${{ matrix.batch }}/V147_BATCH_CONTACT_SHEET.jpg
          retention-days: 14
          if-no-files-found: warn

  combine_new_and_existing_sha_verified_reels:
    if: always() && github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || github.head_ref == 'storia-v147-batched-multireel-local-motion-20261031')
    needs: [three_plus_two_real_originals]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only PIL to read source audit QA helpers
        run: python -m pip install -q "pillow>=10,<13"
      - name: Download only THIS RUN's two audit reports, never original films
        uses: actions/download-artifact@v4
        with:
          pattern: STORIA_V147_BATCH_*
          path: output/storia_v147_downloaded_batches
          merge-multiple: false
      - name: Join three prior SHA-verified reels and five new checks, fail closed
        shell: bash
        run: |
          set -euo pipefail
          python src/storia_rivive_v147_aggregate_batches.py \
            --manifest config/storia_rivive_v147_remaining_five_reels.json \
            --baseline docs/evidence/STORIA_V146_FIRST_3_REAL_FILMS_41221612482.json \
            --batch-dir output/storia_v147_downloaded_batches \
            --out output/storia_v147_aggregate/EIGHT_REELS_RESEARCH_V147.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("output/storia_v147_aggregate/EIGHT_REELS_RESEARCH_V147.json").read_text())
          assert p["original_reels_examined"]==8
          assert p["paid_calls"]==0
          assert not p["video_finished"] and not p["published"]
          assert not p["rights_italy_verified"] and not p["five_real_camera_shots_artistic_review"]
          assert len(p["five_review_reels"]) in (0,5)
          print("V147_SOURCE_RESEARCH",p["status"],"moving_originals",
                p["moving_original_reel_count"],"five_selected",len(p["five_review_reels"]))
          PY
      - name: Preserve combined authentic SHA/PTS evidence for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STORIA_V147_EIGHT_REEL_SOURCE_REVIEW_${{ github.run_id }}
          path: |
            output/storia_v147_aggregate/EIGHT_REELS_RESEARCH_V147.json
            output/storia_v147_downloaded_batches/**/V147_BATCH_CONTACT_SHEET.jpg
          retention-days: 14
          if-no-files-found: warn
