name: "Cane Olimpico · Vidu Q3 Pro qualita (non Fast)"
on:
  push:
    branches: [main]
    paths:
      - "requests/cane_q3_pro/*.json"
permissions:
  contents: write
  actions: read
concurrency:
  group: vidu-chatgpt-gateway-single-provider-billable-post
  cancel-in-progress: false
jobs:
  cane_q3_pro:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VIDU_API_KEY: ${{ secrets.VIDUOK || secrets.VIDU_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect one unique request, fail closed on duplicates
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,subprocess
          b=os.environ['BEFORE'];a=os.environ['AFTER']
          if not re.fullmatch('[0-9a-f]{40}',b) or not re.fullmatch('[0-9a-f]{40}',a):raise SystemExit('Invalid commits')
          r=subprocess.run(['git','diff','--name-only','--diff-filter=A',b,a,'--','requests/cane_q3_pro'],capture_output=True,text=True,check=True)
          files=r.stdout.strip().splitlines()
          if len(files)!=1 or not re.fullmatch(r'requests/cane_q3_pro/cane-olympic-q3-[a-z0-9-]{8,50}[.]json',files[0]):raise SystemExit('Must create exactly one new request')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CANE_Q3_REQUEST='+files[0]+'\n')
          print('CANE_Q3_SINGLE_NEW_REQUEST_VERIFIED')
          PY
      - name: Install FFmpeg and Pillow
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet "Pillow>=10,<13"
      - name: Free plan or exactly one approved Q3 Pro POST
        shell: bash
        run: python -u src/cane_q3_pro_v1.py --request "$CANE_Q3_REQUEST"
      - name: Preserve private QA status and MP4 for Android, no public release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CANE_OLIMPICO_Q3_PRO_QUALITY_${{ github.run_id }}
          path: |
            output/cane_q3_pro/CANE_OLIMPICO_Q3_PRO_8S.mp4
            output/cane_q3_pro/PUBLIC_STATUS.json
          if-no-files-found: warn
          retention-days: 30
