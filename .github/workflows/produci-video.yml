name: "Tra le Pagine - Video automatico"
on:
  push:
    branches: [main]
    paths:
      - "episodes/**/BUILD.txt"
  workflow_dispatch:
    inputs:
      voce:
        description: "Voce narrante italiana"
        required: true
        type: choice
        default: kokoro
        options:
          - kokoro
          - espeak
concurrency:
  group: tra-le-pagine-video-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  produzione:
    name: "Genera voce + sottotitoli + MP4"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VOCE: "${{ github.event.inputs.voce || 'kokoro' }}"
    steps:
      - name: "Scarica progetto"
        uses: actions/checkout@v4
      - name: "Installa Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Prepara FFmpeg, fonetica italiana e librerie"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.25,<3' 'pillow>=10,<13' 'soundfile>=0.12' 'scipy>=1.11'
      - name: "Crea il video"
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$VOCE" == "kokoro" ]]; then
            echo "Provo la voce italiana Kokoro im_nicola."
            if python -m pip install 'kokoro>=0.9.4,<1'; then
              if python src/render.py --engine kokoro --out output; then
                echo "Kokoro riuscito."
              else
                echo "::warning::Kokoro non riuscito: passo alla voce eSpeak."
                rm -rf output
                python src/render.py --engine espeak --out output
              fi
            else
              echo "::warning::Kokoro non installabile: passo alla voce eSpeak."
              python src/render.py --engine espeak --out output
            fi
          else
            python src/render.py --engine espeak --out output
          fi
      - name: "Consegna ZIP scaricabile da Android"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "TRA_LE_PAGINE_EP01_MP4_e_audio"
          path: output/
          if-no-files-found: warn
          retention-days: 14
