<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTVISION — Revisione Cinema (Nuova selezione 30)</title>
<style>
  :root{--bg:#0c0e11;--card:#14171c;--line:#262b33;--gold:#d2a661;--ink:#ece6da;--mut:#9aa0a8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
  header{padding:28px 20px 12px;text-align:center;border-bottom:1px solid var(--line)}
  h1{margin:0;font:600 26px/1.2 Georgia,serif;letter-spacing:.4px}
  .sub{color:var(--mut);font-size:13px;margin-top:6px}
  .note{color:var(--gold);font-size:12.5px;margin-top:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;padding:24px;max-width:1400px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  video{width:100%;background:#000;aspect-ratio:9/16;object-fit:contain}
  .body{padding:14px 16px 16px}
  .t{font:600 17px/1.25 Georgia,serif}
  .m{color:var(--mut);font-size:12.5px;margin-top:4px}
  .row{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
  a.btn{display:inline-block;padding:9px 14px;border-radius:9px;text-decoration:none;font-size:13.5px;font-weight:600}
  .dl{background:var(--gold);color:#141414}
  .op{background:transparent;color:var(--gold);border:1px solid var(--gold)}
  .tag{margin-left:auto;font-size:11px;color:var(--mut);border:1px solid var(--line);padding:3px 8px;border-radius:20px}
</style>
</head>
<body>
<header>
  <h1>ARTVISION — Revisione Cinema</h1>
  <div class="sub">Nuova selezione 30 · versioni Cinema (senza voce) · dipinto originale + partitura originale</div>
  <div class="note">Revisione privata: nessun Gold, nessuna pubblicazione. Diritti territoriali e inquadrature — PENDING.</div>
</header>
<main class="grid" id="grid"></main>
<script>
const works=[
 {t:"The Quarrel of Oberon and Titania",a:"Sir Joseph Noel Paton",y:"1849",d:"69,5 s",dir:"owner-paton-quarrel-cinema-v1"},
 {t:"Medea",a:"Frederick Sandys",y:"1868",d:"43,2 s",dir:"owner-medea-sandys-cinema-v1"},
 {t:"Fairy Tale of the Kings",a:"M. K. Čiurlionis",y:"1909",d:"35,4 s",dir:"owner-fairy-tale-of-the-kings-cinema-v1"},
 {t:"Sonata of the Sea: Finale",a:"M. K. Čiurlionis",y:"1908",d:"31,4 s",dir:"owner-sonata-of-the-sea-finale-cinema-v1"},
 {t:"The Iron Rolling Mill",a:"Adolph Menzel",y:"1872-75",d:"39,8 s",dir:"owner-iron-rolling-mill-cinema-v1"},
 {t:"The Defense of the Sampo",a:"Akseli Gallen-Kallela",y:"1896",d:"35,2 s",dir:"owner-defense-of-the-sampo-cinema-v1"},
 {t:"Lemminkäinen's Mother",a:"Akseli Gallen-Kallela",y:"1897",d:"39,1 s",dir:"owner-lemminkainen-mother-cinema-v1"},
 {t:"The Architect's Dream",a:"Thomas Cole",y:"1840",d:"39,8 s",dir:"owner-architects-dream-cinema-v1"}
];
const g=document.getElementById('grid');
works.forEach((w,i)=>{
  const p=`${w.dir}/VIDEO_REVIEW.mp4`;
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`
    <video controls preload="metadata" playsinline poster="${w.dir}/COPERTINA.jpg">
      <source src="${p}" type="video/mp4">Il tuo browser non supporta il video.
    </video>
    <div class="body">
      <div class="t">${i+1}. ${w.t}</div>
      <div class="m">${w.a} · ${w.y} · ${w.d} · 1080×1920</div>
      <div class="row">
        <a class="btn dl" href="${p}" download>Scarica MP4</a>
        <a class="btn op" href="${w.dir}/COPERTINA.jpg" download>Copertina</a>
        <span class="tag">revisione</span>
      </div>
    </div>`;
  g.appendChild(el);
});
</script>
</body>
</html>
